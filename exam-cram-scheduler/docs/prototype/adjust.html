<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>시험 벼락치기 스케줄러 · 스케줄 조정</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div class="stage">
  <div class="stage-caption">5 · 스케줄 조정</div>

  <div class="device">
    <div class="statusbar">
      <span class="statusbar-time">10:14</span>
      <span class="statusbar-icons">
        <svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="7" width="3" height="5" rx="0.5"/><rect x="5" y="5" width="3" height="7" rx="0.5"/><rect x="10" y="3" width="3" height="9" rx="0.5"/><rect x="15" y="0" width="3" height="12" rx="0.5"/></svg>
        <svg width="16" height="12" viewBox="0 0 16 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M1 4a10 10 0 0114 0"/><path d="M3.8 7a6 6 0 018.4 0"/><circle cx="8" cy="10.2" r="1.1" fill="currentColor" stroke="none"/></svg>
        <svg width="24" height="12" viewBox="0 0 24 12" fill="none"><rect x="0.5" y="0.5" width="20" height="11" rx="2.5" stroke="currentColor"/><rect x="2" y="2" width="17" height="8" rx="1.3" fill="currentColor"/><rect x="21.5" y="4" width="1.7" height="4" rx="0.8" fill="currentColor"/></svg>
      </span>
    </div>

    <div class="navbar">
      <div class="nav-side">
        <a href="result.html" class="icon-btn ghost">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </a>
        <span class="nav-title">스케줄 조정</span>
      </div>
      <div class="nav-side"></div>
    </div>

    <div class="progress-track">
      <div class="progress-seg is-done"></div>
      <div class="progress-seg is-done"></div>
      <div class="progress-seg is-done"></div>
      <div class="progress-seg is-done"></div>
      <div class="progress-seg is-current"></div>
    </div>

    <div class="screen">
      <h1 class="headline">월요일 스케줄 조정</h1>
      <p class="subtext" style="margin-bottom:18px;">직접 조정한 조건으로 다시 계산해요. 다른 날짜는 목록에서 선택하세요.</p>

      <div class="card">
        <div class="slider-row" style="margin-bottom:22px;">
          <div class="slider-head">
            <span class="name">취침 시각</span>
            <span class="value">23:30</span>
          </div>
          <input type="range" min="22" max="26" step="0.5" value="23.5" />
          <div class="range-bounds"><span>22:00</span><span>02:00</span></div>
        </div>

        <div class="slider-row" style="margin-bottom:22px;">
          <div class="slider-head">
            <span class="name">기상 시각</span>
            <span class="value">05:30</span>
          </div>
          <input type="range" min="4" max="8" step="0.5" value="5.5" />
          <div class="range-bounds"><span>04:00</span><span>08:00</span></div>
        </div>

        <div class="slider-row" style="margin-bottom:22px;">
          <div class="slider-head">
            <span class="name">카페인 섭취량</span>
            <span class="value">100mg</span>
          </div>
          <input type="range" min="0" max="200" step="10" value="100" />
          <div class="range-bounds"><span>0mg</span><span>200mg</span></div>
        </div>

        <div class="slider-row">
          <div class="slider-head">
            <span class="name">카페인 섭취 시각</span>
            <span class="value">06:00</span>
          </div>
          <input type="range" min="4" max="9" step="0.5" value="6" />
          <div class="range-bounds"><span>04:00</span><span>09:00</span></div>
        </div>
      </div>

      <div class="warning-banner">
        <span class="icon">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M12 9v4m0 4h.01M10.3 3.6L2.5 17a2 2 0 001.7 3h15.6a2 2 0 001.7-3L13.7 3.6a2 2 0 00-3.4 0z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </span>
        <span>조정한 카페인 용량이 오늘 안전 섭취 한도(400mg)에 가까워요.</span>
      </div>

      <div class="section-block mt-0">
        <div class="section-head">
          <span class="label">최소 수면시간</span>
          <span class="meta">정보 입력에서 설정</span>
        </div>
        <div class="card">
          <div class="row">
            <span class="row-icon sleep">🌙</span>
            <span class="row-body"><div class="row-title">최소 수면시간</div></span>
            <span class="row-value">4시간</span>
          </div>
        </div>
      </div>
    </div>

    <div class="footer-cta">
      <a href="result.html" class="btn btn-secondary">취소</a>
      <a href="processing.html" class="btn btn-primary">재계산하기</a>
    </div>
    <div class="home-indicator-wrap"><div class="home-indicator"></div></div>
  </div>

  <div class="screen-jump">
    <a href="index.html">1 홈</a>
    <a href="input.html">2 정보 입력</a>
    <a href="processing.html">3 처리 중</a>
    <a href="result.html">4 결과</a>
    <a href="adjust.html" class="is-active">5 스케줄 조정</a>
  </div>
</div>
<script src="script.js" defer></script>
</body>
</html>
