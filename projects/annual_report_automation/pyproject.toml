[project]
name = "annual-report-automation"
version = "0.1.0"
description = "법인 연간결산 보고서 자동화 — 세무조정(4단계) 엔진 (Python)"
requires-python = ">=3.11"
# 계산 엔진 자체는 의존성 0개(표준 라이브러리만). Excel 출력(taxengine.export.excel)만 openpyxl 필요.
dependencies = [
    "openpyxl>=3.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
