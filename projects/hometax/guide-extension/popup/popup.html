<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <title>홈택스 AI 가이드</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <h1>홈택스 AI 가이드</h1>
    <p class="body-text">
      홈택스에 이미 로그인하셨다면, 하고 싶은 일을 입력하고 시작하세요.
      AI가 화면을 보고 다음에 누를 버튼을 강조해줍니다.
    </p>
    <textarea id="goal-input" class="goal-input" rows="3" placeholder="예: 환급금 조회하고 싶어"></textarea>
    <button id="start-btn" class="btn-solid">가이드 시작하기</button>
    <p id="status" class="status-text"></p>
    <script src="popup.js"></script>
  </body>
</html>
