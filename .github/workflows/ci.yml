name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 의존성 설치
        run: npm ci

      - name: 린트 (oxlint)
        run: npm run lint

      - name: 타입체크 + 빌드 (tsc -b && vite build)
        run: npm run build

      - name: 테스트 (test 스크립트가 있을 때만)
        run: |
          if node -e "process.exit(require('./package.json').scripts?.test ? 0 : 1)"; then
            npm test
          else
            echo "test 스크립트 없음 — CHECKLIST T1(Vitest 도입) 전까지 건너뜀"
          fi
