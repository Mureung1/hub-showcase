name: CI

on:
  pull_request:
  push:
    branches:
      - develop
      - main

permissions:
  contents: read

jobs:
  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - run: python scripts/check_task_packet.py --root .
      - run: python scripts/check_docs_index.py
      - run: python scripts/check_docs_html.py
      - run: node scripts/check_doc_viewer_normalization.js

  web:
    name: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --check package.json pnpm-workspace.yaml .prettierrc.json apps/web
      - run: pnpm --dir apps/web typecheck
      - run: pnpm --dir apps/web lint
      - run: pnpm --dir apps/web test
      - run: pnpm --dir apps/web build

  api:
    name: api
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8
        with:
          version: "0.10.11"
          python-version: "3.13"
          enable-cache: true
          working-directory: apps/api
      - run: uv sync --directory apps/api --frozen
      - run: uv run --directory apps/api ruff check .
      - run: uv run --directory apps/api ruff format --check .
      - run: uv run --directory apps/api pytest -W error
