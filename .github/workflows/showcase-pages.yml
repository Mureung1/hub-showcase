name: Showcase Pages

on:
  push:
    branches:
      - dashboard-page
    paths:
      - 'dashboard/**'
      - '.github/workflows/showcase-pages.yml'
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 대시보드 코드 받기
        uses: actions/checkout@v7
        with:
          ref: dashboard-page
          fetch-depth: 0

      - name: 전시 대상 브랜치 받기
        run: git fetch origin '+refs/heads/*:refs/remotes/origin/*'

      - name: Node.js 설정
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: 패키지 설치
        run: npm ci
        working-directory: dashboard

      - name: showcase 자료 만들기
        run: npm run collect:active
        working-directory: dashboard

      - name: 시험 실행
        run: npm test
        working-directory: dashboard

      - name: 정적 파일 만들기
        run: npm run build
        working-directory: dashboard

      - name: Pages 설정
        uses: actions/configure-pages@v6

      - name: 정적 파일 업로드
        uses: actions/upload-pages-artifact@v5
        with:
          path: dashboard/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Pages 배포
        id: deployment
        uses: actions/deploy-pages@v5
