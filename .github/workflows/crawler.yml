name: Crawler

on:
  schedule:
    # 매일 15:00 UTC (00:00 KST, 이슈 #87) — KST 자정 직후 실행해 그 전날 마감된 공고를
    # 최대한 빨리 sweep 대상으로 잡는다. dday 계산 자체는 kstToday()가 실행 서버(UTC)
    # 타임존과 무관하게 KST 기준으로 하므로, 이 스케줄은 "지연 시간 최소화" 목적이다.
    - cron: '0 15 * * *'
  workflow_dispatch: {}

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # 이슈 #74: bizinfo 호출은 crawler 코드 안에서도 지수 백오프 재시도를 하지만(withRetry),
      # 그마저 다 소진될 정도로 bizinfo가 몇 분 이상 다운되는 경우까지 대비한 두 번째 안전망.
      # 5분 간격 재시도라 최악의 경우에도 다음날 15:00 UTC 실행과 겹치지 않는다.
      - name: Run crawler (with retry)
        uses: nick-fields/retry@ce71cc2ab81d554ebbe88c79ab5975992d79ba08 # v3.0.2
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 300
          command: npm run run -w @hub/crawler
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BIZINFO_API_KEY: ${{ secrets.BIZINFO_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
