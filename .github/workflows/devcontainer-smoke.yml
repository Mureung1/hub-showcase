name: Dev Container smoke

on:
  pull_request:
    paths:
      - .devcontainer/**
      - .vscode/**
      - docker-compose*.yml
      - Makefile
      - scripts/**
      - package.json
      - package-lock.json
      - .github/workflows/devcontainer-smoke.yml
  push:
    branches:
      - main
    paths:
      - .devcontainer/**
      - .vscode/**
      - docker-compose*.yml
      - Makefile
      - scripts/**
      - package.json
      - package-lock.json
      - .github/workflows/devcontainer-smoke.yml

concurrency:
  group: devcontainer-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Build and test Dev Container
        uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3
        with:
          imageName: ghcr.io/${{ github.repository }}/placepick-devcontainer-ci
          push: never
          runCmd: make setup && java -version && node --version && docker version
