name: Deploy Overlay Studio

on:
  push:
    branches: [week2-project-structure]
    paths:
      - "tools/overlay-agent/web/**"
      - ".github/workflows/deploy-overlay-studio.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/overlay-agent/web/package-lock.json
      - name: Install dependencies
        working-directory: tools/overlay-agent/web
        run: npm ci
      - name: Prepare local vision assets
        working-directory: tools/overlay-agent/web
        run: npm run setup-models
      - name: Build static site
        working-directory: tools/overlay-agent/web
        env:
          VITE_BASE_PATH: /hub/
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: tools/overlay-agent/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
