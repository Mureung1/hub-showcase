name: Deploy Overlay Studio

on:
  push:
    branches: [week2-project-structure]
    paths:
      - "tools/overlay-agent/web/**"
      - ".github/workflows/deploy-overlay-studio.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/overlay-agent/web/package-lock.json
      - name: Install dependencies
        working-directory: tools/overlay-agent/web
        run: npm ci
      - name: Prepare local vision assets
        working-directory: tools/overlay-agent/web
        run: npm run setup-models
      - name: Build static site
        working-directory: tools/overlay-agent/web
        env:
          VITE_BASE_PATH: /hub/overlay-studio/
        run: npm run build
      - name: Publish Studio below the existing Pages site
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: tools/overlay-agent/web/dist
          destination_dir: overlay-studio
          keep_files: true
