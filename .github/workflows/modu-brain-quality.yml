name: Modu Brain quality

on:
  pull_request:
  push:
    branches:
      - "N031_김서준"
      - production
  workflow_dispatch:

# Fork pull requests receive a read-only token. No job in this workflow has
# deployment permissions or reads repository/environment secrets.
permissions:
  contents: read

concurrency:
  group: modu-brain-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MODU_BRAIN_ANALYSIS_PROVIDER: local-heuristic
  MODU_BRAIN_OPENAI_ENABLED: "false"

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run the local quality gate
        run: npm run check
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-${{ github.run_id }}
          path: coverage/
          if-no-files-found: ignore
          retention-days: 7

  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out full history
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan for committed credentials
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

  db-integration:
    name: db-integration
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Set up Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3
        with:
          version: 2.109.1
      - name: Start isolated local Supabase
        run: supabase start
      - name: Apply migrations and seed from scratch
        run: supabase db reset
      - name: Verify migration rollback and reapply
        shell: bash
        run: |
          source <(supabase status -o env)
          while IFS= read -r file; do
            psql "$DB_URL" --set ON_ERROR_STOP=1 --file "$file"
          done < <(find supabase/rollback -maxdepth 1 -name '*.down.sql' -print | sort -r)
          while IFS= read -r file; do
            psql "$DB_URL" --set ON_ERROR_STOP=1 --file "$file"
          done < <(find supabase/migrations -maxdepth 1 -name '*.sql' -print | sort)
      - name: Run pgTAP database policy tests
        run: supabase test db

  e2e:
    name: e2e
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Set up Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3
        with:
          version: 2.109.1
      - name: Install dependencies and Chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Start and reset isolated local Supabase
        run: |
          supabase start
          supabase db reset
      - name: Export local-only test settings
        shell: bash
        run: |
          source <(supabase status -o env)
          echo "SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "SUPABASE_ANON_KEY=$ANON_KEY" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY" >> "$GITHUB_ENV"
          echo "VITE_SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "VITE_SUPABASE_ANON_KEY=$ANON_KEY" >> "$GITHUB_ENV"
      - name: Run browser journeys
        env:
          E2E_TEST_EMAIL: modu-brain-e2e@example.test
          IP_HASH_SECRET: ci-only-ip-hash-secret-not-for-production
        run: npm run test:e2e
      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  security-smoke:
    name: security-smoke
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies and build
        run: |
          npm ci
          npm run build
      - name: Verify local headers, health metadata, and bounded load
        shell: bash
        env:
          HOST: 127.0.0.1
          PORT: 4173
          RENDER_GIT_COMMIT: ${{ github.sha }}
          LOAD_TEST_PHASES: "5:2,25:2"
          LOAD_TEST_P95_MS: "500"
        run: |
          npm start > /tmp/modu-brain-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/api/health/live > /dev/null; then
              break
            fi
            sleep 1
          done
          node scripts/ops/security-smoke.mjs http://127.0.0.1:4173 "${{ github.sha }}"
          npm run ops:load
