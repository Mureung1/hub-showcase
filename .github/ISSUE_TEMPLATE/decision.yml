name: Decision
description: 장기 영향을 주는 기술·제품 결정을 ADR과 함께 논의합니다.
title: "decision: "
labels:
  - decision
body:
  - type: textarea
    id: context
    attributes:
      label: 결정 맥락과 제약
      description: 지금 결정해야 하는 이유와 변경하지 않을 때의 영향을 적어주세요.
    validations:
      required: true
  - type: textarea
    id: criteria
    attributes:
      label: 판단 기준
      description: 우선순위와 비교 지표를 적어주세요.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 대안과 트레이드오프
      description: 최소 두 대안 또는 다른 대안이 성립하지 않는 근거를 적어주세요.
    validations:
      required: true
  - type: input
    id: adr
    attributes:
      label: ADR
      description: 제안 ADR ID 또는 경로를 적어주세요.
      placeholder: ADR-0001
    validations:
      required: true
