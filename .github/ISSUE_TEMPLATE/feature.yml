name: 기능 구현
description: 사용자 결과와 완료 기준이 분명한 구현 작업을 등록합니다.
title: '[기능] '
labels:
  - enhancement
projects:
  - ppre1ude/3
body:
  - type: markdown
    attributes:
      value: |
        하나의 이슈에는 사용자가 끝까지 확인할 수 있는 결과 하나를 담아 주세요.

  - type: textarea
    id: user-story
    attributes:
      label: 사용자 이야기
      description: 이 작업으로 사용자가 얻는 결과를 한두 문장으로 적어 주세요.
      placeholder: 사용자는 …할 수 있다.
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: 구현 범위
      description: 이번 이슈에서 구현할 흐름과 경계를 적어 주세요.
      placeholder: |
        - 구현할 사용자 흐름
        - 다룰 데이터와 상태
        - 연결할 화면과 기능
    validations:
      required: true

  - type: textarea
    id: tasks
    attributes:
      label: 작업 항목
      description: 구현 순서를 확인할 수 있는 작업 목록을 적어 주세요.
      value: |
        - [ ] 첫 번째 작업
        - [ ] 두 번째 작업
    validations:
      required: true

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: 완료 기준
      description: 구현을 마쳤다고 판단할 수 있는 관찰 가능한 조건을 적어 주세요.
      value: |
        - [ ] 사용자가 확인할 수 있는 결과
        - [ ] 오류와 빈 상태 처리
        - [ ] 필요한 자동 테스트
    validations:
      required: true

  - type: textarea
    id: verification
    attributes:
      label: 검증 방법
      description: 완료 기준을 확인할 실행 절차와 명령을 적어 주세요.
      value: |
        - [ ] 핵심 사용자 흐름을 처음부터 끝까지 실행한다.
        - [ ] 관련 테스트와 품질 명령을 실행한다.
    validations:
      required: true

  - type: textarea
    id: references
    attributes:
      label: 관련 기준
      description: 참고할 Wiki, 저장소 문서, 디자인 기준이나 관련 이슈를 연결해 주세요.
      placeholder: |
        - https://github.com/ppre1ude/hub/wiki/...
        - 관련 문서 또는 이슈

  - type: input
    id: dependencies
    attributes:
      label: 선행 이슈
      description: 먼저 완료해야 하는 이슈 번호를 적어 주세요. 없으면 `없음`이라고 적습니다.
      placeholder: '#13 또는 없음'

  - type: textarea
    id: out-of-scope
    attributes:
      label: 제외 범위
      description: 범위가 커지지 않도록 이번 이슈에서 다루지 않을 내용을 적어 주세요.
      placeholder: |
        - 이번 이슈에서 구현하지 않을 기능
        - 후속 이슈에서 판단할 내용
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ### 등록 뒤 Project에서 채울 항목

        `기능 영역`, `예상 시간(h)`, `우선순위`, `시작일`, `완료 목표일`, `주차`, `제품 단계`, `작업 종류`를 입력합니다. 관련된 `화면:*` 라벨을 붙이고, 상위 기능이 있으면 GitHub의 Parent issue로 연결합니다. 개인 프로젝트이므로 담당자는 지정하지 않습니다.
