name: Feature
description: 사용자 가치가 있는 기능을 문제와 성공 기준부터 정의합니다.
title: "feat: "
labels:
  - feature
body:
  - type: textarea
    id: problem
    attributes:
      label: 문제와 근거
      description: 누구의 어떤 문제가 있으며 어떤 관찰·데이터가 이를 뒷받침하는지 적어주세요.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: 목적과 성공 기준
      description: 구현물이 아니라 달성할 결과와 검증 방법을 적어주세요.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 범위와 비범위
      description: 이번 변경에 포함하고 포함하지 않을 내용을 구분해 주세요.
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: 제약, 위험과 계약 영향
      description: API·이벤트·DB·LLM·보안·비용·호환성 영향을 적어주세요.
    validations:
      required: true
  - type: input
    id: work_record
    attributes:
      label: Work Record
      description: 연결할 WI ID 또는 문서 경로를 적어주세요.
      placeholder: WI-0001
    validations:
      required: true
