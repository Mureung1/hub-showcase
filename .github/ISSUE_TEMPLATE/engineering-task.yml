name: Engineering task
description: 환경·리팩터링·품질·운영 작업을 검증 가능한 단위로 정의합니다.
title: "chore: "
labels:
  - engineering
body:
  - type: textarea
    id: context
    attributes:
      label: 현재 상태와 문제
      description: 재현 가능한 현재 상태와 작업이 필요한 이유를 적어주세요.
    validations:
      required: true
  - type: textarea
    id: criteria
    attributes:
      label: 완료·검증 기준
      description: 명령, 테스트, 문서와 관측 증거를 포함해 주세요.
    validations:
      required: true
  - type: textarea
    id: decisions
    attributes:
      label: 필요한 의사 결정
      description: 판단 기준, 대안과 ADR 필요 여부를 적어주세요.
    validations:
      required: true
  - type: input
    id: work_record
    attributes:
      label: Work Record
      placeholder: WI-0001
    validations:
      required: true
