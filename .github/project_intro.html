<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>프로젝트 소개</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at top, #16212a 0%, #08111a 55%, #04080d 100%);
      color: #e9f2ff;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
    }
    .app-shell {
      width: min(100%, 760px);
      padding: 32px;
    }
    .card {
      position: relative;
      border-radius: 24px;
      background: rgba(18, 28, 42, 0.92);
      box-shadow: 0 28px 80px rgba(0, 0, 0, 0.24);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 32px;
      backdrop-filter: blur(16px);
    }
    .badge {
      display: inline-flex;
      gap: 8px;
      align-items: center;
      padding: 10px 16px;
      border-radius: 999px;
      background: rgba(94, 156, 255, 0.12);
      color: #93b5ff;
      font-size: 0.92rem;
      letter-spacing: 0.03em;
      margin-bottom: 24px;
    }
    h1 {
      margin: 0 0 20px;
      font-size: clamp(2rem, 2.6vw, 3rem);
      line-height: 1.05;
    }
    p {
      margin: 0;
      line-height: 1.75;
      color: #cbd4e3;
    }
    .section {
      margin-top: 24px;
    }
    .section strong {
      color: #ffffff;
    }
    .feature-list {
      margin: 16px 0 0;
      padding: 0;
      list-style: none;
      display: grid;
      gap: 12px;
    }
    .feature-list li {
      padding: 18px 20px;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.06);
    }
    .feature-list li strong {
      display: block;
      margin-bottom: 6px;
      color: #f4f9ff;
    }
    .toggle-button {
      margin-top: 28px;
      padding: 14px 22px;
      border: none;
      border-radius: 14px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      color: #0d1a2e;
      background: #8fb7ff;
      transition: transform 0.2s ease, background 0.2s ease;
    }
    .toggle-button:hover {
      transform: translateY(-1px);
      background: #a6c9ff;
    }
    .note {
      margin-top: 18px;
      font-size: 0.96rem;
      color: #9bb0cc;
    }
  </style>
</head>
<body>
  <div id="root" class="app-shell"></div>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script type="text/babel">
    const { useState } = React;

    function ProjectIntro() {
      const [detailsVisible, setDetailsVisible] = useState(false);
      const handleToggle = () => setDetailsVisible((prev) => !prev);

      return (
        <div className="card">
          <div className="badge">4주 프로젝트 소개</div>
          <h1>스마트 소상공인 지원금 매칭 & 규제 가이드</h1>
          <p>
            정보 취약계층인 소상공인을 위한 공공 정책 지원금 자동 매칭 서비스와
            계약서 독소조항 검토 에이전트입니다. 현장의 부담을 줄이고 실시간
            대응을 돕는 경험을 제공합니다.
          </p>

          <div className="section">
            <strong>기획 의도</strong>
            <p>
              디지털 접근성이 낮은 소상공인에게 맞춤형 지원 정보를 선제적으로
              전달하여 복잡한 행정 절차와 규제 위험에서 안전하게 보호합니다.
            </p>
          </div>

          <div className="section">
            <strong>핵심 기능</strong>
            <ul className="feature-list">
              <li>
                <strong>지원금 선제적 알림</strong>
                지방자치단체 및 공공기관 지원금 정보를 자동 매칭하고 우선 안내합니다.
              </li>
              <li>
                <strong>계약서 독소조항 검토</strong>
                거래 조건 및 계약서 문장을 분석해 주요 위험 요소를 쉽고 빠르게
                확인합니다.
              </li>
            </ul>
          </div>

          <button className="toggle-button" onClick={handleToggle}>
            {detailsVisible ? '숨기기' : '자세히 보기'}
          </button>

          {detailsVisible && (
            <div className="note">
              이 서비스는 소상공인의 공공 지원 접근성을 높이고, 법률·규제 리스크를
              줄이는 데 초점을 둔 4주 개발 프로젝트입니다.
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<ProjectIntro />);
  </script>
</body>
</html>
