<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>내 계정 - ShopEase</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="container">
    <header class="topbar">
      <div class="logo"><span class="logo-mark">S</span>ShopEase</div>
      <nav class="menu-links">
        <a href="shopping_site.html">홈으로</a>
        <a href="login.html">로그아웃</a>
      </nav>
    </header>

    <section class="detail-card">
      <h1>내 계정</h1>
      <p>로그인 상태입니다. 아래 정보로 주문 내역과 배송지를 확인하세요.</p>
      <div class="account-grid">
        <div class="account-card">
          <div><span>이름</span><span>홍길동</span></div>
          <div><span>이메일</span><span>user@example.com</span></div>
          <div><span>회원등급</span><span>일반 회원</span></div>
          <div><span>포인트</span><span>1,200P</span></div>
        </div>
        <div class="account-card">
          <div><span>최근 주문</span><span>없음</span></div>
          <div><span>Wishlist</span><span>5개</span></div>
          <div><span>배송지</span><span>서울시 강남구</span></div>
          <div><span>로그인 상태</span><span>활성</span></div>
        </div>
      </div>
      <div class="actions-row">
        <a class="btn btn-primary" href="shopping_site.html">쇼핑 계속하기</a>
        <a class="btn btn-secondary" href="login.html">로그아웃</a>
      </div>
    </section>
  </div>
</body>
</html>
