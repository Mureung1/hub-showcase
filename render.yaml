services:
  - type: web
    name: localtwin-api
    runtime: python
    region: singapore
    plan: free
    rootDir: product/apps/api
    buildCommand: pip install .
    startCommand: uvicorn localtwin_api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: off
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGINS_SERVER
        value: https://localtwin-product.vercel.app
      - key: DATABASE_URL
        sync: false
      - key: SCENE_API_ENABLED
        value: false
      - key: PYTHONUNBUFFERED
        value: "1"
