# https://render.com/docs/blueprint-spec
# ═══════════════════════════════════════════════════════════════════════════

services:
  - type: web
    name: hub-api
    runtime: node
    # Root Directory는 프로젝트 루트 (packages/kb 접근 필요)
    buildCommand: cd apps/api && npm install
    startCommand: cd apps/api && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        sync: false  # 수동 설정 필요
      - key: SUPABASE_ANON_KEY
        sync: false  # 수동 설정 필요
      - key: FRONTEND_URL
        sync: false  # Vercel 배포 후 설정
