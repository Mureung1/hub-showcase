services:
  - type: web
    name: modu-brain-demo
    runtime: node
    plan: free
    region: singapore
    branch: production
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health/ready
    # Promote only commits whose GitHub required checks have succeeded.
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: MODU_BRAIN_ANALYSIS_PROVIDER
        value: local-heuristic
      - key: MODU_BRAIN_OPENAI_ENABLED
        value: "false"
      - key: MODU_BRAIN_OPENAI_MODEL
        value: gpt-5.6-terra
      - key: MODU_BRAIN_OPENAI_REASONING_EFFORT
        value: low
      - key: MODU_BRAIN_TRUST_PROXY
        value: render
      - key: MODU_BRAIN_CANONICAL_ORIGIN
        value: https://modu-brain-demo.onrender.com
      - key: MODU_BRAIN_CAPTCHA_REQUIRED
        value: "true"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_PUBLISHABLE_KEY
        sync: false
      # Public Turnstile site key. Configure the matching secret only in the
      # Supabase Auth CAPTCHA dashboard; it must never be exposed to Vite.
      - key: VITE_TURNSTILE_SITE_KEY
        sync: false
      - key: SAFETY_IDENTIFIER_SECRET
        generateValue: true
      - key: IP_HASH_SECRET
        generateValue: true
