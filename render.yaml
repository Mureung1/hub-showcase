services:
  - type: web
    name: review-assistant-server
    runtime: node
    plan: free
    rootDir: review-assistant-server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: CORS_ORIGIN
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
