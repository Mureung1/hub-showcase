services:
  - type: web
    name: haru-checkout-n114-demo
    runtime: node
    plan: free
    buildCommand: npm run render:build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: SERVE_CLIENT
        value: "true"
      - key: DEMO_MODE
        value: "true"
      - key: AI_GENERATION_RETRIES
        value: "0"
      - key: AI_TIMEOUT_MS
        value: "3000"
