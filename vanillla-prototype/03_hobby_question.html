<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>우리결 | 취미 발견 테스트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="page">

  <div class="progress-label" id="progress">1/8</div>

  <h1 class="page-title" id="introTitle">처음 오셨군요!</h1>
  <p class="page-subtitle" id="introSub">몇 가지 질문으로 당신의 취미를 찾아볼게요</p>

  <h2 class="page-title" id="questionText" style="margin-bottom:16px;"></h2>

  <div class="choice-grid" id="choiceGrid"></div>

</div>

<script src="js/icons.js"></script>
<script src="js/quiz.js"></script>
<script>
  var questions = [
    { q: "선호하는 장소가 있나요?", options: [
      { icon: "moon", label: "조용한 장소" },
      { icon: "sparkle", label: "시끄러운 장소" }
    ]},
    { q: "주말엔 주로 뭘 하나요?", options: [
      { icon: "home", label: "집에서 휴식" },
      { icon: "running", label: "밖에서 활동" }
    ]},
    { q: "새로운 걸 배우는 거 좋아하나요?", options: [
      { icon: "book", label: "네, 좋아해요" },
      { icon: "sofa", label: "익숙한 게 좋아요" }
    ]},
    { q: "사람 많은 곳 vs 한적한 곳?", options: [
      { icon: "crowd", label: "사람 많은 곳" },
      { icon: "leaf", label: "한적한 곳" }
    ]},
    { q: "몸을 움직이는 게 좋나요?", options: [
      { icon: "running", label: "활동적인 게 좋아요" },
      { icon: "palette", label: "정적인 게 좋아요" }
    ]},
    { q: "계획적인 편인가요?", options: [
      { icon: "calendar", label: "미리 계획해요" },
      { icon: "dice", label: "즉흥적이에요" }
    ]},
    { q: "디지털 vs 아날로그?", options: [
      { icon: "phone", label: "디지털 기기" },
      { icon: "pen", label: "아날로그 감성" }
    ]}
  ];

  renderQuiz({ questions: questions, totalSteps: 8, resultUrl: "04_hobby_result.html" });
</script>
</body>
</html>
