<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>우리결 | 과팅 인원 선택</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="page">

  <div class="progress-label">1/5</div>

  <h1 class="page-title">과팅 인원을 선택해주세요</h1>

  <div class="size-options">

    <a class="size-card" href="10_ideal_type_question.html" onclick="localStorage.setItem('groupSize','1:1')">
      <div class="size-icon-row">
        <span class="icon-box" data-icon="person"></span>
        <span class="icon-box heart" data-icon="heart"></span>
        <span class="icon-box" data-icon="person"></span>
      </div>
      <div class="size-ratio">1:1</div>
      <div class="size-desc">두근두근한 분위기를 원한다면?</div>
    </a>

    <a class="size-card" href="10_ideal_type_question.html" onclick="localStorage.setItem('groupSize','2:2')">
      <div class="size-icon-row">
        <span class="icon-box" data-icon="person"></span>
        <span class="icon-box" data-icon="person"></span>
        <span class="icon-box heart" data-icon="heart"></span>
        <span class="icon-box" data-icon="person"></span>
        <span class="icon-box" data-icon="person"></span>
      </div>
      <div class="size-ratio">2:2</div>
      <div class="size-desc">부담없이 즐기고 싶다면?</div>
    </a>

    <a class="size-card" href="10_ideal_type_question.html" onclick="localStorage.setItem('groupSize','3:3')">
      <div class="size-icon-row">
        <span class="icon-box" data-icon="person"></span>
        <span class="icon-box" data-icon="person"></span>
        <span class="icon-box" data-icon="person"></span>
        <span class="icon-box heart" data-icon="heart"></span>
        <span class="icon-box" data-icon="person"></span>
        <span class="icon-box" data-icon="person"></span>
        <span class="icon-box" data-icon="person"></span>
      </div>
      <div class="size-ratio">3:3</div>
      <div class="size-desc">왁자지껄하게 즐기고 싶다면?</div>
    </a>

  </div>

</div>
<script src="js/icons.js"></script>
<script src="js/apply-icons.js"></script>
</body>
</html>
