<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>우리결 | 이상형 테스트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="page">

  <div class="progress-label" id="progress">1/6</div>

  <h1 class="page-title" id="introTitle">먼저 이상형 테스트를 시작할게요!</h1>
  <p class="page-subtitle" id="introSub" style="display:none;"></p>

  <h2 class="page-title" id="questionText" style="margin-bottom:16px;"></h2>

  <div class="choice-grid" id="choiceGrid"></div>

</div>

<script src="js/quiz.js"></script>
<script>
  var questions = [
    { q: "원하는 데이트가 무엇인가요?", options: [
      { icon: "🌳", label: "밖에서 하는 데이트" },
      { icon: "🛋️", label: "집에서 하는 데이트" }
    ]},
    { q: "대화 스타일은 어떤 게 좋나요?", options: [
      { icon: "🤫", label: "조용히 대화해요" },
      { icon: "🗣️", label: "활발하게 대화해요" }
    ]},
    { q: "연락은 어느 정도가 좋나요?", options: [
      { icon: "📱", label: "자주 연락해요" },
      { icon: "🌙", label: "가끔 연락해요" }
    ]},
    { q: "스킨십 표현은 어떤가요?", options: [
      { icon: "🤗", label: "적극적인 편" },
      { icon: "🙈", label: "조심스러운 편" }
    ]},
    { q: "데이트 비용은 어떻게 나눌까요?", options: [
      { icon: "🧾", label: "반반이 좋아요" },
      { icon: "💳", label: "상황따라 달라요" }
    ]},
    { q: "선물은 어떤 스타일이 좋나요?", options: [
      { icon: "🎁", label: "이벤트를 좋아해요" },
      { icon: "✅", label: "실용적인 게 좋아요" }
    ]}
  ];

  renderQuiz({ questions: questions, totalSteps: 6, resultUrl: "11_samegender_matching.html" });
</script>
</body>
</html>
