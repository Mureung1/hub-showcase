services:
  k6:
    image: placepick/k6:2.1.0
    build:
      context: ./k6
      dockerfile: Dockerfile
    environment:
      BASE_URL: ${BASE_URL:-http://dev:8080}
      PLACEPICK_EXTERNAL_MODE: ${PLACEPICK_EXTERNAL_MODE:-mock}
    command: ["version"]
    depends_on:
      dev:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "k6", "version"]
      interval: 10s
      timeout: 5s
      retries: 3
