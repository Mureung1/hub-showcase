<!-- Interview Card Container -->

<!-- Decorative Background Element (Lightweight Atmospheric Effect) -->
<div class="fixed -bottom-32 -left-32 w-96 h-96 bg-primary opacity-5 blur-[120px] rounded-full pointer-events-none" id="glow-effect"></div>
<div class="fixed -top-32 -right-32 w-96 h-96 bg-secondary opacity-5 blur-[120px] rounded-full pointer-events-none" id="glow-effect-2"></div>
</main>
<script>
        // Micro-interaction for option cards
        const optionCards = document.querySelectorAll('.option-card');
        optionCards.forEach(card => {
            card.addEventListener('click', () => {
                optionCards.forEach(c => c.classList.remove('active'));
                card.classList.add('active');
            });
        });

        // Simple mouse tracking glow effect
        document.addEventListener('mousemove', (e) => {
            const glow1 = document.getElementById('glow-effect');
            const glow2 = document.getElementById('glow-effect-2');
            
            const moveX = (e.clientX / window.innerWidth - 0.5) * 50;
            const moveY = (e.clientY / window.innerHeight - 0.5) * 50;
            
            glow1.style.transform = `translate(${moveX}px, ${moveY}px)`;
            glow2.style.transform = `translate(${-moveX}px, ${-moveY}px)`;
        });
    </script>
