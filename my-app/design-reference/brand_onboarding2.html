<script>
        function toggleConnection(btn) {
            // Simplified interaction simulation
            const parent = btn.closest('.flex.items-center.justify-between');
            
            // Transform button to connected state
            btn.classList.remove('bg-primary', 'hover:bg-[#0052cc]', 'text-on-primary');
            btn.classList.add('bg-secondary-container', 'text-secondary', 'cursor-default');
            btn.onclick = null;
            btn.innerHTML = `
                <span class="material-symbols-outlined fill-icon text-[18px]">check_circle</span>
                <span>연결됨</span>
            `;

            // Change card background
            parent.classList.remove('bg-white');
            parent.classList.add('bg-surface-container-low');

            // Feedback
            const toast = document.createElement('div');
            toast.className = 'fixed bottom-10 left-1/2 -translate-x-1/2 bg-inverse-surface text-inverse-on-surface px-6 py-3 rounded-xl shadow-xl flex items-center gap-3 animate-bounce';
            toast.innerHTML = `<span class="material-symbols-outlined text-secondary">check_circle</span> <span class="font-label-md">채널이 성공적으로 연결되었습니다.</span>`;
            document.body.appendChild(toast);
            
            setTimeout(() => toast.remove(), 3000);
        }
    </script>
