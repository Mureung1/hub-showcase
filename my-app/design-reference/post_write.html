</div>

</div>

<span class="material-symbols-outlined text-outline text-[18px] cursor-help">info</span>
<div class="tooltip-content absolute bottom-full left-1/2 -translate-x-1/2 mb-2 px-md py-sm bg-inverse-surface text-inverse-on-surface text-label-sm rounded-lg w-[240px] opacity-0 invisible transform translate-y-1 transition-all duration-200 z-10 shadow-lg">
                            홍보 목적에 따라 AI가 질문과 SEO 전략을 다르게 생성합니다.

<!-- Side Decoration (Subtle AI Particles) -->

<div class="absolute top-[-10%] right-[-5%] w-[40%] h-[40%] bg-primary/5 blur-[120px] rounded-full"></div>
<div class="absolute bottom-[-5%] left-[-5%] w-[30%] h-[30%] bg-tertiary/5 blur-[100px] rounded-full"></div>
</div>
<script>
        // Interactive Selection Logic
        const cards = document.querySelectorAll('.selection-card');
        cards.forEach(card => {
            card.addEventListener('click', () => {
                cards.forEach(c => {
                    c.classList.remove('active', 'border-2', 'border-primary', 'bg-on-primary-container/10');
                    c.classList.add('border', 'border-outline-variant');
                    const iconBox = c.querySelector('.w-12.h-12');
                    iconBox.classList.remove('bg-primary-container');
                    iconBox.classList.add('bg-surface-container');
                    const icon = c.querySelector('.material-symbols-outlined');
                    icon.classList.remove('text-white');
                    icon.classList.add('text-on-surface-variant');
                    const dot = c.querySelector('.rounded-full.bg-primary');
                    dot.classList.add('opacity-0');
                    const outerCircle = c.querySelector('.w-6.h-6');
                    outerCircle.classList.remove('border-primary');
                    outerCircle.classList.add('border-outline-variant');
                });

                card.classList.add('active', 'border-2', 'border-primary', 'bg-on-primary-container/10');
                card.classList.remove('border', 'border-outline-variant');
                const activeIconBox = card.querySelector('.w-12.h-12');
                activeIconBox.classList.add('bg-primary-container');
                activeIconBox.classList.remove('bg-surface-container');
                const activeIcon = card.querySelector('.material-symbols-outlined');
                activeIcon.classList.add('text-white');
                activeIcon.classList.remove('text-on-surface-variant');
                const activeDot = card.querySelector('.rounded-full.bg-primary');
                activeDot.classList.remove('opacity-0');
                const activeOuterCircle = card.querySelector('.w-6.h-6');
                activeOuterCircle.classList.add('border-primary');
                activeOuterCircle.classList.remove('border-outline-variant');
            });
        });
    </script>
