<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ShowUp Demo Player</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #111; color: #fff;
    font-family: -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
    overflow: hidden;
  }

  /* Main stage */
  #stage {
    width: 100vw; height: 100vh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center;
  }

  /* Card styles */
  .card-content {
    max-width: 900px;
  }
  .card-content h1 { font-size: 48px; font-weight: 700; line-height: 1.4; margin-bottom: 20px; }
  .card-content h2 { font-size: 36px; font-weight: 600; line-height: 1.5; margin-bottom: 16px; }
  .card-content p { font-size: 28px; font-weight: 400; line-height: 1.6; color: #ccc; }
  .card-content .small { font-size: 22px; color: #888; margin-top: 24px; }
  .card-content .logo { font-size: 72px; font-weight: 800; margin-bottom: 30px; }
  .card-content .tagline { font-size: 32px; color: #ccc; margin-bottom: 40px; }
  .card-content .meta { font-size: 22px; color: #666; line-height: 1.8; }

  /* Action cue — when user needs to switch to Chrome */
  .action-cue {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    width: 100vw; height: 100vh;
  }
  .action-cue .icon { font-size: 80px; margin-bottom: 20px; }
  .action-cue .title { font-size: 42px; font-weight: 700; margin-bottom: 15px; }
  .action-cue .desc { font-size: 28px; color: #aaa; max-width: 700px; line-height: 1.5; }
  .action-cue .steps { font-size: 24px; color: #888; margin-top: 20px; line-height: 1.8; text-align: left; }
  .action-cue .steps li { margin-bottom: 8px; list-style: none; }
  .action-cue .steps li::before { content: "→ "; color: #f59e0b; }
  .action-cue .timer { font-size: 60px; font-weight: 700; color: #f59e0b; margin-top: 30px; }

  /* Problem cards */
  .problem-card { text-align: left; padding: 0 120px; max-width: 1000px; }
  .problem-card .label { font-size: 22px; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 2px; }
  .problem-card .content { font-size: 32px; line-height: 1.5; margin-bottom: 30px; }
  .problem-card .solution-label { color: #22c55e; }
  .problem-card .problem-label { color: #ef4444; }

  /* Ending card */
  .ending .logo { font-size: 64px; font-weight: 800; margin-bottom: 20px; }
  .ending .tagline { font-size: 28px; color: #ccc; margin-bottom: 30px; }
  .ending .info { font-size: 22px; color: #888; line-height: 1.8; }
  .ending .roadmap { font-size: 20px; color: #555; margin-top: 30px; line-height: 1.8; }
  .ending .roadmap strong { color: #aaa; }

  /* Progress bar */
  #progress {
    position: fixed; bottom: 0; left: 0;
    height: 4px; background: #f59e0b;
    width: 0%; transition: width 0.3s;
    z-index: 100;
  }

  /* Scene counter */
  #counter {
    position: fixed; top: 20px; right: 20px;
    font-size: 16px; color: #555;
    z-index: 100;
  }

  /* Start screen */
  #start-screen {
    width: 100vw; height: 100vh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center;
  }
  #start-screen h1 { font-size: 56px; margin-bottom: 20px; }
  #start-screen p { font-size: 24px; color: #888; margin-bottom: 15px; line-height: 1.6; }
  #start-screen .warning { font-size: 20px; color: #f59e0b; margin-top: 30px; line-height: 1.6; }
  #start-btn {
    margin-top: 40px;
    padding: 20px 60px;
    font-size: 28px;
    font-weight: 700;
    background: #f59e0b;
    color: #111;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    transition: transform 0.1s;
  }
  #start-btn:hover { transform: scale(1.05); }
  #start-btn:active { transform: scale(0.98); }

  /* Hidden */
  .hidden { display: none !important; }
</style>
</head>

let currentScene = 0;
let audio = new Audio();

function renderScene(i) {
  const scene = scenes[i];
  const stage = document.getElementById('stage');
  const counter = document.getElementById('counter');
  counter.textContent = `${i + 1} / ${scenes.length}`;

  if (scene.type === 'card') {
    stage.innerHTML = scene.html;
  } else if (scene.type === 'action') {
    stage.innerHTML = `
      <div class="action-cue">
        <div class="icon">${scene.icon}</div>
        <div class="title">${scene.title}</div>
        <div class="desc">${scene.desc}</div>
        <ul class="steps">
          ${scene.steps.map(s => `<li>${s}</li>`).join('')}
        </ul>
        <div class="timer" id="action-timer"></div>
      </div>
    `;
  } else if (scene.type === 'problem') {
    stage.innerHTML = `
      <div class="card-content problem-card">
        <div class="label problem-label">${scene.problemLabel}</div>
        <div class="content">${scene.problem}</div>
        <div class="label solution-label">${scene.solutionLabel}</div>
        <div class="content">${scene.solution}</div>
      </div>
    `;
  }

  // Play audio
  audio.src = scene.audio;
  audio.play();

  // Update progress bar
  const progress = ((i + 1) / scenes.length) * 100;
  document.getElementById('progress').style.width = progress + '%';

  // When audio ends, go to next scene
  audio.onended = () => {
    if (i + 1 < scenes.length) {
      renderScene(i + 1);
    } else {
      // Done
      stage.innerHTML = `<div class="card-content">
        <h1 style="color:#22c55e;">녹화 완료</h1>
        <p>QuickTime 녹화를 중지하세요</p>
      </div>`;
      document.getElementById('counter').textContent = '완료';
      document.getElementById('progress').style.width = '100%';
    }
  };

  // Action timer
  if (scene.type === 'action') {
    audio.onloadedmetadata = () => {
      let remaining = Math.ceil(audio.duration);
      const timerEl = document.getElementById('action-timer');
      const interval = setInterval(() => {
        remaining--;
        if (remaining <= 0) {
          clearInterval(interval);
          timerEl.textContent = '';
        } else {
          timerEl.textContent = remaining + '초';
        }
      }, 1000);
    };
  }
}

// Start button
document.getElementById('start-btn').addEventListener('click', () => {
  document.getElementById('start-screen').classList.add('hidden');
  document.getElementById('stage').classList.remove('hidden');
  renderScene(0);
});
