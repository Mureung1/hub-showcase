name: one_step
description: "One-Step: 캐릭터 육성형 도전 앱"
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.10.1

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  # 이미 Flutter SDK가 끌어오는 패키지지만, normalizeMemo가 이모지/한글 결합문자를
  # 안전하게 자르려고 String.characters(그래프임 클러스터)를 직접 쓰므로 직접
  # 의존으로 명시한다(depend_on_referenced_packages 린트). 버전은 Flutter SDK가 고정.
  characters: any
  # riverpod 3.x는 notifier API가 바뀐 breaking change라 2.6.1에 고정한다.
  flutter_riverpod: 2.6.1
  go_router: ^17.3.0
  material_symbols_icons: ^4.2951.0
  # ⚠️ Firebase 버전을 올리지 말 것 (2026-07-14 기준).
  # firebase_auth 6.5.3+ / 그와 함께 올라가는 firestore·messaging·storage는
  # `FirebasePlugin` 클래스를 상속하는데, 그 클래스는 **어떤 배포된
  # firebase_core_platform_interface에도 존재하지 않는다**(7.1.0에도 `FirebasePluginPlatform`뿐).
  # 상류가 아직 안 나온 core를 기대하며 먼저 배포된 상태라, 올리면
  #   "Error: Type 'FirebasePlugin' not found"
  # 로 안드로이드 빌드가 깨진다. firebase_core를 4.10.0에 고정하면
  # pub이 마지막 정상 조합(auth 6.5.2 · fcpi 7.0.1)으로 내려간다.
  # 상류가 고쳐지면(FirebasePlugin이 실제로 배포되면) 다시 올릴 것.
  firebase_core: 4.10.0
  firebase_auth: ^6.5.0
  cloud_firestore: ^6.0.0
  firebase_messaging: ^16.0.0
  firebase_storage: ^13.0.0
  http: ^1.6.0
  # 사진 인증(3주차): 갤러리에서 이미지를 골라 압축 썸네일을 얻는다.
  # 한글 경로 APK 빌드가 되는지 스파이크로 확인했다(네이티브 플러그인이지만 재발 없음).
  # Storage는 쓰지 않는다 — 압축 바이트를 base64로 Firestore proof 문서에 저장한다.
  image_picker: ^1.2.3

dependency_overrides:
  # firebase_core_platform_interface 7.1.0의 Dart pigeon 코덱은 필드를 14개 기대하지만
  # firebase_core 4.10.0의 **네이티브(Android)** 쪽은 13개만 보낸다.
  # → 초기화 시 "RangeError (length): Not in inclusive range 0..13: 14".
  # 네이티브와 짝이 맞는 7.0.1로 고정한다. (auth 6.5.2의 제약 ^7.0.1을 만족)
  firebase_core_platform_interface: 7.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

  # 런처 아이콘 코드젠. 빌드 전에 1회 돌려 android/ios 아이콘 리소스를 굽는
  # 도구라 런타임 의존이 아니다(그래서 dev_dependencies).
  # 캐럿(^) 대신 정확한 버전으로 고정하는 이유: 이 패키지의 산출물은 레포에
  # 커밋되는 바이너리(mipmap PNG · AppIcon.appiconset)다. 도구 버전이 조용히
  # 올라가면 같은 원본에서 다른 픽셀이 구워지고, 그 사실이 이미지 diff로만
  # 드러난다. 설정 블록은 파일 맨 아래 `flutter_launcher_icons:` 에 있다.
  flutter_launcher_icons: 0.14.4

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  uses-material-design: true

  # 도트아트 자산 25장. 디렉터리 단위로 선언하므로 파일이 늘어도 여기는 안 고친다.
  # 경로 오타·선언 누락은 test/core/pixel_asset_test.dart 가 두 층으로 잡는다
  # (File.existsSync = 디스크 대조 · rootBundle.load = 이 선언 자체의 검증).
  assets:
    - assets/characters/
    - assets/backgrounds/
    - assets/auras/
    - assets/empty/
    - assets/dialogs/

  fonts:
    # 두 가변 폰트를 역할로 나눠 번들한다. 역할 분리의 정본은 AppTypography다.
    # 굵기는 AppTypography가 wght 축(FontVariation)으로 지정한다.
    # google_fonts 패키지를 쓰지 않는 이유: 런타임에 폰트를 HTTP로 내려받으므로
    # 오프라인 첫 실행이 깨진다(checklist: 네트워크 없이도 크래시 없어야 함).
    #
    # 본문 기본 서체. **한글 글리프를 갖춘 쪽이다**(Sora에는 한글이 없다).
    # 라이선스: assets/fonts/Pretendard-OFL.txt (SIL OFL).
    - family: Pretendard
      fonts:
        - asset: assets/fonts/PretendardVariable.ttf
    # 수치 전용 서체(코인·XP·카운터 등 숫자만 있는 문자열).
    # 라이선스: assets/fonts/OFL.txt (SIL OFL).
    - family: Sora
      fonts:
        - asset: assets/fonts/Sora-Variable.ttf

# 런처 아이콘 코드젠 설정 (`dart run flutter_launcher_icons`).
#
# 원본 `assets/icon/app_icon.png`는 **위 `flutter:` → `assets:` 목록에 넣지 않는다.**
# 런타임에 `Image.asset`으로 그리는 자산이 아니라 빌드 시 codegen의 입력일 뿐이라,
# 선언하면 앱 번들에 쓰이지 않는 이미지가 한 장 더 실린다.
flutter_launcher_icons:
  image_path: assets/icon/app_icon.png
  android: true
  ios: true

  # Android 8+ 어댑티브 아이콘. 런처가 원형·스쿼클·물방울 등 제조사 마스크를
  # 씌우므로, 단일 정사각 PNG만 주면 모서리가 잘려 나간다. 전경/배경을 나눠
  # 주면 마스크 밖 영역을 배경색이 채워 어떤 모양에서도 잘림이 안 보인다.
  #
  # ⚠️ 전경은 108dp 캔버스 중 **중앙 66dp만 안전 영역**이다(바깥은 마스크·시차
  # 애니메이션에 먹힌다). 원본 PNG는 캐릭터가 캔버스의 대략 2/3 안에 들어오도록
  # 여백을 두고 만들어야 한다.
  adaptive_icon_foreground: assets/icon/app_icon.png
  # AppColors.primary(#006E2F) — 그린. 새 HEX가 아니라 팔레트의 브랜드 주색이다.
  # 노랑은 코인·보상 전용이고 블루는 AI·정보 전용이라 앱 정체성을 대표할 수 없다.
  # (YAML은 Dart 토큰을 못 읽으므로 값이 여기 한 번 복제된다. 그린을 바꾸면
  #  lib/core/theme/app_colors.dart 의 primary 와 함께 고칠 것.)
  adaptive_icon_background: "#006E2F"

  # iOS 아이콘에 알파 채널이 있으면 App Store Connect가 업로드를 거부한다.
  # 투명 픽셀을 흰색으로 합성해 평평하게 만든다.
  remove_alpha_ios: true
