  <rect x="110" y="540" width="402" height="48" rx="24" fill="#2563eb"/><text x="311" y="571" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="17" font-weight="800">저장 후 분석 화면으로 이동</text>

