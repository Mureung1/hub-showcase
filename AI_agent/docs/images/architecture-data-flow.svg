  <path d="M1205 487 H1295" class="line"/>
  <path d="M1205 613 H1295" class="line"/>
  <path d="M1205 728 H1295" class="line"/>
  <path d="M1205 843 H1295" class="line"/>
  <path d="M1205 842 C1240 842 1240 895 1295 895" class="soft-line"/>

  <path d="M1205 488 C1240 488 1240 678 1295 678" class="soft-line"/>
  <path d="M1205 248 C1240 248 1240 895 1295 895" class="soft-line"/>

  <text x="614" y="360" class="small">JSON</text>
  <text x="608" y="535" class="small">Bearer JWT</text>
  <text x="1232" y="665" class="small">AI</text>
  <text x="1232" y="820" class="small">검색</text>
  <text x="1226" y="890" class="small">메일</text>
</svg>
