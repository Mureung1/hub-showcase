<svg width="1600" height="1000" viewBox="0 0 1600 1000" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#475569"/>
    </marker>
    <style>
      .title { font: 800 34px Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 500 16px Arial, sans-serif; fill: #64748b; }
      .lane-title { font: 800 20px Arial, sans-serif; fill: #0f172a; }
      .box-title { font: 800 17px Arial, sans-serif; fill: #0f172a; }
      .box-text { font: 500 13px Arial, sans-serif; fill: #475569; }
      .small { font: 700 12px Arial, sans-serif; fill: #64748b; }
      .line { stroke: #475569; stroke-width: 2; marker-end: url(#arrow); }
      .soft-line { stroke: #94a3b8; stroke-width: 1.5; marker-end: url(#arrow); stroke-dasharray: 5 5; }
      .lane { fill: #f8fafc; stroke: #e2e8f0; stroke-width: 1.5; rx: 18; }
      .client { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.5; rx: 12; }
      .server { fill: #ffffff; stroke: #64748b; stroke-width: 1.5; rx: 12; }
      .service { fill: #ecfeff; stroke: #06b6d4; stroke-width: 1.5; rx: 12; }
      .db { fill: #f0fdf4; stroke: #22c55e; stroke-width: 1.5; rx: 12; }
      .external { fill: #fff7ed; stroke: #f97316; stroke-width: 1.5; rx: 12; }
    </style>
  </defs>

  <rect x="0" y="0" width="1600" height="1000" fill="#f4f7fb"/>
  <text x="70" y="70" class="title">Career Mission AI 전체 데이터 흐름</text>
  <text x="70" y="102" class="subtitle">React 화면에서 Express API를 거쳐 PostgreSQL/Supabase와 외부 API로 이어지는 현재 코드 기준 구조</text>

  <rect x="55" y="135" width="250" height="785" class="lane"/>
  <rect x="335" y="135" width="270" height="785" class="lane"/>
  <rect x="635" y="135" width="300" height="785" class="lane"/>
  <rect x="965" y="135" width="270" height="785" class="lane"/>
  <rect x="1265" y="135" width="280" height="785" class="lane"/>

  <text x="85" y="175" class="lane-title">1. 화면</text>
  <text x="365" y="175" class="lane-title">2. 프론트 API</text>
  <text x="665" y="175" class="lane-title">3. Express 서버</text>
  <text x="995" y="175" class="lane-title">4. 서비스 계층</text>
  <text x="1295" y="175" class="lane-title">5. DB / 외부 API</text>

  <rect x="85" y="210" width="190" height="86" class="client"/>
  <text x="105" y="238" class="box-title">공개 화면</text>
  <text x="105" y="263" class="box-text">Home, Signup, Login</text>
  <text x="105" y="284" class="box-text">VerifyEmail</text>

  <rect x="85" y="330" width="190" height="132" class="client"/>
  <text x="105" y="358" class="box-title">보호 화면</text>
  <text x="105" y="383" class="box-text">MyPage, Specs</text>
  <text x="105" y="404" class="box-text">Analysis, Mission</text>
  <text x="105" y="425" class="box-text">MissionDetail</text>
  <text x="105" y="446" class="box-text">Upload, Feedback, Portfolio</text>

  <rect x="85" y="500" width="190" height="92" class="client"/>
  <text x="105" y="528" class="box-title">mock data</text>
  <text x="105" y="553" class="box-text">추천 미션</text>
  <text x="105" y="574" class="box-text">피드백/포트폴리오 초안</text>

  <rect x="365" y="210" width="210" height="86" class="client"/>
  <text x="385" y="238" class="box-title">authStorage</text>
  <text x="385" y="263" class="box-text">JWT/session localStorage</text>
  <text x="385" y="284" class="box-text">ProtectedRoute 판단</text>

  <rect x="365" y="330" width="210" height="105" class="client"/>
  <text x="385" y="358" class="box-title">authService</text>
  <text x="385" y="383" class="box-text">requestJson</text>
  <text x="385" y="404" class="box-text">requestAuthJson</text>
  <text x="385" y="425" class="box-text">Authorization Bearer</text>

  <rect x="365" y="472" width="210" height="166" class="client"/>
  <text x="385" y="500" class="box-title">career/auth API helper</text>
  <text x="385" y="525" class="box-text">specApi</text>
  <text x="385" y="546" class="box-text">analysisApi</text>
  <text x="385" y="567" class="box-text">missionProgressApi</text>
  <text x="385" y="588" class="box-text">submissionApi</text>
  <text x="385" y="609" class="box-text">job/qualification/schoolApi</text>

  <rect x="665" y="205" width="240" height="70" class="server"/>
  <text x="685" y="233" class="box-title">app.js</text>
  <text x="685" y="258" class="box-text">CORS, JSON parser, router mount</text>

  <rect x="665" y="305" width="240" height="238" class="server"/>
  <text x="685" y="333" class="box-title">API routes</text>
  <text x="685" y="358" class="box-text">/api/auth</text>
  <text x="685" y="379" class="box-text">/api/specs</text>
  <text x="685" y="400" class="box-text">/api/analysis</text>
  <text x="685" y="421" class="box-text">/api/feedback/latest</text>
  <text x="685" y="442" class="box-text">/api/portfolio/latest</text>
  <text x="685" y="463" class="box-text">/api/missions/:id/progress</text>
  <text x="685" y="484" class="box-text">/api/submissions</text>
  <text x="685" y="505" class="box-text">/api/jobs, qualifications</text>
  <text x="685" y="512" class="small">보호 API는 requireAuth 사용</text>

  <rect x="665" y="580" width="240" height="82" class="server"/>
  <text x="685" y="608" class="box-title">requireAuth</text>
  <text x="685" y="633" class="box-text">JWT 검증</text>
  <text x="685" y="654" class="box-text">request.user 설정</text>

  <rect x="995" y="205" width="210" height="86" class="service"/>
  <text x="1015" y="233" class="box-title">user/email service</text>
  <text x="1015" y="258" class="box-text">회원, 로그인, 프로필</text>
  <text x="1015" y="279" class="box-text">이메일 인증 발송</text>

  <rect x="995" y="320" width="210" height="86" class="service"/>
  <text x="1015" y="348" class="box-title">spec service</text>
  <text x="1015" y="373" class="box-text">스펙 저장/조회</text>
  <text x="1015" y="394" class="box-text">사용자별 upsert</text>

  <rect x="995" y="435" width="210" height="105" class="service"/>
  <text x="1015" y="463" class="box-title">analysis service</text>
  <text x="1015" y="488" class="box-text">스펙 검증</text>
  <text x="1015" y="509" class="box-text">OpenAI 호출</text>
  <text x="1015" y="530" class="box-text">결과 저장/최신 결과 재사용</text>

  <rect x="995" y="570" width="210" height="86" class="service"/>
  <text x="1015" y="598" class="box-title">mission service</text>
  <text x="1015" y="623" class="box-text">checkedItems 저장/조회</text>
  <text x="1015" y="644" class="box-text">pending/in_progress/submitted</text>

  <rect x="995" y="685" width="210" height="86" class="service"/>
  <text x="1015" y="713" class="box-title">submission/feedback</text>
  <text x="1015" y="738" class="box-text">결과물 저장/최신 제출 조회</text>
  <text x="1015" y="759" class="box-text">피드백 생성, 저장/조회</text>

  <rect x="995" y="800" width="210" height="86" class="service"/>
  <text x="1015" y="828" class="box-title">search services</text>
  <text x="1015" y="853" class="box-text">직업/학교/전공/자격증</text>
  <text x="1015" y="874" class="box-text">외부 API 실패 시 fallback</text>

  <rect x="1295" y="205" width="215" height="70" class="db"/>
  <text x="1315" y="233" class="box-title">User</text>
  <text x="1315" y="258" class="box-text">계정, JWT 대상, 이메일 인증</text>

  <rect x="1295" y="305" width="215" height="70" class="db"/>
  <text x="1315" y="333" class="box-title">UserSpec</text>
  <text x="1315" y="358" class="box-text">목표 직무, 학점, 활동, 기술</text>

  <rect x="1295" y="405" width="215" height="70" class="db"/>
  <text x="1315" y="433" class="box-title">AnalysisResult</text>
  <text x="1315" y="458" class="box-text">준비도, 강점, 보완점, 추천</text>

  <rect x="1295" y="505" width="215" height="92" class="db"/>
  <text x="1315" y="533" class="box-title">Mission / UserMission</text>
  <text x="1315" y="558" class="box-text">미션 메타 정보</text>
  <text x="1315" y="579" class="box-text">status, checkedItems, 제출</text>

  <rect x="1295" y="635" width="215" height="86" class="external"/>
  <text x="1315" y="663" class="box-title">OpenAI API</text>
  <text x="1315" y="688" class="box-text">커리어 분석 JSON 생성</text>
  <text x="1315" y="709" class="box-text">서버에서만 API key 사용</text>

  <rect x="1295" y="755" width="215" height="86" class="external"/>
  <text x="1315" y="783" class="box-title">CareerNet / Q-Net</text>
  <text x="1315" y="808" class="box-text">직업, 학교, 전공, 자격증</text>
  <text x="1315" y="829" class="box-text">검색 데이터 공급</text>

  <rect x="1295" y="870" width="215" height="50" class="external"/>
  <text x="1315" y="900" class="box-title">SMTP</text>

  <path d="M275 250 H365" class="line"/>
  <path d="M275 390 H365" class="line"/>
  <path d="M575 382 H665" class="line"/>
  <path d="M575 555 H665" class="line"/>
