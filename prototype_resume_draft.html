<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>취업비서 - 자소서 초안 생성</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* 헤더 */
        .header {
            background: white;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .breadcrumb {
            font-size: 13px;
            color: #999;
            margin-bottom: 15px;
        }

        .job-info {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            flex-wrap: wrap;
            gap: 20px;
        }

        .job-detail h1 {
            font-size: 24px;
            color: #333;
            margin-bottom: 10px;
        }

        .company-info {
            display: flex;
            gap: 20px;
            margin-top: 10px;
            font-size: 14px;
            color: #666;
        }

        .company-info span {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .back-btn {
            padding: 10px 20px;
            background: #f0f0f0;
            border: 1px solid #ddd;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            transition: background 0.3s;
        }

        .back-btn:hover {
            background: #e8e8e8;
        }

        /* 메인 컨테이너 */
        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
            margin-bottom: 30px;
        }

        .section {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        }

        .section-title {
            font-size: 18px;
            font-weight: 700;
            color: #333;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #667eea;
        }

        /* 질문 입력 섹션 */
        .question-form {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-group label {
            font-size: 14px;
            font-weight: 600;
            color: #333;
        }

        .form-group .hint {
            font-size: 12px;
            color: #999;
            font-weight: normal;
        }

        textarea {
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-family: inherit;
            font-size: 13px;
            resize: vertical;
            min-height: 90px;
            transition: border-color 0.3s;
        }

        textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-generate {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-generate:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-generate:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .btn-reset {
            background: #f5f5f5;
            color: #333;
            border: 1px solid #ddd;
        }

        .btn-reset:hover {
            background: #efefef;
        }

        /* 초안 미리보기 섹션 */
        .preview-section {
            display: flex;
            flex-direction: column;
        }

        .preview-placeholder {
            background: #f9f9f9;
            border: 2px dashed #ddd;
            border-radius: 8px;
            padding: 30px;
            text-align: center;
            color: #999;
            min-height: 300px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .preview-content {
            background: #f9f9f9;
            border-radius: 8px;
            padding: 20px;
            line-height: 1.8;
            color: #333;
            font-size: 13px;
            max-height: 500px;
            overflow-y: auto;
        }

        .preview-header {
            font-size: 16px;
            font-weight: 700;
            color: #667eea;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid #ddd;
        }

        .preview-section .button-group {
            margin-top: auto;
            padding-top: 20px;
        }

        .btn-edit {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            flex: 1;
        }

        .btn-edit:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-edit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        /* 로딩 상태 */
        .loading {
            display: none;
            text-align: center;
            padding: 30px;
        }

        .loading.active {
            display: block;
        }

        .spinner {
            display: inline-block;
            width: 30px;
            height: 30px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading-text {
            margin-top: 15px;
            color: #667eea;
            font-weight: 600;
        }

        /* 모바일 반응형 */
        @media (max-width: 1024px) {
            .main-content {
                grid-template-columns: 1fr;
            }

            .job-info {
                flex-direction: column;
            }

            .back-btn {
                width: 100%;
            }
        }

        @media (max-width: 600px) {
            .container {
                padding: 10px;
            }

            .header {
                padding: 15px;
            }

            .section {
                padding: 15px;
            }

            .section-title {
                font-size: 16px;
            }

            .button-group {
                flex-direction: column;
            }
        }

        /* 성공 메시지 */
        .success-badge {
            display: inline-block;
            background: #e8f5e9;
            color: #2e7d32;
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 헤더 -->
        <div class="header">
            <div class="breadcrumb">추천 공고 > 자소서 작성</div>
            <div class="job-info">
                <div class="job-detail">
                    <h1>네이버 웨일 팀 - 풀스택 개발자</h1>
                    <div class="company-info">
                        <span>📍 서울, 강남</span>
                        <span>💼 스타트업</span>
                        <span>💰 3,500~4,500만원</span>
                        <span>📅 마감: 2026년 7월 20일</span>
                    </div>
                </div>
                <button class="back-btn">← 뒤로가기</button>
            </div>
        </div>

        <!-- 메인 컨텐츠 -->
        <div class="main-content">
            <!-- 왼쪽: 입력 폼 -->
            <div class="section">
                <div class="section-title">📝 초안 생성을 위한 정보</div>
                <form class="question-form" id="draftForm">
                    <div class="form-group">
                        <label for="strength">
                            1. 자신의 주요 강점은 무엇인가요?
                            <div class="hint">이 직무와 관련된 기술, 경험, 성격 등</div>
                        </label>
                        <textarea id="strength" placeholder="예: Python, React에 능숙하고, 빠른 학습 능력이 있습니다..." required></textarea>
                    </div>

                    <div class="form-group">
                        <label for="reason">
                            2. 이 직무를 선택한 이유는?
                            <div class="hint">회사, 직무, 팀에 대한 관심도</div>
                        </label>
                        <textarea id="reason" placeholder="예: 웨일의 빠른 기술 혁신과 사용자 중심의 개발 문화에 매력을 느낍니다..." required></textarea>
                    </div>

                    <div class="form-group">
                        <label for="experience">
                            3. 관련 경험이나 프로젝트가 있나요?
                            <div class="hint">실제 경험한 프로젝트, 인턴십, 동아리 등</div>
                        </label>
                        <textarea id="experience" placeholder="예: 대학 프로젝트에서 React와 Node.js를 사용해 SNS 앱을 개발했습니다..." required></textarea>
                    </div>

                    <div class="form-group">
                        <label for="contribution">
                            4. 회사에 기여할 수 있는 점은?
                            <div class="hint">특별한 기술, 관점, 또는 가치</div>
                        </label>
                        <textarea id="contribution" placeholder="예: 빠른 피드백 문화에 잘 적응하며, 팀과의 협업을 중시합니다..." required></textarea>
                    </div>

                    <div class="button-group">
                        <button type="button" class="btn btn-reset" onclick="resetForm()">초기화</button>
                        <button type="button" class="btn btn-generate" onclick="generateDraft()">✨ 초안 생성</button>
                    </div>
                </form>
            </div>

            <!-- 오른쪽: 미리보기 -->
            <div class="section preview-section">
                <div class="section-title">👁️ 초안 미리보기</div>
                <div id="previewContainer" class="preview-placeholder">
                    위의 정보를 입력하고 "초안 생성" 버튼을 클릭하면<br>AI가 자동으로 자소서 초안을 생성합니다.
                </div>
                <div class="button-group" style="margin-top: 15px;">
                    <button class="btn btn-edit" id="editBtn" disabled>✏️ 수정하러 가기</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        function resetForm() {
            document.getElementById('draftForm').reset();
            document.getElementById('previewContainer').innerHTML = `
                위의 정보를 입력하고 "초안 생성" 버튼을 클릭하면<br>AI가 자동으로 자소서 초안을 생성합니다.
            `;
            document.getElementById('previewContainer').className = 'preview-placeholder';
            document.getElementById('editBtn').disabled = true;
        }

        function generateDraft() {
            const strength = document.getElementById('strength').value;
            const reason = document.getElementById('reason').value;
            const experience = document.getElementById('experience').value;
            const contribution = document.getElementById('contribution').value;

            // 입력 검증
            if (!strength || !reason || !experience || !contribution) {
                alert('모든 항목을 입력해주세요.');
                return;
            }

            // 로딩 상태 표시
            const previewContainer = document.getElementById('previewContainer');
            previewContainer.innerHTML = `
                <div class="loading active">
                    <div class="spinner"></div>
                    <div class="loading-text">AI가 자소서 초안을 작성 중입니다...</div>
                </div>
            `;
            previewContainer.className = 'preview-placeholder';

            // 시뮬레이션: 2초 후 초안 표시
            setTimeout(() => {
                const draftContent = generateDraftContent(strength, reason, experience, contribution);
                previewContainer.innerHTML = draftContent;
                previewContainer.className = 'preview-content';
                document.getElementById('editBtn').disabled = false;
            }, 2000);
        }

        function generateDraftContent(strength, reason, experience, contribution) {
            return `
                <div class="preview-header">✓ 자소서 초안이 생성되었습니다</div>
                <p>
                    저는 웹 개발에 열정을 가진 개발자입니다. ${strength}
                </p>
                <p style="margin-top: 12px;">
                    특히 네이버 웨일 팀에 관심을 가지게 된 이유는 ${reason}
                </p>
                <p style="margin-top: 12px;">
                    이러한 관심은 실무 경험으로도 이어졌습니다. ${experience}
                </p>
                <p style="margin-top: 12px;">
                    네이버 웨일 팀에 입사하게 된다면, ${contribution} 이를 통해 팀의 성장에 기여하고 싶습니다.
                </p>
                <p style="margin-top: 12px;">
                    빠르게 변화하는 기술 환경에서 지속적인 학습과 개선을 추구하며, 사용자 중심의 개발 철학을 실천하겠습니다. 감사합니다.
                </p>
                <div class="success-badge">✓ 초안 생성 완료 - 수정하러 가기 버튼을 눌러 계속하세요</div>
            `;
        }

        // 뒤로가기 버튼
        document.querySelector('.back-btn').addEventListener('click', () => {
            alert('추천 페이지로 돌아갑니다.');
            // window.location.href = 'prototype_recommendation.html';
        });

        // 수정하러 가기 버튼
        document.getElementById('editBtn').addEventListener('click', () => {
            alert('자소서 작성/첨삭 페이지로 이동합니다.');
            // window.location.href = 'prototype_resume_editor.html';
        });
    </script>
</body>
</html>
