server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 관리·모니터링 엔드포인트는 외부에 노출하지 않는다.
    # /api/admin  적재·지오코딩 실행 (카카오 할당량 소모, DB 부하)
    # /actuator   앱 상태 (설정 실수로 정보가 노출될 여지)
    # 컨테이너 안에서는 nginx를 안 거치므로 SSH 접속 후
    #   curl localhost:8080/api/admin/... 으로 그대로 실행할 수 있다.
    location /api/admin {
        deny all;
    }

    location /actuator {
        deny all;
    }

    # API 요청만 백엔드로 넘긴다. 나머지는 정적 파일이다.
    location /api {
        proxy_pass http://app:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 도보거리 조회가 TMAP 응답을 기다리므로 기본 60초로는 여유가 있으나,
        # 외부 API가 느려질 때 nginx가 먼저 끊지 않도록 명시해 둔다.
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # [SPA 폴백] /results, /parking-lots/416 같은 주소는 서버에 실제 파일이 없다.
    # 라우팅은 브라우저의 react-router가 하므로, 파일이 없으면 index.html을 돌려준다.
    # 이게 없으면 상세 화면에서 새로고침할 때 404가 난다.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 해시가 붙은 정적 자산(index-CKX7YIqv.js)은 내용이 바뀌면 파일명도 바뀐다.
    # 그래서 오래 캐시해도 안전하다.
    location /assets {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/css application/javascript application/json;
    gzip_min_length 1024;
}