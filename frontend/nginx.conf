# nginx.conf — 프론트 정적 파일 서빙 + /api 요청을 백엔드 컨테이너로 프록시
server {
    listen 80;

    # React 빌드 결과물 서빙
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # /api로 시작하는 요청은 백엔드 컨테이너로 전달
    # (docker-compose 네트워크에서 서비스명 'backend'가 호스트명이 됨)
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /health {
        proxy_pass http://backend:8000;
    }
}
