<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Bridge">
  <!-- "연결 두 점 + 호" 컨셉: 다리 모양 호가 두 사람(점)을 잇는다. bridge-design 팔레트 사용. -->
  <rect x="0" y="0" width="64" height="64" rx="12" fill="#fbf9f5" />
  <path d="M13 42 C13 22, 51 22, 51 42" fill="none" stroke="#11434c" stroke-width="6" stroke-linecap="round" />
  <circle cx="13" cy="42" r="6" fill="#964735" />
  <circle cx="51" cy="42" r="6" fill="#964735" />
</svg>
