<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="공부·회복 루틴">
  <!-- 색은 frontend/src/styles/app.css 의 브랜드 토큰과 동일하다
       (blue-deep #203965 · blue-primary #406EB7 · blue-soft #A6BAD6
        · paper-surface #FEFAF1 · accent-terracotta #B96842).
       파비콘은 16px 로도 뜨므로 형태를 크게 잡고 색 대비를 세게 줬다. -->
  <rect width="32" height="32" rx="7.5" fill="#203965"/>

  <!-- 노트: 제본선 + 지면 -->
  <rect x="5.4" y="7" width="2.8" height="18" rx="1.4" fill="#406EB7"/>
  <path d="M9.2 7h7.6a1.8 1.8 0 0 1 1.8 1.8v14.4a1.8 1.8 0 0 1-1.8 1.8H9.2z" fill="#FEFAF1"/>

  <!-- 밑줄 -->
  <rect x="11" y="11.3" width="5.6" height="1.7" rx=".85" fill="#A6BAD6"/>
  <rect x="11" y="15.2" width="5.6" height="1.7" rx=".85" fill="#A6BAD6"/>
  <rect x="11" y="19.1" width="3.4" height="1.7" rx=".85" fill="#A6BAD6"/>

  <!-- 연필: 노트 오른쪽에서 기울어져 내려온다 -->
  <g transform="rotate(34 24 16)">
    <rect x="21.7" y="5.6" width="4.6" height="2.3" rx="1.05" fill="#E8D3B4"/>
    <rect x="21.7" y="7.4" width="4.6" height="12.8" fill="#B96842"/>
    <path d="M21.7 20.2h4.6L24 25.2z" fill="#FEFAF1"/>
    <path d="M23.06 23.15h1.88L24 25.2z" fill="#203965"/>
  </g>
</svg>
