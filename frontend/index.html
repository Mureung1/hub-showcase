<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ABCDEF - AI 기반 맞춤형 수학 교육 플랫폼</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Login Page -->
    <div id="login-page" class="page active">
        <div class="container">
            <div class="card" style="max-width: 400px; margin: 60px auto;">
                <h1 class="card-title">ABCDEF</h1>
                <p class="card-text" style="margin-bottom: 24px;">AI 기반 맞춤형 수학 교육 플랫폼</p>

                <div class="form-group">
                    <label class="form-label">선생님 로그인</label>
                    <input
                        type="text"
                        id="teacher-name"
                        class="form-input"
                        placeholder="선생님 이름"
                    >
                </div>
                <button class="btn btn-primary w-full" onclick="loginAsTeacher()">
                    선생님으로 로그인
                </button>

                <div style="margin: 24px 0; text-align: center; color: var(--text-secondary);">
                    또는
                </div>

                <div class="form-group">
                    <label class="form-label">학생 로그인</label>
                    <input
                        type="text"
                        id="student-name"
                        class="form-input"
                        placeholder="학생 이름"
                    >
                    <input
                        type="text"
                        id="classroom-id"
                        class="form-input"
                        placeholder="교실 ID"
                        style="margin-top: 8px;"
                    >
                </div>
                <button class="btn btn-primary w-full" onclick="loginAsStudent()">
                    학생으로 로그인
                </button>
            </div>
        </div>
    </div>

    <!-- Teacher Dashboard Page -->
    <div id="teacher-page" class="page">
        <div class="header">
            <div class="dashboard-header">
                <div>
                    <h1 class="header h1" id="teacher-title">선생님 대시보드</h1>
                    <p class="header-subtitle" id="classroom-name">수학 1반</p>
                </div>
                <button class="btn btn-secondary" onclick="logout()">로그아웃</button>
            </div>
            <div class="nav-tabs">
                <button class="tab active">대시보드</button>
                <button class="tab">평가 관리</button>
                <button class="tab">학생 관리</button>
            </div>
        </div>

        <div class="container">
            <!-- Statistics Cards -->
            <div class="grid grid-cols-3">
                <div class="stat-card">
                    <div class="stat-value" id="stat-students">0</div>
                    <div class="stat-label">전체 학생</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="stat-progress">0%</div>
                    <div class="stat-label">평균 진행률</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="stat-correct">0/0</div>
                    <div class="stat-label">정답률</div>
                </div>
            </div>

            <!-- Students Table -->
            <div class="section-title">학생별 평가</div>
            <table class="table" id="students-table">
                <thead>
                    <tr>
                        <th style="flex: 1.5;">학생</th>
                        <th style="flex: 2;">진행 상태</th>
                        <th style="flex: 1; text-align: right;">이해도</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>

            <!-- Action Buttons -->
            <div style="display: flex; gap: 12px; margin-top: 24px;">
                <button class="btn btn-primary" onclick="addTestStudent()">
                    학생 추가
                </button>
                <button class="btn btn-primary" onclick="addTestQuestion()">
                    질문 추가
                </button>
            </div>
        </div>
    </div>

    <!-- Student Page -->
    <div id="student-page" class="page">
        <div class="header">
            <div class="dashboard-header">
                <div>
                    <h1 class="header h1">오늘의 수학 평가</h1>
                    <p class="header-subtitle">문제를 풀고 피드백을 받아보세요</p>
                </div>
                <button class="btn btn-secondary" onclick="logout()">로그아웃</button>
            </div>
        </div>

        <div class="container">
            <!-- Progress Indicator -->
            <div class="progress-container">
                <div class="progress-label">
                    <span>진행 상황</span>
                    <span id="progress-text">0/0 문제 완료</span>
                </div>
                <div class="progress-bar">
                    <div class="progress-fill success" id="progress-bar-fill" style="width: 0%"></div>
                </div>
            </div>

            <!-- Questions -->
            <div id="questions-container"></div>

            <!-- Next Steps -->
            <div class="card">
                <div class="card-title">다음 단계</div>
                <p class="card-text">
                    모든 문제를 풀었습니다! AI 선생님과 함께 심화 학습을 진행할 수 있습니다.
                </p>
                <button class="btn btn-primary w-full mt-8" style="margin-top: 12px;">
                    심화 학습 시작
                </button>
            </div>
        </div>
    </div>

    <script src="js/main.js"></script>
</body>
</html>
