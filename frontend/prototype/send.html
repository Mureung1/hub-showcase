<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">

<title>Bridge 프로토타입 — 편지 발송</title>

</head>
<body>
<main class="send-screen">
  <h1>편지지 · 봉투를 골라주세요</h1>

  <section class="picker">
    <p class="picker-label">편지지</p>
    <div class="swatch-row">
      <button class="swatch swatch-cream selected"></button>
      <button class="swatch swatch-blue"></button>
      <button class="swatch swatch-kraft"></button>
    </div>
  </section>

  <section class="picker">
    <p class="picker-label">봉투</p>
    <div class="swatch-row">
      <button class="swatch swatch-envelope-1 selected"></button>
      <button class="swatch swatch-envelope-2"></button>
      <button class="swatch swatch-envelope-3"></button>
    </div>
  </section>

  <p class="warning">⚠️ 이 편지는 보내면 수정할 수 없습니다.</p>

  <a class="btn btn-primary btn-block" href="waiting.html">모음소로 보내기</a>
</main>
