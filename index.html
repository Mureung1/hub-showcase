<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🍊 리뷰 답변 도우미 (프로토타입)</title>
<style>
  :root {
    --bg: #FFF8F3;
    --card-bg: #FFFFFF;
    --accent: #FF7A45;
    --accent-dark: #E85D2A;
    --text-main: #2B2621;
    --text-sub: #8A8178;
    --border: #F0E6DC;
    --positive: #34A853;
    --negative: #E24C4C;
    --neutral: #9AA0A6;
  }

  * { box-sizing: border-box; }

  html { scroll-behavior: smooth; }

  body {
    margin: 0;
    background: var(--bg);
    font-family: -apple-system, BlinkMacSystemFont, 'Pretendard', 'Malgun Gothic', sans-serif;
    color: var(--text-main);
  }

  .container {
    max-width: 720px;
    margin: 0 auto;
    padding: 0 16px 80px;
  }

  .navbar {
    position: sticky;
    top: 0;
    z-index: 10;
    background: rgba(255, 248, 243, 0.9);
    backdrop-filter: blur(6px);
    border-bottom: 1px solid var(--border);
  }

  .nav-inner {
    max-width: 960px;
    margin: 0 auto;
    padding: 14px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .nav-logo {
    font-weight: 700;
    font-size: 16px;
    color: var(--text-main);
    text-decoration: none;
  }

  .nav-links {
    display: flex;
    align-items: center;
    gap: 18px;
  }

  .nav-links a {
    color: var(--text-sub);
    text-decoration: none;
    font-size: 14px;
  }

  .nav-links a:hover { color: var(--text-main); }

  .nav-cta {
    background: var(--accent);
    color: white !important;
    padding: 8px 16px;
    border-radius: 999px;
    font-weight: 600;
  }

  .nav-cta:hover { background: var(--accent-dark); }

  .hero {
    max-width: 720px;
    margin: 0 auto;
    text-align: center;
    padding: 56px 16px 40px;
  }

  .hero h1 {
    font-size: 32px;
    line-height: 1.35;
    margin: 0 0 14px;
  }

  .hero p {
    color: var(--text-sub);
    font-size: 15px;
    margin: 0 0 24px;
  }

  .hero-cta {
    display: inline-block;
    background: var(--accent);
    color: white;
    text-decoration: none;
    font-weight: 600;
    font-size: 15px;
    padding: 14px 28px;
    border-radius: 999px;
    transition: background 0.15s ease;
  }

  .hero-cta:hover { background: var(--accent-dark); }

  .how-it-works {
    max-width: 720px;
    margin: 0 auto;
    padding: 0 16px 48px;
  }

  .how-it-works h2 {
    text-align: center;
    font-size: 20px;
    margin: 0 0 24px;
  }

  .steps {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
  }

  .step {
    background: var(--card-bg);
    border-radius: 16px;
    padding: 20px 16px;
    text-align: center;
    box-shadow: 0 8px 24px rgba(0,0,0,0.04);
    font-size: 14px;
    line-height: 1.4;
  }

  .step-num {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 28px;
    height: 28px;
    margin: 0 auto 10px;
    border-radius: 50%;
    background: var(--accent);
    color: white;
    font-weight: 700;
    font-size: 13px;
  }

  @media (max-width: 560px) {
    .steps { grid-template-columns: 1fr; }
  }

  .site-footer {
    text-align: center;
    padding: 32px 16px 48px;
    color: var(--text-sub);
    font-size: 13px;
  }

  .input-card {
    background: var(--card-bg);
    border-radius: 20px;
    padding: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.04);
    margin-bottom: 28px;
  }

  textarea {
    width: 100%;
    min-height: 140px;
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px;
    font-size: 15px;
    font-family: inherit;
    resize: vertical;
    color: var(--text-main);
  }

  textarea:focus {
    outline: none;
    border-color: var(--accent);
  }

  .hint {
    font-size: 12px;
    color: var(--text-sub);
    margin: 8px 0 16px;
  }

  .analyze-btn {
    width: 100%;
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 14px;
    padding: 14px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s ease, transform 0.05s ease;
  }

  .analyze-btn:hover { background: var(--accent-dark); }
  .analyze-btn:active { transform: scale(0.98); }
  .analyze-btn:disabled {
    background: #D9D2C9;
    cursor: not-allowed;
  }

  .status {
    text-align: center;
    color: var(--text-sub);
    font-size: 14px;
    margin: 16px 0;
    display: none;
  }

  .status.visible { display: block; }

  .error-box {
    background: #FDEDED;
    color: var(--negative);
    border-radius: 12px;
    padding: 12px 16px;
    font-size: 14px;
    margin-bottom: 20px;
    display: none;
  }

  .error-box.visible { display: block; }

  .recurring-panel {
    background: var(--card-bg);
    border: 1px solid var(--negative);
    border-radius: 18px;
    padding: 20px;
    margin-bottom: 20px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.04);
    display: none;
  }

  .recurring-panel.visible { display: block; }

  .recurring-panel-header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 4px;
  }

  .recurring-panel h3 {
    margin: 0;
    font-size: 16px;
    color: var(--negative);
  }

  .recurring-scope {
    font-size: 12px;
    color: var(--text-sub);
  }

  .reset-history-btn {
    background: none;
    border: none;
    color: var(--text-sub);
    font-size: 12px;
    text-decoration: underline;
    cursor: pointer;
    padding: 0;
    margin-bottom: 12px;
  }

  .reset-history-btn:hover { color: var(--negative); }

  .recurring-issue-item {
    padding: 10px 0;
    border-top: 1px solid var(--border);
  }

  .recurring-issue-item:first-of-type {
    border-top: none;
    padding-top: 0;
  }

  .recurring-issue-item .meta-row { margin-bottom: 6px; }

  .issue-keyword {
    font-size: 12px;
    font-weight: 700;
    color: white;
    background: var(--negative);
    padding: 4px 10px;
    border-radius: 999px;
  }

  .issue-count {
    font-size: 12px;
    color: var(--text-sub);
  }

  .issue-solution {
    font-size: 14px;
    line-height: 1.5;
    color: var(--text-main);
  }

  .review-card {
    background: var(--card-bg);
    border-radius: 18px;
    padding: 20px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.04);
    margin-bottom: 18px;
    border-top: 4px solid var(--neutral);
  }

  .review-card.positive { border-top-color: var(--positive); }
  .review-card.negative { border-top-color: var(--negative); }
  .review-card.neutral { border-top-color: var(--neutral); }

  .review-text {
    font-size: 15px;
    line-height: 1.5;
    margin-bottom: 12px;
  }

  .meta-row {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 16px;
  }

  .sentiment-tag {
    font-size: 12px;
    font-weight: 600;
    padding: 4px 10px;
    border-radius: 999px;
    color: white;
  }

  .sentiment-tag.positive { background: var(--positive); }
  .sentiment-tag.negative { background: var(--negative); }
  .sentiment-tag.neutral { background: var(--neutral); }

  .keyword-tag {
    font-size: 12px;
    color: var(--text-sub);
    background: var(--bg);
    border: 1px solid var(--border);
    padding: 4px 10px;
    border-radius: 999px;
  }

  .solution-box {
    background: #FFF3EC;
    border-left: 3px solid var(--accent);
    border-radius: 10px;
    padding: 10px 14px;
    margin-bottom: 14px;
    font-size: 14px;
    line-height: 1.5;
  }

  .solution-label {
    font-size: 11px;
    font-weight: 700;
    color: var(--accent-dark);
    margin-bottom: 4px;
    display: block;
  }

  .reply-option {
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 14px;
    margin-bottom: 10px;
    font-size: 14px;
    line-height: 1.5;
    position: relative;
  }

  .reply-label {
    font-size: 11px;
    font-weight: 700;
    color: var(--accent-dark);
    margin-bottom: 4px;
    display: block;
  }

  .copy-btn {
    margin-top: 8px;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text-main);
    font-size: 12px;
    padding: 6px 12px;
    border-radius: 999px;
    cursor: pointer;
  }

  .copy-btn:hover { background: var(--border); }

  .copy-btn.copied {
    background: var(--positive);
    color: white;
    border-color: var(--positive);
  }

  .empty-state {
    text-align: center;
    color: var(--text-sub);
    font-size: 14px;
    padding: 40px 0;
  }
</style>
</head>
<body>

<nav class="navbar">
  <div class="nav-inner">
    <a class="nav-logo" href="#top">🍊 리뷰 답변 도우미</a>
    <div class="nav-links">
      <a href="#how-it-works">사용법</a>
      <a href="#tool" class="nav-cta">바로 사용하기</a>
    </div>
  </div>
</nav>

<section class="hero" id="top">
  <h1>손님 리뷰, 이제 고민하지 말고 답변하세요</h1>
  <p>리뷰를 붙여넣으면 감정 분석, 반복되는 문제 감지, 개선 제안까지 한 번에 처리해드려요.</p>
  <a class="hero-cta" href="#tool">지금 시작하기</a>
</section>

<section class="how-it-works" id="how-it-works">
  <h2>이렇게 사용하세요</h2>
  <div class="steps">
    <div class="step">
      <span class="step-num">1</span>
      <div>리뷰를 한 줄에 하나씩 붙여넣기</div>
    </div>
    <div class="step">
      <span class="step-num">2</span>
      <div>&ldquo;분석 시작&rdquo; 버튼 클릭</div>
    </div>
    <div class="step">
      <span class="step-num">3</span>
      <div>마음에 드는 답변을 복사해서 사용</div>
    </div>
  </div>
</section>

<div class="container" id="tool">
  <div class="input-card">
    <textarea id="reviewInput" placeholder="리뷰를 한 줄에 하나씩 붙여넣어 주세요.&#10;예)&#10;사장님이 너무 친절하고 맛있었어요!&#10;대기시간이 너무 길어서 아쉬웠어요."></textarea>
    <div class="hint">여러 리뷰는 줄바꿈으로 구분해주세요.</div>
    <button class="analyze-btn" id="analyzeBtn" onclick="analyzeReviews()">분석 시작</button>
  </div>

  <div class="status" id="status">분석 중이에요, 잠시만 기다려주세요...</div>
  <div class="error-box" id="errorBox"></div>

  <div class="recurring-panel" id="recurringPanel">
    <div class="recurring-panel-header">
      <h3>⚠️ 반복되는 문제 감지</h3>
      <span class="recurring-scope" id="recurringScope"></span>
    </div>
    <button class="reset-history-btn" onclick="resetHistory()">누적 기록 초기화</button>
    <div id="recurringList"></div>
  </div>

  <div id="results"></div>
</div>

<footer class="site-footer">
  <p>🍊 리뷰 답변 도우미 · 소상공인을 위한 무료 도구</p>
</footer>

<script>
  const KEYWORD_MAP = {
    맛: ['맛있', '맛없', '음식', '메뉴', '양이', '맛도', '맛이', '맛은'],
    친절도: ['친절', '불친절', '사장님', '직원', '무뚝뚝', '응대', '태도'],
    대기시간: ['대기', '기다', '오래', '빠르', '느리', '웨이팅', '줄'],
    가격: ['가격', '비싸', '저렴', '가성비', '값'],
    청결도: ['청결', '깨끗', '더럽', '위생'],
    분위기: ['분위기', '인테리어', '자리', '시끄럽', '조용'],
  };

  const POSITIVE_WORDS = [
    '좋아요', '좋았', '맛있', '친절', '최고', '만족', '감사', '추천', '훌륭', '깨끗', '빠르', '재방문', '또 올',
  ];

  const NEGATIVE_WORDS = [
    '별로', '불친절', '오래', '대기', '실망', '최악', '비싸', '더럽', '불만', '느리', '불편', '맛없', '무뚝뚝',
    '쓰레기', '노맛', '맛도 없', '맛이 없', '맛은 없', '엉망', '성의 없', '정성 없',
  ];

  const NEGATION_PREFIXES = ['불', '안', '못'];

  const SOLUTION_MAP = {
    맛: '메뉴 맛의 일관성을 점검하고, 레시피 표준화나 조리 담당자 교육을 고려해보세요.',
    친절도: '직원 응대 교육을 강화하고, 정기적인 서비스 피드백 세션을 진행해보세요.',
    대기시간: '피크타임 인력 배치를 조정하거나, 예약/웨이팅 시스템 도입을 검토해보세요.',
    가격: '가격 대비 만족도를 높일 수 있도록 메뉴 구성이나 프로모션을 재검토해보세요.',
    청결도: '위생 점검 주기를 단축하고, 매장 청소 체크리스트를 도입해보세요.',
    분위기: '조명, 음악, 좌석 배치 등 매장 분위기 요소를 점검하고 개선해보세요.',
    일반: '구체적인 원인 파악을 위해 추가 피드백을 요청하거나 직접 문의해보세요.',
  };

  const RECURRING_THRESHOLD = 2;

  let history = [];

  const reviewInput = document.getElementById('reviewInput');
  const analyzeBtn = document.getElementById('analyzeBtn');
  const statusEl = document.getElementById('status');
  const errorBox = document.getElementById('errorBox');
  const resultsEl = document.getElementById('results');
  const recurringPanel = document.getElementById('recurringPanel');
  const recurringScope = document.getElementById('recurringScope');
  const recurringList = document.getElementById('recurringList');

  function showError(msg) {
    errorBox.textContent = msg;
    errorBox.classList.add('visible');
  }

  function clearError() {
    errorBox.classList.remove('visible');
    errorBox.textContent = '';
  }

  function sentimentClass(sentiment) {
    if (sentiment === '긍정') return 'positive';
    if (sentiment === '부정') return 'negative';
    return 'neutral';
  }

  function countPositiveMatches(text, words) {
    return words.reduce((acc, word) => {
      let idx = text.indexOf(word);
      let matched = false;
      while (idx !== -1) {
        const prevChar = idx > 0 ? text[idx - 1] : '';
        if (!NEGATION_PREFIXES.includes(prevChar)) {
          matched = true;
          break;
        }
        idx = text.indexOf(word, idx + 1);
      }
      return acc + (matched ? 1 : 0);
    }, 0);
  }

  function classifySentiment(text) {
    const posScore = countPositiveMatches(text, POSITIVE_WORDS);
    const negScore = NEGATIVE_WORDS.reduce((acc, w) => acc + (text.includes(w) ? 1 : 0), 0);
    if (posScore > negScore) return '긍정';
    if (negScore > posScore) return '부정';
    return '중립';
  }

  function extractKeywords(text) {
    const keywords = Object.entries(KEYWORD_MAP)
      .filter(([, triggers]) => triggers.some((t) => text.includes(t)))
      .map(([label]) => label);
    return keywords.length > 0 ? keywords.slice(0, 3) : ['일반'];
  }

  function suggestSolution(sentiment, keyword) {
    if (sentiment !== '부정') return null;
    return SOLUTION_MAP[keyword] || SOLUTION_MAP['일반'];
  }

  function buildReplies(sentiment, keyword) {
    if (sentiment === '긍정') {
      return {
        정중함: `소중한 후기 남겨주셔서 진심으로 감사드립니다. 말씀해주신 ${keyword} 부분, 앞으로도 변함없이 유지하겠습니다.`,
        친근함: `우와 이렇게 좋은 말씀 남겨주셔서 너무 감사해요! 다음에 또 뵙고 싶어요 :)`,
        간결함: `감사합니다! 또 뵙겠습니다.`,
      };
    }
    if (sentiment === '부정') {
      return {
        정중함: `불편을 드려 진심으로 죄송합니다. 말씀해주신 ${keyword} 부분은 꼭 개선하도록 노력하겠습니다.`,
        친근함: `아이고 ${keyword} 때문에 많이 아쉬우셨겠어요 ㅠㅠ 다음엔 더 신경 쓸게요!`,
        간결함: `죄송합니다. 개선하겠습니다.`,
      };
    }
    return {
      정중함: `소중한 의견 남겨주셔서 감사합니다. ${keyword} 관련 말씀 참고하여 더 나은 모습 보이겠습니다.`,
      친근함: `방문해주셔서 감사해요! 다음에도 편하게 놀러 오세요~`,
      간결함: `감사합니다!`,
    };
  }

  function analyzeReviewLocally(review) {
    const sentiment = classifySentiment(review);
    const keywords = extractKeywords(review);
    const replies = buildReplies(sentiment, keywords[0]);
    const solution = suggestSolution(sentiment, keywords[0]);
    return { review, sentiment, keywords, replies, solution };
  }

  function detectRecurringIssues(analyzedReviews) {
    const counts = {};
    analyzedReviews.forEach((item) => {
      if (item.sentiment !== '부정') return;
      item.keywords.forEach((keyword) => {
        counts[keyword] = (counts[keyword] || 0) + 1;
      });
    });
    return Object.entries(counts)
      .filter(([, count]) => count >= RECURRING_THRESHOLD)
      .sort((a, b) => b[1] - a[1])
      .map(([keyword, count]) => ({
        keyword,
        count,
        solution: SOLUTION_MAP[keyword] || SOLUTION_MAP['일반'],
      }));
  }

  async function analyzeReviews() {
    clearError();
    const rawText = reviewInput.value.trim();
    if (!rawText) {
      showError('리뷰를 먼저 입력해주세요.');
      return;
    }

    const reviews = rawText.split('\n').map((r) => r.trim()).filter(Boolean);
    if (reviews.length === 0) {
      showError('유효한 리뷰가 없어요.');
      return;
    }
    if (reviews.length > 15) {
      showError('한 번에 최대 15개까지 분석할 수 있어요. 리뷰 수를 줄여주세요.');
      return;
    }

    analyzeBtn.disabled = true;
    statusEl.classList.add('visible');
    resultsEl.innerHTML = '';

    await new Promise((resolve) => setTimeout(resolve, 500));

    const analyzed = reviews.map(analyzeReviewLocally);
    history = history.concat(analyzed);

    renderResults(analyzed);
    renderRecurringIssues(detectRecurringIssues(history));

    analyzeBtn.disabled = false;
    statusEl.classList.remove('visible');
  }

  function resetHistory() {
    history = [];
    renderRecurringIssues([]);
  }

  function renderRecurringIssues(issues) {
    if (!issues || issues.length === 0) {
      recurringPanel.classList.remove('visible');
      recurringList.innerHTML = '';
      return;
    }

    recurringScope.textContent = `지금까지 분석한 리뷰 ${history.length}건 기준`;
    recurringList.innerHTML = issues.map((issue) => `
      <div class="recurring-issue-item">
        <div class="meta-row">
          <span class="issue-keyword">${escapeHtml(issue.keyword)}</span>
          <span class="issue-count">${issue.count}건 반복</span>
        </div>
        <div class="issue-solution">${escapeHtml(issue.solution)}</div>
      </div>
    `).join('');
    recurringPanel.classList.add('visible');
  }

  function renderResults(items) {
    if (!Array.isArray(items) || items.length === 0) {
      resultsEl.innerHTML = '<div class="empty-state">분석 결과가 없어요.</div>';
      return;
    }

    resultsEl.innerHTML = items.map((item, idx) => {
      const sClass = sentimentClass(item.sentiment);
      const keywords = (item.keywords || [])
        .map((k) => `<span class="keyword-tag">${escapeHtml(k)}</span>`)
        .join('');

      const solution = item.solution
        ? `<div class="solution-box"><span class="solution-label">💡 개선 제안</span><div>${escapeHtml(item.solution)}</div></div>`
        : '';

      const replyEntries = Object.entries(item.replies || {});
      const replies = replyEntries.map(([label, text], rIdx) => {
        const replyId = `reply-${idx}-${rIdx}`;
        return `
          <div class="reply-option">
            <span class="reply-label">${escapeHtml(label)}</span>
            <div id="${replyId}">${escapeHtml(text)}</div>
            <button class="copy-btn" onclick="copyReply('${replyId}', this)">복사하기</button>
          </div>
        `;
      }).join('');

      return `
        <div class="review-card ${sClass}">
          <div class="review-text">&ldquo;${escapeHtml(item.review)}&rdquo;</div>
          <div class="meta-row">
            <span class="sentiment-tag ${sClass}">${escapeHtml(item.sentiment || '중립')}</span>
            ${keywords}
          </div>
          ${solution}
          ${replies}
        </div>
      `;
    }).join('');
  }

  function copyReply(elId, btn) {
    const text = document.getElementById(elId).textContent;
    navigator.clipboard.writeText(text).then(() => {
      const original = btn.textContent;
      btn.textContent = '복사됨 ✓';
      btn.classList.add('copied');
      setTimeout(() => {
        btn.textContent = original;
        btn.classList.remove('copied');
      }, 1500);
    }).catch(() => {
      showError('복사에 실패했어요. 직접 선택해서 복사해주세요.');
    });
  }

  function escapeHtml(str) {
    if (typeof str !== 'string') return '';
    return str
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }
</script>
