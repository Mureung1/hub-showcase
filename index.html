<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>리뷰 답변 도우미</title>
<style>
  :root {
    --bg: #FFF8F3;
    --card-bg: #FFFFFF;
    --accent: #FF7A45;
    --accent-dark: #E85D2A;
    --text-main: #2B2621;
    --text-sub: #8A8178;
    --border: #F0E6DC;
    --positive: #34A853;
    --negative: #E24C4C;
    --neutral: #9AA0A6;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    font-family: -apple-system, BlinkMacSystemFont, 'Pretendard', 'Malgun Gothic', sans-serif;
    color: var(--text-main);
    padding: 32px 16px 80px;
  }

  .container {
    max-width: 720px;
    margin: 0 auto;
  }

  header {
    text-align: center;
    margin-bottom: 28px;
  }

  header h1 {
    font-size: 26px;
    margin: 0 0 6px;
  }

  header p {
    color: var(--text-sub);
    font-size: 14px;
    margin: 0;
  }

  .input-card {
    background: var(--card-bg);
    border-radius: 20px;
    padding: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.04);
    margin-bottom: 28px;
  }

  textarea {
    width: 100%;
    min-height: 140px;
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px;
    font-size: 15px;
    font-family: inherit;
    resize: vertical;
    color: var(--text-main);
  }

  textarea:focus {
    outline: none;
    border-color: var(--accent);
  }

  .hint {
    font-size: 12px;
    color: var(--text-sub);
    margin: 8px 0 16px;
  }

  .analyze-btn {
    width: 100%;
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 14px;
    padding: 14px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s ease, transform 0.05s ease;
  }

  .analyze-btn:hover { background: var(--accent-dark); }
  .analyze-btn:active { transform: scale(0.98); }
  .analyze-btn:disabled {
    background: #D9D2C9;
    cursor: not-allowed;
  }

  .status {
    text-align: center;
    color: var(--text-sub);
    font-size: 14px;
    margin: 16px 0;
    display: none;
  }

  .status.visible { display: block; }

  .error-box {
    background: #FDEDED;
    color: var(--negative);
    border-radius: 12px;
    padding: 12px 16px;
    font-size: 14px;
    margin-bottom: 20px;
    display: none;
  }

  .error-box.visible { display: block; }

  .review-card {
    background: var(--card-bg);
    border-radius: 18px;
    padding: 20px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.04);
    margin-bottom: 18px;
    border-top: 4px solid var(--neutral);
  }

  .review-card.positive { border-top-color: var(--positive); }
  .review-card.negative { border-top-color: var(--negative); }
  .review-card.neutral { border-top-color: var(--neutral); }

  .review-text {
    font-size: 15px;
    line-height: 1.5;
    margin-bottom: 12px;
  }

  .meta-row {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 16px;
  }

  .sentiment-tag {
    font-size: 12px;
    font-weight: 600;
    padding: 4px 10px;
    border-radius: 999px;
    color: white;
  }

  .sentiment-tag.positive { background: var(--positive); }
  .sentiment-tag.negative { background: var(--negative); }
  .sentiment-tag.neutral { background: var(--neutral); }

  .keyword-tag {
    font-size: 12px;
    color: var(--text-sub);
    background: var(--bg);
    border: 1px solid var(--border);
    padding: 4px 10px;
    border-radius: 999px;
  }

  .reply-option {
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 14px;
    margin-bottom: 10px;
    font-size: 14px;
    line-height: 1.5;
    position: relative;
  }

  .reply-label {
    font-size: 11px;
    font-weight: 700;
    color: var(--accent-dark);
    margin-bottom: 4px;
    display: block;
  }

  .copy-btn {
    margin-top: 8px;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text-main);
    font-size: 12px;
    padding: 6px 12px;
    border-radius: 999px;
    cursor: pointer;
  }

  .copy-btn:hover { background: var(--border); }

  .copy-btn.copied {
    background: var(--positive);
    color: white;
    border-color: var(--positive);
  }

  .empty-state {
    text-align: center;
    color: var(--text-sub);
    font-size: 14px;
    padding: 40px 0;
  }
</style>
</head>
<body>

<div class="container">
  <header>
    <h1>🍊 리뷰 답변 도우미</h1>
    <p>손님 리뷰를 붙여넣으면 감정 분석과 답변 초안을 만들어드려요</p>
  </header>

  <div class="input-card">
    <textarea id="reviewInput" placeholder="리뷰를 한 줄에 하나씩 붙여넣어 주세요.&#10;예)&#10;사장님이 너무 친절하고 맛있었어요!&#10;대기시간이 너무 길어서 아쉬웠어요."></textarea>
    <div class="hint">여러 리뷰는 줄바꿈으로 구분해주세요.</div>
    <button class="analyze-btn" id="analyzeBtn" onclick="analyzeReviews()">분석 시작</button>
  </div>

  <div class="status" id="status">분석 중이에요, 잠시만 기다려주세요...</div>
  <div class="error-box" id="errorBox"></div>

  <div id="results"></div>
</div>

<script>
  const reviewInput = document.getElementById('reviewInput');
  const analyzeBtn = document.getElementById('analyzeBtn');
  const statusEl = document.getElementById('status');
  const errorBox = document.getElementById('errorBox');
  const resultsEl = document.getElementById('results');

  function showError(msg) {
    errorBox.textContent = msg;
    errorBox.classList.add('visible');
  }

  function clearError() {
    errorBox.classList.remove('visible');
    errorBox.textContent = '';
  }

  function sentimentClass(sentiment) {
    if (sentiment === '긍정') return 'positive';
    if (sentiment === '부정') return 'negative';
    return 'neutral';
  }

  async function analyzeReviews() {
    clearError();
    const rawText = reviewInput.value.trim();
    if (!rawText) {
      showError('리뷰를 먼저 입력해주세요.');
      return;
    }

    const reviews = rawText.split('\n').map(r => r.trim()).filter(Boolean);
    if (reviews.length === 0) {
      showError('유효한 리뷰가 없어요.');
      return;
    }
    if (reviews.length > 15) {
      showError('한 번에 최대 15개까지 분석할 수 있어요. 리뷰 수를 줄여주세요.');
      return;
    }

    analyzeBtn.disabled = true;
    statusEl.classList.add('visible');
    resultsEl.innerHTML = '';

    try {
      const systemPrompt = `당신은 소상공인을 돕는 리뷰 분석 도우미입니다.
주어진 리뷰 목록 각각에 대해 다음을 수행하세요:
1. 감정을 "긍정", "부정", "중립" 중 하나로 분류
2. 리뷰에서 언급된 핵심 키워드 1~3개 추출 (예: 맛, 친절도, 대기시간, 가격, 청결도 등)
3. 사장님이 바로 사용할 수 있는 답변 초안 3개를 작성:
   - 정중함 (격식있고 예의바른 톤)
   - 친근함 (편안하고 다정한 톤)
   - 간결함 (짧고 담백한 톤)

반드시 아래 JSON 배열 형식으로만 응답하세요. 다른 설명, 마크다운, 전후 텍스트를 절대 포함하지 마세요.

[
  {
    "review": "원본 리뷰 텍스트",
    "sentiment": "긍정|부정|중립",
    "keywords": ["키워드1", "키워드2"],
    "replies": {
      "정중함": "답변 내용",
      "친근함": "답변 내용",
      "간결함": "답변 내용"
    }
  }
]`;

      const userMessage = `다음 리뷰들을 분석해주세요:\n\n${reviews.map((r, i) => `${i + 1}. ${r}`).join('\n')}`;

      const response = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          model: "claude-sonnet-4-6",
          max_tokens: 1000,
          system: systemPrompt,
          messages: [{ role: "user", content: userMessage }]
        })
      });

      if (!response.ok) {
        throw new Error(`API 요청 실패 (status: ${response.status})`);
      }

      const data = await response.json();
      const textBlock = data.content.find(b => b.type === 'text');
      if (!textBlock) throw new Error('응답에서 텍스트를 찾을 수 없어요.');

      let cleaned = textBlock.text.trim().replace(/^```json\s*/i, '').replace(/```$/, '').trim();
      let parsed;
      try {
        parsed = JSON.parse(cleaned);
      } catch (parseErr) {
        throw new Error('AI 응답을 해석하는 데 실패했어요. 다시 시도해주세요.');
      }

      renderResults(parsed);
    } catch (err) {
      console.error(err);
      showError(err.message || '분석 중 오류가 발생했어요. 다시 시도해주세요.');
    } finally {
      analyzeBtn.disabled = false;
      statusEl.classList.remove('visible');
    }
  }

  function renderResults(items) {
    if (!Array.isArray(items) || items.length === 0) {
      resultsEl.innerHTML = '<div class="empty-state">분석 결과가 없어요.</div>';
      return;
    }

    resultsEl.innerHTML = items.map((item, idx) => {
      const sClass = sentimentClass(item.sentiment);
      const keywords = (item.keywords || [])
        .map(k => `<span class="keyword-tag">${escapeHtml(k)}</span>`)
        .join('');

      const replyEntries = Object.entries(item.replies || {});
      const replies = replyEntries.map(([label, text], rIdx) => {
        const replyId = `reply-${idx}-${rIdx}`;
        return `
          <div class="reply-option">
            <span class="reply-label">${escapeHtml(label)}</span>
            <div id="${replyId}">${escapeHtml(text)}</div>
            <button class="copy-btn" onclick="copyReply('${replyId}', this)">복사하기</button>
          </div>
        `;
      }).join('');

      return `
        <div class="review-card ${sClass}">
          <div class="review-text">"${escapeHtml(item.review)}"</div>
          <div class="meta-row">
            <span class="sentiment-tag ${sClass}">${escapeHtml(item.sentiment || '중립')}</span>
            ${keywords}
          </div>
          ${replies}
        </div>
      `;
    }).join('');
  }

  function copyReply(elId, btn) {
    const text = document.getElementById(elId).textContent;
    navigator.clipboard.writeText(text).then(() => {
      const original = btn.textContent;
      btn.textContent = '복사됨 ✓';
      btn.classList.add('copied');
      setTimeout(() => {
        btn.textContent = original;
        btn.classList.remove('copied');
      }, 1500);
    }).catch(() => {
      showError('복사에 실패했어요. 직접 선택해서 복사해주세요.');
    });
  }

  function escapeHtml(str) {
    if (typeof str !== 'string') return '';
    return str
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }
</script>

</body>
</html>
