<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <title>커리어 코파일럿 — 채용 공고 적합도</title>
    <script>
      /* 테마 플래시 방지 — React 렌더 전에 data-theme 을 먼저 세팅.
         토글·저장은 App.jsx(React)가 담당. 기본은 라이트. */
      (function () {
        var saved; try { saved = localStorage.getItem('cc-theme'); } catch (e) {}
        document.documentElement.setAttribute('data-theme', saved || 'light');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
