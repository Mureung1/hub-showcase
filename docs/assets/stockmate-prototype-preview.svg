<svg width="1400" height="900" viewBox="0 0 1400 900" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">StockMate Prototype Preview</title>
  <desc id="desc">StockMate Agent 정적 프로토타입의 대시보드와 오늘의 브리핑 화면을 보여주는 이미지 미리보기</desc>
  <style>
    .bg{fill:#E8E1D2}.paper{fill:#F5EFE4}.ink{fill:#241C14}.muted{fill:#5C5040}.line{stroke:#DBCFB8;stroke-width:2}.card{fill:#fff;stroke:#DBCFB8;stroke-width:2}.dark{fill:#241C14}.gold{fill:#A8722E}.sage{fill:#4F6B52}.danger{fill:#9C3B2E}.amber{fill:#C0902E}.soft-gold{fill:#EFDFC2}.soft-sage{fill:#DEE8DA}.soft-danger{fill:#F3DAD3}.soft-amber{fill:#F5E6C3}.h1{font:800 46px -apple-system,BlinkMacSystemFont,"Noto Sans KR","Apple SD Gothic Neo",sans-serif}.h2{font:800 28px -apple-system,BlinkMacSystemFont,"Noto Sans KR","Apple SD Gothic Neo",sans-serif}.h3{font:800 22px -apple-system,BlinkMacSystemFont,"Noto Sans KR","Apple SD Gothic Neo",sans-serif}.body{font:500 20px -apple-system,BlinkMacSystemFont,"Noto Sans KR","Apple SD Gothic Neo",sans-serif}.small{font:500 16px -apple-system,BlinkMacSystemFont,"Noto Sans KR","Apple SD Gothic Neo",sans-serif}.label{font:800 14px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:1.4px}
  </style>
  <rect class="bg" width="1400" height="900"/>
  <rect class="paper" x="70" y="60" width="1260" height="780" rx="28"/>
  <rect x="70" y="60" width="1260" height="82" rx="28" fill="#F5EFE4"/>
  <circle class="dark" cx="125" cy="101" r="24"/>
  <text x="118" y="110" font-family="serif" font-size="24" font-weight="700" fill="#F5EFE4">S</text>
  <text class="h2 ink" x="165" y="108">StockMate Agent</text>
  <rect class="dark" x="1005" y="82" width="100" height="38" rx="19"/>
  <text class="small" x="1032" y="107" fill="#F5EFE4">대시보드</text>
  <rect class="soft-gold" x="1116" y="82" width="96" height="38" rx="19"/>
  <text class="small gold" x="1143" y="107">브리핑</text>
  <rect class="soft-sage" x="1224" y="82" width="62" height="38" rx="19"/>
  <text class="small sage" x="1243" y="107">상세</text>
  <line class="line" x1="70" y1="142" x2="1330" y2="142"/>

  <text class="label gold" x="120" y="210">PROTOTYPE · STATIC HTML</text>
  <text class="h1 ink" x="120" y="270">모닝루틴 재고 브리핑 화면</text>
  <text class="body muted" x="120" y="315">대시보드에서 위험 상품을 확인하고, 오늘의 브리핑으로 발주 판단까지 이어지는 MVP 화면</text>

  <rect class="card" x="120" y="370" width="250" height="125" rx="18"/>
  <text class="small muted" x="150" y="414">전체 상품</text>
  <text class="h1 ink" x="150" y="468">40</text>
  <text class="small sage" x="220" y="464">SKU 연결됨</text>

  <rect class="card" x="400" y="370" width="250" height="125" rx="18"/>
  <text class="small muted" x="430" y="414">품절 위험</text>
  <text class="h1 danger" x="430" y="468">5</text>
  <text class="small danger" x="495" y="464">오늘 확인</text>

  <rect class="card" x="680" y="370" width="250" height="125" rx="18"/>
  <text class="small muted" x="710" y="414">발주 필요</text>
  <text class="h1 amber" x="710" y="468">8</text>
  <text class="small amber" x="775" y="464">리드타임 임박</text>

  <rect class="card" x="960" y="370" width="250" height="125" rx="18"/>
  <text class="small muted" x="990" y="414">과잉재고</text>
  <text class="h1 sage" x="990" y="468">4</text>
  <text class="small sage" x="1055" y="464">판매 둔화</text>

  <rect class="card" x="120" y="535" width="700" height="245" rx="18"/>
  <text class="h2 ink" x="150" y="586">상품별 재고 상태</text>
  <line class="line" x1="150" y1="618" x2="790" y2="618"/>
  <text class="small muted" x="150" y="660">콜롬비아 원두 250g</text>
  <rect class="soft-danger" x="520" y="637" width="110" height="34" rx="17"/>
  <text class="small danger" x="546" y="660">품절 위험</text>
  <text class="small muted" x="690" y="660">4일 후</text>
  <line class="line" x1="150" y1="690" x2="790" y2="690"/>
  <text class="small muted" x="150" y="732">디카페인 드립백 10개입</text>
  <rect class="soft-gold" x="520" y="709" width="110" height="34" rx="17"/>
  <text class="small gold" x="546" y="732">발주 필요</text>
  <text class="small muted" x="690" y="732">7일 후</text>

  <rect class="card" x="860" y="535" width="350" height="245" rx="18"/>
  <text class="h2 ink" x="890" y="586">오늘의 브리핑</text>
  <text class="small muted" x="890" y="632">최근 7일 판매량이 증가했고, 리드타임을 고려하면 오늘 발주 판단이 필요합니다.</text>
  <rect class="dark" x="890" y="690" width="220" height="46" rx="23"/>
  <text class="small" x="930" y="719" fill="#F5EFE4">추천 발주 수량 30개</text>
</svg>
