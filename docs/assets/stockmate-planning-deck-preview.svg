<svg width="1400" height="900" viewBox="0 0 1400 900" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">StockMate Planning Deck Preview</title>
  <desc id="desc">StockMate Agent 기획 덱의 주요 섹션을 보여주는 이미지 미리보기</desc>
  <style>
    .bg{fill:#E8E1D2}.paper{fill:#F5EFE4}.ink{fill:#241C14}.muted{fill:#5C5040}.line{stroke:#DBCFB8;stroke-width:2}.card{fill:#fff;stroke:#DBCFB8;stroke-width:2}.dark{fill:#241C14}.gold{fill:#A8722E}.sage{fill:#4F6B52}.danger{fill:#9C3B2E}.soft-gold{fill:#EFDFC2}.soft-sage{fill:#DEE8DA}.soft-danger{fill:#F3DAD3}.soft-plum{fill:#E7E0ED}.h1{font:800 52px -apple-system,BlinkMacSystemFont,"Noto Sans KR","Apple SD Gothic Neo",sans-serif}.h2{font:800 32px -apple-system,BlinkMacSystemFont,"Noto Sans KR","Apple SD Gothic Neo",sans-serif}.h3{font:800 23px -apple-system,BlinkMacSystemFont,"Noto Sans KR","Apple SD Gothic Neo",sans-serif}.body{font:500 22px -apple-system,BlinkMacSystemFont,"Noto Sans KR","Apple SD Gothic Neo",sans-serif}.small{font:500 17px -apple-system,BlinkMacSystemFont,"Noto Sans KR","Apple SD Gothic Neo",sans-serif}.label{font:800 16px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:1.6px}
  </style>
  <rect class="bg" width="1400" height="900"/>
  <rect class="paper" x="70" y="60" width="1260" height="780" rx="28"/>
  <rect class="dark" x="70" y="60" width="1260" height="230" rx="28"/>
  <text class="label" x="120" y="128" fill="#EFDFC2">PLANNING DECK · HTML ARTIFACT</text>
  <text class="h1" x="120" y="196" fill="#F5EFE4">StockMate Agent 기획 덱</text>
  <text class="body" x="120" y="248" fill="#D8CDB8">문제 정의 · 서비스 흐름 · IA · 화면 설계 · 4주 MVP 범위를 한 번에 확인하는 발표형 문서</text>
  <circle cx="1200" cy="130" r="70" fill="#A8722E" opacity=".35"/>
  <circle cx="1250" cy="235" r="44" fill="#A8722E" opacity=".18"/>

  <text class="h2 ink" x="120" y="360">덱 구성</text>
  <text class="body muted" x="920" y="360">리뷰어가 기획 의도를 빠르게 볼 수 있게 구성</text>

  <rect class="card" x="120" y="400" width="260" height="165" rx="18"/>
  <rect class="soft-danger" x="150" y="430" width="54" height="54" rx="14"/>
  <text class="h3 danger" x="166" y="466">01</text>
  <text class="h3 ink" x="150" y="515">문제 정의</text>
  <text class="small muted" x="150" y="548">품절과 과잉재고가 반복되는 이유</text>

  <rect class="card" x="420" y="400" width="260" height="165" rx="18"/>
  <rect class="soft-gold" x="450" y="430" width="54" height="54" rx="14"/>
  <text class="h3 gold" x="466" y="466">02</text>
  <text class="h3 ink" x="450" y="515">유저 플로우</text>
  <text class="small muted" x="450" y="548">더미 데이터부터 브리핑까지</text>

  <rect class="card" x="720" y="400" width="260" height="165" rx="18"/>
  <rect class="soft-sage" x="750" y="430" width="54" height="54" rx="14"/>
  <text class="h3 sage" x="766" y="466">03</text>
  <text class="h3 ink" x="750" y="515">IA / 화면</text>
  <text class="small muted" x="750" y="548">홈, 대시보드, 브리핑, 상세</text>

  <rect class="card" x="1020" y="400" width="260" height="165" rx="18"/>
  <rect class="soft-plum" x="1050" y="430" width="54" height="54" rx="14"/>
  <text class="h3" x="1066" y="466" fill="#6E5B7B">04</text>
  <text class="h3 ink" x="1050" y="515">MVP 범위</text>
  <text class="small muted" x="1050" y="548">포함 기능과 제외 기능 구분</text>

  <text class="h2 ink" x="120" y="660">핵심 메시지</text>
  <rect x="120" y="695" width="1160" height="88" rx="16" fill="#FFF" stroke="#DBCFB8" stroke-width="2"/>
  <circle class="sage" cx="168" cy="739" r="10"/>
  <text class="body ink" x="195" y="747">재고표를 보여주는 서비스가 아니라, 셀러가 오늘 판단해야 할 상품과 이유를 먼저 알려주는 에이전트</text>
</svg>
