<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PREFER — 최종 확정 결과</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="page">
  <div class="container">
    <div class="screen-label">12. 최종 확정 결과 화면</div>

    <div class="card card-center">
      <div class="card-title">최종 약속 시간이 확정되었어요</div>
      <div id="final-datetime" style="font-size:22px; font-weight:700;"></div>
      <p id="final-rationale" style="font-size:13px; color:var(--color-text-muted); margin:0;"></p>
    </div>

    <div class="card">
      <div class="card-title">결과 공유하기</div>
      <div id="final-link-box" class="link-box"></div>
      <button type="button" id="final-copy-btn" class="btn btn-secondary btn-block">링크 복사</button>
      <p class="form-hint">확정 후에는 결과 조회만 가능하고 응답 수정은 제한돼요.</p>
    </div>

    <div class="btn-row">
      <button type="button" id="final-back" class="btn btn-secondary btn-grow">허브로 돌아가기</button>
    </div>
  </div>
</div>

<script src="js/mock-data.js"></script>
<script src="js/components.js"></script>
<script src="js/main.js"></script>
<script>initFinalPage();</script>
</body>
</html>
