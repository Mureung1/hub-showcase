<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>차세워 · 결과 없음</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <h1 class="screen-title">검색 결과</h1>

    <div class="pad">
      <form class="search-field" action="results.html">
        <svg class="icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <circle cx="11" cy="11" r="7" />
          <line x1="21" y1="21" x2="16.65" y2="16.65" />
        </svg>
        <input type="text" name="destination" value="잠실새내" />
        <a class="clear" href="index.html" title="지우고 다시 검색">&times;</a>
      </form>
    </div>

    <div class="state">
      <div class="state-icon">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <circle cx="11" cy="11" r="7" />
          <line x1="21" y1="21" x2="16.65" y2="16.65" />
        </svg>
      </div>
      <div class="state-title">주변에 공영주차장이 없어요</div>
      <div class="state-sub">다른 목적지를 검색해 보세요</div>
    </div>
  </div>
</body>
</html>
