<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>콕 — Zero-Input 온보딩 (프로토타입)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang&family=IBM+Plex+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#FAF4EA;
    --cream-line:#EDE3D3;
    --white:#FFFDF9;
    --ink:#3E332C;
    --ink-soft:#8A7A70;
    --ink-faint:#C6B9AC;
    --rose:#E4BFB9;
    --rose-line:#D9A9A3;
    --sky:#DCE8ED;
    --sky-line:#C4D9E1;
    --sky-ink:#5C7986;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    background:var(--cream);
    color:var(--ink);
    font-family:'IBM Plex Sans KR', sans-serif;
    font-weight:300;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:56px 24px 260px;
  }
  h1{
    font-family:'Gowun Batang', serif;
    font-weight:400;
    font-size:26px;
    margin-bottom:10px;
    text-align:center;
  }
  .sub{
    font-size:13px;
    color:var(--ink-soft);
    margin-bottom:32px;
    text-align:center;
    line-height:1.7;
  }
  .steps{
    width:100%;
    max-width:480px;
    display:flex;
    flex-direction:column;
    gap:16px;
    margin-bottom:28px;
  }
  .step{
    background:var(--white);
    border:1px solid var(--cream-line);
    border-radius:16px;
    padding:18px 20px;
    display:flex;
    gap:14px;
    align-items:flex-start;
  }
  .step-num{
    flex:none;
    width:24px; height:24px;
    border-radius:50%;
    background:var(--sky);
    color:var(--sky-ink);
    font-size:12px;
    display:flex; align-items:center; justify-content:center;
  }
  .step-body{flex:1;}
  .step-title{font-size:14px; margin-bottom:6px;}
  .step-desc{font-size:12px; color:var(--ink-soft); line-height:1.6; margin-bottom:10px;}
  .step-link{
    display:inline-block;
    font-size:12px;
    color:var(--ink);
    text-decoration:underline;
  }
  .step-input{
    width:100%;
    padding:10px 12px;
    border:1px solid var(--cream-line);
    border-radius:8px;
    background:var(--cream);
    font-family:'IBM Plex Sans KR', sans-serif;
    font-size:13px;
    color:var(--ink);
  }
  .step-input::placeholder{color:var(--ink-faint);}
  button.pill{
    padding:16px 44px;
    border-radius:100px;
    border:none;
    font-family:'IBM Plex Sans KR', sans-serif;
    font-size:16px;
    cursor:pointer;
    background:var(--ink);
    color:var(--white);
  }

  .companion{
    position:fixed;
    bottom:0;
    left:50%;
    transform:translateX(-50%) scale(2.2);
    transform-origin:bottom center;
    width:150px;
    height:64px;
  }
  .ear{
    position:absolute; top:-18px; width:34px; height:46px;
    background:var(--rose); border:1px solid var(--rose-line);
    border-radius:50% 50% 45% 45%;
  }
  .ear.left{left:20px;}
  .ear.right{right:20px;}
  .head{
    position:absolute; bottom:0; left:14px; right:14px; height:52px;
    background:var(--rose); border:1px solid var(--rose-line); border-bottom:none;
    border-radius:50% 50% 0 0 / 65% 65% 0 0;
  }
  .eye{
    position:absolute; top:18px; width:5px; height:8px;
    background:var(--ink); border-radius:50%;
  }
  .eye.left{left:44px;}
  .eye.right{right:44px;}
</style>
</head>
<body>
  <h1>노션이랑 연결해볼까</h1>
  <p class="sub">콕은 노션을 할 일 저장소로 써요.<br>템플릿 하나 복제하고, 두 가지만 붙여넣으면 끝나요.</p>

  <div class="steps">
    <div class="step">
      <div class="step-num">1</div>
      <div class="step-body">
        <div class="step-title">템플릿 복제하기</div>
        <div class="step-desc">아래 링크를 열고, 오른쪽 위 "복제" 버튼을 눌러 내 노션으로 가져와요.</div>
        <a class="step-link" href="#">→ 콕 템플릿 열기</a>
      </div>
    </div>
    <div class="step">
      <div class="step-num">2</div>
      <div class="step-body">
        <div class="step-title">연결 토큰 붙여넣기</div>
        <div class="step-desc">노션 페이지 "···" → "연결 추가"로 만든 토큰을 붙여넣어요.</div>
        <input class="step-input" placeholder="ntn_ 으로 시작하는 토큰" />
      </div>
    </div>
    <div class="step">
      <div class="step-num">3</div>
      <div class="step-body">
        <div class="step-title">데이터베이스 주소 붙여넣기</div>
        <div class="step-desc">복제한 페이지 주소창에서 32자리 ID만 복사해서 붙여넣어요.</div>
        <input class="step-input" placeholder="데이터베이스 ID" />
      </div>
    </div>
  </div>

  <button class="pill">시작하기</button>

  <div class="companion">
    <div class="ear left"></div>
    <div class="ear right"></div>
    <div class="head">
      <div class="eye left"></div>
      <div class="eye right"></div>
    </div>
  </div>
</body>
</html>
