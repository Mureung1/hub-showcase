<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>S3 알림 상세 — 프로토타입</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="tokens.css">
<style>
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg-deep);
    display: flex;
    justify-content: center;
    padding: var(--space-5) 0;
  }

  .app {
    width: 100%; max-width: var(--frame-w); margin: 0 auto;
    background: var(--bg); border-radius: var(--radius-app); overflow: hidden;
    box-shadow: var(--shadow-app);
  }

  /* 화면 간 이동 링크 — 기본 밑줄·파란색만 리셋, 컴포넌트 자체 색은 그대로 */
  a { text-decoration: none; color: inherit; }

  /* ========== ① 상단 바 ========== */
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: var(--space-4);
  }
  .topbar .back { font-size: var(--fs-body); color: var(--text-2); font-weight: 500; }
  .topbar .share { font-size: var(--fs-body); color: var(--text-3); }

  .detail { padding: 0 var(--space-4) var(--space-4); }

  /* ========== ② 뱃지·태그 줄 — S2 카드 레시피 재사용 ========== */
  .meta { display: flex; align-items: center; gap: var(--space-2); margin-bottom: var(--space-3); }
  .dday {
    font-size: var(--fs-caption); font-weight: 700;
    padding: var(--pad-badge); border-radius: var(--radius-badge);
    background: var(--accent-dim); color: var(--accent);
  }
  .dday.urgent { background: var(--warn-dim); color: var(--warn); }
  .src { margin-left: auto; font-size: var(--fs-caption); color: var(--text-3); font-weight: 500; }

  .detail-title { font-size: var(--fs-display); font-weight: 700; color: var(--text-1); line-height: 1.4; letter-spacing: -0.02em; margin-bottom: var(--space-4); }

  /* ========== ③ 에이전트 요약 박스 — A안(왼쪽 accent 선) 확정 ========== */
  .summary {
    background: var(--surface);
    border: 1px solid var(--line);
    border-left: 3px solid var(--accent);
    border-radius: var(--radius-cell);
    padding: var(--space-4);
    margin-bottom: var(--space-4);
  }
  .summary-label { font-size: var(--fs-caption); font-weight: 700; color: var(--accent); letter-spacing: .04em; margin-bottom: var(--space-2); }
  .summary-text { font-size: var(--fs-body); color: var(--text-2); line-height: 1.7; }
  .summary-text b { color: var(--text-1); }

  /* ========== ④ 정보 블록 ========== */
  .info { display: flex; flex-direction: column; gap: var(--space-3); padding: var(--space-1) 0 var(--space-4); }
  .info-row { display: flex; font-size: var(--fs-body); }
  .info-key { width: 88px; color: var(--text-3); flex: 0 0 auto; }
  .info-val { color: var(--text-2); }
  .info-val .kw { color: var(--accent); font-weight: 600; }

  /* ========== ⑤ 원문 보러가기 ========== */
  .origin {
    display: block; text-align: center;
    border: 1px dashed var(--line);
    border-radius: var(--radius-cell);
    padding: var(--space-3);
    font-size: var(--fs-body); color: var(--text-3); font-weight: 500;
    margin-bottom: var(--space-5);
  }

  /* ========== ⑥ 하단 버튼 2개 ========== */
  .actions { display: flex; gap: var(--space-3); }
  .btn {
    flex: 1; text-align: center;
    padding: var(--space-4);
    border-radius: var(--radius-cell);
    font-size: var(--fs-body); font-weight: 700;
  }
  .btn.secondary { background: var(--surface-2); color: var(--text-2); }
  .btn.primary { background: var(--accent); color: var(--bg); }
</style>
</head>
<body>
  <div class="app">
    <div class="topbar">
      <a class="back" href="s2.html">← 뒤로</a>
      <span class="share">공유 ↗</span>
    </div>
    <div class="detail">
      <div class="meta">
        <span class="dday urgent">D-2 · 중요</span>
        <span class="src">포털 · 장학안내</span>
      </div>
      <div class="detail-title">2026-2학기 국가장학금 1차 신청 마감</div>

      <div class="summary">
        <div class="summary-label">에이전트 요약</div>
        <div class="summary-text"><b>7월 12일(일) 18:00</b>까지 한국장학재단에서 신청. 신입생도 1차 대상이며, 놓치면 2차는 성적 기준이 추가돼요. 소득분위 산정에 시간이 걸리니 서류는 미리 준비하는 게 안전해요.</div>
      </div>

      <div class="info">
        <div class="info-row"><span class="info-key">마감일</span><span class="info-val">2026-07-12 (일) 18:00</span></div>
        <div class="info-row"><span class="info-key">출처</span><span class="info-val">학교 포털 › 장학안내</span></div>
        <div class="info-row"><span class="info-key">관련 키워드</span><span class="info-val"><span class="kw"># 장학금</span></span></div>
      </div>

      <a class="origin">원문 보러가기 (외부 링크) ↗</a>

      <div class="actions">
        <div class="btn secondary">나중에</div>
        <div class="btn primary">완료로 표시 ✓</div>
      </div>
    </div>
  </div>
</body>
</html>
