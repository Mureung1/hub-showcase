<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>출발/도착 등록 - RideSplit</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="shell">
    <div class="topbar">
      <div class="brand">
        <div class="logo-sm">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none">
            <circle cx="8" cy="10" r="6" fill="#fff" opacity="0.9"></circle>
            <circle cx="15" cy="10" r="6" fill="#fff" opacity="0.55"></circle>
            <circle cx="17.5" cy="17.5" r="5.5" fill="#fff"></circle>
            <text x="17.5" y="20.3" font-size="7" font-weight="800" text-anchor="middle" fill="#8C0E22">₩</text>
          </svg>
        </div>
        <span class="brand-name">RideSplit</span>
      </div>
      <div class="dots">
        <div class="dot"></div>
        <div class="dot active"></div>
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
      </div>
    </div>

    <div class="screen">
      <a class="back-btn" href="index.html">‹ 이전</a>
      <h1 class="title sm">오늘의 이동을 등록해요</h1>
      <p class="subtitle">비슷한 시간, 비슷한 방향으로 가는<br />동행자를 찾아드릴게요</p>

      <div class="section">
        <div class="section-label">이동 방향</div>
        <div class="chip-row">
          <button type="button" class="chip flex selected">학교 → 거점</button>
          <button type="button" class="chip flex">거점 → 학교</button>
        </div>
      </div>

      <div class="section">
        <div class="section-label">출발 · 정문</div>
        <div class="chip-row">
          <button type="button" class="chip selected">정문</button>
          <button type="button" class="chip">북문</button>
        </div>
      </div>

      <div class="section">
        <div class="section-label">목적지 · 대구역</div>
        <div class="chip-row">
          <button type="button" class="chip selected">대구역</button>
          <button type="button" class="chip">동대구역</button>
          <button type="button" class="chip">동성로</button>
          <button type="button" class="chip">대구공항</button>
          <button type="button" class="chip">서부정류장</button>
          <button type="button" class="chip">반월당</button>
          <button type="button" class="chip">기타</button>
        </div>
      </div>

      <div class="section">
        <div class="section-label">희망 출발 시간</div>
        <div class="chip-row">
          <button type="button" class="chip flex">21:15</button>
          <button type="button" class="chip flex selected">21:30</button>
          <button type="button" class="chip flex">21:45</button>
        </div>
      </div>

      <div class="section" style="margin-bottom: 20px;">
        <div class="section-label">도착 소요시간 (거점까지)</div>
        <div class="chip-row">
          <button type="button" class="chip flex selected">5분 이내</button>
          <button type="button" class="chip flex">10분 이내</button>
          <button type="button" class="chip flex">15분 이내</button>
        </div>
      </div>

      <div class="toggle-card">
        <div>
          <div class="toggle-title">동성끼리만 매칭 희망</div>
          <div class="toggle-desc">안전을 위한 선택 옵션이에요</div>
        </div>
        <div class="toggle-track" id="genderToggle">
          <div class="toggle-knob"></div>
        </div>
      </div>

      <div class="spacer"></div>
      <a class="btn-primary" href="candidates.html">동행자 찾기</a>
    </div>
  </div>

  <script>
    document.querySelectorAll('.chip').forEach((chip) => {
      chip.addEventListener('click', () => {
        const row = chip.closest('.chip-row')
        row.querySelectorAll('.chip').forEach((c) => c.classList.remove('selected'))
        chip.classList.add('selected')
      })
    })

    document.getElementById('genderToggle').addEventListener('click', function () {
      this.classList.toggle('on')
    })
  </script>
</body>
</html>
