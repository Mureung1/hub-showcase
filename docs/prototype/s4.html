<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>S4 설정 — 프로토타입</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="tokens.css">
<style>
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg-deep);
    display: flex;
    justify-content: center;
    padding: var(--space-5) 0;
  }

  .app {
    width: 100%; max-width: var(--frame-w); margin: 0 auto;
    background: var(--bg); border-radius: var(--radius-app); overflow: hidden;
    box-shadow: var(--shadow-app);
  }

  /* 화면 간 이동 링크 — 기본 밑줄·파란색만 리셋, 컴포넌트 자체 색은 그대로 */
  a { text-decoration: none; color: inherit; }

  .page-header { padding: var(--space-5) var(--space-4) var(--space-2); }
  .page-title { font-size: var(--fs-display); font-weight: 700; color: var(--text-1); }

  .settings { padding: 0 var(--space-4) var(--space-4); display: flex; flex-direction: column; gap: var(--space-5); }
  .setting-group { display: flex; flex-direction: column; gap: var(--space-2); }

  /* ========== 필드 라벨 · 힌트 (S1 레시피 재사용) ========== */
  .field-group { display: flex; flex-direction: column; gap: var(--space-1); }
  .field-label { font-size: var(--fs-body); font-weight: 600; color: var(--text-1); }
  .field-hint { font-size: var(--fs-caption); color: var(--text-3); }

  /* ========== 칩 — 하나의 컴포넌트, 상태 변형 (S1/v2 레시피 재사용) ========== */
  .chip-row { display: flex; gap: var(--space-2); flex-wrap: wrap; align-items: center; }
  .chip {
    font-size: var(--fs-caption); font-weight: 600;
    padding: var(--pad-chip); border-radius: var(--radius-chip);
    background: var(--surface-2); color: var(--text-2);
    border: 1px solid transparent;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .chip.on { background: var(--accent-dim); color: var(--accent); border-color: var(--accent); }
  .chip .x { font-weight: 400; opacity: .7; }
  .chip.input { background: transparent; border: 1px dashed var(--line); color: var(--text-3); font-weight: 500; }

  /* ========== 발신처 입력 (S1 레시피 재사용) ========== */
  .sender-input {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius-cell);
    padding: var(--space-3) var(--space-4);
    font-size: var(--fs-body); color: var(--text-3);
  }

  /* ========== 연동 계정 토글 (v2 레시피 재사용) ========== */
  .toggle-row { display: flex; align-items: center; justify-content: space-between; font-size: var(--fs-body); color: var(--text-2); }
  .toggle { width: 40px; height: 24px; border-radius: var(--radius-chip); background: var(--surface-2); position: relative; }
  .toggle::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: var(--text-3); }
  .toggle.on { background: var(--accent); }
  .toggle.on::after { left: 19px; background: var(--knob); }

  /* ========== 학사일정 바로가기 (S3 원문 링크 레시피 재사용) ========== */
  .origin {
    display: block; text-align: center;
    border: 1px dashed var(--line);
    border-radius: var(--radius-cell);
    padding: var(--space-3);
    font-size: var(--fs-body); color: var(--text-3); font-weight: 500;
  }

  /* ========== 하단 탭 (v2 레시피 재사용) ========== */
  .tabbar { display: flex; border-top: 1px solid var(--line); background: var(--bg); margin-top: var(--space-5); }
  .tab { flex: 1; text-align: center; padding: var(--pad-tab); font-size: var(--fs-caption); font-weight: 600; color: var(--text-3); }
  .tab.on { color: var(--accent); }
  .tab .ico { display: block; font-size: var(--fs-icon); margin-bottom: 3px; }
</style>
</head>
<body>
  <div class="app">
    <div class="page-header"><div class="page-title">설정</div></div>
    <div class="settings">
      <div class="setting-group">
        <div class="field-label">관심 키워드</div>
        <div class="chip-row">
          <span class="chip on">장학금 <span class="x">×</span></span>
          <span class="chip on">취업 <span class="x">×</span></span>
          <span class="chip on">교환학생 <span class="x">×</span></span>
          <span class="chip">공모전</span>
          <span class="chip">현장실습</span>
          <span class="chip input">+ 직접입력</span>
        </div>
      </div>

      <div class="setting-group">
        <div class="field-group">
          <div class="field-label">꼭 알림 받을 발신처</div>
          <div class="field-hint">AI가 놓쳐도 이 발신처의 메일은 반드시 알려드려요</div>
        </div>
        <div class="sender-input">예: 학과 사무실, 장학팀…</div>
        <div class="chip-row">
          <span class="chip on">학과 사무실 <span class="x">×</span></span>
          <span class="chip on">장학팀 <span class="x">×</span></span>
        </div>
      </div>

      <div class="setting-group">
        <div class="field-group">
          <div class="field-label">확인 주기</div>
          <div class="field-hint">새 알림을 얼마나 자주 확인할까요</div>
        </div>
        <div class="chip-row">
          <span class="chip">30분</span>
          <span class="chip on">1시간</span>
          <span class="chip">3시간</span>
          <span class="chip">하루 1회</span>
        </div>
      </div>

      <div class="setting-group">
        <div class="field-label">연동 계정</div>
        <div class="toggle-row"><span>학교 이메일 (연결됨)</span><div class="toggle on"></div></div>
        <div class="toggle-row"><span>포털 공지</span><div class="toggle on"></div></div>
        <div class="toggle-row"><span>취업진로포털 (검증 중)</span><div class="toggle"></div></div>
      </div>

      <a class="origin">학사일정 바로가기 ↗</a>
    </div>

    <div class="tabbar">
      <a class="tab" href="s2.html"><span class="ico">☰</span>홈</a>
      <div class="tab on"><span class="ico">⚙</span>설정</div>
    </div>
  </div>
</body>
</html>
