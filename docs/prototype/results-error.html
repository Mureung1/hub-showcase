<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>차세워 · 검색 실패</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <h1 class="screen-title">검색 결과</h1>

    <div class="pad">
      <form class="search-field" action="results.html">
        <svg class="icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <circle cx="11" cy="11" r="7" />
          <line x1="21" y1="21" x2="16.65" y2="16.65" />
        </svg>
        <input type="text" name="destination" placeholder="목적지를 입력하세요" />
        <a class="clear" href="index.html" title="지우고 다시 검색">&times;</a>
      </form>
    </div>

    <div class="state">
      <div class="state-icon state-icon--busy">!</div>
      <div class="state-title">장소를 찾지 못했어요</div>
      <div class="state-sub">다시 입력해 주세요</div>
      <a class="btn-primary" href="index.html">다시 검색</a>
    </div>
  </div>
</body>
</html>
