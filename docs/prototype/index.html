<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>로그인 - RideSplit</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="shell">
    <div class="topbar">
      <div class="brand">
        <div class="logo-sm">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none">
            <circle cx="8" cy="10" r="6" fill="#fff" opacity="0.9"></circle>
            <circle cx="15" cy="10" r="6" fill="#fff" opacity="0.55"></circle>
            <circle cx="17.5" cy="17.5" r="5.5" fill="#fff"></circle>
            <text x="17.5" y="20.3" font-size="7" font-weight="800" text-anchor="middle" fill="#8C0E22">₩</text>
          </svg>
        </div>
        <span class="brand-name">RideSplit</span>
      </div>
      <div class="dots">
        <div class="dot active"></div>
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
      </div>
    </div>

    <div class="screen center">
      <div class="big-logo">
        <svg viewBox="0 0 24 24" width="32" height="32" fill="none">
          <circle cx="8" cy="10" r="6" fill="#fff" opacity="0.9"></circle>
          <circle cx="15" cy="10" r="6" fill="#fff" opacity="0.55"></circle>
          <circle cx="17.5" cy="17.5" r="5.5" fill="#fff"></circle>
          <text x="17.5" y="20.3" font-size="7" font-weight="800" text-anchor="middle" fill="#8C0E22">₩</text>
        </svg>
      </div>
      <h1 class="title">학교 이메일로 로그인</h1>
      <p class="subtitle">대학교 학생만 이용할 수 있는<br />택시 동승 매칭 서비스예요</p>

      <div class="email-card">
        <div class="email-label">학교 이메일</div>
        <div class="email-row">
          <span class="email-value">jieun@univ.ac.kr</span>
          <span class="badge-tint">.ac.kr 인증</span>
        </div>
      </div>

      <a class="btn-primary" href="register.html">인증 메일 받기</a>
      <p class="helper-text">프로토타입이라 인증 없이 바로 다음 화면으로 이동해요</p>
    </div>
  </div>
</body>
</html>
