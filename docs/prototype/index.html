<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>차세워 · 검색</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <div class="home">
      <h1 class="logo">차세워</h1>
      <p class="tagline">목적지 근처 공영주차장을<br />빠르게 찾아보세요</p>

      <form class="search-form" action="results.html">
        <label class="search-field">
          <svg class="icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <circle cx="11" cy="11" r="7" />
            <line x1="21" y1="21" x2="16.65" y2="16.65" />
          </svg>
          <input type="text" name="destination" placeholder="목적지나 장소를 검색해보세요" />
        </label>
      </form>

      <p class="section-label">예시 목적지</p>
      <div class="chips">
        <a class="chip" href="results.html">강남역</a>
        <a class="chip" href="results.html">서울역</a>
        <a class="chip" href="results.html">홍대입구</a>
        <a class="chip" href="results.html">코엑스</a>
      </div>
    </div>
  </div>
</body>
</html>
