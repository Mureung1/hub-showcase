<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PREFER — 응답 완료</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="page">
  <div class="container">
    <div class="screen-label">09. 투표 완료 화면</div>

    <div class="card card-center">
      <div class="card-title">투표 완료! ✅</div>
      <p style="font-size:13px; color:var(--color-text-muted); margin:0;">
        입력한 내용을 저장했어요.<br>다른 참여자의 응답이 모이면 추천 결과를 확인할 수 있어요.
      </p>
    </div>

    <div class="card">
      <div class="card-title">내 응답 요약</div>
      <div id="vote-done-summary" class="participant-list"></div>
    </div>

    <div class="btn-row">
      <button type="button" id="vote-done-edit" class="btn btn-secondary btn-grow">내 응답 수정하기</button>
      <button type="button" id="vote-done-share" class="btn btn-secondary btn-grow">약속 링크 공유하기</button>
      <button type="button" id="vote-done-home" class="btn btn-primary btn-grow">현황으로 돌아가기</button>
    </div>
  </div>
</div>

<script src="js/mock-data.js"></script>
<script src="js/components.js"></script>
<script src="js/main.js"></script>
<script>initVoteDonePage();</script>
</body>
</html>
