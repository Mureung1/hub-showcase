<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PREFER — 약속 허브</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="page">
  <div class="container">
    <div class="screen-label">05·06. 약속 허브 (관리자 / 참여자)</div>

    <p id="hub-loading" hidden style="color:var(--color-text-muted); font-size:14px;">참여 정보를 확인하는 중...</p>

    <div id="hub-content" style="display:none;">
      <span id="hub-role-badge" class="hub-role-badge"></span>
      <h1 id="hub-title" class="hub-title"></h1>
      <p id="hub-sub" class="hub-sub"></p>

      <div class="card">
        <span id="hub-status-badge" class="badge badge-status" style="align-self:flex-start;"></span>
        <div id="hub-progress"></div>

        <div class="form-group">
          <label class="form-label">참여 링크</label>
          <div id="hub-link-box" class="link-box"></div>
          <button type="button" id="hub-copy-btn" class="btn btn-secondary btn-block">링크 복사</button>
        </div>

        <div id="hub-actions" class="btn-row"></div>
        <div id="hub-error-text" class="hub-error-text" hidden>관리자만 가능합니다!</div>
      </div>

      <div class="card">
        <div class="card-title">참여 현황</div>
        <div id="hub-participant-list" class="participant-list"></div>
      </div>
    </div>
  </div>
</div>

<script src="js/mock-data.js"></script>
<script src="js/components.js"></script>
<script src="js/main.js"></script>
<script>initHubPage();</script>
</body>
</html>
