<!-- @dsCard group="Screens" -->
<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>하루 체크아웃 — S3 기록 캘린더</title>
<style>
  :root {
    --primary: #3182f6;
    --primary-light: #e8f3ff;
    --text-strong: #191f28;
    --text-body: #4e5968;
    --text-sub: #8b95a1;
    --border: #e5e8eb;
    --bg-page: #f2f4f6;
    --bg-card: #ffffff;
    --error: #f04452;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Pretendard", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    background: linear-gradient(180deg, #eef2ff 0%, #f7f3ff 50%, #fff5f2 100%);
    color: var(--text-body);
    display: flex; justify-content: center;
    padding: 32px 16px 80px; min-height: 100vh;
  }
  .phone { width: 100%; max-width: 430px; }
  .app-header { text-align: center; margin-bottom: 20px; }
  .app-header .badge { display: inline-block; font-size: 12px; font-weight: 700; color: var(--primary); background: var(--primary-light); padding: 4px 12px; border-radius: 9999px; margin-bottom: 8px; }
  .app-header h1 { font-size: 18px; font-weight: 700; color: var(--text-strong); }
  .screen { background: var(--bg-card); border-radius: 20px; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08); padding: 24px 20px 20px; min-height: 560px; }

  .cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  .cal-head .month { font-size: 17px; font-weight: 700; color: var(--text-strong); }
  .cal-head .nav { color: var(--text-sub); font-size: 14px; }

  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-bottom: 22px; }
  .cal-dow { text-align: center; font-size: 11px; color: var(--text-sub); padding-bottom: 6px; }
  .cal-day { aspect-ratio: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; border-radius: 10px; font-size: 12.5px; color: var(--text-body); gap: 3px; }
  .cal-day.today { background: var(--primary-light); font-weight: 700; color: var(--primary); }
  .cal-day.empty { color: transparent; }
  .cal-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--primary); }
  .cal-dot.repeat { background: var(--error); }

  .section-label { font-size: 12px; font-weight: 700; color: var(--text-sub); letter-spacing: 0.02em; margin-bottom: 10px; }

  .pattern-card { background: #fff5f2; border: 1px solid #ffd9cf; border-radius: 14px; padding: 14px 16px; margin-bottom: 20px; }
  .pattern-card .title { font-size: 13px; font-weight: 700; color: var(--error); margin-bottom: 4px; }
  .pattern-card .desc { font-size: 12.5px; color: var(--text-body); line-height: 1.5; margin-bottom: 10px; }
  .pattern-card .link { font-size: 12px; font-weight: 700; color: var(--primary); }

  .history-list { display: flex; flex-direction: column; gap: 8px; }
  .history-row { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--border); }
  .history-row .date { font-size: 11px; color: var(--text-sub); flex: 0 0 44px; }
  .history-row .emotion { font-size: 13.5px; color: var(--text-strong); flex: 1; }
  .history-row .icon { font-size: 15px; }
</style>
</head>
<body>
<div class="phone">
  <div class="app-header">
    <div class="badge">DESIGN SYSTEM · S3</div>
    <h1>하루 체크아웃</h1>
  </div>
  <section class="screen">
    <div class="cal-head">
      <span class="nav">‹</span>
      <span class="month">2026년 7월</span>
      <span class="nav">›</span>
    </div>
    <div class="cal-grid">
      <div class="cal-dow">일</div><div class="cal-dow">월</div><div class="cal-dow">화</div><div class="cal-dow">수</div><div class="cal-dow">목</div><div class="cal-dow">금</div><div class="cal-dow">토</div>
      <div class="cal-day empty">·</div><div class="cal-day empty">·</div><div class="cal-day">1</div><div class="cal-day">2<span class="cal-dot"></span></div><div class="cal-day">3</div><div class="cal-day">4<span class="cal-dot"></span></div><div class="cal-day">5</div>
      <div class="cal-day">6<span class="cal-dot repeat"></span></div><div class="cal-day">7<span class="cal-dot repeat"></span></div><div class="cal-day">8<span class="cal-dot repeat"></span></div><div class="cal-day today">9<span class="cal-dot"></span></div><div class="cal-day">10</div><div class="cal-day">11</div><div class="cal-day">12</div>
    </div>

    <div class="pattern-card">
      <div class="title">⚠ 반복되는 감정이 있어요</div>
      <div class="desc">최근 3일 연속 "무기력함"이 기록됐어요. 학교 상담센터나 심리상담 바우처 정보를 확인해보시겠어요?</div>
      <span class="link">지원 정보 보기 →</span>
    </div>

    <div class="section-label">최근 기록</div>
    <div class="history-list">
      <div class="history-row"><span class="date">7/9</span><span class="icon">🙂</span><span class="emotion">무기력함, 답답함</span></div>
      <div class="history-row"><span class="date">7/8</span><span class="icon">🙂</span><span class="emotion">무기력함</span></div>
      <div class="history-row"><span class="date">7/7</span><span class="icon">🙂</span><span class="emotion">무기력함, 초조함</span></div>
      <div class="history-row"><span class="date">7/4</span><span class="icon">😌</span><span class="emotion">안정감</span></div>
    </div>
  </section>
</div>
</body>
</html>
