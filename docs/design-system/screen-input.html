<!-- @dsCard group="Screens" -->
<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>하루 체크아웃 — S1 입력 화면</title>
<style>
  :root {
    --primary: #3182f6;
    --primary-hover: #2272eb;
    --primary-light: #e8f3ff;
    --text-strong: #191f28;
    --text-body: #4e5968;
    --text-sub: #8b95a1;
    --border: #e5e8eb;
    --bg-page: #f2f4f6;
    --bg-card: #ffffff;
    --bg-input: #f9fafb;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Pretendard", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    background: linear-gradient(180deg, #eef2ff 0%, #f7f3ff 50%, #fff5f2 100%);
    color: var(--text-body);
    display: flex;
    justify-content: center;
    padding: 32px 16px 80px;
    min-height: 100vh;
  }
  .phone { width: 100%; max-width: 430px; }
  .app-header { text-align: center; margin-bottom: 20px; }
  .app-header .badge {
    display: inline-block; font-size: 12px; font-weight: 700; color: var(--primary);
    background: var(--primary-light); padding: 4px 12px; border-radius: 9999px; margin-bottom: 8px;
  }
  .app-header h1 { font-size: 18px; font-weight: 700; color: var(--text-strong); }
  .screen {
    background: var(--bg-card); border-radius: 20px; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    padding: 24px 20px 20px; min-height: 560px; display: flex; flex-direction: column;
  }
  .date-label { font-size: 13px; color: var(--text-sub); margin-bottom: 6px; }
  .prompt-title { font-size: 21px; font-weight: 700; color: var(--text-strong); line-height: 1.4; margin-bottom: 20px; }
  textarea#input-text {
    flex: 1; width: 100%; min-height: 260px; resize: none; background: var(--bg-input);
    border: 1px solid var(--border); border-radius: 16px; padding: 16px; font-size: 15px;
    line-height: 1.6; font-family: inherit; color: var(--text-strong); outline: none;
  }
  textarea#input-text:focus { border-color: var(--primary); }
  .hint { font-size: 12.5px; color: var(--text-sub); margin-top: 10px; margin-bottom: 18px; }
  .btn { height: 56px; border: none; border-radius: 16px; font-size: 16px; font-weight: 600; cursor: pointer; width: 100%; font-family: inherit; }
  .btn-primary { background: var(--primary); color: #fff; }
</style>
</head>
<body>
<div class="phone">
  <div class="app-header">
    <div class="badge">DESIGN SYSTEM</div>
    <h1>하루 체크아웃</h1>
  </div>
  <section class="screen">
    <div class="date-label">2026년 7월 9일 목요일</div>
    <div class="prompt-title">오늘 하루,<br />어떤 감정이 남았어?</div>
    <textarea id="input-text">팀플에서 의견이 계속 무시돼서 지쳤다</textarea>
    <div class="hint">비워둔 채로는 정리할 수 없어요. 한두 문장이어도 괜찮아요.</div>
    <button class="btn btn-primary">정리하기</button>
  </section>
</div>
</body>
</html>
