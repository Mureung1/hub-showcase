<div class="flex justify-between items-center p-6 border-b-border-thick border-white/10">
<h2 class="font-headline-lg text-headline-lg text-white" id="modal-title">모임 만들기</h2>

                준비 중인 기능입니다. 곧 만나보실 수 있어요!
            </p>
<div class="mt-8 flex justify-end">
<button class="px-[26px] py-[14px] bg-campfire-orange text-white font-button-label rounded-full border-extra-thick border-campfire-orange shadow-[4px_4px_0px_0px_rgba(12,13,21,1)] active:translate-x-[2px] active:translate-y-[2px] active:shadow-none" onclick="closeModal()">
                    확인
                </button>
</div>
</div>
</div>

<script>
    function openModal(type) {
        const backdrop = document.getElementById('modal-backdrop');
        const container = document.getElementById('modal-container');
        const title = document.getElementById('modal-title');
        const body = document.getElementById('modal-body');

        const contentMap = {
            'create': {
                title: '모임 만들기',
                body: '새로운 소모임을 개설하고 멤버를 초대해보세요. 어떤 모임을 계획하고 계신가요?'
            },
            'list': {
                title: '모임 목록',
                body: '현재 활발하게 진행 중인 모임들을 확인하고 마음에 드는 곳에 참여해보세요.'
            },
            'my': {
                title: '내 모임',
                body: '내가 참여 중이거나 개설한 모임의 소식을 한눈에 확인하세요.'
            }
        };

        const content = contentMap[type];
        title.innerText = content.title;
        body.innerText = content.body;

        backdrop.classList.remove('hidden');
        backdrop.classList.add('flex');
        setTimeout(() => {
            backdrop.classList.add('opacity-100');
            container.classList.remove('scale-95');
            container.classList.add('scale-100');
        }, 10);
    }

    function closeModal() {
        const backdrop = document.getElementById('modal-backdrop');
        const container = document.getElementById('modal-container');

        backdrop.classList.remove('opacity-100');
        container.classList.remove('scale-100');
        container.classList.add('scale-95');
        setTimeout(() => {
            backdrop.classList.add('hidden');
            backdrop.classList.remove('flex');
        }, 200);
    }

    // Close modal on backdrop click
    document.getElementById('modal-backdrop').addEventListener('click', (e) => {
        if (e.target === e.currentTarget) closeModal();
    });
</script>
