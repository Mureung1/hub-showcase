<!-- Interactive Script for micro-interactions -->
<script>
        // Simple timer logic simulation
        let seconds = 2712; // Starting from 00:45:12
        const timerElement = document.querySelector('.font-mono-timer');
        
        setInterval(() => {
            seconds++;
            const h = Math.floor(seconds / 3600).toString().padStart(2, '0');
            const m = Math.floor((seconds % 3600) / 60).toString().padStart(2, '0');
            const s = (seconds % 60).toString().padStart(2, '0');
            timerElement.textContent = `[${h}:${m}:${s}]`;
        }, 1000);

        // Click effects for "Put wood"
        const fireBtn = document.querySelector('button:has(.material-symbols-outlined:contains("local_fire_department"))');
        if (fireBtn) {
            fireBtn.addEventListener('click', () => {
                // Flash effect simulation
                const img = document.querySelector('img');
                img.classList.remove('opacity-90');
                img.classList.add('brightness-125');
                setTimeout(() => {
                    img.classList.remove('brightness-125');
                    img.classList.add('opacity-90');
                }, 300);
            });
        }

        // Material Icons patch for non-supporting browsers (using innerText fallback)
        document.querySelectorAll('.material-symbols-outlined').forEach(icon => {
            if (icon.textContent === 'contains("local_fire_department")') {
                icon.textContent = 'local_fire_department';
            }
        });
    </script>
