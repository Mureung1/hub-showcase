    <script class="">
        function toggleChip(el) {
            // Deactivate all others
            const chips = el.parentElement.querySelectorAll('button');
            chips.forEach(c => {
                c.classList.remove('chip-active');
                c.classList.add('bg-paper-cream');
            });
            // Activate selected
            el.classList.add('chip-active');
            el.classList.remove('bg-paper-cream');
        }

        // Add some click listeners for haptic simulation
        document.querySelectorAll('.active-press').forEach(btn => {
            btn.addEventListener('click', function() {
                this.classList.add('translate-x-[2px]', 'translate-y-[2px]', 'shadow-none');
                setTimeout(() => {
                    this.classList.remove('translate-x-[2px]', 'translate-y-[2px]', 'shadow-none');</script>
