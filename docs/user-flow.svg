<svg viewBox="0 0 620 870" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">동행자 매칭 서비스 사용자 흐름도</title>
  <desc id="desc">로그인부터 이동 완료 및 평가까지 이어지는 8단계 사용자 흐름을 보여주는 순서도</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5F5E5A"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="620" height="870" fill="#FFFFFF"/>

  <line x1="310" y1="80" x2="310" y2="108" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="310" y1="170" x2="310" y2="198" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="310" y1="260" x2="310" y2="288" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="310" y1="350" x2="310" y2="368" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="310" y1="480" x2="310" y2="498" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="310" y1="560" x2="310" y2="588" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="310" y1="650" x2="310" y2="678" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="310" y1="740" x2="310" y2="768" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <path d="M170,425 L90,425 L90,230 L158,230" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="50" y="330" font-size="12" fill="#5F5E5A" text-anchor="middle" transform="rotate(-90 50 330)">아니오 / 대기중</text>

  <text x="335" y="495" font-size="12" fill="#5F5E5A">예</text>

  <rect x="160" y="20" width="300" height="60" rx="10" fill="#F1EFE8" stroke="#B4B2A9"/>
  <text x="310" y="55" font-size="14" fill="#2C2C2A" text-anchor="middle" dominant-baseline="middle">로그인 - 학교 이메일 인증</text>

  <rect x="160" y="110" width="300" height="60" rx="10" fill="#F1EFE8" stroke="#B4B2A9"/>
  <text x="310" y="145" font-size="14" fill="#2C2C2A" text-anchor="middle" dominant-baseline="middle">출발/도착/희망시간 등록</text>

  <rect x="160" y="200" width="300" height="60" rx="10" fill="#F1EFE8" stroke="#B4B2A9"/>
  <text x="310" y="235" font-size="14" fill="#2C2C2A" text-anchor="middle" dominant-baseline="middle">매칭 후보 리스트 조회</text>

  <rect x="160" y="290" width="300" height="60" rx="10" fill="#F1EFE8" stroke="#B4B2A9"/>
  <text x="310" y="325" font-size="14" fill="#2C2C2A" text-anchor="middle" dominant-baseline="middle">동행 신청</text>

  <polygon points="310,370 450,425 310,480 170,425" fill="#E6F1FB" stroke="#185FA5"/>
  <text x="310" y="425" font-size="14" fill="#0C447C" text-anchor="middle" dominant-baseline="middle">상대방 수락?</text>

  <rect x="160" y="500" width="300" height="60" rx="10" fill="#F1EFE8" stroke="#B4B2A9"/>
  <text x="310" y="535" font-size="14" fill="#2C2C2A" text-anchor="middle" dominant-baseline="middle">그룹 확정 + 채팅방 생성</text>

  <rect x="160" y="590" width="300" height="60" rx="10" fill="#F1EFE8" stroke="#B4B2A9"/>
  <text x="310" y="625" font-size="14" fill="#2C2C2A" text-anchor="middle" dominant-baseline="middle">예상 비용 1/N 계산 표시</text>

  <rect x="160" y="680" width="300" height="60" rx="10" fill="#F1EFE8" stroke="#B4B2A9"/>
  <text x="310" y="715" font-size="14" fill="#2C2C2A" text-anchor="middle" dominant-baseline="middle">탑승 확인 버튼</text>

  <rect x="160" y="770" width="300" height="60" rx="10" fill="#F1EFE8" stroke="#B4B2A9"/>
  <text x="310" y="805" font-size="14" fill="#2C2C2A" text-anchor="middle" dominant-baseline="middle">이동 완료 - 상호 평가</text>
</svg>
