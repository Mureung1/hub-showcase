<svg width="1280" height="760" viewBox="0 0 1280 760" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font: 700 44px "Inter", "Segoe UI", "Malgun Gothic", sans-serif; fill: #000000; }
      .subtitle { font: 400 18px "Inter", "Segoe UI", "Malgun Gothic", sans-serif; fill: #33332e; }
      .section { font: 700 20px "Inter", "Segoe UI", "Malgun Gothic", sans-serif; fill: #000000; }
      .body { font: 500 15px "Inter", "Segoe UI", "Malgun Gothic", sans-serif; fill: #33332e; }
      .small { font: 500 13px "Inter", "Segoe UI", "Malgun Gothic", sans-serif; fill: #62625b; }
      .pill { font: 700 13px "Inter", "Segoe UI", "Malgun Gothic", sans-serif; fill: #ffffff; }
      .chip { font: 700 12px "Inter", "Segoe UI", "Malgun Gothic", sans-serif; fill: #000000; }
      .on-dark { font: 700 20px "Inter", "Segoe UI", "Malgun Gothic", sans-serif; fill: #ffffff; }
      .on-dark-body { font: 500 15px "Inter", "Segoe UI", "Malgun Gothic", sans-serif; fill: rgba(255,255,255,0.78); }
    </style>
  </defs>

  <rect width="1280" height="760" fill="#fbfbf9"/>

  <g transform="translate(64 46)">
    <text class="title" x="0" y="48">TeamFlow Agent</text>
    <text class="subtitle" x="2" y="84">회의록과 역할 분담 메모를 팀원별 업무 흐름으로 바꾸는 대학생 프로젝트 에이전트</text>
    <rect x="1010" y="10" width="126" height="40" rx="16" fill="#e60023"/>
    <text class="pill" x="1041" y="35">MVP Flow</text>
  </g>

  <g transform="translate(64 146)">
    <rect x="0" y="0" width="1152" height="86" rx="16" fill="#ffffff" stroke="#dadad3"/>
    <text class="section" x="28" y="34">문제 정의</text>
    <text class="body" x="28" y="62">팀플, 공모전, 졸업설계의 회의 내용과 역할 분담이 여러 채널에 흩어져 작업 누락과 반복 정리가 발생한다.</text>
  </g>

  <g transform="translate(64 280)">
    <text class="section" x="0" y="0">사용자 흐름</text>

    <g transform="translate(0 28)">
      <rect x="0" y="0" width="178" height="196" rx="16" fill="#f6f6f3" stroke="#dadad3"/>
      <circle cx="28" cy="30" r="18" fill="#000000"/>
      <text class="pill" x="23" y="35">1</text>
      <text class="section" x="24" y="74">회의 종료</text>
      <text class="small" x="24" y="104">팀플, 공모전,</text>
      <text class="small" x="24" y="126">졸업설계 회의가</text>
      <text class="small" x="24" y="148">끝난다.</text>
      <rect x="24" y="164" width="86" height="24" rx="12" fill="#ffffff"/>
      <text class="chip" x="39" y="180">회의록</text>
    </g>

    <path d="M188 126H230" stroke="#e60023" stroke-width="4" stroke-linecap="round"/>
    <path d="M230 126L216 116V136L230 126Z" fill="#e60023"/>

    <g transform="translate(242 28)">
      <rect x="0" y="0" width="178" height="196" rx="16" fill="#ffffff" stroke="#dadad3"/>
      <circle cx="28" cy="30" r="18" fill="#000000"/>
      <text class="pill" x="23" y="35">2</text>
      <text class="section" x="24" y="74">내용 입력</text>
      <text class="small" x="24" y="104">카카오톡 공지,</text>
      <text class="small" x="24" y="126">역할 분담 메모,</text>
      <text class="small" x="24" y="148">피드백을 붙여넣는다.</text>
      <rect x="24" y="164" width="94" height="24" rx="12" fill="#f6f6f3"/>
      <text class="chip" x="38" y="180">텍스트</text>
    </g>

    <path d="M430 126H472" stroke="#e60023" stroke-width="4" stroke-linecap="round"/>
    <path d="M472 126L458 116V136L472 126Z" fill="#e60023"/>

    <g transform="translate(484 28)">
      <rect x="0" y="0" width="178" height="196" rx="16" fill="#f6f6f3" stroke="#dadad3"/>
      <circle cx="28" cy="30" r="18" fill="#000000"/>
      <text class="pill" x="23" y="35">3</text>
      <text class="section" x="24" y="74">AI 분석</text>
      <text class="small" x="24" y="104">팀원 이름, 업무,</text>
      <text class="small" x="24" y="126">마감일, 상태를</text>
      <text class="small" x="24" y="148">추출한다.</text>
      <rect x="24" y="164" width="100" height="24" rx="12" fill="#ffffff"/>
      <text class="chip" x="40" y="180">추출</text>
    </g>

    <path d="M672 126H714" stroke="#e60023" stroke-width="4" stroke-linecap="round"/>
    <path d="M714 126L700 116V136L714 126Z" fill="#e60023"/>

    <g transform="translate(726 28)">
      <rect x="0" y="0" width="178" height="196" rx="16" fill="#ffffff" stroke="#dadad3"/>
      <circle cx="28" cy="30" r="18" fill="#000000"/>
      <text class="pill" x="23" y="35">4</text>
      <text class="section" x="24" y="74">업무표 생성</text>
      <text class="small" x="24" y="104">팀원별 할 일과</text>
      <text class="small" x="24" y="126">확인 필요 항목을</text>
      <text class="small" x="24" y="148">표로 정리한다.</text>
      <rect x="24" y="164" width="92" height="24" rx="12" fill="#f6f6f3"/>
      <text class="chip" x="39" y="180">대시보드</text>
    </g>

    <path d="M914 126H956" stroke="#e60023" stroke-width="4" stroke-linecap="round"/>
    <path d="M956 126L942 116V136L956 126Z" fill="#e60023"/>

    <g transform="translate(968 28)">
      <rect x="0" y="0" width="184" height="196" rx="16" fill="#f6f6f3" stroke="#dadad3"/>
      <circle cx="28" cy="30" r="18" fill="#000000"/>
      <text class="pill" x="23" y="35">5</text>
      <text class="section" x="24" y="74">다음 회의 준비</text>
      <text class="small" x="24" y="104">미결 이슈와</text>
      <text class="small" x="24" y="126">다음 회의 체크리스트를</text>
      <text class="small" x="24" y="148">공유한다.</text>
      <rect x="24" y="164" width="94" height="24" rx="12" fill="#ffffff"/>
      <text class="chip" x="39" y="180">체크리스트</text>
    </g>
  </g>

  <g transform="translate(64 570)">
    <rect x="0" y="0" width="358" height="112" rx="16" fill="#ffffff" stroke="#dadad3"/>
    <text class="section" x="24" y="34">핵심 기능 1</text>
    <text class="body" x="24" y="64">회의록/역할 분담 메모에서</text>
    <text class="body" x="24" y="88">팀원별 할 일을 추출한다.</text>

    <rect x="397" y="0" width="358" height="112" rx="16" fill="#ffffff" stroke="#dadad3"/>
    <text class="section" x="421" y="34">핵심 기능 2</text>
    <text class="body" x="421" y="64">업무표와 다음 회의 체크리스트를</text>
    <text class="body" x="421" y="88">자동으로 생성한다.</text>

    <rect x="794" y="0" width="358" height="112" rx="16" fill="#262622"/>
    <text class="on-dark" x="818" y="34">MVP 기준</text>
    <text class="on-dark-body" x="818" y="64">실제 AI API 없이 더미 데이터로</text>
    <text class="on-dark-body" x="818" y="88">화면 흐름을 먼저 검증한다.</text>
  </g>
</svg>
