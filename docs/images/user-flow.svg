<svg width="1280" height="760" viewBox="0 0 1280 760" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font: 700 44px "Inter", "Segoe UI", "Malgun Gothic", sans-serif; fill: #000000; }
      .subtitle { font: 400 18px "Inter", "Segoe UI", "Malgun Gothic", sans-serif; fill: #33332e; }
      .section { font: 700 20px "Inter", "Segoe UI", "Malgun Gothic", sans-serif; fill: #000000; }
      .body { font: 500 15px "Inter", "Segoe UI", "Malgun Gothic", sans-serif; fill: #33332e; }
      .small { font: 500 13px "Inter", "Segoe UI", "Malgun Gothic", sans-serif; fill: #62625b; }
      .pill { font: 700 13px "Inter", "Segoe UI", "Malgun Gothic", sans-serif; fill: #ffffff; }
      .chip { font: 700 12px "Inter", "Segoe UI", "Malgun Gothic", sans-serif; fill: #000000; }
      .on-dark { font: 700 20px "Inter", "Segoe UI", "Malgun Gothic", sans-serif; fill: #ffffff; }
      .on-dark-body { font: 500 15px "Inter", "Segoe UI", "Malgun Gothic", sans-serif; fill: rgba(255,255,255,0.78); }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2 2L10 6L2 10" stroke="#e60023" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="1280" height="760" fill="#fbfbf9"/>

  <g transform="translate(64 46)">
    <text class="title" x="0" y="48">모두의 뇌</text>
    <text class="subtitle" x="2" y="84">회의 요약이 아니라, 팀 전체가 같은 맥락을 이해하도록 돕는 공유 지식망 에이전트</text>
    <rect x="990" y="10" width="146" height="40" rx="16" fill="#e60023"/>
    <text class="pill" x="1018" y="35">Shared Brain</text>
  </g>

  <g transform="translate(64 146)">
    <rect x="0" y="0" width="1152" height="534" rx="32" fill="#ffffff" stroke="#dadad3"/>

    <g transform="translate(40 44)">
      <rect x="0" y="0" width="178" height="122" rx="16" fill="#f6f6f3" stroke="#e5e5e0"/>
      <text class="section" x="24" y="36">자료 입력</text>
      <text class="body" x="24" y="66">회의록</text>
      <text class="body" x="24" y="91">연구 메모</text>
      <text class="body" x="24" y="116">설계 피드백</text>
    </g>

    <line x1="230" y1="105" x2="310" y2="105" stroke="#e60023" stroke-width="3" marker-end="url(#arrow)"/>

    <g transform="translate(322 44)">
      <rect x="0" y="0" width="200" height="122" rx="16" fill="#262622"/>
      <text class="on-dark" x="24" y="36">AI 맥락 추출</text>
      <text class="on-dark-body" x="24" y="67">주제, 용어</text>
      <text class="on-dark-body" x="24" y="92">결정사항, 근거</text>
      <text class="on-dark-body" x="24" y="117">미결 질문</text>
    </g>

    <line x1="535" y1="105" x2="615" y2="105" stroke="#e60023" stroke-width="3" marker-end="url(#arrow)"/>

    <g transform="translate(627 44)">
      <rect x="0" y="0" width="218" height="122" rx="16" fill="#f6f6f3" stroke="#e5e5e0"/>
      <text class="section" x="24" y="36">관점 연결</text>
      <text class="body" x="24" y="67">건축 / 구조 / 설비</text>
      <text class="body" x="24" y="92">연구자 / 업체 / 팀원</text>
      <text class="body" x="24" y="117">의견 차이 표시</text>
    </g>

    <line x1="858" y1="105" x2="938" y2="105" stroke="#e60023" stroke-width="3" marker-end="url(#arrow)"/>

    <g transform="translate(950 44)">
      <rect x="0" y="0" width="162" height="122" rx="16" fill="#e60023"/>
      <text class="on-dark" x="24" y="36">공유 지식맵</text>
      <text class="on-dark-body" x="24" y="67">같은 맥락</text>
      <text class="on-dark-body" x="24" y="92">같은 기준</text>
      <text class="on-dark-body" x="24" y="117">빠른 합류</text>
    </g>

    <g transform="translate(40 230)">
      <text class="section" x="0" y="0">지식맵이 만드는 변화</text>

      <g transform="translate(0 36)">
        <rect x="0" y="0" width="340" height="190" rx="16" fill="#f6f6f3" stroke="#e5e5e0"/>
        <rect x="24" y="24" width="74" height="30" rx="15" fill="#e5e5e0"/>
        <text class="chip" x="43" y="44">Before</text>
        <text class="body" x="24" y="82">문서와 회의록은 많지만</text>
        <text class="body" x="24" y="110">결정 배경과 용어의 의미가</text>
        <text class="body" x="24" y="138">사람마다 다르게 남아 있다.</text>
      </g>

      <g transform="translate(390 36)">
        <rect x="0" y="0" width="340" height="190" rx="16" fill="#262622"/>
        <rect x="24" y="24" width="62" height="30" rx="15" fill="#e60023"/>
        <text class="pill" x="42" y="44">AI</text>
        <text class="on-dark-body" x="24" y="82">자료에서 반복되는 주제와</text>
        <text class="on-dark-body" x="24" y="110">사람별 판단 근거를 추출해</text>
        <text class="on-dark-body" x="24" y="138">관계로 연결한다.</text>
      </g>

      <g transform="translate(780 36)">
        <rect x="0" y="0" width="300" height="190" rx="16" fill="#f6f6f3" stroke="#e5e5e0"/>
        <rect x="24" y="24" width="64" height="30" rx="15" fill="#e5e5e0"/>
        <text class="chip" x="47" y="44">After</text>
        <text class="body" x="24" y="82">새 참여자는 지식맵만 보고</text>
        <text class="body" x="24" y="110">프로젝트의 핵심 맥락과</text>
        <text class="body" x="24" y="138">남은 질문을 빠르게 이해한다.</text>
      </g>
    </g>
  </g>

  <g transform="translate(84 704)">
    <text class="small" x="0" y="0">MVP는 자동 녹음/자동 추적이 아니라 사용자가 입력한 문서와 메모를 바탕으로 시작한다.</text>
  </g>
</svg>
