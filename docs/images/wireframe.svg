<svg width="1280" height="900" viewBox="0 0 1280 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font: 700 44px "Inter", "Segoe UI", "Malgun Gothic", sans-serif; fill: #000000; }
      .subtitle { font: 400 18px "Inter", "Segoe UI", "Malgun Gothic", sans-serif; fill: #33332e; }
      .heading { font: 700 24px "Inter", "Segoe UI", "Malgun Gothic", sans-serif; fill: #000000; }
      .section { font: 700 18px "Inter", "Segoe UI", "Malgun Gothic", sans-serif; fill: #000000; }
      .body { font: 500 15px "Inter", "Segoe UI", "Malgun Gothic", sans-serif; fill: #33332e; }
      .muted { font: 500 13px "Inter", "Segoe UI", "Malgun Gothic", sans-serif; fill: #62625b; }
      .button { font: 700 14px "Inter", "Segoe UI", "Malgun Gothic", sans-serif; fill: #ffffff; }
      .chip { font: 700 12px "Inter", "Segoe UI", "Malgun Gothic", sans-serif; fill: #000000; }
      .on-dark { font: 700 18px "Inter", "Segoe UI", "Malgun Gothic", sans-serif; fill: #ffffff; }
      .on-dark-muted { font: 500 13px "Inter", "Segoe UI", "Malgun Gothic", sans-serif; fill: rgba(255,255,255,0.78); }
    </style>
  </defs>

  <rect width="1280" height="900" fill="#fbfbf9"/>

  <g transform="translate(64 46)">
    <text class="title" x="0" y="48">모두의 뇌 와이어프레임</text>
    <text class="subtitle" x="2" y="84">입력 화면과 지식맵 결과 화면을 먼저 만들고, 실제 AI 연동은 다음 단계로 분리한다.</text>
    <rect x="1015" y="10" width="122" height="40" rx="16" fill="#e60023"/>
    <text class="button" x="1047" y="35">MVP UI</text>
  </g>

  <g transform="translate(64 150)">
    <rect x="0" y="0" width="544" height="662" rx="32" fill="#ffffff" stroke="#dadad3"/>
    <text class="heading" x="36" y="52">1. 프로젝트 자료 입력</text>
    <text class="muted" x="36" y="82">회의록, 연구 메모, 설계 피드백을 붙여넣는 화면</text>

    <g transform="translate(36 120)">
      <rect x="0" y="0" width="472" height="52" rx="16" fill="#f6f6f3" stroke="#e5e5e0"/>
      <text class="muted" x="20" y="31">프로젝트명</text>
      <text class="body" x="132" y="31">공학설계 공모전 구조 검토</text>
    </g>

    <g transform="translate(36 194)">
      <text class="section" x="0" y="0">입력 자료</text>
      <rect x="0" y="20" width="472" height="270" rx="16" fill="#f6f6f3" stroke="#e5e5e0"/>
      <text class="body" x="22" y="58">교수님 피드백: 보이드 공간은 유지하되</text>
      <text class="body" x="22" y="90">구조 보강 방식과 동선 근거를 다시 설명해야 함.</text>
      <text class="body" x="22" y="134">구조팀: 장스팬 구간 보강 필요.</text>
      <text class="body" x="22" y="166">설비팀: 천장고와 덕트 경로 충돌 가능.</text>
      <text class="body" x="22" y="210">아직 합의 안 된 질문: 보이드 우선인가,</text>
      <text class="body" x="22" y="242">시공 가능성 우선인가?</text>
    </g>

    <g transform="translate(36 522)">
      <rect x="0" y="0" width="472" height="54" rx="16" fill="#e60023"/>
      <text class="button" x="177" y="34">맥락 지식맵 만들기</text>
    </g>

    <g transform="translate(36 600)">
      <text class="muted" x="0" y="0">MVP에서는 사용자가 직접 붙여넣은 텍스트를 분석한다.</text>
    </g>
  </g>

  <g transform="translate(672 150)">
    <rect x="0" y="0" width="544" height="662" rx="32" fill="#ffffff" stroke="#dadad3"/>
    <text class="heading" x="36" y="52">2. 공유 지식맵 결과</text>
    <text class="muted" x="36" y="82">주제, 사람, 분야, 결정, 질문을 관계로 보여주는 화면</text>

    <g transform="translate(36 120)">
      <rect x="0" y="0" width="472" height="250" rx="16" fill="#262622"/>
      <circle cx="236" cy="126" r="48" fill="#e60023"/>
      <text class="on-dark" x="205" y="132">보이드</text>

      <circle cx="102" cy="72" r="36" fill="#ffffff"/>
      <text class="chip" x="78" y="77">구조팀</text>
      <line x1="136" y1="85" x2="194" y2="111" stroke="#dadad3" stroke-width="2"/>

      <circle cx="370" cy="72" r="36" fill="#ffffff"/>
      <text class="chip" x="346" y="77">설비팀</text>
      <line x1="336" y1="85" x2="278" y2="111" stroke="#dadad3" stroke-width="2"/>

      <circle cx="112" cy="190" r="40" fill="#ffffff"/>
      <text class="chip" x="85" y="195">동선 근거</text>
      <line x1="150" y1="178" x2="194" y2="145" stroke="#dadad3" stroke-width="2"/>

      <circle cx="370" cy="190" r="40" fill="#ffffff"/>
      <text class="chip" x="342" y="195">미결 질문</text>
      <line x1="335" y1="178" x2="278" y2="145" stroke="#dadad3" stroke-width="2"/>
    </g>

    <g transform="translate(36 402)">
      <text class="section" x="0" y="0">관점 차이 요약</text>
      <rect x="0" y="22" width="472" height="76" rx="16" fill="#f6f6f3" stroke="#e5e5e0"/>
      <text class="body" x="20" y="54">건축팀은 공간 경험을 우선하고, 구조팀은 장스팬</text>
      <text class="body" x="20" y="80">보강 가능성을 먼저 확인해야 한다.</text>
    </g>

    <g transform="translate(36 526)">
      <text class="section" x="0" y="0">다음 질문</text>
      <rect x="0" y="22" width="472" height="92" rx="16" fill="#f6f6f3" stroke="#e5e5e0"/>
      <text class="body" x="20" y="56">1. 보이드 크기를 줄이지 않고 보강할 수 있는가?</text>
      <text class="body" x="20" y="84">2. 설비 경로와 구조 보강안이 충돌하지 않는가?</text>
    </g>
  </g>
</svg>
