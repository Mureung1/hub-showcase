<svg xmlns="http://www.w3.org/2000/svg" width="1840" height="980" viewBox="0 0 1840 980" role="img" aria-labelledby="title desc">
  <title id="title">ICU User Flow</title>
  <desc id="desc">Today Learning Hub에서 여러 학습 모듈, 공통 실습 루프, 오답노트, 저장 흐름으로 이어지는 ICU 사용자 흐름도</desc>
  <rect width="1840" height="980" fill="#f4f6f8"/>
  <style>
    text{font-family:&quot;Malgun Gothic&quot;,&quot;Apple SD Gothic Neo&quot;,Arial,sans-serif;fill:#172033}
    .title{font-size:48px;font-weight:800;fill:#101828}
    .subtitle{font-size:22px;fill:#64748b}
    .laneTitle{font-size:20px;font-weight:700;fill:#112b5f}
    .nodeText{font-size:20px;font-weight:700;text-anchor:middle}
    .nodeSub{font-size:16px;fill:#64748b;text-anchor:middle}
    .small{font-size:15px;fill:#64748b;text-anchor:middle}
    .arrow{stroke:#112b5f;stroke-width:3;fill:none;marker-end:url(#arrow)}
    .softArrow{stroke:#64748b;stroke-width:2.5;fill:none;stroke-dasharray:8 8;marker-end:url(#softArrow)}
    .entry{fill:#ffffff;stroke:#d3dce8}
    .hub{fill:#e7f8fe;stroke:#35c8f4}
    .primary{fill:#e9f0ff;stroke:#0b4bb3}
    .module{fill:#f8fafc;stroke:#0b4bb3}
    .review{fill:#fff3e8;stroke:#ff8a1c}
    .mistake{fill:#fdf2f8;stroke:#f3b8d8}
    .store{fill:#f8fafc;stroke:#64748b}
  </style>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#112b5f"/>
    </marker>
    <marker id="softArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#64748b"/>
    </marker>
  </defs>

  <text x="70" y="72" class="title">ICU User Flow</text>
  <text x="70" y="112" class="subtitle">Today Hub에서 여러 학습 모듈로 진입하고, 실패 기록은 공통 오답노트로 모입니다.</text>

  <rect x="55" y="155" width="320" height="700" rx="8" fill="#ffffff" stroke="#d3dce8"/>
  <text x="85" y="195" class="laneTitle">1. 시작과 선택</text>
  <rect x="90" y="245" width="250" height="72" rx="8" class="entry" stroke-width="2"/>
  <text x="215" y="289" class="nodeText">ICU 실행</text>
  <rect x="90" y="385" width="250" height="96" rx="8" class="hub" stroke-width="3"/>
  <text x="215" y="423" class="nodeText">Today Learning Hub</text>
  <text x="215" y="453" class="nodeSub">오늘 할 일 확인</text>
  <path d="M215 525 L330 600 L215 675 L100 600 Z" class="entry" stroke-width="2"/>
  <text x="215" y="593" class="nodeText">사용자 선택</text>
  <text x="215" y="624" class="nodeSub">시작 / 이어하기 / 전체보기</text>

  <rect x="425" y="155" width="360" height="700" rx="8" fill="#fbfcfe" stroke="#d3dce8"/>
  <text x="455" y="195" class="laneTitle">2. 학습 진입</text>
  <rect x="475" y="245" width="260" height="86" rx="8" class="primary" stroke-width="2"/>
  <text x="605" y="282" class="nodeText">학습 목표 입력</text>
  <text x="605" y="310" class="nodeSub">배우고 싶은 내용 작성</text>
  <rect x="475" y="405" width="260" height="86" rx="8" class="primary" stroke-width="2"/>
  <text x="605" y="442" class="nodeText">AI 커리큘럼 제안</text>
  <text x="605" y="470" class="nodeSub">오늘 순서와 첫 미션</text>
  <rect x="450" y="565" width="310" height="108" rx="8" class="primary" stroke-width="3"/>
  <text x="605" y="604" class="nodeText">학습 모듈 진입</text>
  <text x="605" y="634" class="nodeSub">오늘 큐 / 학습 목록 / 다시 풀기</text>

  <rect x="835" y="155" width="360" height="700" rx="8" fill="#ffffff" stroke="#d3dce8"/>
  <text x="865" y="195" class="laneTitle">3. 학습 모듈</text>
  <rect x="885" y="230" width="260" height="86" rx="8" class="module" stroke-width="2"/>
  <text x="1015" y="266" class="nodeText">Workspace IDE</text>
  <text x="1015" y="294" class="nodeSub">React / Python / FastAPI</text>
  <rect x="885" y="365" width="260" height="86" rx="8" class="module" stroke-width="2"/>
  <text x="1015" y="401" class="nodeText">Git Lab</text>
  <text x="1015" y="429" class="nodeSub">Git 명령 시뮬레이터</text>
  <rect x="885" y="500" width="260" height="92" rx="8" class="module" stroke-width="2"/>
  <text x="1015" y="536" class="nodeText">추가 학습 모듈</text>
  <text x="1015" y="564" class="nodeSub">알고리즘 / API / 프로젝트</text>
  <rect x="885" y="660" width="260" height="86" rx="8" class="module" stroke-width="3"/>
  <text x="1015" y="696" class="nodeText">실습 / 퀴즈 / 실행</text>
  <text x="1015" y="724" class="nodeSub">모듈별 실패를 같은 방식으로 처리</text>

  <rect x="1245" y="155" width="260" height="700" rx="8" fill="#fbfcfe" stroke="#d3dce8"/>
  <text x="1275" y="195" class="laneTitle">4. 결과 처리</text>
  <path d="M1375 300 L1490 375 L1375 450 L1260 375 Z" class="module" stroke-width="2"/>
  <text x="1375" y="369" class="nodeText">통과했나요?</text>
  <text x="1375" y="399" class="nodeSub">성공 / 실패 분기</text>
  <rect x="1265" y="555" width="220" height="86" rx="8" class="module" stroke-width="2"/>
  <text x="1375" y="591" class="nodeText">피드백 / 리뷰</text>
  <text x="1375" y="619" class="nodeSub">다음 단계 추천</text>

  <rect x="1555" y="155" width="230" height="700" rx="8" fill="#ffffff" stroke="#d3dce8"/>
  <text x="1585" y="195" class="laneTitle">5. 오답과 저장</text>
  <rect x="1580" y="245" width="180" height="92" rx="8" class="mistake" stroke-width="2"/>
  <text x="1670" y="282" class="nodeText">오답 저장</text>
  <text x="1670" y="312" class="nodeSub">source + lessonId</text>
  <rect x="1570" y="410" width="200" height="100" rx="8" class="mistake" stroke-width="3"/>
  <text x="1670" y="447" class="nodeText">오답노트 목록</text>
  <text x="1670" y="476" class="nodeSub">필터 / 상태 관리</text>
  <rect x="1580" y="600" width="180" height="86" rx="8" class="mistake" stroke-width="2"/>
  <text x="1670" y="637" class="nodeText">다시 풀기</text>
  <text x="1670" y="665" class="nodeSub">출처 모듈로 복귀</text>

  <rect x="690" y="875" width="270" height="68" rx="8" class="store" stroke-width="2"/>
  <text x="825" y="902" class="nodeText">localStorage</text>
  <text x="825" y="927" class="nodeSub">학습 진행률 / 오답</text>
  <rect x="1025" y="875" width="300" height="68" rx="8" class="store" stroke-width="2"/>
  <text x="1175" y="902" class="nodeText">향후 Supabase</text>
  <text x="1175" y="927" class="nodeSub">프로필 / 진행률 / 오답 동기화</text>

  <path d="M215 317 C215 345 215 355 215 385" class="arrow"/>
  <path d="M215 481 C215 505 215 505 215 525" class="arrow"/>
  <path d="M330 600 C390 600 410 288 475 288" class="arrow"/>
  <text x="392" y="280" class="small">새 목표</text>
  <path d="M330 600 C380 600 400 618 450 618" class="arrow"/>
  <text x="390" y="640" class="small">이어서 학습</text>
  <path d="M605 331 L605 405" class="arrow"/>
  <path d="M605 491 L605 565" class="arrow"/>
  <path d="M760 618 C815 610 835 274 885 274" class="arrow"/>
  <path d="M760 618 C820 610 835 409 885 409" class="arrow"/>
  <path d="M760 618 C820 615 835 546 885 546" class="softArrow"/>
  <path d="M1015 316 L1015 365" class="arrow"/>
  <path d="M1015 451 L1015 500" class="arrow"/>
  <path d="M1015 592 L1015 660" class="arrow"/>
  <path d="M1145 703 C1190 700 1220 375 1260 375" class="arrow"/>
  <path d="M1490 375 C1530 375 1538 292 1580 292" class="arrow"/>
  <text x="1535" y="340" class="small">아니요</text>
  <path d="M1375 450 L1375 555" class="arrow"/>
  <text x="1412" y="512" class="small">예</text>
  <path d="M1485 598 C1515 598 1548 460 1570 460" class="arrow"/>
  <path d="M1670 337 L1670 410" class="arrow"/>
  <path d="M1670 510 L1670 600" class="arrow"/>
  <path d="M1580 643 C1280 850 840 745 760 618" class="arrow"/>
  <text x="1370" y="828" class="small">다시 풀기는 출처 모듈로 복귀</text>
  <path d="M1375 641 C1300 800 930 805 825 875" class="softArrow"/>
  <path d="M1580 292 C1410 820 970 805 825 875" class="softArrow"/>
  <path d="M960 909 L1025 909" class="softArrow"/>
  <path d="M825 875 C690 805 375 760 300 675" class="softArrow"/>
</svg>