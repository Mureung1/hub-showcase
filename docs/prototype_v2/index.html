<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>① 정보 입력 - 프로토타입 v2</title>
<link rel="stylesheet" href="../variables.css">
<link rel="stylesheet" href="./style.css">
</head>
<body>
<div class="page">

  <ul class="steps">
    <li><a class="active" href="./index.html"><span class="num">1</span>정보 입력</a></li>
    <li><a href="./list.html"><span class="num">2</span>추천 목록</a></li>
    <li><a href="./detail-1.html"><span class="num">3</span>공고 상세</a></li>
    <li><a href="./draft-1.html"><span class="num">4</span>자소서 초안</a></li>
  </ul>

  <div class="card">
    <p class="label">STEP 1</p>
    <h1 class="title-display">내 정보를 입력해주세요</h1>
    <p class="subtitle">입력한 정보를 바탕으로 맞춤 공고를 추천해드려요.</p>
    <p class="note">※ 전공·학점 아래 빨간 안내문은 실제 입력 여부와 무관하게, 필수값을 비워둔 채 제출했을 때 보이는 화면을 예시로 고정 표시한 것입니다.</p>

    <form>
      <div class="field">
        <label for="major">전공</label>
        <input class="field-input has-error" type="text" id="major" name="major" placeholder="예: 컴퓨터공학과">
        <p class="error-text">필수 항목입니다</p>
      </div>

      <div class="field">
        <label for="minor">부전공 <span class="hint">(선택)</span></label>
        <input class="field-input" type="text" id="minor" name="minor" placeholder="예: 경영학과">
      </div>

      <div class="field">
        <label for="gpa">학점</label>
        <input class="field-input has-error" type="text" id="gpa" name="gpa" placeholder="예: 3.8 / 4.5">
        <p class="error-text">필수 항목입니다</p>
      </div>

      <div class="field">
        <label>자격증</label>
        <div class="field-row">
          <input class="field-input" type="text" placeholder="예: 정보처리기사">
        </div>
        <div class="field-row">
          <input class="field-input" type="text" placeholder="예: TOEIC 900">
        </div>
        <span class="btn-ghost">+ 자격증 추가</span>
      </div>

      <div class="field">
        <label for="experience">그 외 경험 <span class="hint">(현장실습 · 인턴 · 교육 등)</span></label>
        <textarea class="field-input" id="experience" name="experience" placeholder="예: OO기업 하계 현장실습 2개월, 교내 창업 동아리 활동"></textarea>
      </div>

      <a class="btn-primary btn-block" href="./list.html">추천받기</a>
    </form>
  </div>

</div>
</body>
</html>
