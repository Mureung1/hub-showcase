<svg viewBox="0 0 880 920" xmlns="http://www.w3.org/2000/svg" font-family="Pretendard, -apple-system, BlinkMacSystemFont, 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#B4451F"/>
    </marker>
  </defs>

  <rect width="880" height="920" fill="#FAFAFA"/>

  <!-- ===== HEADER ===== -->
  <rect x="0" y="0" width="880" height="104" fill="#FFFFFF"/>
  <line x1="0" y1="104" x2="880" y2="104" stroke="#E3E7EB" stroke-width="1"/>
  <text x="40" y="36" font-size="14" font-weight="700" fill="#16202B">논문 브리핑</text>
  <text x="122" y="36" font-size="11.5" fill="#98A3AE">arXiv를 읽고 스스로 판단하는 에이전트</text>

  <rect x="40" y="54" width="620" height="34" rx="6" fill="#FFFFFF" stroke="#C9D2DA" stroke-width="1.3"/>
  <text x="54" y="76" font-size="12.5" fill="#16202B">LLM agent의 최근 planning 연구</text>
  <rect x="672" y="54" width="88" height="34" rx="6" fill="#16202B"/>
  <text x="716" y="76" font-size="12.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">브리핑</text>

  <!-- ===== TIMELINE RAIL ===== -->
  <line x1="62" y1="140" x2="62" y2="850" stroke="#DDE3E9" stroke-width="1.5"/>

  <!-- --- entry: search --- -->
  <circle cx="62" cy="148" r="4" fill="#C1CAD3"/>
  <text x="86" y="152" font-size="11.5" fill="#8A96A2">arXiv 검색 — cs.CL · cs.AI · cs.LG</text>

  <!-- --- entry: found --- -->
  <circle cx="62" cy="182" r="4" fill="#C1CAD3"/>
  <text x="86" y="186" font-size="11.5" fill="#8A96A2">12편 발견</text>

  <!-- --- JUDGE BLOCK (하이라이트 1) --- -->
  <circle cx="62" cy="228" r="5.5" fill="#2563A8"/>
  <rect x="86" y="212" width="754" height="146" rx="7" fill="#F1F6FB" stroke="#C3D7EA" stroke-width="1.2"/>
  <rect x="86" y="212" width="3.5" height="146" rx="2" fill="#2563A8"/>

  <text x="106" y="236" font-size="12.5" font-weight="700" fill="#2563A8">중요도 판단</text>
  <text x="180" y="236" font-size="12.5" fill="#16202B">12편 중 <tspan font-weight="700">4편</tspan> 선별 · 8편 제외</text>

  <text x="106" y="264" font-size="11.5" fill="#4A5966">✓ Tree-of-Agents: Hierarchical Planning...</text>
  <text x="106" y="282" font-size="10.5" fill="#8A96A2">　 planning에 계층 구조를 도입한 새 방법론. 핵심 주제와 직결.</text>

  <text x="106" y="308" font-size="11.5" fill="#4A5966">✓ Self-Refine Planning with Verifier Feedback...</text>
  <text x="106" y="326" font-size="10.5" fill="#8A96A2">　 검증 피드백 기반 계획 수정. planning + reflexion 교차 지점.</text>

  <text x="106" y="348" font-size="10.5" fill="#B4451F">✕ 제외된 8편 보기 — 제외 사유 포함</text>
  <line x1="106" y1="352" x2="252" y2="352" stroke="#B4451F" stroke-width="0.8" stroke-dasharray="2 2"/>

  <!-- 주석: 신뢰의 근거 -->
  <path d="M 862 240 L 862 300" fill="none" stroke="#B4451F" stroke-width="1.2"/>
  <path d="M 862 300 L 848 300" fill="none" stroke="#B4451F" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="868" y="252" font-size="9.5" font-weight="700" fill="#B4451F" transform="rotate(90 868 252)">신뢰의 근거 — 지우지 마세요</text>

  <!-- --- PAPER CARD 1 --- -->
  <circle cx="62" cy="392" r="4" fill="#2E7D5B"/>
  <rect x="86" y="376" width="754" height="152" rx="7" fill="#FFFFFF" stroke="#DDE3E9" stroke-width="1.3"/>

  <rect x="106" y="394" width="86" height="19" rx="9.5" fill="#EDF6F1"/>
  <text x="149" y="407" font-size="9.5" font-weight="600" fill="#2E7D5B" text-anchor="middle">본문까지 읽음</text>
  <text x="204" y="407" font-size="9.5" fill="#98A3AE">arXiv 2506.14231 · 2026-06-18</text>

  <text x="106" y="434" font-size="14" font-weight="700" fill="#16202B">Tree-of-Agents: Hierarchical Planning for Long-Horizon LLM Agents</text>

  <text x="106" y="460" font-size="11.5" fill="#4A5966">기여 · 긴 작업을 상위 계획과 하위 실행으로 분리하는 계층적 에이전트 구조를 제안.</text>
  <text x="106" y="480" font-size="11.5" fill="#4A5966">방법 · 상위 플래너가 목표를 하위 작업으로 분해하고, 실패 시 상위로 되돌려 재계획.</text>
  <text x="106" y="500" font-size="11.5" fill="#4A5966">결과 · WebArena에서 단일 에이전트 대비 성공률 18%p 상승. 다만 비용은 2.3배.</text>

  <text x="700" y="500" font-size="10.5" fill="#2563A8">원문 초록 ▾　arXiv ↗</text>

  <!-- --- RETRY (하이라이트 2) --- -->
  <circle cx="62" cy="562" r="4.5" fill="#B07A18"/>
  <rect x="86" y="546" width="754" height="34" rx="6" fill="#FDF7EC" stroke="#E8D5A8" stroke-width="1.1"/>
  <text x="106" y="567" font-size="11" font-weight="600" fill="#B07A18">요약 보완 중 (1회)</text>
  <text x="196" y="567" font-size="11" fill="#8A7440">스스로 검증한 결과 — 실험 설정 설명이 누락됨</text>

  <!-- --- PAPER CARD 2 --- -->
  <circle cx="62" cy="614" r="4" fill="#2E7D5B"/>
  <rect x="86" y="598" width="754" height="132" rx="7" fill="#FFFFFF" stroke="#DDE3E9" stroke-width="1.3"/>

  <rect x="106" y="616" width="94" height="19" rx="9.5" fill="#F3F5F7"/>
  <text x="153" y="629" font-size="9.5" font-weight="600" fill="#7A8896" text-anchor="middle">초록으로 충분</text>
  <text x="212" y="629" font-size="9.5" fill="#98A3AE">arXiv 2506.11907 · 2026-06-15</text>

  <text x="106" y="656" font-size="14" font-weight="700" fill="#16202B">Self-Refine Planning with Verifier Feedback</text>
  <text x="106" y="682" font-size="11.5" fill="#4A5966">기여 · 계획 단계에 검증자를 붙여, 실행 전에 계획 자체를 수정하는 구조를 제안.</text>
  <text x="106" y="702" font-size="11.5" fill="#4A5966">방법 · 별도 verifier 모델이 계획의 실행 가능성을 평가하고 피드백을 반환.</text>

  <!-- --- CURRENT STATUS --- -->
  <circle cx="62" cy="768" r="7" fill="none" stroke="#2563A8" stroke-width="2"/>
  <circle cx="62" cy="768" r="3.5" fill="#2563A8"/>
  <text x="86" y="765" font-size="12.5" font-weight="600" fill="#2563A8">논문 3 / 4 읽는 중</text>
  <text x="86" y="784" font-size="10.5" fill="#8A96A2">'Memory-Augmented Planning...' — 본문까지 읽는 중</text>

  <!-- --- 남은 순서 (예고) --- -->
  <circle cx="62" cy="826" r="4" fill="#FFFFFF" stroke="#DDE3E9" stroke-width="1.5"/>
  <text x="86" y="830" font-size="11" fill="#C1CAD3">트렌드 종합 — 4편을 관통하는 흐름 정리</text>

  <!-- ===== FOOTER NOTE ===== -->
  <line x1="40" y1="866" x2="840" y2="866" stroke="#E3E7EB" stroke-width="1"/>
  <text x="40" y="890" font-size="11" fill="#8A96A2">시각적 위계가 레이아웃을 대신합니다 — <tspan fill="#C1CAD3">과정은 작고 흐리게</tspan>, <tspan font-weight="700" fill="#16202B">결과는 크고 선명하게</tspan>. 훑으면 결과만, 들여다보면 근거까지 읽힙니다.</text>
  <text x="40" y="908" font-size="11" fill="#8A96A2">작업이 끝나도 이 기록은 사라지지 않습니다. 연구자는 '왜 이 4편인가'를 되짚을 수 있어야 결과를 신뢰합니다.</text>
</svg>
