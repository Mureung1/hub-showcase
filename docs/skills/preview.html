<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>Design Preview (Toss tone)</title>
<style>
  :root {
    --font-family-base: "Pretendard", -apple-system, BlinkMacSystemFont,
      "Apple SD Gothic Neo", "Noto Sans KR", "Segoe UI", Roboto,
      "Helvetica Neue", Arial, sans-serif;

    --color-primary-50: #E8F3FF;
    --color-primary-500: #3182F6;
    --color-primary-600: #1B64DA;
    --color-primary: var(--color-primary-500);
    --color-primary-hover: var(--color-primary-600);
    --color-primary-light: var(--color-primary-50);

    --color-success: #18A5A5;
    --color-danger: #F04452;
    --color-warning: #FFB020;

    --color-bg-page: #FFFFFF;
    --color-bg-section: #F9FAFB;
    --color-bg-subtle: #F5F6F8;
    --color-bg-muted: #F2F4F6;
    --color-bg-surface: #FFFFFF;

    --color-text-strong: #191F28;
    --color-text-primary: #333D4B;
    --color-text-secondary: #4E5968;
    --color-text-tertiary: #6B7684;
    --color-text-muted: #8B95A1;
    --color-text-disabled: #B0B8C1;
    --color-text-inverse: #FFFFFF;

    --color-border-subtle: #E5E8EB;
    --color-border-muted: #D1D6DB;

    --radius-xs: 6px;
    --radius-sm: 8px;
    --radius-md: 12px;
    --radius-lg: 16px;
    --radius-xl: 22px;
    --radius-2xl: 28px;
    --radius-pill: 999px;

    --space-1: 4px;
    --space-2: 8px;
    --space-3: 12px;
    --space-4: 16px;
    --space-5: 20px;
    --space-6: 24px;
    --space-8: 32px;
    --space-10: 40px;
    --space-12: 48px;
    --space-16: 64px;
    --space-20: 80px;

    --card-padding: var(--space-6);
    --card-gap: var(--space-4);
    --grid-gap: var(--space-6);
    --section-padding-y: 120px;
    --container-max: 1140px;
    --container-padding-mobile: 24px;
    --container-padding-desktop: 48px;

    --font-size-caption: 13px;
    --font-size-nav: 15px;
    --font-size-body: 16px;
    --font-size-body-lg: 20px;
    --font-size-title-sm: 24px;
    --font-size-title-md: 32px;
    --font-size-title-lg: 48px;
    --font-size-display: 72px;

    --line-height-tight: 1.2;
    --line-height-base: 1.5;
    --line-height-comfy: 1.6;
    --line-height-display: 1.3;

    --font-weight-regular: 400;
    --font-weight-medium: 500;
    --font-weight-bold: 700;
    --font-weight-heavy: 800;

    --nav-height: 60px;
    --button-height-sm: 44px;
    --button-height-md: 52px;
    --button-height-lg: 74px;

    --card-bg: var(--color-bg-surface);
    --card-radius: var(--radius-lg);
    --card-shadow: 0 8px 24px rgba(0, 19, 43, 0.08);

    --duration-fast: 120ms;
    --duration-base: 180ms;
    --ease-out: cubic-bezier(0.2, 0, 0, 1);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--color-bg-page);
    font-family: var(--font-family-base);
    color: var(--color-text-primary);
  }

  /* ===== Nav ===== */
  .nav {
    height: var(--nav-height);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-inline: var(--container-padding-desktop);
    background: rgba(255, 255, 255, 0.92);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--color-border-subtle);
    position: sticky;
    top: 0;
  }

  .nav-logo {
    font-weight: var(--font-weight-heavy);
    font-size: var(--font-size-body-lg);
    color: var(--color-text-strong);
  }

  .nav-links {
    display: flex;
    gap: var(--space-2);
  }

  .nav-link {
    display: inline-flex;
    align-items: center;
    min-height: 44px;
    padding: 12px 10px;
    border-radius: var(--radius-xs);
    color: var(--color-text-secondary);
    font-size: var(--font-size-nav);
    line-height: 20px;
    text-decoration: none;
    transition: background-color var(--duration-base) var(--ease-out);
  }

  .nav-link:hover { background: var(--color-bg-subtle); }
  .nav-link.active { color: var(--color-text-primary); font-weight: var(--font-weight-bold); }

  /* ===== Hero ===== */
  .hero {
    padding: var(--space-20) var(--container-padding-desktop);
    max-width: var(--container-max);
    margin-inline: auto;
    text-align: center;
  }

  .hero-title {
    font-size: var(--font-size-title-lg);
    line-height: var(--line-height-display);
    font-weight: var(--font-weight-bold);
    color: var(--color-text-strong);
    margin: 0 0 var(--space-4);
  }

  .hero-desc {
    font-size: var(--font-size-body-lg);
    line-height: var(--line-height-comfy);
    color: var(--color-text-secondary);
    margin: 0 0 var(--space-8);
  }

  /* ===== Button ===== */
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: var(--space-2);
    border: 0;
    min-height: var(--button-height-sm);
    padding: 12px 22px;
    border-radius: var(--radius-pill);
    font-family: var(--font-family-base);
    font-size: var(--font-size-body);
    font-weight: var(--font-weight-bold);
    line-height: var(--line-height-tight);
    cursor: pointer;
    transition: background-color var(--duration-base) var(--ease-out),
      transform var(--duration-fast) var(--ease-out);
  }

  .btn-primary {
    color: var(--color-text-inverse);
    background: var(--color-primary);
  }
  .btn-primary:hover { background: var(--color-primary-hover); }
  .btn-primary:active { transform: translateY(1px); }

  .btn-secondary {
    color: var(--color-text-primary);
    background: var(--color-bg-surface);
    border: 1px solid var(--color-border-subtle);
    border-radius: var(--radius-xl);
  }

  /* ===== Feature section ===== */
  .feature-section {
    background: var(--color-bg-section);
    padding-block: var(--section-padding-y);
  }

  .feature-heading {
    max-width: 760px;
    margin: 0 auto var(--space-10);
    text-align: center;
    color: var(--color-text-strong);
    font-size: var(--font-size-title-md);
    line-height: var(--line-height-comfy);
    font-weight: var(--font-weight-bold);
  }

  .feature-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: var(--grid-gap);
    max-width: var(--container-max);
    margin-inline: auto;
    padding-inline: var(--container-padding-desktop);
  }

  .card {
    background: var(--card-bg);
    border-radius: var(--card-radius);
    box-shadow: var(--card-shadow);
    padding: var(--card-padding);
    display: flex;
    flex-direction: column;
    gap: var(--space-2);
    transition: box-shadow var(--duration-base) var(--ease-out),
      transform var(--duration-base) var(--ease-out);
  }

  .card:hover {
    transform: translateY(-2px);
  }

  .card-badge {
    display: inline-block;
    width: fit-content;
    font-size: var(--font-size-caption);
    font-weight: var(--font-weight-bold);
    color: var(--color-primary);
    background: var(--color-primary-light);
    border-radius: var(--radius-xs);
    padding: 4px var(--space-2);
    margin-bottom: var(--space-2);
  }

  .card-title {
    font-size: 20px;
    line-height: 1.45;
    font-weight: var(--font-weight-bold);
    color: var(--color-text-primary);
  }

  .card-desc {
    font-size: 15px;
    line-height: var(--line-height-base);
    color: var(--color-text-tertiary);
  }

  /* ===== Form ===== */
  .form-section {
    max-width: 480px;
    margin: 0 auto;
    padding: var(--space-20) var(--container-padding-desktop);
  }

  .input {
    width: 100%;
    height: var(--button-height-md);
    padding: 0 var(--space-4);
    border: 0;
    border-radius: var(--radius-md);
    background: var(--color-bg-muted);
    color: var(--color-text-primary);
    font-family: var(--font-family-base);
    font-size: var(--font-size-body);
    outline: none;
    margin-bottom: var(--space-4);
    transition: background-color var(--duration-base) var(--ease-out),
      box-shadow var(--duration-base) var(--ease-out);
  }

  .input::placeholder { color: var(--color-text-disabled); }

  .input:focus {
    box-shadow: 0 0 0 3px var(--color-primary-light);
    background: var(--color-bg-surface);
  }
</style>
</head>
<body>
  <nav class="nav">
    <div class="nav-logo">약속조율</div>
    <div class="nav-links">
      <a class="nav-link active" href="#">홈</a>
      <a class="nav-link" href="#">약속 만들기</a>
      <a class="nav-link" href="#">내 약속</a>
    </div>
  </nav>

  <section class="hero">
    <h1 class="hero-title">모두의 시간을<br />가장 쉽게 맞추는 방법</h1>
    <p class="hero-desc">선호 시간을 투표하면, 가장 많은 사람이 가능한 시간을 자동으로 추천해드려요.</p>
    <button class="btn btn-primary">약속 만들기</button>
  </section>

  <section class="feature-section">
    <h2 class="feature-heading">약속 조율, 이렇게 진행돼요</h2>
    <div class="feature-grid">
      <div class="card">
        <span class="card-badge">Step 1</span>
        <div class="card-title">약속 링크 만들기</div>
        <div class="card-desc">후보 날짜와 시간을 정하고 링크를 만들어 참여자에게 공유하세요.</div>
      </div>
      <div class="card">
        <span class="card-badge">Step 2</span>
        <div class="card-title">투표 참여하기</div>
        <div class="card-desc">참여자는 로그인 없이 링크만으로 가능한 시간에 투표할 수 있어요.</div>
      </div>
      <div class="card">
        <span class="card-badge">Step 3</span>
        <div class="card-title">최적 시간 확인</div>
        <div class="card-desc">가장 많은 인원이 가능한 시간을 자동으로 계산해 추천해드려요.</div>
      </div>
    </div>
  </section>

  <section class="form-section">
    <h2 class="feature-heading" style="text-align:left; font-size: var(--font-size-title-sm); margin-bottom: var(--space-6);">약속 만들기</h2>
    <input class="input" type="text" placeholder="약속 이름을 입력하세요" />
    <input class="input" type="text" placeholder="장소 (선택)" />
    <button class="btn btn-primary" style="width:100%;">다음</button>
  </section>
</body>
</html>
