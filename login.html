<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>로그인 - ShopEase</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="container">
    <header class="topbar">
      <div class="logo"><span class="logo-mark">S</span>ShopEase</div>
      <nav class="menu-links">
        <a href="shopping_site.html">홈으로</a>
      </nav>
    </header>

    <section class="form-card">
      <h1>로그인</h1>
      <p>ShopEase 계정으로 로그인하면 더 빠르게 주문할 수 있습니다.</p>
      <form action="account.html" method="get">
        <div class="form-field">
          <label for="email">이메일</label>
          <input id="email" name="email" type="email" placeholder="example@domain.com" required />
        </div>
        <div class="form-field">
          <label for="password">비밀번호</label>
          <input id="password" name="password" type="password" placeholder="비밀번호를 입력하세요" required />
        </div>
        <button type="submit" class="primary">로그인</button>
      </form>
      <p class="link-row">아직 계정이 없으신가요? <a href="signup.html">회원가입</a></p>
    </section>
  </div>
</body>
</html>
