<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShortsGen - 대시보드 홈</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <aside class="sidebar">
        <div class="logo">ShortsGen</div>
        <nav class="nav-menu">
            <a href="dashboard.html" class="nav-link active">대시보드 홈</a>
            <a href="pipeline.html" class="nav-link">릴스 생성 파이프라인</a>
            <a href="#" class="nav-link">내 보관함</a>
            <a href="#" class="nav-link">설정</a>
        </nav>
    </aside>

    <div class="main-wrapper">
        <header class="header">
            <h1 class="header-title">대시보드 홈</h1>
        </header>

        <main class="content">
            <!-- Block 1: Store Information -->
            <div class="block">
                <h2 class="block-title">매장 정보 설정</h2>
                <div class="grid-2">
                    <div class="form-group">
                        <label class="form-label">매장 이름</label>
                        <input type="text" class="form-input" value="연남동 빵실이">
                    </div>
                    <div class="form-group">
                        <label class="form-label">대표자명</label>
                        <input type="text" class="form-input" value="김사장">
                    </div>
                    <div class="form-group">
                        <label class="form-label">연락처</label>
                        <input type="text" class="form-input" value="010-1234-5678">
                    </div>
                    <div class="form-group">
                        <label class="form-label">위치 (로컬 정보)</label>
                        <input type="text" class="form-input" value="서울시 마포구 연남동">
                    </div>
                </div>

                <!-- 업종 카테고리 (직접 입력 포함) -->
                <div class="form-group">
                    <label class="form-label">업종 카테고리</label>
                    <div style="display: flex; gap: 12px;">
                        <select id="categorySelect" class="form-input" style="flex: 1;">
                            <option value="bakery" selected>베이커리 카페</option>
                            <option value="meat">고기집/삼겹살</option>
                            <option value="nail">네일/뷰티샵</option>
                            <option value="custom">직접 입력하기</option>
                        </select>
                        <input type="text" id="customCategoryInput" class="form-input" placeholder="업종을 직접 입력하세요" style="display: none; flex: 2;">
                    </div>
                </div>

                <!-- 핵심 주력 상품 -->
                <div class="form-group" style="margin-bottom: 24px;">
                    <label class="form-label">핵심 주력 상품 (가장 홍보하고 싶은 메뉴나 특징)</label>
                    <input type="text" class="form-input" placeholder="예: 프랑스산 최고급 버터를 사용한 소금빵">
                </div>

                <button class="btn btn-secondary" style="width: auto; padding: 12px 24px;" onclick="alert('가게 정보가 안전하게 DB에 저장되었습니다!')">정보 저장하기</button>
            </div>

            <!-- Block 2: Trend Analysis -->
            <div class="block">
                <h2 class="block-title">트렌드 분석 및 추천 해시태그</h2>
                <p class="block-subtitle">트렌드와 최근 틱톡/릴스 분석을 기반으로 해시태그를 제공합니다.</p>
                
                <h3 class="section-title">최근 트렌드 (<span id="trendTargetText">디저트</span> 관련 검색량)</h3>
                <div class="chart-container">
                    <canvas id="trendChart"></canvas>
                </div>

                <h3 class="section-title">해시태그 키워드</h3>
                <div class="hashtag-container" id="hashtagContainer"></div>

                <div style="margin-top: 16px;">
                    <a href="pipeline.html" class="btn">이 트렌드로 AI 릴스 생성하기 ➔</a>
                </div>
            </div>
        </main>
    </div>

    <!-- Script for Dynamic Features -->
    <script>
        const categorySelect = document.getElementById('categorySelect');
        const customCategoryInput = document.getElementById('customCategoryInput');
        const trendTargetText = document.getElementById('trendTargetText');
        const hashtagContainer = document.getElementById('hashtagContainer');
        const ctx = document.getElementById('trendChart').getContext('2d');

        const colors = [
            { bg: '#3B82F6', text: '#FFFFFF' }, { bg: '#DBEAFE', text: '#1E3A8A' },
            { bg: '#D1FAE5', text: '#065F46' }, { bg: '#E0E7FF', text: '#3730A3' },
            { bg: '#A7F3D0', text: '#065F46' },
        ];

        const industryData = {
            bakery: {
                targetName: '디저트',
                chartData: [20, 35, 45, 75, 65, 90],
                hashtags: ['#디저트', '#카페투어', '#맛집추천', '#소상공인', '#마케팅', '#단국', '#카페', '#디저트맛집', '#크루아상', '#빵지순례']
            },
            meat: {
                targetName: '고기/회식',
                chartData: [10, 40, 30, 80, 100, 120],
                hashtags: ['#고기먹방', '#삼겹살맛집', '#회식장소', '#소상공인', '#마케팅', '#연남동고기', '#먹스타그램', '#고기ASMR']
            },
            nail: {
                targetName: '뷰티/네일',
                chartData: [50, 60, 55, 70, 85, 110],
                hashtags: ['#이달의아트', '#시럽네일', '#기분전환', '#소상공인', '#마케팅', '#네일디자인', '#봄네일', '#뷰티샵']
            },
            custom: {
                targetName: '입력된 업종',
                chartData: [10, 10, 20, 30, 45, 60],
                hashtags: ['#신규오픈', '#동네맛집', '#소상공인', '#마케팅', '#트렌드', '#요즘핫플']
            }
        };

        let trendChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: ['0일', '1일', '2일', '3일', '4일', '5일'],
                datasets: [{
                    label: '검색량 추이',
                    data: industryData.bakery.chartData,
                    borderColor: '#3B82F6',
                    backgroundColor: 'rgba(59, 130, 246, 0.1)',
                    borderWidth: 2, fill: true, tension: 0.3, pointRadius: 0
                }]
            },
            options: {
                responsive: true, maintainAspectRatio: false,
                scales: { y: { beginAtZero: true, max: 120, ticks: { stepSize: 30 } } },
                plugins: { legend: { display: false } }
            }
        });

        function renderHashtags(tags) {
            hashtagContainer.innerHTML = '';
            tags.forEach((tag, index) => {
                const colorObj = colors[index % colors.length];
                const pill = document.createElement('div');
                pill.className = 'hashtag-pill';
                pill.textContent = tag;
                pill.style.backgroundColor = colorObj.bg;
                pill.style.color = colorObj.text;
                hashtagContainer.appendChild(pill);
            });
        }

        renderHashtags(industryData.bakery.hashtags);

        categorySelect.addEventListener('change', (e) => {
            const selected = e.target.value;
            
            if (selected === 'custom') {
                customCategoryInput.style.display = 'block';
                customCategoryInput.focus();
            } else {
                customCategoryInput.style.display = 'none';
            }

            const data = industryData[selected];
            trendTargetText.textContent = data.targetName;
            trendChart.data.datasets[0].data = data.chartData;
            trendChart.update();
            renderHashtags(data.hashtags);
        });

        // Update custom target name based on typing
        customCategoryInput.addEventListener('keyup', (e) => {
            const val = e.target.value;
            trendTargetText.textContent = val ? val : '입력된 업종';
        });
    </script>
</body>
</html>
