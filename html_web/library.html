<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShortsGen - 내 보관함</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <aside class="sidebar">
        <div class="logo">ShortsGen</div>
        <nav class="nav-menu">
            <a href="dashboard.html" class="nav-link">대시보드 홈</a>
            <a href="pipeline.html" class="nav-link">릴스 생성 파이프라인</a>
            <a href="library.html" class="nav-link active">내 보관함</a>
            <a href="#" class="nav-link">설정</a>
        </nav>
    </aside>

    <div class="main-wrapper">
        <header class="header">
            <h1 class="header-title">내 보관함</h1>
        </header>

        <main class="content">
            
            <!-- Saved Templates -->
            <div class="block" style="margin-bottom: 32px;">
                <h2 class="block-title">저장된 기획 템플릿</h2>
                <p class="block-subtitle">성공적이었던 기획 방향성 세팅을 원클릭으로 불러오세요.</p>
                
                <div style="display: flex; gap: 16px; flex-wrap: wrap;">
                    <div style="border: 1px solid var(--primary-color); background-color: #EFF6FF; padding: 20px; border-radius: 16px; flex: 1; min-width: 250px;">
                        <h3 style="font-size: 16px; color: var(--primary-color); margin-bottom: 8px;">🔥 마감 세일용 세팅</h3>
                        <p style="font-size: 13px; color: var(--text-muted); margin-bottom: 16px;">#이벤트 #활기찬 #마감할인</p>
                        <button class="btn" style="padding: 10px; font-size: 14px;">이 세팅으로 바로 생성 ➔</button>
                    </div>
                    <div style="border: 1px solid var(--border-color); padding: 20px; border-radius: 16px; flex: 1; min-width: 250px;">
                        <h3 style="font-size: 16px; color: var(--text-main); margin-bottom: 8px;">✨ 신메뉴 감성 홍보</h3>
                        <p style="font-size: 13px; color: var(--text-muted); margin-bottom: 16px;">#신메뉴출시 #감성적인 #시그니처</p>
                        <button class="btn btn-secondary" style="padding: 10px; font-size: 14px;">불러오기</button>
                    </div>
                </div>
            </div>

            <!-- Video History -->
            <div class="block">
                <h2 class="block-title">과거 생성된 릴스 히스토리</h2>
                <p class="block-subtitle">이전에 AI가 만들어준 영상들을 다시 확인하고 다운로드할 수 있습니다.</p>
                
                <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 24px; margin-top: 24px;">
                    <!-- Video Card 1 -->
                    <div style="display: flex; flex-direction: column; gap: 12px;">
                        <div style="aspect-ratio: 9/16; background-color: #FFF3E0; border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 40px; border: 1px solid var(--border-color);">
                            🥐
                        </div>
                        <div>
                            <span style="font-size: 12px; color: var(--text-muted);">2023.10.24 생성</span>
                            <h4 style="font-size: 14px; font-weight: 700; margin-top: 4px;">크루아상 마감 할인</h4>
                        </div>
                    </div>
                    
                    <!-- Video Card 2 -->
                    <div style="display: flex; flex-direction: column; gap: 12px;">
                        <div style="aspect-ratio: 9/16; background-color: #E0F2FE; border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 40px; border: 1px solid var(--border-color);">
                            ☕
                        </div>
                        <div>
                            <span style="font-size: 12px; color: var(--text-muted);">2023.10.21 생성</span>
                            <h4 style="font-size: 14px; font-weight: 700; margin-top: 4px;">아메리카노 감성샷</h4>
                        </div>
                    </div>

                    <!-- Video Card 3 -->
                    <div style="display: flex; flex-direction: column; gap: 12px;">
                        <div style="aspect-ratio: 9/16; background-color: #FCE7F3; border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 40px; border: 1px solid var(--border-color);">
                            🍰
                        </div>
                        <div>
                            <span style="font-size: 12px; color: var(--text-muted);">2023.10.15 생성</span>
                            <h4 style="font-size: 14px; font-weight: 700; margin-top: 4px;">딸기 케이크 신메뉴</h4>
                        </div>
                    </div>
                </div>
            </div>

        </main>
    </div>
</body>
</html>
