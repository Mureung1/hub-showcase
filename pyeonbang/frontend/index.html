<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>편방 - 편의점 가성비 & 영양성분 분석</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="min-h-screen bg-[#F4F6F9] text-[#111827] flex justify-center items-start py-8 px-4 antialiased">

    <div class="w-full max-w-md bg-white rounded-[32px] shadow-xl overflow-hidden border border-gray-100 flex flex-col min-h-[800px] relative">
        
        <header class="px-6 pt-6 pb-4 flex justify-between items-center border-b border-gray-50">
          <div class="flex items-center gap-2">
            <span class="text-2xl">🏪</span>
            <h1 class="text-xl font-bold tracking-tight text-gray-900">편방 <span class="text-xs text-gray-400 font-normal">v1.0</span></h1>
          </div>
          <span class="px-3 py-1 bg-yellow-100 text-yellow-800 text-xs font-semibold rounded-full">7월 MVP</span>
        </header>

        <main class="flex-1 px-6 py-4 space-y-5 overflow-y-auto pb-32">
          
          <div class="space-y-1">
            <h2 class="text-lg font-bold text-gray-800">오늘의 편의점 가성비는?</h2>
            <p class="text-xs text-gray-400">제품의 가격표나 영양성분표를 정면으로 촬영해 주세요.</p>
          </div>

          <label class="block w-full border-2 border-dashed border-gray-200 bg-gray-50 rounded-2xl p-6 text-center cursor-pointer hover:bg-gray-100 transition-all relative overflow-hidden group">
            <input 
              type="file" 
              accept="image/*" 
              class="hidden" 
              id="imageInput"
            />
            <div class="py-6 flex flex-col items-center justify-center space-y-2">
              <div class="w-12 h-12 bg-white rounded-full shadow-sm flex items-center justify-center text-xl">📸</div>
              <p class="text-sm font-semibold text-gray-600">이곳을 눌러 사진 업로드</p>
              <p class="text-xs text-gray-400">영양성분표가 평평할수록 정확도가 높아집니다</p>
            </div>
          </label>

          <div class="space-y-4">
            <h3 class="text-xs font-bold text-gray-400 tracking-wider uppercase">분석 결과 리포트 (예시)</h3>

            <div class="bg-white border border-gray-100 rounded-2xl p-5 shadow-sm space-y-3">
              <div class="flex justify-between items-center">
                <span class="text-sm font-medium text-gray-500">💰 가격 대비 영양 가성비</span>
                <span class="text-lg font-bold text-[#FFB800]">85점 / 100점</span>
              </div>
              <div class="w-full bg-gray-100 h-3 rounded-full overflow-hidden">
                <div class="bg-gradient-to-r from-yellow-400 to-[#FFB800] h-full rounded-full" style="width: 85%"></div>
              </div>
              <p class="text-xs text-gray-400">동일 가격대 평균 제품보다 단백질 함량이 24% 높습니다.</p>
            </div>

            <div class="bg-white border border-gray-100 rounded-2xl p-5 shadow-sm space-y-4">
              <div class="flex justify-between items-baseline">
                <span class="text-sm font-bold text-gray-800">🔥 총 칼로리</span>
                <span class="text-base font-extrabold text-gray-900">345 <span class="text-xs font-normal text-gray-400">kcal</span></span>
              </div>
              
              <hr class="border-gray-50" />

              <div class="space-y-3">
                <div class="space-y-1">
                  <div class="flex justify-between text-xs font-medium">
                    <span class="text-gray-500">탄수화물 (45g)</span>
                    <span class="text-gray-700">50%</span>
                  </div>
                  <div class="w-full bg-gray-100 h-2 rounded-full"><div class="bg-blue-400 h-full rounded-full" style="width: 50%"></div></div>
                </div>
                <div class="space-y-1">
                  <div class="flex justify-between text-xs font-medium">
                    <span class="text-gray-500">단백질 (22g)</span>
                    <span class="text-gray-700">35%</span>
                  </div>
                  <div class="w-full bg-gray-100 h-2 rounded-full"><div class="bg-green-400 h-full rounded-full" style="width: 35%"></div></div>
                </div>
                <div class="space-y-1">
                  <div class="flex justify-between text-xs font-medium">
                    <span class="text-gray-500">지방 (5g)</span>
                    <span class="text-gray-700">15%</span>
                  </div>
                  <div class="w-full bg-gray-100 h-2 rounded-full"><div class="bg-red-400 h-full rounded-full" style="width: 15%"></div></div>
                </div>
              </div>
            </div>

          </div>
        </main>

        <div class="absolute bottom-0 left-0 right-0 bg-gradient-to-t from-white via-white to-transparent pt-8 pb-6 px-6">
          <button class="w-full bg-[#FFD200] hover:bg-[#e6be00] active:scale-[0.98] text-gray-900 font-bold py-4 px-6 rounded-2xl shadow-lg shadow-yellow-400/20 transition-all text-center flex items-center justify-center gap-2 text-base">
            <span>✨</span> AI 가성비 분석 시작하기
          </button>
        </div>

      </div>
    </div>

</body>
</html>


<!-- index.html 내 원하는 위치에 추가 -->
<input type="file" accept="image/*" capture="environment" id="food-camera">

<script>
  // 사진이 찍히거나 파일이 선택되면 자동으로 백엔드에 전송하는 자바스크립트
  document.getElementById('food-camera').addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (!file) return;

    const formData = new FormData();
    formData.append('image', file);

    // 백엔드의 이미지 업로드 API 주소로 전송
    fetch('/upload', {
      method: 'POST',
      body: formData
    })
    .then(res => res.json())
    .then(data => console.log('서버가 읽은 텍스트:', data))
    .catch(err => console.error('전송 에러:', err));
  });
</script>
