<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Beacon 목업 — Discord 알림</title>
    <style>
      /* Beacon 브랜드 accent (src/index.css) */
      :root {
        --accent: #aa3bff;
        --sans: system-ui, "Segoe UI", Roboto, sans-serif;
        --mono: ui-monospace, Consolas, monospace;
        /* Discord 다크 팔레트 */
        --dc-bg: #313338;
        --dc-input: #383a40;
        --dc-embed: #2b2d31;
        --dc-text: #dbdee1;
        --dc-muted: #949ba4;
        --dc-heading: #f2f3f5;
        --dc-green: #248046;
        --dc-red: #da373c;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #232428;
        font-family: var(--sans);
        color: var(--dc-text);
        display: flex;
        justify-content: center;
        padding: 48px 24px;
        -webkit-font-smoothing: antialiased;
      }
      .channel {
        width: 640px;
        max-width: 100%;
        background: var(--dc-bg);
        border-radius: 12px;
        padding: 20px 20px 24px;
      }
      .channel-name {
        color: var(--dc-muted);
        font-size: 14px;
        font-weight: 600;
        border-bottom: 1px solid #3f4147;
        padding-bottom: 12px;
        margin-bottom: 20px;
      }
      .channel-name span {
        color: #7d818a;
      }
      .msg {
        display: flex;
        gap: 16px;
      }
      .avatar {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        background: linear-gradient(135deg, var(--accent), #7d2bd6);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 20px;
        flex-shrink: 0;
      }
      .body {
        flex: 1;
        min-width: 0;
      }
      .head {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 6px;
      }
      .name {
        color: #f6a5ff;
        font-weight: 600;
        font-size: 16px;
      }
      .bot {
        background: var(--accent);
        color: #fff;
        font-size: 10px;
        font-weight: 700;
        padding: 1px 5px;
        border-radius: 4px;
        letter-spacing: 0.3px;
      }
      .time {
        color: var(--dc-muted);
        font-size: 12px;
      }
      .embed {
        background: var(--dc-embed);
        border-left: 4px solid var(--accent);
        border-radius: 4px;
        padding: 14px 16px;
        margin-top: 4px;
        max-width: 460px;
      }
      .embed-title {
        color: var(--dc-heading);
        font-weight: 700;
        font-size: 15px;
        margin-bottom: 10px;
      }
      .fields {
        display: flex;
        gap: 40px;
        margin-bottom: 12px;
      }
      .field-label {
        color: var(--dc-muted);
        font-size: 12px;
        font-weight: 600;
        margin-bottom: 2px;
      }
      .field-value {
        color: var(--dc-heading);
        font-size: 15px;
        font-family: var(--mono);
      }
      .field-value.up {
        color: #f2555a;
      }
      .memory {
        display: flex;
        gap: 8px;
        background: rgba(170, 59, 255, 0.12);
        border: 1px solid rgba(170, 59, 255, 0.35);
        border-radius: 6px;
        padding: 10px 12px;
        font-size: 13.5px;
        line-height: 150%;
        color: #e8d9ff;
      }
      .memory b {
        color: #f6a5ff;
      }
      .buttons {
        display: flex;
        gap: 8px;
        margin-top: 14px;
      }
      .btn {
        border: none;
        border-radius: 4px;
        padding: 9px 16px;
        font-size: 14px;
        font-weight: 600;
        color: #fff;
        font-family: var(--sans);
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      .btn.buy {
        background: var(--dc-green);
      }
      .btn.sell {
        background: var(--dc-red);
      }
      .btn.link {
        background: #4e5058;
      }
      .caption {
        width: 640px;
        max-width: 100%;
        color: #6a6e78;
        font-size: 13px;
        margin: 14px 2px 0;
      }
    </style>
  </head>
  <body>
    <div>
      <div class="channel">
        <div class="channel-name"># beacon-알림 <span>· 나만 볼 수 있음</span></div>
        <div class="msg">
          <div class="avatar">🔦</div>
          <div class="body">
            <div class="head">
              <span class="name">Beacon</span>
              <span class="bot">BOT</span>
              <span class="time">오늘 오후 2:14</span>
            </div>
            <div class="embed">
              <div class="embed-title">🔔 조건 충족 — 삼성전자 (005930)</div>
              <div class="fields">
                <div>
                  <div class="field-label">설정한 조건</div>
                  <div class="field-value">80,000원 도달</div>
                </div>
                <div>
                  <div class="field-label">현재가</div>
                  <div class="field-value up">80,100원 ▲</div>
                </div>
              </div>
              <div class="memory">
                <span>💭</span>
                <span
                  >지난번 이 조건으로 샀을 때
                  <b>"성급하게 추격매수했다"</b>고 복기했었죠. 이번엔 한 박자
                  기다려볼까요?</span
                >
              </div>
              <div class="buttons">
                <button class="btn buy">📥 매수 기록</button>
                <button class="btn sell">📤 매도 기록</button>
                <button class="btn link">웹에서 열기 ↗</button>
              </div>
            </div>
          </div>
        </div>
      </div>
      <p class="caption">
        핵심 기능 ① 자연어 조건 알림 — 조건 충족 시 과거 복기 메모리 한 줄과
        원클릭 기록 버튼이 함께 도착한다.
      </p>
    </div>
  </body>
</html>
