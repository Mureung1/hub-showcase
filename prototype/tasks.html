<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>할 일</title>
<style>
  :root {
    --color-primary: #6C5CE7;
    --color-primary-hover: #5A4BD1;
    --color-primary-light: #A29BFE;
    --color-primary-subtle: #EFECFC;

    --bg-page: #F7F5F6;
    --bg-surface: #FFFFFF;
    --bg-dark: #1A1726;
    --bg-dark-alt: #262238;

    --text-primary: #1A1726;
    --text-secondary: #5C5670;
    --text-muted: #948FA4;
    --text-on-dark: #FFFFFF;
    --text-on-dark-muted: #A8A3BB;

    --border-subtle: rgba(26,23,38,0.05);
    --border-default: rgba(26,23,38,0.10);
    --border-dark: rgba(255,255,255,0.07);

    --color-info: #2F80ED;
    --color-info-light: #4DA3FF;
    --color-success: #0F7A57;
    --color-success-bg: #E4F7EF;

    --radius-sm: 9px;
    --radius-lg: 20px;
    --radius-xl: 28px;
    --radius-full: 9999px;

    --shadow-sm: 0 1px 3px rgba(26,23,38,0.03);
    --shadow-md: 0 4px 18px rgba(26,23,38,0.05);
    --shadow-lg: 0 14px 36px rgba(26,23,38,0.07);
    --shadow-primary: 0 8px 24px rgba(108,92,231,0.22);
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    font-family: "Pretendard", -apple-system, BlinkMacSystemFont, "Segoe UI",
      "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    background: var(--bg-page);
    color: var(--text-primary);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 48px 24px;
  }

  .page {
    width: 100%;
    max-width: 720px;
  }

  .page-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 20px;
  }

  .page-header h1 {
    font-size: 36px;
    font-weight: 700;
    letter-spacing: -0.025em;
    color: var(--text-primary);
    margin-bottom: 6px;
  }

  .page-header .subtitle {
    font-size: 14px;
    color: var(--text-secondary);
  }

  .avatar {
    flex-shrink: 0;
    width: 44px;
    height: 44px;
    border-radius: var(--radius-full);
    background: linear-gradient(135deg, var(--color-primary), var(--color-primary-light));
    color: var(--text-on-dark);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
    font-weight: 700;
    box-shadow: var(--shadow-primary);
  }

  /* 나는 누구인지 선택 */
  .whoami-row {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: var(--text-secondary);
    margin-bottom: 28px;
  }

  .whoami-row select {
    padding: 6px 10px;
  }

  /* 진행도 카드 (다크) */
  .progress-card {
    background: var(--bg-dark);
    border: 1px solid var(--border-dark);
    border-radius: var(--radius-xl);
    padding: 28px 24px;
    box-shadow: var(--shadow-lg);
    margin-bottom: 28px;
  }

  .progress-block + .progress-block {
    margin-top: 20px;
    padding-top: 20px;
    border-top: 1px solid var(--border-dark);
  }

  .progress-top {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 10px;
  }

  .progress-title {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.09em;
    color: var(--text-on-dark-muted);
  }

  .dot {
    flex-shrink: 0;
    width: 8px;
    height: 8px;
    border-radius: 50%;
  }

  .dot-team {
    background: var(--color-primary-light);
  }

  .dot-mine {
    background: var(--color-info-light);
  }

  .progress-value {
    font-size: 20px;
    font-weight: 700;
    color: var(--text-on-dark);
  }

  .progress-track {
    height: 8px;
    background: var(--border-dark);
    border-radius: var(--radius-full);
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    width: 0%;
    border-radius: var(--radius-full);
    transition: width 0.3s ease;
  }

  .progress-fill.fill-team {
    background: linear-gradient(90deg, var(--color-primary), var(--color-primary-light));
  }

  .progress-fill.fill-mine {
    background: linear-gradient(90deg, var(--color-info), var(--color-info-light));
  }

  .progress-caption {
    font-size: 12px;
    color: var(--text-on-dark-muted);
    margin-top: 8px;
  }

  /* 섹션 라벨 */
  .section-label {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.09em;
    color: var(--text-muted);
    margin: 0 0 12px 4px;
  }

  /* 할 일 목록 */
  .task-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 16px;
  }

  .task-empty {
    padding: 20px;
    text-align: center;
    font-size: 13px;
    color: var(--text-muted);
    background: var(--bg-surface);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-lg);
  }

  .task-item {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 16px;
    background: var(--bg-surface);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-sm);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }

  .task-item:hover {
    transform: translateY(-1px);
    box-shadow: var(--shadow-md);
  }

  .checkbox {
    flex-shrink: 0;
    width: 22px;
    height: 22px;
    border-radius: var(--radius-sm);
    border: 2px solid var(--border-default);
    background: var(--bg-surface);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: background 0.15s ease, border-color 0.15s ease, transform 0.1s ease;
  }

  .checkbox:hover {
    border-color: var(--color-primary);
  }

  .checkbox:active {
    transform: scale(0.9);
  }

  .checkbox.checked {
    background: var(--color-primary);
    border-color: var(--color-primary);
    color: var(--text-on-dark);
    font-size: 13px;
    font-weight: 700;
  }

  .checkbox.checked:hover {
    background: var(--color-primary-hover);
    border-color: var(--color-primary-hover);
  }

  .checkbox.locked {
    cursor: not-allowed;
    opacity: 0.45;
  }

  .checkbox.locked:hover {
    border-color: var(--border-default);
  }

  .delete-btn {
    flex-shrink: 0;
    width: 24px;
    height: 24px;
    border-radius: var(--radius-sm);
    border: none;
    background: transparent;
    color: var(--text-muted);
    font-size: 15px;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease;
  }

  .delete-btn:hover {
    background: var(--border-subtle);
    color: var(--text-secondary);
  }

  .delete-btn.locked {
    cursor: not-allowed;
    opacity: 0.3;
  }

  .task-info {
    flex: 1;
    min-width: 0;
  }

  .task-title {
    font-size: 15px;
    font-weight: 600;
    color: var(--text-primary);
  }

  .task-item.done .task-title {
    color: var(--text-muted);
    text-decoration: line-through;
  }

  .task-meta {
    font-size: 13px;
    color: var(--text-muted);
    margin-top: 4px;
  }

  .status-badge {
    flex-shrink: 0;
    padding: 5px 12px;
    border-radius: var(--radius-full);
    font-size: 12px;
    font-weight: 700;
    white-space: nowrap;
    cursor: pointer;
  }

  .status-badge.status-wait {
    background: #F2F0F4;
    color: var(--text-secondary);
  }

  .status-badge.status-progress {
    background: var(--color-primary-subtle);
    color: var(--color-primary);
  }

  .status-badge.status-done {
    background: var(--color-success-bg);
    color: var(--color-success);
  }

  .status-badge.locked {
    cursor: not-allowed;
    opacity: 0.45;
  }

  /* 할 일 추가 */
  .add-task-btn {
    width: 100%;
    padding: 15px;
    background: var(--color-primary);
    border: none;
    border-radius: var(--radius-full);
    color: var(--text-on-dark);
    font-size: 14px;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    box-shadow: var(--shadow-primary);
    transition: background 0.15s ease, transform 0.1s ease;
  }

  .add-task-btn:hover {
    background: var(--color-primary-hover);
  }

  .add-task-btn:active {
    transform: scale(0.98);
  }

  .add-task-form {
    margin-top: 12px;
    padding: 20px;
    background: var(--bg-surface);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-sm);
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .add-task-form[hidden] {
    display: none;
  }

  .form-row {
    display: flex;
    gap: 8px;
  }

  .field {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .form-row .field {
    flex: 1;
    min-width: 0;
  }

  .field-label {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.09em;
    color: var(--text-muted);
    padding-left: 2px;
  }

  .form-input {
    width: 100%;
    padding: 11px 12px;
    background: var(--bg-page);
    border: 1px solid var(--border-default);
    border-radius: var(--radius-sm);
    font-size: 14px;
    font-family: inherit;
    color: var(--text-primary);
  }

  .form-input:focus {
    outline: none;
    border-color: var(--color-primary);
  }

  .form-actions {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    margin-top: 2px;
  }

  .btn {
    padding: 10px 18px;
    border-radius: var(--radius-full);
    font-size: 14px;
    font-weight: 700;
    font-family: inherit;
    border: none;
    cursor: pointer;
  }

  .btn-secondary {
    background: var(--bg-surface);
    color: var(--text-secondary);
    border: 1px solid var(--border-default);
  }

  .btn-secondary:hover {
    background: var(--border-subtle);
  }

  .btn-primary {
    background: var(--color-primary);
    color: var(--text-on-dark);
    box-shadow: var(--shadow-primary);
  }

  .btn-primary:hover {
    background: var(--color-primary-hover);
  }

  .form-error {
    font-size: 12px;
    color: var(--text-secondary);
  }

  .toast {
    position: fixed;
    left: 50%;
    bottom: 32px;
    transform: translateX(-50%);
    background: var(--bg-dark);
    color: var(--text-on-dark);
    padding: 14px 20px;
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-lg);
    font-size: 13px;
    font-weight: 600;
    max-width: 90vw;
    text-align: center;
    z-index: 100;
  }

  .toast[hidden] {
    display: none;
  }

  .footer-note {
    text-align: center;
    margin-top: 20px;
    font-size: 13px;
    color: var(--text-muted);
  }

  .log-toggle-btn {
    width: 100%;
    padding: 12px;
    margin-top: 24px;
    background: transparent;
    border: 1px dashed var(--border-default);
    border-radius: var(--radius-lg);
    color: var(--text-secondary);
    font-size: 13px;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    transition: background 0.15s ease, border-color 0.15s ease;
  }

  .log-toggle-btn:hover {
    background: var(--border-subtle);
    border-color: var(--color-primary-light);
  }

  .log-list {
    margin-top: 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .log-list[hidden] {
    display: none;
  }

  .log-item {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    padding: 12px 14px;
    background: var(--bg-surface);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-md);
    box-shadow: var(--shadow-sm);
  }

  .log-text {
    font-size: 13px;
    color: var(--text-primary);
  }

  .log-text strong {
    font-weight: 700;
  }

  .log-time {
    flex-shrink: 0;
    font-size: 12px;
    color: var(--text-muted);
    white-space: nowrap;
  }

  .log-empty {
    padding: 16px;
    text-align: center;
    font-size: 13px;
    color: var(--text-muted);
    background: var(--bg-surface);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-lg);
  }
</style>
</head>
<body>
  <div class="page">
    <header class="page-header">
      <div>
        <h1>할 일</h1>
        <p class="subtitle" id="teamSubtitle">우리 팀 · 팀원 - 명</p>
      </div>
      <div class="avatar" id="avatarInitial">-</div>
    </header>

    <div class="whoami-row">
      <label for="whoAmISelect">나는</label>
      <select class="form-input" id="whoAmISelect"></select>
      <span>입니다</span>
    </div>

    <div class="form-error" id="loadError" hidden></div>

    <div class="progress-card">
      <div class="progress-block">
        <div class="progress-top">
          <span class="progress-title"><span class="dot dot-team"></span>팀 전체 진행도</span>
          <span class="progress-value" id="teamProgressValue">0%</span>
        </div>
        <div class="progress-track">
          <div class="progress-fill fill-team" id="teamProgressFill"></div>
        </div>
        <div class="progress-caption" id="teamProgressCaption"></div>
      </div>

      <div class="progress-block">
        <div class="progress-top">
          <span class="progress-title"><span class="dot dot-mine"></span>내 진행도</span>
          <span class="progress-value" id="myProgressValue">0%</span>
        </div>
        <div class="progress-track">
          <div class="progress-fill fill-mine" id="myProgressFill"></div>
        </div>
        <div class="progress-caption" id="myProgressCaption"></div>
      </div>
    </div>

    <div class="section-label">할 일 목록</div>

    <div class="task-list" id="taskList"></div>

    <button type="button" class="add-task-btn" id="addTaskBtn">+ 할 일 추가</button>

    <div class="add-task-form" id="addTaskForm" hidden>
      <div class="field">
        <label class="field-label" for="newTaskTitle">할 일 제목</label>
        <input type="text" class="form-input" id="newTaskTitle" placeholder="예: 디자인 리뷰" />
      </div>
      <div class="form-row">
        <div class="field">
          <label class="field-label" for="newTaskAssignee">담당자</label>
          <select class="form-input" id="newTaskAssignee">
            <option value="">담당자 없음</option>
          </select>
        </div>
        <div class="field">
          <label class="field-label" for="newTaskDue">마감기한</label>
          <input type="date" class="form-input" id="newTaskDue" />
        </div>
      </div>
      <div class="form-error" id="addTaskError" hidden></div>
      <div class="form-actions">
        <button type="button" class="btn btn-secondary" id="cancelAddBtn">취소</button>
        <button type="button" class="btn btn-primary" id="confirmAddBtn">추가</button>
      </div>
    </div>

    <div class="footer-note">체크박스·상태 뱃지로 대기·진행·완료를 바꿀 수 있어요 (담당자 본인만 가능)</div>

    <button type="button" class="log-toggle-btn" id="toggleLogsBtn">활동 로그 보기</button>
    <div class="log-list" id="logList" hidden></div>
  </div>

  <div class="toast" id="toast" hidden></div>

  <script>
    var API_BASE = "http://localhost:3000/api";
    var CURRENT_MEMBER_KEY = "teamplan_currentMemberId";
    var STATUS_LABEL = { pending: "대기", in_progress: "진행", done: "완료" };
    var STATUS_CLASS = { pending: "wait", in_progress: "progress" };

    var members = [];
    var tasks = [];
    var logs = [];
    var currentMemberId = null;

    var loadError = document.getElementById("loadError");
    var toastEl = document.getElementById("toast");
    var toastTimer = null;
    var teamSubtitle = document.getElementById("teamSubtitle");
    var avatarInitial = document.getElementById("avatarInitial");
    var whoAmISelect = document.getElementById("whoAmISelect");
    var taskListEl = document.getElementById("taskList");

    var teamProgressFill = document.getElementById("teamProgressFill");
    var teamProgressValue = document.getElementById("teamProgressValue");
    var teamProgressCaption = document.getElementById("teamProgressCaption");
    var myProgressFill = document.getElementById("myProgressFill");
    var myProgressValue = document.getElementById("myProgressValue");
    var myProgressCaption = document.getElementById("myProgressCaption");

    var addTaskBtn = document.getElementById("addTaskBtn");
    var addTaskForm = document.getElementById("addTaskForm");
    var addTaskError = document.getElementById("addTaskError");
    var cancelAddBtn = document.getElementById("cancelAddBtn");
    var confirmAddBtn = document.getElementById("confirmAddBtn");
    var newTaskTitle = document.getElementById("newTaskTitle");
    var newTaskAssignee = document.getElementById("newTaskAssignee");
    var newTaskDue = document.getElementById("newTaskDue");

    var toggleLogsBtn = document.getElementById("toggleLogsBtn");
    var logListEl = document.getElementById("logList");

    function memberName(memberId) {
      var member = members.filter(function (m) { return m.id === memberId; })[0];
      return member ? member.name : "담당자 없음";
    }

    function formatDue(value) {
      if (!value) return "마감일 미정";
      var parts = value.split("-");
      if (parts.length !== 3) return "마감일 미정";
      var month = parseInt(parts[1], 10);
      var day = parseInt(parts[2], 10);
      return month + "월 " + day + "일";
    }

    function parseUtcDate(sqliteDatetime) {
      // SQLite의 datetime('now')는 UTC라서, 로컬 시각과 정확히 비교하려면 ISO 형식으로 바꿔줘야 함
      return new Date(sqliteDatetime.replace(" ", "T") + "Z");
    }

    function formatLogTime(changedAt) {
      var date = parseUtcDate(changedAt);
      var diffMin = Math.floor((Date.now() - date.getTime()) / 60000);

      if (diffMin < 1) return "방금 전";
      if (diffMin < 60) return diffMin + "분 전";
      var diffHour = Math.floor(diffMin / 60);
      if (diffHour < 24) return diffHour + "시간 전";

      return (date.getMonth() + 1) + "월 " + date.getDate() + "일";
    }

    function renderLogs() {
      logListEl.innerHTML = "";

      if (logs.length === 0) {
        logListEl.innerHTML = '<div class="log-empty">아직 활동 기록이 없어요.</div>';
        return;
      }

      logs.forEach(function (log) {
        var item = document.createElement("div");
        item.className = "log-item";

        var text = document.createElement("span");
        text.className = "log-text";

        var nameEl = document.createElement("strong");
        nameEl.textContent = log.member_name || "알 수 없음";

        var fromLabel = STATUS_LABEL[log.previous_status] || log.previous_status;
        var toLabel = STATUS_LABEL[log.new_status] || log.new_status;

        text.appendChild(nameEl);
        text.appendChild(document.createTextNode(
          "님이 '" + log.task_title + "'를 " + fromLabel + " → " + toLabel + "로 변경"
        ));

        var time = document.createElement("span");
        time.className = "log-time";
        time.textContent = formatLogTime(log.changed_at);

        item.appendChild(text);
        item.appendChild(time);
        logListEl.appendChild(item);
      });
    }

    toggleLogsBtn.addEventListener("click", function () {
      var willShow = logListEl.hidden;
      logListEl.hidden = !willShow;
      toggleLogsBtn.textContent = willShow ? "활동 로그 숨기기" : "활동 로그 보기";
    });

    function calcStats(list) {
      var total = list.length;
      var doneCount = list.filter(function (t) { return t.status === "done"; }).length;
      var percent = total === 0 ? 0 : Math.round((doneCount / total) * 100);
      return { total: total, doneCount: doneCount, percent: percent };
    }

    function updateProgress() {
      var mine = tasks.filter(function (t) { return t.assignee_id === currentMemberId; });

      var team = calcStats(tasks);
      teamProgressFill.style.width = team.percent + "%";
      teamProgressValue.textContent = team.percent + "%";
      teamProgressCaption.textContent = "총 " + team.total + "개 중 " + team.doneCount + "개 완료";

      var mineStats = calcStats(mine);
      myProgressFill.style.width = mineStats.percent + "%";
      myProgressValue.textContent = mineStats.percent + "%";
      myProgressCaption.textContent =
        mineStats.total === 0 ? "내 할 일이 아직 없어요" : "총 " + mineStats.total + "개 중 " + mineStats.doneCount + "개 완료";
    }

    function renderTasks() {
      taskListEl.innerHTML = "";

      if (tasks.length === 0) {
        taskListEl.innerHTML = '<div class="task-empty">아직 할 일이 없어요. 추가해보세요!</div>';
        updateProgress();
        return;
      }

      tasks.forEach(function (task) {
        var isDone = task.status === "done";
        var isMine = task.assignee_id === currentMemberId;
        var canChange = task.assignee_id === null || isMine;

        var item = document.createElement("div");
        item.className = "task-item" + (isDone ? " done" : "");
        item.dataset.taskId = task.id;
        item.dataset.status = STATUS_CLASS[task.status] || "wait";
        item.dataset.mine = isMine ? "true" : "false";

        var checkbox = document.createElement("div");
        checkbox.className = "checkbox" + (isDone ? " checked" : "") + (canChange ? "" : " locked");
        checkbox.innerHTML = isDone ? "&#10003;" : "";

        var info = document.createElement("div");
        info.className = "task-info";
        var titleEl = document.createElement("div");
        titleEl.className = "task-title";
        titleEl.textContent = task.title;
        var metaEl = document.createElement("div");
        metaEl.className = "task-meta";
        metaEl.textContent = memberName(task.assignee_id) + " · 마감 " + formatDue(task.due_date);
        info.appendChild(titleEl);
        info.appendChild(metaEl);

        var badge = document.createElement("div");
        if (isDone) {
          badge.className = "status-badge status-done";
          badge.textContent = "완료";
        } else {
          var statusKey = STATUS_CLASS[task.status] || "wait";
          badge.className = "status-badge status-" + statusKey;
          badge.textContent = STATUS_LABEL[task.status] || "대기";
        }
        if (!canChange) badge.className += " locked";

        var deleteBtn = document.createElement("button");
        deleteBtn.type = "button";
        deleteBtn.className = "delete-btn" + (canChange ? "" : " locked");
        deleteBtn.title = "삭제";
        deleteBtn.setAttribute("aria-label", "삭제");
        deleteBtn.textContent = "×";

        item.appendChild(checkbox);
        item.appendChild(info);
        item.appendChild(badge);
        item.appendChild(deleteBtn);
        taskListEl.appendChild(item);
      });

      updateProgress();
    }

    function showToast(message) {
      toastEl.textContent = message;
      toastEl.hidden = false;
      clearTimeout(toastTimer);
      toastTimer = setTimeout(function () { toastEl.hidden = true; }, 2500);
    }

    var NEXT_STATUS = { pending: "in_progress", in_progress: "done", done: "pending" };

    async function changeStatus(taskId, newStatus) {
      try {
        var res = await fetch(API_BASE + "/tasks/" + taskId, {
          method: "PATCH",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ status: newStatus, memberId: currentMemberId }),
        });

        if (!res.ok) {
          var err = await res.json();
          showToast(err.error || "상태를 변경하지 못했어요.");
          return;
        }

        var updated = await res.json();
        var idx = tasks.findIndex(function (t) { return t.id === updated.id; });
        if (idx !== -1) tasks[idx] = updated;
        renderTasks();
        loadLogs();
      } catch (e) {
        showToast("서버에 연결할 수 없어요.");
      }
    }

    taskListEl.addEventListener("click", function (e) {
      var item = e.target.closest(".task-item");
      if (!item) return;
      var taskId = Number(item.dataset.taskId);
      var task = tasks.filter(function (t) { return t.id === taskId; })[0];
      if (!task) return;

      var canChange = task.assignee_id === null || task.assignee_id === currentMemberId;

      if (e.target.closest(".checkbox")) {
        if (!canChange) { showToast("담당자만 상태를 변경할 수 있어요."); return; }
        changeStatus(taskId, task.status === "done" ? "pending" : "done");
        return;
      }

      if (e.target.closest(".status-badge")) {
        if (!canChange) { showToast("담당자만 상태를 변경할 수 있어요."); return; }
        changeStatus(taskId, NEXT_STATUS[task.status] || "pending");
        return;
      }

      if (e.target.closest(".delete-btn")) {
        if (!canChange) { showToast("담당자만 삭제할 수 있어요."); return; }
        archiveTask(taskId);
      }
    });

    async function archiveTask(taskId) {
      try {
        var res = await fetch(API_BASE + "/tasks/" + taskId, {
          method: "DELETE",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ memberId: currentMemberId }),
        });

        if (!res.ok) {
          var err = await res.json();
          showToast(err.error || "삭제하지 못했어요.");
          return;
        }

        tasks = tasks.filter(function (t) { return t.id !== taskId; });
        renderTasks();
      } catch (e) {
        showToast("서버에 연결할 수 없어요.");
      }
    }

    // 일부 브라우저는 file:// 페이지에서 localStorage 접근을 막고 예외를 던지기도 해서,
    // 그런 경우에도 멤버 목록 자체는 계속 불러와지도록 localStorage만 따로 감싼다.
    function safeGetStoredMemberId() {
      try {
        return Number(localStorage.getItem(CURRENT_MEMBER_KEY));
      } catch (e) {
        return NaN;
      }
    }

    function safeSetStoredMemberId(id) {
      try {
        localStorage.setItem(CURRENT_MEMBER_KEY, String(id));
      } catch (e) {
        // 저장 실패해도 화면 동작에는 지장 없음 (새로고침 유지만 안 될 뿐)
      }
    }

    async function loadMembers() {
      var res = await fetch(API_BASE + "/members");
      if (!res.ok) throw new Error("멤버 목록 조회 실패: " + res.status);
      members = await res.json();

      whoAmISelect.innerHTML = "";
      newTaskAssignee.innerHTML = '<option value="">담당자 없음</option>';

      members.forEach(function (m) {
        var whoOption = document.createElement("option");
        whoOption.value = m.id;
        whoOption.textContent = m.name;
        whoAmISelect.appendChild(whoOption);

        var assigneeOption = document.createElement("option");
        assigneeOption.value = m.id;
        assigneeOption.textContent = m.name;
        newTaskAssignee.appendChild(assigneeOption);
      });

      var saved = safeGetStoredMemberId();
      var savedExists = members.some(function (m) { return m.id === saved; });
      currentMemberId = savedExists ? saved : (members[0] ? members[0].id : null);

      whoAmISelect.value = currentMemberId;
      teamSubtitle.textContent = "우리 팀 · 팀원 " + members.length + "명";
      avatarInitial.textContent = currentMemberId ? memberName(currentMemberId).slice(0, 1) : "-";
    }

    async function loadTasks() {
      var res = await fetch(API_BASE + "/tasks");
      if (!res.ok) throw new Error("태스크 목록 조회 실패: " + res.status);
      tasks = await res.json();
      renderTasks();
    }

    async function loadLogs() {
      var res = await fetch(API_BASE + "/activity-logs");
      if (!res.ok) throw new Error("활동 로그 조회 실패: " + res.status);
      logs = await res.json();
      renderLogs();
    }

    whoAmISelect.addEventListener("change", function () {
      currentMemberId = Number(whoAmISelect.value);
      safeSetStoredMemberId(currentMemberId);
      avatarInitial.textContent = memberName(currentMemberId).slice(0, 1);
      renderTasks();
    });

    function openAddForm() {
      addTaskForm.hidden = false;
      addTaskBtn.hidden = true;
      addTaskError.hidden = true;
      newTaskTitle.focus();
    }

    function closeAddForm() {
      addTaskForm.hidden = true;
      addTaskBtn.hidden = false;
      addTaskError.hidden = true;
      newTaskTitle.value = "";
      newTaskAssignee.value = "";
      newTaskDue.value = "";
    }

    async function addTask() {
      var title = newTaskTitle.value.trim();
      if (!title) {
        newTaskTitle.focus();
        return;
      }

      confirmAddBtn.disabled = true;
      try {
        var res = await fetch(API_BASE + "/tasks", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            title: title,
            assigneeId: newTaskAssignee.value ? Number(newTaskAssignee.value) : null,
            dueDate: newTaskDue.value || null,
          }),
        });

        if (!res.ok) {
          var err = await res.json();
          addTaskError.textContent = err.error || "추가하지 못했어요.";
          addTaskError.hidden = false;
          return;
        }

        await loadTasks();
        closeAddForm();
      } catch (e) {
        addTaskError.textContent = "서버에 연결할 수 없어요. 백엔드가 켜져 있는지 확인해주세요.";
        addTaskError.hidden = false;
      } finally {
        confirmAddBtn.disabled = false;
      }
    }

    addTaskBtn.addEventListener("click", openAddForm);
    cancelAddBtn.addEventListener("click", closeAddForm);
    confirmAddBtn.addEventListener("click", addTask);
    newTaskTitle.addEventListener("keydown", function (e) {
      if (e.key === "Enter") addTask();
    });

    (async function init() {
      try {
        await loadMembers();
        await loadTasks();
        await loadLogs();
      } catch (e) {
        console.error(e);
        loadError.textContent =
          "멤버/할 일/로그를 불러오지 못했어요. 백엔드 서버(http://localhost:3000)가 켜져 있는지 확인하고 새로고침 해주세요.";
        loadError.hidden = false;
      }
    })();
  </script>
</body>
</html>
