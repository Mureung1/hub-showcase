<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>할 일</title>
<style>
  :root {
    --color-primary: #6C5CE7;
    --color-primary-hover: #5A4BD1;
    --color-primary-light: #A29BFE;
    --color-primary-subtle: #EFECFC;

    --bg-page: #F7F5F6;
    --bg-surface: #FFFFFF;
    --bg-dark: #1A1726;
    --bg-dark-alt: #262238;

    --text-primary: #1A1726;
    --text-secondary: #5C5670;
    --text-muted: #948FA4;
    --text-on-dark: #FFFFFF;
    --text-on-dark-muted: #A8A3BB;

    --border-subtle: rgba(26,23,38,0.05);
    --border-default: rgba(26,23,38,0.10);
    --border-dark: rgba(255,255,255,0.07);

    --color-info: #2F80ED;
    --color-info-light: #4DA3FF;
    --color-success: #0F7A57;
    --color-success-bg: #E4F7EF;

    --radius-sm: 9px;
    --radius-lg: 20px;
    --radius-xl: 28px;
    --radius-full: 9999px;

    --shadow-sm: 0 1px 3px rgba(26,23,38,0.03);
    --shadow-md: 0 4px 18px rgba(26,23,38,0.05);
    --shadow-lg: 0 14px 36px rgba(26,23,38,0.07);
    --shadow-primary: 0 8px 24px rgba(108,92,231,0.22);
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    font-family: "Pretendard", -apple-system, BlinkMacSystemFont, "Segoe UI",
      "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    background: var(--bg-page);
    color: var(--text-primary);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 48px 24px;
  }

  .page {
    width: 100%;
    max-width: 720px;
  }

  .page-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 28px;
  }

  .page-header h1 {
    font-size: 36px;
    font-weight: 700;
    letter-spacing: -0.025em;
    color: var(--text-primary);
    margin-bottom: 6px;
  }

  .page-header .subtitle {
    font-size: 14px;
    color: var(--text-secondary);
  }

  .avatar {
    flex-shrink: 0;
    width: 44px;
    height: 44px;
    border-radius: var(--radius-full);
    background: linear-gradient(135deg, var(--color-primary), var(--color-primary-light));
    color: var(--text-on-dark);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
    font-weight: 700;
    box-shadow: var(--shadow-primary);
  }

  /* 진행도 카드 (다크) */
  .progress-card {
    background: var(--bg-dark);
    border: 1px solid var(--border-dark);
    border-radius: var(--radius-xl);
    padding: 28px 24px;
    box-shadow: var(--shadow-lg);
    margin-bottom: 28px;
  }

  .progress-block + .progress-block {
    margin-top: 20px;
    padding-top: 20px;
    border-top: 1px solid var(--border-dark);
  }

  .progress-top {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 10px;
  }

  .progress-title {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.09em;
    color: var(--text-on-dark-muted);
  }

  .dot {
    flex-shrink: 0;
    width: 8px;
    height: 8px;
    border-radius: 50%;
  }

  .dot-team {
    background: var(--color-primary-light);
  }

  .dot-mine {
    background: var(--color-info-light);
  }

  .progress-value {
    font-size: 20px;
    font-weight: 700;
    color: var(--text-on-dark);
  }

  .progress-track {
    height: 8px;
    background: var(--border-dark);
    border-radius: var(--radius-full);
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    width: 0%;
    border-radius: var(--radius-full);
    transition: width 0.3s ease;
  }

  .progress-fill.fill-team {
    background: linear-gradient(90deg, var(--color-primary), var(--color-primary-light));
  }

  .progress-fill.fill-mine {
    background: linear-gradient(90deg, var(--color-info), var(--color-info-light));
  }

  .progress-caption {
    font-size: 12px;
    color: var(--text-on-dark-muted);
    margin-top: 8px;
  }

  /* 섹션 라벨 */
  .section-label {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.09em;
    color: var(--text-muted);
    margin: 0 0 12px 4px;
  }

  /* 할 일 목록 */
  .task-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 16px;
  }

  .task-item {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 16px;
    background: var(--bg-surface);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-sm);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }

  .task-item:hover {
    transform: translateY(-1px);
    box-shadow: var(--shadow-md);
  }

  .checkbox {
    flex-shrink: 0;
    width: 22px;
    height: 22px;
    border-radius: var(--radius-sm);
    border: 2px solid var(--border-default);
    background: var(--bg-surface);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: background 0.15s ease, border-color 0.15s ease, transform 0.1s ease;
  }

  .checkbox:hover {
    border-color: var(--color-primary);
  }

  .checkbox:active {
    transform: scale(0.9);
  }

  .checkbox.checked {
    background: var(--color-primary);
    border-color: var(--color-primary);
    color: var(--text-on-dark);
    font-size: 13px;
    font-weight: 700;
  }

  .checkbox.checked:hover {
    background: var(--color-primary-hover);
    border-color: var(--color-primary-hover);
  }

  .task-info {
    flex: 1;
    min-width: 0;
  }

  .task-title {
    font-size: 15px;
    font-weight: 600;
    color: var(--text-primary);
  }

  .task-item.done .task-title {
    color: var(--text-muted);
    text-decoration: line-through;
  }

  .task-meta {
    font-size: 13px;
    color: var(--text-muted);
    margin-top: 4px;
  }

  .status-badge {
    flex-shrink: 0;
    padding: 5px 12px;
    border-radius: var(--radius-full);
    font-size: 12px;
    font-weight: 700;
    white-space: nowrap;
  }

  .status-badge.status-wait {
    background: #F2F0F4;
    color: var(--text-secondary);
  }

  .status-badge.status-progress {
    background: var(--color-primary-subtle);
    color: var(--color-primary);
  }

  .status-badge.status-done {
    background: var(--color-success-bg);
    color: var(--color-success);
  }

  /* 할 일 추가 */
  .add-task-btn {
    width: 100%;
    padding: 15px;
    background: var(--color-primary);
    border: none;
    border-radius: var(--radius-full);
    color: var(--text-on-dark);
    font-size: 14px;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    box-shadow: var(--shadow-primary);
    transition: background 0.15s ease, transform 0.1s ease;
  }

  .add-task-btn:hover {
    background: var(--color-primary-hover);
  }

  .add-task-btn:active {
    transform: scale(0.98);
  }

  .add-task-form {
    margin-top: 12px;
    padding: 20px;
    background: var(--bg-surface);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-sm);
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .add-task-form[hidden] {
    display: none;
  }

  .form-row {
    display: flex;
    gap: 8px;
  }

  .field {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .form-row .field {
    flex: 1;
    min-width: 0;
  }

  .field-label {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.09em;
    color: var(--text-muted);
    padding-left: 2px;
  }

  .form-input {
    width: 100%;
    padding: 11px 12px;
    background: var(--bg-page);
    border: 1px solid var(--border-default);
    border-radius: var(--radius-sm);
    font-size: 14px;
    font-family: inherit;
    color: var(--text-primary);
  }

  .form-input:focus {
    outline: none;
    border-color: var(--color-primary);
  }

  .form-actions {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    margin-top: 2px;
  }

  .btn {
    padding: 10px 18px;
    border-radius: var(--radius-full);
    font-size: 14px;
    font-weight: 700;
    font-family: inherit;
    border: none;
    cursor: pointer;
  }

  .btn-secondary {
    background: var(--bg-surface);
    color: var(--text-secondary);
    border: 1px solid var(--border-default);
  }

  .btn-secondary:hover {
    background: var(--border-subtle);
  }

  .btn-primary {
    background: var(--color-primary);
    color: var(--text-on-dark);
    box-shadow: var(--shadow-primary);
  }

  .btn-primary:hover {
    background: var(--color-primary-hover);
  }

  .footer-note {
    text-align: center;
    margin-top: 20px;
    font-size: 13px;
    color: var(--text-muted);
  }
</style>
</head>
<body>
  <div class="page">
    <header class="page-header">
      <div>
        <h1>할 일</h1>
        <p class="subtitle">프로토타입 팀 · 팀원 4명</p>
      </div>
      <div class="avatar">나</div>
    </header>

    <div class="progress-card">
      <div class="progress-block">
        <div class="progress-top">
          <span class="progress-title"><span class="dot dot-team"></span>팀 전체 진행도</span>
          <span class="progress-value" id="teamProgressValue">0%</span>
        </div>
        <div class="progress-track">
          <div class="progress-fill fill-team" id="teamProgressFill"></div>
        </div>
        <div class="progress-caption" id="teamProgressCaption"></div>
      </div>

      <div class="progress-block">
        <div class="progress-top">
          <span class="progress-title"><span class="dot dot-mine"></span>내 진행도</span>
          <span class="progress-value" id="myProgressValue">0%</span>
        </div>
        <div class="progress-track">
          <div class="progress-fill fill-mine" id="myProgressFill"></div>
        </div>
        <div class="progress-caption" id="myProgressCaption"></div>
      </div>
    </div>

    <div class="section-label">할 일 목록</div>

    <div class="task-list" id="taskList">
      <div class="task-item" data-status="progress" data-mine="true">
        <div class="checkbox"></div>
        <div class="task-info">
          <div class="task-title">회의시간 매칭 화면 디자인 리뷰</div>
          <div class="task-meta">나 · 마감 7월 10일</div>
        </div>
        <div class="status-badge status-progress">진행</div>
      </div>

      <div class="task-item" data-status="wait" data-mine="false">
        <div class="checkbox"></div>
        <div class="task-info">
          <div class="task-title">팀원 가능시간 데이터 연동</div>
          <div class="task-meta">서연 · 마감 7월 12일</div>
        </div>
        <div class="status-badge status-wait">대기</div>
      </div>

      <div class="task-item done" data-status="progress" data-mine="true">
        <div class="checkbox checked">&#10003;</div>
        <div class="task-info">
          <div class="task-title">추천 로직 QA 테스트</div>
          <div class="task-meta">나 · 마감 7월 9일</div>
        </div>
        <div class="status-badge status-done">완료</div>
      </div>

      <div class="task-item" data-status="wait" data-mine="false">
        <div class="checkbox"></div>
        <div class="task-info">
          <div class="task-title">반응형 레이아웃 점검</div>
          <div class="task-meta">하은 · 마감 7월 15일</div>
        </div>
        <div class="status-badge status-wait">대기</div>
      </div>
    </div>

    <button type="button" class="add-task-btn" id="addTaskBtn">+ 할 일 추가</button>

    <div class="add-task-form" id="addTaskForm" hidden>
      <div class="field">
        <label class="field-label" for="newTaskTitle">할 일 제목</label>
        <input type="text" class="form-input" id="newTaskTitle" placeholder="예: 디자인 리뷰" />
      </div>
      <div class="form-row">
        <div class="field">
          <label class="field-label" for="newTaskAssignee">담당자</label>
          <input type="text" class="form-input" id="newTaskAssignee" placeholder="이름 입력 (내 할 일은 '나')" />
        </div>
        <div class="field">
          <label class="field-label" for="newTaskDue">마감기한</label>
          <input type="date" class="form-input" id="newTaskDue" />
        </div>
      </div>
      <div class="form-actions">
        <button type="button" class="btn btn-secondary" id="cancelAddBtn">취소</button>
        <button type="button" class="btn btn-primary" id="confirmAddBtn">추가</button>
      </div>
    </div>

    <div class="footer-note">체크박스를 눌러 할 일을 완료해보세요</div>
  </div>

  <script>
    var STATUS_LABEL = { wait: "대기", progress: "진행" };
    var taskListEl = document.getElementById("taskList");

    var teamProgressFill = document.getElementById("teamProgressFill");
    var teamProgressValue = document.getElementById("teamProgressValue");
    var teamProgressCaption = document.getElementById("teamProgressCaption");
    var myProgressFill = document.getElementById("myProgressFill");
    var myProgressValue = document.getElementById("myProgressValue");
    var myProgressCaption = document.getElementById("myProgressCaption");

    var addTaskBtn = document.getElementById("addTaskBtn");
    var addTaskForm = document.getElementById("addTaskForm");
    var cancelAddBtn = document.getElementById("cancelAddBtn");
    var confirmAddBtn = document.getElementById("confirmAddBtn");
    var newTaskTitle = document.getElementById("newTaskTitle");
    var newTaskAssignee = document.getElementById("newTaskAssignee");
    var newTaskDue = document.getElementById("newTaskDue");

    function setBadge(item, isDone) {
      var badge = item.querySelector(".status-badge");
      if (isDone) {
        badge.className = "status-badge status-done";
        badge.textContent = "완료";
      } else {
        var status = item.getAttribute("data-status") || "wait";
        badge.className = "status-badge status-" + status;
        badge.textContent = STATUS_LABEL[status];
      }
    }

    function calcStats(items) {
      var total = items.length;
      var doneCount = items.filter(function (item) {
        return item.classList.contains("done");
      }).length;
      var percent = total === 0 ? 0 : Math.round((doneCount / total) * 100);
      return { total: total, doneCount: doneCount, percent: percent };
    }

    function updateProgress() {
      var allItems = Array.prototype.slice.call(taskListEl.querySelectorAll(".task-item"));
      var myItems = allItems.filter(function (item) {
        return item.getAttribute("data-mine") === "true";
      });

      var team = calcStats(allItems);
      teamProgressFill.style.width = team.percent + "%";
      teamProgressValue.textContent = team.percent + "%";
      teamProgressCaption.textContent = "총 " + team.total + "개 중 " + team.doneCount + "개 완료";

      var mine = calcStats(myItems);
      myProgressFill.style.width = mine.percent + "%";
      myProgressValue.textContent = mine.percent + "%";
      myProgressCaption.textContent =
        mine.total === 0 ? "내 할 일이 아직 없어요" : "총 " + mine.total + "개 중 " + mine.doneCount + "개 완료";
    }

    // 체크박스는 위임 방식으로 처리해서, 나중에 새로 추가되는 할 일에도 그대로 동작해요
    taskListEl.addEventListener("click", function (e) {
      var checkbox = e.target.closest(".checkbox");
      if (!checkbox) return;
      var item = checkbox.closest(".task-item");

      var isDone = !item.classList.contains("done");
      item.classList.toggle("done", isDone);
      checkbox.classList.toggle("checked", isDone);
      checkbox.innerHTML = isDone ? "&#10003;" : "";
      setBadge(item, isDone);
      updateProgress();
    });

    function formatDue(value) {
      var parts = value.split("-");
      if (parts.length !== 3) return "";
      var month = parseInt(parts[1], 10);
      var day = parseInt(parts[2], 10);
      return month + "월 " + day + "일";
    }

    function escapeHtml(str) {
      var div = document.createElement("div");
      div.textContent = str;
      return div.innerHTML;
    }

    function openAddForm() {
      addTaskForm.hidden = false;
      addTaskBtn.hidden = true;
      newTaskTitle.focus();
    }

    function closeAddForm() {
      addTaskForm.hidden = true;
      addTaskBtn.hidden = false;
      newTaskTitle.value = "";
      newTaskAssignee.value = "";
      newTaskDue.value = "";
    }

    function addTask() {
      var title = newTaskTitle.value.trim();
      if (!title) {
        newTaskTitle.focus();
        return;
      }
      var assignee = newTaskAssignee.value.trim() || "담당자 미정";
      var dueText = formatDue(newTaskDue.value) || "마감일 미정";
      var isMine = assignee === "나";

      var item = document.createElement("div");
      item.className = "task-item";
      item.setAttribute("data-status", "wait");
      item.setAttribute("data-mine", isMine ? "true" : "false");
      item.innerHTML =
        '<div class="checkbox"></div>' +
        '<div class="task-info">' +
        '<div class="task-title">' + escapeHtml(title) + "</div>" +
        '<div class="task-meta">' + escapeHtml(assignee) + " · 마감 " + dueText + "</div>" +
        "</div>" +
        '<div class="status-badge status-wait">대기</div>';

      taskListEl.appendChild(item);
      updateProgress();
      closeAddForm();
    }

    addTaskBtn.addEventListener("click", openAddForm);
    cancelAddBtn.addEventListener("click", closeAddForm);
    confirmAddBtn.addEventListener("click", addTask);
    newTaskTitle.addEventListener("keydown", function (e) {
      if (e.key === "Enter") addTask();
    });

    updateProgress();
  </script>
</body>
</html>
