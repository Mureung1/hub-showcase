<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>에코봇 · 대형폐기물</title><link rel="stylesheet" href="style.css"></head>
<body>
<div class="phone">
  <header class="top"><div class="back-row"><a href="home.html" class="back">←</a><div class="brand" style="font-size:17px">대형폐기물</div></div></header>
  <div class="content">
    <div class="region-bar">📍 부산 / 해운대구</div>
    <select class="selfield"><option>품목 선택 — 예: 소파, 냉장고</option><option>소파</option><option>냉장고</option><option>책상</option></select>

    <div class="step-flow">
      <div class="sflow-item done"><div class="sflow-num">1</div><div class="sflow-label">품목</div></div>
      <div class="sflow-item done"><div class="sflow-num">2</div><div class="sflow-label">지역</div></div>
      <div class="sflow-item"><div class="sflow-num">3</div><div class="sflow-label">수수료</div></div>
      <div class="sflow-item"><div class="sflow-num">4</div><div class="sflow-label">신고</div></div>
    </div>

    <div class="card">
      <h4>예상 수수료</h4>
      <div style="font-family:var(--font-display);font-size:28px;font-weight:700;color:var(--green-700)">₩5,000</div>
      <div style="font-size:12px;color:var(--sub);margin-top:4px">2인용 소파 기준 · 해운대구 2026년 요금</div>
    </div>
    <button class="btn-primary">공식 신고 사이트로 이동 →</button>
    <div class="info-card">공식 신고 사이트로 이동 후 스티커 구매 및 배출 안내를 받을 수 있습니다.</div>
  </div>
</div>
</body></html>
