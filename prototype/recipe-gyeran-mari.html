  <div class="page">

          <span class="name">당근 약간 <span class="kamis-tag cheap">KAMIS 대비 -4%</span></span>
          <span class="links"><a href="https://search.shopping.naver.com/search/all?query=당근">네이버</a><a href="https://www.coupang.com/np/search?component=&q=당근">쿠팡</a></span>
