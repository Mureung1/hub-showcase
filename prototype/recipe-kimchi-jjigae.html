<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>김치찌개 — 끼니픽</title>
<link rel="stylesheet" href="style-warm.css">
</head>
<body>
<div class="app">
  <nav class="site-nav">
    <div class="nav-inner">
      <a class="back-link" href="home.html">← 홈으로</a>
    </div>
  </nav>

  <div class="page">
    <div class="video-block">
      <div class="video-thumb">
        <img src="https://img.youtube.com/vi/4quUR3RLVyI/hqdefault.jpg" alt="김치찌개 만드는 법">
        <span class="play-circle">▶</span>
      </div>
      <div class="video-meta">
        <p class="hero-label">유튜브 만드는 법</p>
        <p class="hero-headline">김치찌개 · 20~30분</p>
      </div>
    </div>

    <div class="detail-grid">
      <div>
        <div class="ingredient-head">재료 · 필요량 · 참고 구매가</div>
        <div class="ingredient-row" data-ingredient="신김치">
          <span class="name">신김치 1컵</span>
          <span class="links"><a href="https://search.shopping.naver.com/search/all?query=김치">네이버</a><a href="https://www.coupang.com/np/search?component=&q=김치">쿠팡</a></span>
          <span class="price">1,200원</span>
        </div>
        <div class="ingredient-row" data-ingredient="돼지고기">
          <span class="name">돼지고기 100g</span>
          <span class="links"><a href="https://search.shopping.naver.com/search/all?query=돼지고기">네이버</a><a href="https://www.coupang.com/np/search?component=&q=돼지고기">쿠팡</a></span>
          <span class="price">900원</span>
        </div>
        <div class="ingredient-row" data-ingredient="두부">
          <span class="name">두부 1/4모</span>
          <span class="links"><a href="https://search.shopping.naver.com/search/all?query=두부">네이버</a><a href="https://www.coupang.com/np/search?component=&q=두부">쿠팡</a></span>
          <span class="price">600원</span>
        </div>
        <div class="ingredient-row" data-ingredient="대파">
          <span class="name">대파 약간 <span class="kamis-tag cheap">KAMIS 대비 -6%</span></span>
          <span class="links"><a href="https://search.shopping.naver.com/search/all?query=대파">네이버</a><a href="https://www.coupang.com/np/search?component=&q=대파">쿠팡</a></span>
          <span class="price">500원</span>
        </div>
        <div class="ingredient-total">
          <span class="label">1인분 총 재료비</span>
          <span class="value">3,200원</span>
        </div>
      </div>
      <div class="summary-card">
        <p class="hint">"구매 필요" 재료는 기본으로 체크돼 있어요. 보유 재료도 다시 살 거면 체크하세요.</p>
        <a class="pill-btn primary" href="https://search.shopping.naver.com/search/all?query=김치찌개 재료">네이버에서 한번에 구매</a>
        <a class="pill-btn" href="https://www.coupang.com/np/search?component=&q=김치찌개 재료">쿠팡에서 한번에 구매</a>
      </div>
    </div>
    <p class="filter-caption">KAMIS 평균 시세를 나타내어 평균보다 싼지 비싼지 나타냅니다.</p>
  </div>
</div>
<script src="recipe.js"></script>
