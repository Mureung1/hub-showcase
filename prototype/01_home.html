<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>홈 | 데일리 브리핑</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="phone-frame">

  <div class="home-topbar">
    <span class="logo"><span class="logo-icon">📈</span>브리플리</span>
    <span class="profile-icon">👤</span>
  </div>

  <div class="progress-bar" data-step="1">
    <span></span><span></span><span></span><span></span><span></span><span></span>
  </div>

  <div class="screen-content">

    <div class="briefing-card">
      <span class="badge">1</span>
      <p class="briefing-label">오늘의 브리핑</p>
      <h2 class="briefing-ticker">Apple Inc. (AAPL)</h2>
      <p class="briefing-date">2026년 7월 8일 (수) 발행</p>
    </div>

    <div class="streak-box">
      <p class="streak-title">학습 스트릭</p>
      <div class="streak-bars">
        <div class="streak-bar completed">
          <span class="bar" style="height: 70%"></span>
          <label>월</label>
        </div>
        <div class="streak-bar completed">
          <span class="bar" style="height: 85%"></span>
          <label>화</label>
        </div>
        <div class="streak-bar completed today">
          <span class="bar" style="height: 100%"></span>
          <label>수</label>
        </div>
        <div class="streak-bar">
          <span class="bar" style="height: 15%"></span>
          <label>목</label>
        </div>
        <div class="streak-bar">
          <span class="bar" style="height: 15%"></span>
          <label>금</label>
        </div>
      </div>
      <p class="streak-count">3일 연속 학습 중 🔥</p>
    </div>

  </div>

  <div class="bottom-cta">
    <a class="btn-cta" href="02_entry.html">브리핑 열기</a>
  </div>

</div>
</body>
</html>
