<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Home | Daily Briefing</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="phone-frame">

  <div class="home-topbar">
    <span class="logo"><span class="menu-icon">☰</span><span class="logo-text">Briefly</span></span>
    <span class="profile-icon">👤</span>
  </div>

  <div class="progress-section">
    <div class="progress-meta">
      <span class="progress-label">Today's Briefing</span>
      <span class="progress-fraction">1/6</span>
    </div>
    <div class="progress-track">
      <div class="progress-fill" style="width: 16.66%"></div>
    </div>
  </div>

  <div class="screen-content">

    <div class="briefing-card">
      <span class="badge">Hot</span>
      <p class="briefing-label">Today's Briefing</p>
      <h2 class="briefing-ticker">Apple Inc. (AAPL)</h2>
      <p class="briefing-date">2026년 7월 8일 (수) 발행</p>
    </div>

    <div class="streak-box">
      <p class="streak-title">Learning Streak</p>
      <div class="streak-row">
        <div class="streak-day completed">
          <span class="day-circle">✓</span>
          <span class="day-label">Mon</span>
        </div>
        <div class="streak-day completed">
          <span class="day-circle">✓</span>
          <span class="day-label">Tue</span>
        </div>
        <div class="streak-day completed today">
          <span class="day-circle">✓</span>
          <span class="day-label">Wed</span>
        </div>
        <div class="streak-day upcoming">
          <span class="day-circle">9</span>
          <span class="day-label">Thu</span>
        </div>
        <div class="streak-day upcoming">
          <span class="day-circle">10</span>
          <span class="day-label">Fri</span>
        </div>
      </div>
      <p class="streak-count">3-day streak 🔥</p>
    </div>

  </div>

  <div class="bottom-cta">
    <a class="btn-cta" href="02_entry.html">Open Briefing</a>
  </div>

  <nav class="bottom-nav">
    <a class="nav-item active" href="01_home.html"><span class="nav-item-icon">🏠</span>Home</a>
    <span class="nav-item"><span class="nav-item-icon">📈</span>Stocks</span>
    <span class="nav-item"><span class="nav-item-icon">📚</span>Learn</span>
    <span class="nav-item"><span class="nav-item-icon">👤</span>Profile</span>
  </nav>

</div>
</body>
</html>
