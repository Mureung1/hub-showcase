<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>회의시간 매칭</title>
<style>
  :root {
    --color-primary: #6C5CE7;
    --color-primary-light: #A29BFE;

    --bg-page: #F7F5F6;
    --bg-surface: #FFFFFF;
    --bg-dark: #1A1726;
    --bg-dark-alt: #262238;

    --text-primary: #1A1726;
    --text-secondary: #5C5670;
    --text-muted: #948FA4;
    --text-on-dark: #FFFFFF;
    --text-on-dark-muted: #A8A3BB;

    --border-subtle: rgba(26,23,38,0.05);
    --border-dark: rgba(255,255,255,0.07);

    --radius-sm: 9px;
    --radius-xl: 28px;
    --radius-full: 9999px;

    --shadow-sm: 0 1px 3px rgba(26,23,38,0.03);
    --shadow-lg: 0 14px 36px rgba(26,23,38,0.07);

    /* 격자 색 5단계 (겹치는 인원수) */
    --grid-0: #F2F0F4;
    --grid-1: #DED9FB;
    --grid-2: #BCB2F7;
    --grid-3: #9384EF;
    --grid-4: #6C5CE7;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    font-family: "Pretendard", -apple-system, BlinkMacSystemFont, "Segoe UI",
      "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    background: var(--bg-page);
    color: var(--text-primary);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 48px 24px;
  }

  .page {
    width: 100%;
    max-width: 720px;
  }

  .page-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 28px;
  }

  .page-header h1 {
    font-size: 36px;
    font-weight: 700;
    letter-spacing: -0.025em;
    color: var(--text-primary);
    margin-bottom: 6px;
  }

  .page-header .subtitle {
    font-size: 14px;
    color: var(--text-secondary);
  }

  .avatar {
    flex-shrink: 0;
    width: 44px;
    height: 44px;
    border-radius: var(--radius-full);
    background: linear-gradient(135deg, var(--color-primary), var(--color-primary-light));
    color: var(--text-on-dark);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
    font-weight: 700;
    box-shadow: var(--shadow-lg);
  }

  .card {
    background: var(--bg-surface);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-xl);
    box-shadow: var(--shadow-lg);
    padding: 28px 24px 32px;
  }

  .card-title {
    font-size: 15px;
    font-weight: 700;
    color: var(--text-primary);
    margin-bottom: 4px;
  }

  .card-subtitle {
    font-size: 13px;
    color: var(--text-muted);
    margin-bottom: 24px;
  }

  .grid-wrapper {
    overflow-x: auto;
  }

  .grid {
    display: grid;
    grid-template-columns: 84px repeat(5, 1fr);
    gap: 8px;
    min-width: 480px;
  }

  .day-label {
    text-align: center;
    font-size: 13px;
    font-weight: 700;
    color: var(--text-primary);
    padding: 10px 4px;
  }

  .time-label {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    font-size: 13px;
    font-weight: 500;
    color: var(--text-secondary);
    padding-right: 10px;
    white-space: nowrap;
  }

  .slot {
    height: 56px;
    background: var(--grid-0);
    border-radius: var(--radius-sm);
    cursor: pointer;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }

  .slot:hover {
    transform: scale(1.06);
    position: relative;
    z-index: 2;
  }

  .slot:active {
    transform: scale(0.97);
  }

  .slot.level-1 { background: var(--grid-1); }
  .slot.level-2 { background: var(--grid-2); }
  .slot.level-3 { background: var(--grid-3); }
  .slot.level-4 { background: var(--grid-3); }
  .slot.level-5 { background: var(--grid-4); }

  .slot.mine {
    box-shadow: inset 0 0 0 2px var(--color-primary);
  }

  .team-note {
    font-size: 13px;
    color: var(--text-muted);
    margin-bottom: 20px;
  }

  .team-note b {
    color: var(--text-secondary);
    font-weight: 600;
  }

  .legend {
    margin-top: 24px;
    padding-top: 20px;
    border-top: 1px solid var(--border-subtle);
  }

  .section-label {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.09em;
    color: var(--text-muted);
    margin-bottom: 12px;
  }

  .legend-scale {
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .legend-dot {
    width: 16px;
    height: 16px;
    border-radius: var(--radius-sm);
    background: var(--grid-1);
  }

  .legend-dot.level-2 { background: var(--grid-2); }
  .legend-dot.level-3 { background: var(--grid-3); }
  .legend-dot.level-4 { background: var(--grid-4); }

  .legend-text {
    font-size: 13px;
    color: var(--text-muted);
  }

  .legend-mine {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: 12px;
  }

  .legend-mine-dot {
    width: 16px;
    height: 16px;
    border-radius: var(--radius-sm);
    background: var(--grid-2);
    box-shadow: inset 0 0 0 2px var(--color-primary);
  }

  .footer-note {
    text-align: center;
    margin-top: 20px;
    font-size: 13px;
    color: var(--text-muted);
  }

  /* 추천 회의 시간 (다크 카드) */
  .recommend-card {
    margin-top: 16px;
    background: var(--bg-dark);
    border: 1px solid var(--border-dark);
  }

  .recommend-card .card-title {
    color: var(--text-on-dark);
  }

  .recommend-card .card-subtitle {
    color: var(--text-on-dark-muted);
  }

  .recommend-list {
    display: flex;
    flex-direction: column;
  }

  .recommend-item {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 4px;
  }

  .recommend-item + .recommend-item {
    border-top: 1px solid var(--border-dark);
  }

  .recommend-rank {
    flex-shrink: 0;
    width: 28px;
    height: 28px;
    border-radius: var(--radius-full);
    background: var(--bg-dark-alt);
    color: var(--text-on-dark-muted);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: 700;
  }

  .recommend-rank.rank-1 {
    background: var(--color-primary);
    color: var(--text-on-dark);
  }

  .recommend-info {
    flex: 1;
    min-width: 0;
  }

  .recommend-time {
    font-size: 15px;
    font-weight: 600;
    color: var(--text-on-dark);
  }

  .recommend-sub {
    font-size: 13px;
    color: var(--text-on-dark-muted);
    margin-top: 2px;
  }

  .recommend-badge {
    flex-shrink: 0;
    padding: 5px 12px;
    border-radius: var(--radius-full);
    font-size: 12px;
    font-weight: 700;
    background: var(--grid-1);
    color: var(--text-primary);
  }

  .recommend-badge.level-1 { background: var(--grid-1); color: var(--text-primary); }
  .recommend-badge.level-2 { background: var(--grid-2); color: var(--text-primary); }
  .recommend-badge.level-3 { background: var(--grid-3); color: var(--text-on-dark); }
  .recommend-badge.level-4 { background: var(--grid-3); color: var(--text-on-dark); }
  .recommend-badge.level-5 { background: var(--grid-4); color: var(--text-on-dark); }

  .recommend-empty {
    padding: 20px 4px;
    text-align: center;
    font-size: 13px;
    color: var(--text-on-dark-muted);
  }
</style>
</head>
<body>
  <div class="page">
    <header class="page-header">
      <div>
        <h1>회의시간 매칭</h1>
        <p class="subtitle">프로토타입 팀 · 팀원 4명</p>
      </div>
      <div class="avatar">나</div>
    </header>

    <div class="card">
      <div class="card-title">가능한 시간을 선택해주세요</div>
      <div class="card-subtitle">평일 오전 10시 ~ 오후 6시 사이에서 선택할 수 있어요</div>
      <div class="team-note">팀원 <b>지훈, 서연, 민준, 하은</b>의 가능 시간과 겹쳐서 보여드려요</div>

      <div class="grid-wrapper">
        <div class="grid" id="grid">
          <div class="corner-cell"></div>
          <div class="day-label">월</div>
          <div class="day-label">화</div>
          <div class="day-label">수</div>
          <div class="day-label">목</div>
          <div class="day-label">금</div>

          <div class="time-label">오전 10시</div>
          <div class="slot"></div>
          <div class="slot"></div>
          <div class="slot"></div>
          <div class="slot"></div>
          <div class="slot"></div>

          <div class="time-label">오후 12시</div>
          <div class="slot"></div>
          <div class="slot"></div>
          <div class="slot"></div>
          <div class="slot"></div>
          <div class="slot"></div>

          <div class="time-label">오후 2시</div>
          <div class="slot"></div>
          <div class="slot"></div>
          <div class="slot"></div>
          <div class="slot"></div>
          <div class="slot"></div>

          <div class="time-label">오후 4시</div>
          <div class="slot"></div>
          <div class="slot"></div>
          <div class="slot"></div>
          <div class="slot"></div>
          <div class="slot"></div>
        </div>
      </div>

      <div class="legend">
        <div class="section-label">겹치는 인원 · 적음 → 많음</div>
        <div class="legend-scale">
          <div class="legend-item">
            <div class="legend-dot"></div>
            <div class="legend-text">1명</div>
          </div>
          <div class="legend-item">
            <div class="legend-dot level-2"></div>
            <div class="legend-text">2명</div>
          </div>
          <div class="legend-item">
            <div class="legend-dot level-3"></div>
            <div class="legend-text">3명 이상</div>
          </div>
          <div class="legend-item">
            <div class="legend-dot level-4"></div>
            <div class="legend-text">전원 가능</div>
          </div>
        </div>
        <div class="legend-mine">
          <div class="legend-mine-dot"></div>
          <div class="legend-text">보라 테두리 = 내가 선택한 시간</div>
        </div>
      </div>
    </div>

    <div class="card recommend-card">
      <div class="card-title">✨ 추천 회의 시간</div>
      <div class="card-subtitle">가장 많은 팀원이 가능한 시간이에요</div>
      <div class="recommend-list" id="recommendList"></div>
    </div>

    <div class="footer-note">칸을 클릭해서 내 가능한 시간을 선택해보세요</div>
  </div>

  <script>
    // 가상 팀원별 가능 시간 (칸 index: 0~19, 왼쪽→오른쪽, 위→아래 순서)
    var teammates = [
      { name: "지훈", slots: [0, 1, 2, 5, 6, 10, 11, 15, 16] },
      { name: "서연", slots: [1, 2, 3, 6, 7, 8, 11, 12, 16, 17] },
      { name: "민준", slots: [2, 3, 4, 7, 8, 12, 13, 17, 18] },
      { name: "하은", slots: [0, 5, 10, 11, 12, 15, 16, 17, 18, 19] },
    ];

    var slotEls = Array.prototype.slice.call(document.querySelectorAll("#grid .slot"));
    var recommendListEl = document.getElementById("recommendList");
    var mySelected = new Set();
    var TOTAL_PEOPLE = teammates.length + 1; // 팀원 + 나

    var dayNames = ["월요일", "화요일", "수요일", "목요일", "금요일"];
    var timeNames = ["오전 10시", "오후 12시", "오후 2시", "오후 4시"];

    function slotLabel(index) {
      var dayIdx = index % 5;
      var timeIdx = Math.floor(index / 5);
      return dayNames[dayIdx] + " " + timeNames[timeIdx];
    }

    function teammateCount(index) {
      return teammates.filter(function (t) {
        return t.slots.indexOf(index) !== -1;
      }).length;
    }

    function updateRecommendation(counts) {
      var topIndices = counts
        .map(function (count, index) {
          return index;
        })
        .filter(function (index) {
          return counts[index] > 0;
        })
        .sort(function (a, b) {
          if (counts[b] !== counts[a]) return counts[b] - counts[a];
          return a - b;
        })
        .slice(0, 3);

      recommendListEl.innerHTML = "";

      if (topIndices.length === 0) {
        recommendListEl.innerHTML =
          '<div class="recommend-empty">아직 겹치는 시간이 없어요. 가능한 시간을 선택해보세요!</div>';
        return;
      }

      topIndices.forEach(function (index, rank) {
        var count = counts[index];
        var subText = count === TOTAL_PEOPLE ? count + "명 모두 가능" : count + "명 가능";

        var item = document.createElement("div");
        item.className = "recommend-item";
        item.innerHTML =
          '<div class="recommend-rank' + (rank === 0 ? " rank-1" : "") + '">' + (rank + 1) + "</div>" +
          '<div class="recommend-info">' +
          '<div class="recommend-time">' + slotLabel(index) + "</div>" +
          '<div class="recommend-sub">' + subText + "</div>" +
          "</div>" +
          '<div class="recommend-badge level-' + count + '">' + count + "명</div>";
        recommendListEl.appendChild(item);
      });
    }

    function render() {
      var counts = slotEls.map(function (_, index) {
        var iAmIn = mySelected.has(index);
        return teammateCount(index) + (iAmIn ? 1 : 0);
      });

      slotEls.forEach(function (slot, index) {
        var total = counts[index];
        var iAmIn = mySelected.has(index);

        slot.className = "slot level-" + total;
        slot.classList.toggle("mine", iAmIn);

        var names = teammates
          .filter(function (t) {
            return t.slots.indexOf(index) !== -1;
          })
          .map(function (t) {
            return t.name;
          });
        if (iAmIn) names.push("나");

        slot.title = total === 0 ? "가능한 사람이 없어요" : total + "명 가능 (" + names.join(", ") + ")";
      });

      updateRecommendation(counts);
    }

    slotEls.forEach(function (slot, index) {
      slot.addEventListener("click", function () {
        if (mySelected.has(index)) {
          mySelected.delete(index);
        } else {
          mySelected.add(index);
        }
        render();
      });
    });

    render();
  </script>
</body>
</html>
