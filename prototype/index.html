<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>끼니픽 — 프로토타입</title>
<link rel="stylesheet" href="style-warm.css">
</head>
<body class="fridge">
<div class="app">
  <nav class="site-nav">
    <div class="nav-inner">    </div>
  </nav>

  <div class="page">
    <div class="fridge-hero">
      <img src="../src/assets/fridge-empty.png" alt="끼니픽 — 문 열린 냉장고를 들여다보는 기니, '어떤 재료가 있더랑?'">
    </div>

    <section class="fridge-card">
      <span class="fridge-card-tail" aria-hidden="true"></span>
      <div class="fridge-header">
        <h1>내가 가진 재료는</h1>
        <span class="fridge-count">0개</span>
        <button type="button" class="fridge-clear" style="display:none">전체 해제</button>
      </div>

      <label class="nav-search fridge-search" for="ingredient-search">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <circle cx="7" cy="7" r="5.5" stroke="currentColor" stroke-width="1.5"/>
          <path d="M11.5 11.5L14.5 14.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
        <input type="text" id="ingredient-search" placeholder="재료 검색 (예: 순두부, 삼겹살)" autocomplete="off">
      </label>
      <p class="fridge-search-empty" hidden>검색 결과가 없어요. 다른 이름으로 찾아보세요.</p>

      <div class="filters">
        <div class="ingredient-section">
          <h2 class="ingredient-section-heading">채소</h2>
          <div class="chip-row">
            <input type="checkbox" id="ing-green-onion" value="green-onion"><label for="ing-green-onion">🌿 대파</label>
            <input type="checkbox" id="ing-onion" value="onion"><label for="ing-onion">🧅 양파</label>
            <input type="checkbox" id="ing-garlic" value="garlic"><label for="ing-garlic">🧄 마늘</label>
            <input type="checkbox" id="ing-potato" value="potato"><label for="ing-potato">🥔 감자</label>
            <input type="checkbox" id="ing-carrot" value="carrot"><label for="ing-carrot">🥕 당근</label>
            <input type="checkbox" id="ing-zucchini" value="zucchini"><label for="ing-zucchini">🟢 애호박</label>
            <input type="checkbox" id="ing-bean-sprout" value="bean-sprout"><label for="ing-bean-sprout">🌱 콩나물</label>
            <input type="checkbox" id="ing-spinach" value="spinach"><label for="ing-spinach">🍃 시금치</label>
            <input type="checkbox" id="ing-radish" value="radish"><label for="ing-radish">🫚 무</label>
            <input type="checkbox" id="ing-cucumber" value="cucumber"><label for="ing-cucumber">🥒 오이</label>
            <input type="checkbox" id="ing-tomato" value="tomato"><label for="ing-tomato">🍅 토마토</label>
            <input type="checkbox" id="ing-lettuce" value="lettuce"><label for="ing-lettuce">🥗 양상추</label>
          </div>
        </div>

        <div class="ingredient-section">
          <h2 class="ingredient-section-heading">고기</h2>
          <div class="chip-row">
            <input type="checkbox" id="ing-pork-neck" value="pork-neck" data-group="돼지고기"><label for="ing-pork-neck">🐷 목살</label>
            <input type="checkbox" id="ing-pork-belly" value="pork-belly" data-group="돼지고기"><label for="ing-pork-belly">🥓 삼겹살</label>
            <input type="checkbox" id="ing-beef-bulgogi" value="beef-bulgogi" data-group="소고기"><label for="ing-beef-bulgogi">🥩 불고기용소고기</label>
            <input type="checkbox" id="ing-beef-ground" value="beef-ground" data-group="소고기"><label for="ing-beef-ground">🍖 다짐소고기</label>
            <input type="checkbox" id="ing-bacon" value="bacon"><label for="ing-bacon">🥓 베이컨</label>
            <input type="checkbox" id="ing-chicken-breast" value="chicken-breast"><label for="ing-chicken-breast">🍗 닭가슴살</label>
          </div>
        </div>

        <div class="ingredient-section">
          <h2 class="ingredient-section-heading">해산물</h2>
          <div class="chip-row">
            <input type="checkbox" id="ing-shrimp" value="shrimp"><label for="ing-shrimp">🍤 새우</label>
            <input type="checkbox" id="ing-squid" value="squid"><label for="ing-squid">🦑 오징어</label>
            <input type="checkbox" id="ing-mackerel" value="mackerel"><label for="ing-mackerel">🐟 고등어</label>
            <input type="checkbox" id="ing-salmon" value="salmon"><label for="ing-salmon">🍣 연어</label>
            <input type="checkbox" id="ing-shellfish" value="shellfish"><label for="ing-shellfish">🦪 조개류</label>
            <input type="checkbox" id="ing-kelp" value="kelp"><label for="ing-kelp">🍀 다시마</label>
          </div>
        </div>

        <div class="ingredient-section">
          <h2 class="ingredient-section-heading">가공식품</h2>
          <div class="chip-row">
            <input type="checkbox" id="ing-kimchi" value="kimchi"><label for="ing-kimchi">🥬 김치</label>
            <input type="checkbox" id="ing-spam" value="spam"><label for="ing-spam">🥫 스팸·햄</label>
            <input type="checkbox" id="ing-tuna" value="tuna"><label for="ing-tuna">🐟 참치캔</label>
            <input type="checkbox" id="ing-fish-cake" value="fish-cake"><label for="ing-fish-cake">🍢 어묵</label>
            <input type="checkbox" id="ing-sausage" value="sausage"><label for="ing-sausage">🌭 소시지</label>
            <input type="checkbox" id="ing-cheese" value="cheese"><label for="ing-cheese">🧀 치즈</label>
          </div>
        </div>

        <div class="ingredient-section">
          <h2 class="ingredient-section-heading">면·곡물</h2>
          <div class="chip-row">
            <input type="checkbox" id="ing-rice" value="rice"><label for="ing-rice">🍚 밥</label>
            <input type="checkbox" id="ing-ramyeon" value="ramyeon"><label for="ing-ramyeon">🍜 라면</label>
            <input type="checkbox" id="ing-bread" value="bread"><label for="ing-bread">🍞 식빵</label>
            <input type="checkbox" id="ing-spaghetti" value="spaghetti"><label for="ing-spaghetti">🍝 스파게티면</label>
            <input type="checkbox" id="ing-udon" value="udon"><label for="ing-udon">🍜 우동면</label>
            <input type="checkbox" id="ing-glass-noodle" value="glass-noodle"><label for="ing-glass-noodle">🥢 당면</label>
          </div>
        </div>

        <div class="ingredient-section">
          <h2 class="ingredient-section-heading">기타</h2>
          <div class="chip-row">
            <input type="checkbox" id="ing-egg" value="egg"><label for="ing-egg">🥚 계란</label>
            <input type="checkbox" id="ing-tofu-regular" value="tofu-regular" data-group="두부"><label for="ing-tofu-regular">🧈 두부</label>
            <input type="checkbox" id="ing-tofu-soft" value="tofu-soft" data-group="두부"><label for="ing-tofu-soft">🥣 순두부</label>
            <input type="checkbox" id="ing-cooking-oil" value="cooking-oil"><label for="ing-cooking-oil">🍶 식용유</label>
            <input type="checkbox" id="ing-olive-oil" value="olive-oil"><label for="ing-olive-oil">🫒 올리브유</label>
            <input type="checkbox" id="ing-sesame-oil" value="sesame-oil"><label for="ing-sesame-oil">🍶 참기름</label>
          </div>
        </div>

        <div class="ingredient-section">
          <h2 class="ingredient-section-heading">조미료</h2>
          <div class="chip-row">
            <input type="checkbox" id="ing-salt" value="salt" data-seasoning="true"><label for="ing-salt">🧂 소금</label>
            <input type="checkbox" id="ing-sugar" value="sugar" data-seasoning="true"><label for="ing-sugar">🫙 설탕</label>
            <input type="checkbox" id="ing-soy-sauce" value="soy-sauce" data-seasoning="true"><label for="ing-soy-sauce">🍶 간장</label>
            <input type="checkbox" id="ing-soup-soy-sauce" value="soup-soy-sauce" data-seasoning="true"><label for="ing-soup-soy-sauce">🍶 국간장</label>
            <input type="checkbox" id="ing-vinegar" value="vinegar" data-seasoning="true"><label for="ing-vinegar">🧪 식초</label>
            <input type="checkbox" id="ing-corn-syrup" value="corn-syrup" data-seasoning="true"><label for="ing-corn-syrup">🍯 물엿</label>
            <input type="checkbox" id="ing-red-pepper-powder" value="red-pepper-powder" data-seasoning="true"><label for="ing-red-pepper-powder">🌶️ 고춧가루</label>
            <input type="checkbox" id="ing-mayo" value="mayo" data-seasoning="true"><label for="ing-mayo">🥫 마요네즈</label>
            <input type="checkbox" id="ing-gochujang" value="gochujang" data-seasoning="true"><label for="ing-gochujang">🌶️ 고추장</label>
            <input type="checkbox" id="ing-doenjang" value="doenjang" data-seasoning="true"><label for="ing-doenjang">🫘 된장</label>
            <input type="checkbox" id="ing-pepper" value="pepper" data-seasoning="true"><label for="ing-pepper">🧂 후추</label>
            <input type="checkbox" id="ing-oyster-sauce" value="oyster-sauce" data-seasoning="true"><label for="ing-oyster-sauce">🫙 굴소스</label>
            <input type="checkbox" id="ing-chicken-stock" value="chicken-stock" data-seasoning="true"><label for="ing-chicken-stock">🥫 치킨스톡</label>
          </div>
        </div>
      </div>

      <button type="button" class="btn-complete">완료</button>
    </section>
  </div>
</div>
<script src="fridge.js"></script>
</body>
</html>
