<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>끼니픽 — 프로토타입</title>
<link rel="stylesheet" href="style-warm.css">
</head>
<body class="fridge">
<div class="app">
  <nav class="site-nav">
    <div class="nav-inner">    </div>
  </nav>

  <div class="page">
    <div class="fridge-hero">
      <img src="../src/assets/fridge-empty.png" alt="끼니픽 — 문 열린 냉장고를 들여다보는 기니, '어떤 재료가 있더랑?'">
    </div>

    <section class="fridge-card">
      <span class="fridge-card-tail" aria-hidden="true"></span>
      <div class="fridge-header">
        <h1>내가 가진 재료는</h1>
        <span class="fridge-count">0개</span>
        <button type="button" class="fridge-clear" style="display:none">전체 해제</button>
      </div>

      <div class="filters">
        <div class="chip-row">
          <input type="checkbox" id="ing-egg" value="egg"><label for="ing-egg">🥚 계란</label>
          <input type="checkbox" id="ing-kimchi" value="kimchi"><label for="ing-kimchi">🥬 김치</label>
          <input type="checkbox" id="ing-tofu" value="tofu"><label for="ing-tofu">🧈 두부</label>
          <input type="checkbox" id="ing-pork" value="pork"><label for="ing-pork">🐷 돼지고기</label>
          <input type="checkbox" id="ing-beef" value="beef"><label for="ing-beef">🥩 소고기</label>
          <input type="checkbox" id="ing-green-onion" value="green-onion"><label for="ing-green-onion">🌿 대파</label>
          <input type="checkbox" id="ing-onion" value="onion"><label for="ing-onion">🧅 양파</label>
          <input type="checkbox" id="ing-garlic" value="garlic"><label for="ing-garlic">🧄 마늘</label>
          <input type="checkbox" id="ing-potato" value="potato"><label for="ing-potato">🥔 감자</label>
          <input type="checkbox" id="ing-carrot" value="carrot"><label for="ing-carrot">🥕 당근</label>
          <input type="checkbox" id="ing-rice" value="rice"><label for="ing-rice">🍚 밥</label>
          <input type="checkbox" id="ing-ramyeon" value="ramyeon"><label for="ing-ramyeon">🍜 라면</label>
          <input type="checkbox" id="ing-tuna" value="tuna"><label for="ing-tuna">🐟 참치캔</label>
          <input type="checkbox" id="ing-spam" value="spam"><label for="ing-spam">🥫 스팸·햄</label>
          <input type="checkbox" id="ing-bread" value="bread"><label for="ing-bread">🍞 식빵</label>
          <input type="checkbox" id="ing-shrimp" value="shrimp"><label for="ing-shrimp">🍤 새우</label>
          <input type="checkbox" id="ing-squid" value="squid"><label for="ing-squid">🦑 오징어</label>
          <input type="checkbox" id="ing-zucchini" value="zucchini"><label for="ing-zucchini">🟢 애호박</label>
          <input type="checkbox" id="ing-bean-sprout" value="bean-sprout"><label for="ing-bean-sprout">🌱 콩나물</label>
          <input type="checkbox" id="ing-spinach" value="spinach"><label for="ing-spinach">🍃 시금치</label>
          <input type="checkbox" id="ing-radish" value="radish"><label for="ing-radish">🫚 무</label>
          <input type="checkbox" id="ing-cucumber" value="cucumber"><label for="ing-cucumber">🥒 오이</label>
          <input type="checkbox" id="ing-fish-cake" value="fish-cake"><label for="ing-fish-cake">🍢 어묵</label>
          <input type="checkbox" id="ing-sausage" value="sausage"><label for="ing-sausage">🌭 소시지</label>
          <input type="checkbox" id="ing-spaghetti" value="spaghetti"><label for="ing-spaghetti">🍝 스파게티면</label>
          <input type="checkbox" id="ing-tomato" value="tomato"><label for="ing-tomato">🍅 토마토</label>
          <input type="checkbox" id="ing-bacon" value="bacon"><label for="ing-bacon">🥓 베이컨</label>
          <input type="checkbox" id="ing-cheese" value="cheese"><label for="ing-cheese">🧀 치즈</label>
          <input type="checkbox" id="ing-lettuce" value="lettuce"><label for="ing-lettuce">🥗 양상추</label>
        </div>
      </div>

      <button type="button" class="btn-complete">완료</button>
    </section>
  </div>
</div>
<script src="fridge.js"></script>
</body>
</html>
