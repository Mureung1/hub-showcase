<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>회의시간 매칭</title>
<style>
  :root {
    --toss-blue: #3182f6;
    --toss-blue-light: #eef4ff;
    --toss-gray-900: #191f28;
    --toss-gray-600: #4e5968;
    --toss-gray-400: #8b95a1;
    --toss-gray-200: #e5e8eb;
    --toss-gray-100: #f2f4f6;
    --toss-bg: #f9fafb;
    --shadow-soft: 0 4px 16px rgba(0, 0, 0, 0.05);
    --shadow-card: 0 2px 8px rgba(0, 0, 0, 0.04);
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    font-family: "Pretendard", -apple-system, BlinkMacSystemFont, "Segoe UI",
      "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    background: var(--toss-bg);
    color: var(--toss-gray-900);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 40px 16px;
  }

  .page {
    width: 100%;
    max-width: 720px;
  }

  .header {
    padding: 8px 4px 28px;
  }

  .header h1 {
    font-size: 26px;
    font-weight: 700;
    letter-spacing: -0.5px;
    margin-bottom: 8px;
  }

  .header p {
    font-size: 15px;
    color: var(--toss-gray-600);
    line-height: 1.5;
  }

  .card {
    background: #ffffff;
    border-radius: 24px;
    box-shadow: var(--shadow-soft);
    padding: 28px 24px 32px;
  }

  .card-title {
    font-size: 16px;
    font-weight: 600;
    color: var(--toss-gray-900);
    margin-bottom: 4px;
  }

  .card-subtitle {
    font-size: 13px;
    color: var(--toss-gray-400);
    margin-bottom: 24px;
  }

  .grid-wrapper {
    overflow-x: auto;
  }

  .grid {
    display: grid;
    grid-template-columns: 84px repeat(5, 1fr);
    gap: 8px;
    min-width: 480px;
  }

  .corner-cell {
    /* empty top-left corner */
  }

  .day-label {
    text-align: center;
    font-size: 14px;
    font-weight: 600;
    color: var(--toss-gray-900);
    padding: 10px 4px;
  }

  .time-label {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    font-size: 13px;
    font-weight: 500;
    color: var(--toss-gray-600);
    padding-right: 10px;
    white-space: nowrap;
  }

  .slot {
    height: 56px;
    background: var(--toss-gray-100);
    border-radius: 14px;
    border: 1px solid transparent;
    transition: background 0.15s ease;
  }

  .slot:hover {
    background: var(--toss-blue-light);
    border-color: #d6e6ff;
  }

  .legend {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 24px;
    padding-top: 20px;
    border-top: 1px solid var(--toss-gray-200);
  }

  .legend-dot {
    width: 12px;
    height: 12px;
    border-radius: 4px;
    background: var(--toss-gray-100);
  }

  .legend-text {
    font-size: 13px;
    color: var(--toss-gray-400);
  }

  .footer-note {
    text-align: center;
    margin-top: 20px;
    font-size: 13px;
    color: var(--toss-gray-400);
  }
</style>
</head>
<body>
  <div class="page">
    <div class="header">
      <h1>회의시간 매칭</h1>
      <p>가능한 시간대를 선택하면 팀원들과 겹치는 시간을 쉽게 찾을 수 있어요.</p>
    </div>

    <div class="card">
      <div class="card-title">가능한 시간을 선택해주세요</div>
      <div class="card-subtitle">평일 오전 10시 ~ 오후 6시 사이에서 선택할 수 있어요</div>

      <div class="grid-wrapper">
        <div class="grid">
          <div class="corner-cell"></div>
          <div class="day-label">월</div>
          <div class="day-label">화</div>
          <div class="day-label">수</div>
          <div class="day-label">목</div>
          <div class="day-label">금</div>

          <div class="time-label">오전 10시</div>
          <div class="slot"></div>
          <div class="slot"></div>
          <div class="slot"></div>
          <div class="slot"></div>
          <div class="slot"></div>

          <div class="time-label">오후 12시</div>
          <div class="slot"></div>
          <div class="slot"></div>
          <div class="slot"></div>
          <div class="slot"></div>
          <div class="slot"></div>

          <div class="time-label">오후 2시</div>
          <div class="slot"></div>
          <div class="slot"></div>
          <div class="slot"></div>
          <div class="slot"></div>
          <div class="slot"></div>

          <div class="time-label">오후 4시</div>
          <div class="slot"></div>
          <div class="slot"></div>
          <div class="slot"></div>
          <div class="slot"></div>
          <div class="slot"></div>
        </div>
      </div>

      <div class="legend">
        <div class="legend-dot"></div>
        <div class="legend-text">선택 가능한 시간대</div>
      </div>
    </div>

    <div class="footer-note">클릭 기능은 다음 단계에서 추가될 예정이에요</div>
  </div>
</body>
</html>
