<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scholar-Sync Prototype Layout</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="grid-container">
        <!-- 상단 좌측: Profile (3/4 너비 차지) -->
        <section class="grid-item profile">
            <div class="profile-header">
                <h2>연구 프로필</h2>
                <div class="academic-identity">
                    <span class="label">소속/전공</span>
                    <span class="value">컴퓨터공학부 / 인공지능 전공</span>
                </div>
            </div>
            
            <div class="profile-section">
                <h3>학술 채널 모니터링</h3>
                <div class="toggle-group">
                    <button class="toggle-btn active" data-channel="arxiv">arXiv</button>
                    <button class="toggle-btn active" data-channel="ieee">IEEE</button>
                    <button class="toggle-btn" data-channel="neurips">NeurIPS</button>
                    <button class="toggle-btn" data-channel="cvpr">CVPR</button>
                    <button class="toggle-btn" data-channel="acl">ACL</button>
                </div>
            </div>
            
            <div class="profile-section">
                <h3>연구 키워드</h3>
                <div class="keyword-container">
                    <div class="keyword-list" id="keyword-list">
                        <span class="keyword-badge">Large Language Models <button class="keyword-delete" aria-label="삭제">&times;</button></span>
                        <span class="keyword-badge">RAG <button class="keyword-delete" aria-label="삭제">&times;</button></span>
                        <span class="keyword-badge">Information Retrieval <button class="keyword-delete" aria-label="삭제">&times;</button></span>
                    </div>
                    <form class="keyword-form" id="keyword-form" onsubmit="event.preventDefault();">
                        <input type="text" id="keyword-input" placeholder="새 연구 키워드 입력..." aria-label="새 키워드 입력">
                        <button type="submit" class="btn-add-keyword">추가</button>
                    </form>
                </div>
            </div>
        </section>
        
        <!-- 상단 우측: Curation (1/4 너비 차지) -->
        <section class="grid-item curation">
            <div class="curation-header">
                <h2>큐레이션 보드</h2>
            </div>
            
            <div class="curation-body">
                <!-- 쿼리 입력/디스플레이 박스 -->
                <div class="query-section">
                    <label for="query-input-box">연구 질문 (Query)</label>
                    <textarea id="query-input-box" placeholder="탐색하고 싶은 구체적인 연구 질문이나 키워드 조합을 입력하세요..." rows="3">최신 거대 언어 모델(LLM)의 효율적인 파인튜닝 기법과 검색 증강 생성(RAG)의 융합 연구 동향 탐색</textarea>
                </div>
                
                <!-- 큐레이션 시작 마스터 버튼 -->
                <button class="btn-start-curation">
                    <span>큐레이션 시작</span>
                    <svg class="icon-play" viewBox="0 0 24 24" width="16" height="16">
                        <path fill="currentColor" d="M8 5v14l11-7z"/>
                    </svg>
                </button>
                
                <!-- 분석 상태 및 프로그레스 컴포넌트 -->
                <div class="analysis-status">
                    <div class="status-info">
                        <span class="status-label">에이전트 분석 상태</span>
                        <span class="status-percent">65%</span>
                    </div>
                    <div class="progress-bar-container">
                        <div class="progress-bar" style="width: 65%;"></div>
                    </div>
                    <div class="status-subtask">
                        <span class="pulse-indicator"></span>
                        <span class="subtask-text">arXiv 및 IEEE 데이터베이스에서 관련 논문 초록 수집 중...</span>
                    </div>
                </div>
            </div>
        </section>
        
        <!-- 하단: Insights & Library (전체 너비 차지) -->
        <section class="grid-item insights-library">
            <!-- Insights & Library Area Skeleton -->
        </section>
    </div>
</body>
</html>
