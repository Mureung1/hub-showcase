<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>계란토스트 — 끼니픽</title>
<link rel="stylesheet" href="style-warm.css">
</head>
<body>
<div class="app">
  <nav class="site-nav">
    <div class="nav-inner">
      <a class="back-link" href="home.html">← 홈으로</a>

  </nav>

  <div class="page">
    <div class="video-block">

        <img src="https://img.youtube.com/vi/y_rgEYvCKxo/hqdefault.jpg" alt="계란토스트 만드는 법">
        <span class="play-circle">▶</span>
      </div>
      <div class="video-meta">
        <p class="hero-label">유튜브 만드는 법</p>
        <p class="hero-headline">계란토스트 · 10분 미만</p>
      </div>
    </div>

    <div class="detail-grid">
      <div>
        <div class="ingredient-head">재료 · 필요량 · 참고 구매가</div>
        <div class="ingredient-row" data-ingredient="식빵">
          <span class="name">식빵 2장</span>
          <span class="links"><a href="https://search.shopping.naver.com/search/all?query=식빵">네이버</a><a href="https://www.coupang.com/np/search?component=&q=식빵">쿠팡</a></span>
          <span class="price">900원</span>
        </div>
        <div class="ingredient-row" data-ingredient="계란">
          <span class="name">계란 2개</span>
          <span class="links"><a href="https://search.shopping.naver.com/search/all?query=계란">네이버</a><a href="https://www.coupang.com/np/search?component=&q=계란">쿠팡</a></span>

        <div class="ingredient-row" data-ingredient="설탕">
          <span class="name">설탕 약간</span>
          <span class="links"><a href="https://search.shopping.naver.com/search/all?query=설탕">네이버</a><a href="https://www.coupang.com/np/search?component=&q=설탕">쿠팡</a></span>
          <span class="price">200원</span>
        </div>
        <div class="ingredient-total">
          <span class="label">1인분 총 재료비</span>
          <span class="value">2,000원</span>
        </div>
      </div>
      <div class="summary-card">
        <p class="hint">"구매 필요" 재료는 기본으로 체크돼 있어요. 보유 재료도 다시 살 거면 체크하세요.</p>
        <a class="pill-btn primary" href="https://search.shopping.naver.com/search/all?query=계란토스트 재료">네이버에서 한번에 구매</a>
        <a class="pill-btn" href="https://www.coupang.com/np/search?component=&q=계란토스트 재료">쿠팡에서 한번에 구매</a>
      </div>
    </div>
    <p class="filter-caption">KAMIS 평균 시세를 나타내어 평균보다 싼지 비싼지 나타냅니다.</p>
