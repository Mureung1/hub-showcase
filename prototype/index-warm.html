<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>식비구조대 — 프로토타입 (웜톤)</title>
<link rel="stylesheet" href="style-warm.css">
</head>
<body>
<div class="app">
  <nav class="site-nav">
    <div class="nav-inner">
    <span class="brand"><img class="logo-emblem" src="../src/assets/logo-emblem.png" alt=""><img class="logo-wordmark" src="../src/assets/logo-wordmark.png" alt="식비구조대"></span>
    <div class="nav-search"><svg width="16" height="16" viewBox="0 0 16 16" fill="none"><circle cx="7" cy="7" r="5.5" stroke="currentColor"/><path d="M11.5 11.5L15 15" stroke="currentColor" stroke-linecap="round"/></svg><input type="text" placeholder="검색어를 입력해주세요"></div>
    </div>
    </nav>

  <div class="page">
    <div class="promo-banner">
      <input type="radio" name="promo" id="promo-1" class="promo-radio" checked>
      <input type="radio" name="promo" id="promo-2" class="promo-radio">
      <input type="radio" name="promo" id="promo-3" class="promo-radio">

      <div class="promo-slide" data-slide="1">
        <div class="promo-text">
          <p class="promo-eyebrow">이번 주 최저가 특가</p>
          <h2>제철 재료로<br>가성비 요리 찾기</h2>
        </div>
        <img class="promo-image" src="https://img.youtube.com/vi/4quUR3RLVyI/hqdefault.jpg" alt="">
      </div>
      <div class="promo-slide" data-slide="2">
        <div class="promo-text">
          <p class="promo-eyebrow">이번 주 가성비 픽</p>
          <h2>가성비 TOP3<br>레시피 모아보기</h2>
        </div>
        <img class="promo-image" src="https://img.youtube.com/vi/RUgH6TBDtsM/hqdefault.jpg" alt="">
      </div>
      <div class="promo-slide" data-slide="3">
        <div class="promo-text">
          <p class="promo-eyebrow">바쁜 날엔 이거</p>
          <h2>10분 안에<br>완성하는 한 끼</h2>
        </div>
        <img class="promo-image" src="https://img.youtube.com/vi/Wk4gfmVRE_I/hqdefault.jpg" alt="">
      </div>

      <div class="promo-dots">
        <label for="promo-1" class="promo-dot"></label>
        <label for="promo-2" class="promo-dot"></label>
        <label for="promo-3" class="promo-dot"></label>
      </div>
    </div>

    <div class="quick-tabs" role="tablist">
      <button type="button" class="quick-tab is-active" data-cuisine-tab="all">전체</button>
      <button type="button" class="quick-tab" data-cuisine-tab="korean">한식</button>
      <button type="button" class="quick-tab" data-cuisine-tab="japanese">일식</button>
      <button type="button" class="quick-tab" data-cuisine-tab="chinese">중식</button>
      <button type="button" class="quick-tab" data-cuisine-tab="western">양식</button>
      <button type="button" class="quick-tab" data-cuisine-tab="etc">기타</button>
    </div>

    <div class="filters">
      <div class="filter-group">
        <span class="filter-group-label">음식종류</span>
        <div class="chip-row">
          <input type="checkbox" id="type-main"><label for="type-main">메인음식</label>
          <input type="checkbox" id="type-side"><label for="type-side">반찬</label>
          <input type="checkbox" id="type-snack"><label for="type-snack">간식</label>
        </div>
      </div>
      <div class="filter-group">
        <span class="filter-group-label">재료</span>
        <div class="chip-row">
          <input type="checkbox" id="ing-egg"><label for="ing-egg">계란</label>
          <input type="checkbox" id="ing-pork"><label for="ing-pork">돼지고기</label>
          <input type="checkbox" id="ing-tofu"><label for="ing-tofu">두부</label>
          <input type="checkbox" id="ing-kimchi"><label for="ing-kimchi">김치</label>
          <input type="checkbox" id="ing-ramyeon"><label for="ing-ramyeon">라면</label>
        </div>
      </div>
      <div class="filter-group">
        <span class="filter-group-label">시간</span>
        <div class="chip-row">
          <input type="checkbox" id="time-under10"><label for="time-under10">10분 미만</label>
          <input type="checkbox" id="time-10to20"><label for="time-10to20">10~20분</label>
          <input type="checkbox" id="time-20to30"><label for="time-20to30">20~30분</label>
          <input type="checkbox" id="time-over30"><label for="time-over30">30분 이상</label>
        </div>
      </div>
    </div>

    <ul class="results">
      <li data-type="main" data-cuisine="korean" data-time="under10" data-ing="egg">
        <a class="recipe-card" href="recipe-gyeran-bokkeumbap.html">
          <img class="recipe-thumb" src="https://img.youtube.com/vi/RUgH6TBDtsM/hqdefault.jpg" alt="계란볶음밥">
          <div class="recipe-body">
            <span class="recipe-name">계란볶음밥</span>
            <span class="recipe-sub">10분 미만</span>
            <div class="recipe-price-row"><span class="recipe-price">2,200원</span></div>
          </div>
        </a>
      </li>
      <li data-type="main" data-cuisine="korean" data-time="under10" data-ing="ramyeon egg">
        <a class="recipe-card" href="recipe-shin-ramyeon.html">
          <img class="recipe-thumb" src="https://img.youtube.com/vi/Wk4gfmVRE_I/hqdefault.jpg" alt="신라면">
          <div class="recipe-body">
            <span class="recipe-name">신라면</span>
            <span class="recipe-sub">10분 미만</span>
            <div class="recipe-price-row"><span class="recipe-price">1,200원</span><span class="best-tag">최저가</span></div>
          </div>
        </a>
      </li>
      <li data-type="snack" data-cuisine="etc" data-time="under10" data-ing="egg">
        <a class="recipe-card" href="recipe-gyeran-toast.html">
          <img class="recipe-thumb" src="https://img.youtube.com/vi/y_rgEYvCKxo/hqdefault.jpg" alt="계란토스트">
          <div class="recipe-body">
            <span class="recipe-name">계란토스트</span>
            <span class="recipe-sub">10분 미만</span>
            <div class="recipe-price-row"><span class="recipe-price">2,000원</span></div>
          </div>
        </a>
      </li>
      <li data-type="side" data-cuisine="korean" data-time="10to20" data-ing="egg">
        <a class="recipe-card" href="recipe-gyeran-mari.html">
          <img class="recipe-thumb" src="https://img.youtube.com/vi/6gqSdqiN53s/hqdefault.jpg" alt="계란말이">
          <div class="recipe-body">
            <span class="recipe-name">계란말이</span>
            <span class="recipe-sub">10~20분</span>
            <div class="recipe-price-row"><span class="recipe-price">2,100원</span></div>
          </div>
        </a>
      </li>
      <li data-type="main" data-cuisine="korean" data-time="20to30" data-ing="kimchi pork tofu">
        <a class="recipe-card" href="recipe-kimchi-jjigae.html">
          <img class="recipe-thumb" src="https://img.youtube.com/vi/4quUR3RLVyI/hqdefault.jpg" alt="김치찌개">
          <div class="recipe-body">
            <span class="recipe-name">김치찌개</span>
            <span class="recipe-sub">20~30분</span>
            <div class="recipe-price-row"><span class="recipe-price">3,200원</span></div>
          </div>
        </a>
      </li>
      <li data-type="main" data-cuisine="korean" data-time="20to30" data-ing="pork">
        <a class="recipe-card" href="recipe-jeyuk-bokkeum.html">
          <img class="recipe-thumb" src="https://img.youtube.com/vi/AE7CsTg3iFc/hqdefault.jpg" alt="제육볶음">
          <div class="recipe-body">
            <span class="recipe-name">제육볶음</span>
            <span class="recipe-sub">20~30분</span>
            <div class="recipe-price-row"><span class="recipe-price">4,200원</span></div>
          </div>
        </a>
      </li>
    </ul>
  </div>
</div>
<script src="filter.js"></script>
</body>
</html>
