<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>깸 · 오늘의 미션</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app-shell">
  <header class="screen-header">
    <div class="header-side">
      <a class="icon-btn" href="read-highlighted.html" aria-label="뒤로가기">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M15 5l-7 7 7 7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </a>
      <h1>오늘의 미션</h1>
    </div>
    <div class="header-side header-side--right"></div>
  </header>

  <main class="screen-main">
    <div class="card">
      <p class="mission-quote-label">내가 칠한 문장</p>
      <p class="mission-quote-text">&ldquo;실제로 한 연구는 짧은 영상에 익숙해질수록 긴 글의 논증을 끝까지 따라가는 능력이 떨어진다고 보고했다.&rdquo;</p>
    </div>

    <div class="mission-type">
      <span class="mission-type-badge">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M9 15l6-6M10 8l1.5-1.5a3 3 0 114.2 4.2L14.2 12M14 16l-1.5 1.5a3 3 0 11-4.2-4.2L9.8 12" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </span>
      <span class="mission-type-label">연결</span>
    </div>
    <h2 class="mission-question">내 상황이나 프로젝트와 연결해보면?</h2>

    <textarea class="mission-textarea" placeholder="한 줄이면 충분해요. 완벽하지 않아도 괜찮아요."></textarea>
    <p class="mission-textarea-helper">조금 더 생각해봐요 — 한 문장으로 남겨보세요</p>
  </main>

  <footer class="screen-footer">
    <span class="btn-primary btn-primary--disabled">기록 남기기</span>
  </footer>
</div>
</body>
</html>
