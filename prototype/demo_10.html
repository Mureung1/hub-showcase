<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='10' fill='%2317171f'/%3E%3Ctext x='16' y='22' font-size='17' font-family='sans-serif' fill='white' text-anchor='middle' font-weight='700'%3ES%3C/text%3E%3C/svg%3E" />
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<title>스펙핏 SpecFit</title>
<style>
  :root {
    /* ===== 디자인 토큰 반영 (design-tokens.md 기준) =====
       기존 변수 이름은 그대로 두고 값만 새 팔레트로 교체했다.
       JS(STATUS_STYLE, JOBTYPE_STYLE, donutSvg 등)가 이 변수 이름을 문자열로 그대로 참조하므로
       변수 이름은 절대 바꾸지 않는다. */

    /* 텍스트 — 2단계 기본(primary/muted) + 실사용 폼을 위한 중간톤 1개 */
    --gray-900: #17171f;   /* text-primary */
    --gray-700: #5c5c66;   /* 폼 라벨 등 중간 톤 (레퍼런스엔 없던 실용 톤) */
    --gray-500: #93939d;   /* text-muted */
    --gray-200: #ece2d3;   /* 보더/구분선 (warm) */
    --gray-50:  #f8f1e8;   /* bg-canvas */

    /* 배경 */
    --paper: #d7efe0;      /* bg-page — 옅은 민트 */
    --card-bg: #ffffff;    /* bg-surface */

    /* 상태 태그 (지원 가능/미충족 사유) — 파스텔 4색 + 확장 1색(sky)에서 파생 */
    --green-bg: #e5f5ee;  --green-text: #2f7a4f;   /* match → mint 계열 */
    --orange-bg: #f7e6cc; --orange-text: #7a4a12;  /* peach 계열 */
    --red-bg: #fbe9e6;    --red-text: #9a4636;     /* coral 계열 */
    --purple-bg: #efe9fa; --purple-text: #5b4f96;  /* lavender 계열 */
    --blue-bg: #e8f0f8;   --blue-text: #35618c;    /* sky 확장색 (외국어 성적 전용) */

    /* 강조 — 레퍼런스처럼 "색"이 아니라 다크 액센트로 대비를 준다 */
    --accent: #17171f;
    --accent-dark: #000000;
    --accent-bg: #a3dbc7;   /* insight-banner 솔리드 민트 */
    --accent-text: #17171f;

    /* 도넛차트: 대비가 뚜렷한 다크(합격) vs 웜뉴트럴(불합격) */
    --donut-ok: #3f9c74;
    --donut-no: #e4d9c8;

    --shadow-sm: 0 4px 14px rgba(23,23,31,0.06), 0 1px 2px rgba(23,23,31,0.04);
    --shadow-md: 0 16px 40px rgba(23,23,31,0.12);
    --mono: 'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;

    /* 모서리 스케일 (design-tokens.md) */
    --radius-pill: 999px;
    --radius-chip: 14px;
    --radius-card: 24px;
    --radius-panel: 28px;
    --radius-bar: 6px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: "Pretendard Variable", -apple-system, "Malgun Gothic", sans-serif;
    background: var(--paper);
    color: var(--gray-900);
    display: flex;
    justify-content: center;
    align-items: flex-start;
    min-height: 100vh;
    padding: 28px 16px;
  }
  /* ---------- 사이트 전체를 감싸는 프레임(민트 배경 위 둥근 창 구성) ----------
     프레임 자체는 뷰포트 높이에 맞춘 "창"이고, 내용이 더 길어지는 화면(필터/스펙/결과)은
     프레임 내부에서 스크롤된다 — 그래야 결과 화면처럼 긴 콘텐츠에서도 항상
     "민트 배경 위에 뜬 창" 모양이 유지된다. 홈 화면은 이 창 높이 안에 들어가도록
     레이아웃(글자 크기·여백·카드 배치)을 별도로 압축했다(아래 hero/how-card 참고). */
  .site-frame {
    width: 100%;
    max-width: 1180px;
    max-height: calc(100vh - 56px);
    background: var(--gray-50);
    border-radius: 32px;
    box-shadow: 0 40px 80px -20px rgba(23,23,31,0.28), 0 12px 28px rgba(23,23,31,0.14);
    overflow-y: auto;
    overflow-x: hidden;
    position: relative;
  }
  @media (max-width: 700px) {
    body { padding: 0; display: block; }
    .site-frame { max-width: none; max-height: none; border-radius: 0; box-shadow: none; overflow: visible; }
  }

  main { display: block; min-height: 50vh; }
  .mono { font-family: var(--mono); }
  .fade-in { animation: fadeIn .35s ease; }
  @keyframes fadeIn { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:translateY(0); } }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---------- header / stepper / footer ---------- */
  .site-header { position: sticky; top: 0; background: rgba(255,255,255,0.9); backdrop-filter: blur(6px); border-bottom: 1px solid var(--gray-200); z-index: 40; }
  .site-header-inner { width: 100%; margin: 0 auto; padding: 11px 28px; display: flex; align-items: center; gap: 20px; }
  .logo { display: flex; align-items: center; gap: 8px; cursor: pointer; flex-shrink: 0; }
  .logo-mark { width: 28px; height: 28px; border-radius: var(--radius-chip); background: var(--accent); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px; flex-shrink: 0; }
  .logo-mark.small { width: 22px; height: 22px; font-size: 12px; border-radius: 10px; }
  .logo-text { font-weight: 700; font-size: 15px; color: var(--gray-900); }
  .logo-sub { font-weight: 500; color: var(--gray-500); font-size: 12px; margin-left: 3px; }
  .site-nav { display: flex; gap: 2px; align-items: center; flex-shrink: 0; }
  .nav-link { background: none; border: none; font-size: 13px; color: var(--gray-700); padding: 8px 12px; border-radius: var(--radius-pill); cursor: pointer; font-family: inherit; transition: background .15s, color .15s; }
  .nav-link:hover { background: var(--gray-50); color: var(--gray-900); }
  .nav-link.cta { background: var(--accent); color: #fff; font-weight: 600; }
  .nav-link.cta:hover { background: var(--accent-dark); }

  /* ---------- 스테퍼: 헤더와 같은 줄에 배치해 공간 낭비를 줄인다 ---------- */
  .stepper-inline { flex: 1; display: flex; align-items: center; min-width: 0; }
  .header-spacer { flex: 1; }
  .step-item { display: flex; align-items: center; gap: 8px; opacity: .4; transition: opacity .15s; }
  .step-item.clickable { cursor: pointer; }
  .step-item.clickable:hover { opacity: .75; }
  .step-item.active, .step-item.done { opacity: 1; }
  .step-circle { width: 22px; height: 22px; border-radius: 50%; background: var(--gray-200); color: var(--gray-700); font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: background .15s, color .15s; }
  .step-item.active .step-circle { background: var(--gray-900); color: #fff; }
  .step-item.done .step-circle { background: var(--donut-ok); color: #fff; }
  .step-label { font-size: 12px; font-weight: 600; color: var(--gray-500); white-space: nowrap; }
  .step-item.active .step-label, .step-item.done .step-label { color: var(--gray-900); }
  .step-line { flex: 1; height: 1px; background: var(--gray-200); margin: 0 10px; min-width: 14px; transition: background .2s; }
  .step-line.done { background: var(--donut-ok); }

  .site-footer { border-top: 1px solid var(--gray-200); margin-top: 16px; }
  .site-footer-inner { max-width: 640px; margin: 0 auto; padding: 16px 24px; text-align: center; color: var(--gray-500); font-size: 11.5px; line-height: 1.5; }
  .site-footer-inner .logo-mark { margin: 0 auto 6px; }
  .footer-meta { margin-top: 2px; color: #9a9d8e; }

  /* ---------- generic ---------- */
  .screen { max-width: 640px; margin: 0 auto; padding: 32px 24px 60px; }
  .screen-wide { max-width: 1080px; margin: 0 auto; padding: 32px 24px 60px; }
  h1 { font-size: 20px; font-weight: 700; margin: 0 0 4px; }
  .sub { font-size: 13px; color: var(--gray-500); margin: 0 0 24px; line-height: 1.5; }
  label.field { display: block; margin-bottom: 18px; }
  .field-full { grid-column: 1 / -1; }
  .field-grid { display: block; }
  .field-label { font-size: 13px; color: var(--gray-700); font-weight: 500; display: block; margin-bottom: 6px; }
  select, input[type=number], input[type=text] {
    width: 100%; border: 1px solid var(--gray-200); border-radius: 12px;
    padding: 9px 10px; font-size: 13px; font-family: inherit; background: var(--card-bg); color: var(--gray-900);
    transition: border-color .15s;
  }
  select:focus, input[type=number]:focus, input[type=text]:focus { outline: none; border-color: var(--gray-900); }
  .row { display: flex; gap: 10px; align-items: center; }
  .btn-commit {
    flex: none; padding: 9px 14px; font-size: 12.5px; font-weight: 600; border-radius: var(--radius-pill);
    border: 1px solid var(--accent); background: var(--accent); color: #fff; cursor: pointer;
    font-family: inherit; white-space: nowrap; transition: background .15s;
  }
  .btn-commit:hover { background: var(--accent-dark); }
  .row > * { flex: 1; }
  .chip-row { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip-btn {
    font-size: 12px; padding: 7px 12px; border-radius: var(--radius-pill); border: 1px solid var(--gray-200);
    background: var(--card-bg); color: var(--gray-700); cursor: pointer; transition: all .15s;
  }
  .chip-btn:hover { border-color: var(--gray-900); }
  .chip-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .btn-primary {
    width: 100%; background: var(--accent); color: #fff; border: none; border-radius: var(--radius-pill);
    padding: 13px; font-size: 14px; font-weight: 600; cursor: pointer; transition: background .15s, transform .1s;
  }
  .btn-primary:hover { background: var(--accent-dark); }
  .btn-primary:active { transform: scale(0.99); }
  .btn-secondary {
    flex: 1; background: var(--card-bg); color: var(--gray-900); border: 1px solid var(--gray-200); border-radius: var(--radius-pill);
    padding: 13px; font-size: 14px; font-weight: 600; cursor: pointer; transition: background .15s, border-color .15s;
  }
  .btn-secondary:hover { background: var(--gray-50); border-color: #ccc; }
  .btn-row { display: flex; gap: 10px; }
  .btn-row .btn-primary { flex: 2; }
  .btn-link { background: none; border: none; color: var(--gray-700); font-size: 13px; cursor: pointer; text-decoration: underline; font-family: inherit; padding: 0; }

  .spec-chips { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 20px; }
  .spec-chip { font-size: 12px; color: var(--gray-700); padding: 5px 10px; border: 1px solid var(--gray-200); border-radius: var(--radius-pill); background: var(--card-bg); }

  .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 24px; }
  .stat-card { background: var(--card-bg); border-radius: var(--radius-card); padding: 16px 14px; box-shadow: var(--shadow-sm); }
  /* 레퍼런스처럼 통계 카드도 파스텔 색을 입혀 색감에 변화를 준다 */
  .stat-card:nth-child(1) { background: #f0a79c33; }
  .stat-card:nth-child(2) { background: #f0c89c40; }
  .stat-card:nth-child(3) { background: #a3dbc740; }
  .stat-card .label { font-size: 12px; color: var(--gray-700); margin-bottom: 4px; }
  .stat-card .value { font-size: 22px; font-weight: 700; }

  .chart-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 20px; }
  .chart-card { background: var(--card-bg); border: 1px solid var(--gray-200); border-radius: var(--radius-card); padding: 18px; box-shadow: var(--shadow-sm); }
  .chart-card .title { font-size: 12px; color: var(--gray-500); margin-bottom: 10px; font-weight: 500; }

  .donut-wrap { position: relative; width: 140px; height: 140px; margin: 0 auto; }
  .donut-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .donut-center .rate { font-size: 22px; font-weight: 700; }
  .donut-center .frac { font-size: 11px; color: var(--gray-500); }
  .legend { display: flex; gap: 14px; justify-content: center; margin-top: 10px; font-size: 11px; color: var(--gray-500); }
  .legend .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 4px; vertical-align: -1px; }

  .bar-row { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; font-size: 11px; }
  .bar-row .bar-label { width: 66px; color: var(--gray-500); flex-shrink: 0; text-align: right; }
  .bar-track { flex: 1; background: var(--gray-50); border-radius: var(--radius-bar); height: 16px; position: relative; overflow: hidden; }
  .bar-fill { background: var(--accent); height: 100%; border-radius: var(--radius-bar) 0 0 var(--radius-bar); transition: width .5s ease; }
  /* 보완 우선순위 막대그래프: 항목마다 파스텔 4색+확장색을 순서대로 배정해 레퍼런스의 다색 차트 느낌을 살린다 */
  .bar-row:nth-child(1) .bar-fill { background: #f0a79c; }
  .bar-row:nth-child(2) .bar-fill { background: #f0c89c; }
  .bar-row:nth-child(3) .bar-fill { background: #cbc2ea; }
  .bar-row:nth-child(4) .bar-fill { background: #a3dbc7; }
  .bar-row:nth-child(5) .bar-fill { background: #a9c9e6; }
  .bar-value { font-size: 11px; color: var(--gray-700); width: 26px; }

  .insight-banner { background: var(--accent-bg); border-radius: var(--radius-card); padding: 16px 18px; font-size: 12.5px; color: var(--accent-text); margin-bottom: 18px; line-height: 1.6; }

  .result-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
  .result-tabs { display: flex; gap: 4px; background: var(--gray-50); padding: 4px; border-radius: var(--radius-pill); }
  .result-tab { font-size: 12px; font-weight: 600; padding: 7px 12px; border-radius: var(--radius-pill); border: none; background: transparent; color: var(--gray-500); cursor: pointer; display: flex; align-items: center; gap: 5px; transition: background .15s, color .15s; font-family: inherit; }
  .result-tab:hover { color: var(--gray-900); }
  .result-tab.active { background: var(--card-bg); color: var(--gray-900); box-shadow: var(--shadow-sm); }
  .tab-count { font-size: 10.5px; color: var(--gray-500); font-family: var(--mono); }
  .result-tab.active .tab-count { color: var(--accent-dark); }
  .result-sort { width: auto; font-size: 12px; padding: 7px 10px; border-radius: var(--radius-pill); }

  .job-list-title { font-size: 13px; font-weight: 600; margin-bottom: 10px; }
  .job-card {
    width: 100%; text-align: left; background: var(--card-bg); border: 1px solid var(--gray-200); border-left: 4px solid var(--gray-200); border-radius: var(--radius-card);
    padding: 16px 18px; display: flex; align-items: center; justify-content: space-between; gap: 10px;
    cursor: pointer; margin-bottom: 10px; box-shadow: var(--shadow-sm); transition: box-shadow .15s, transform .15s, border-color .15s;
    font-family: inherit;
  }
  .job-card:hover { border-color: #ccc; box-shadow: var(--shadow-md); transform: translateY(-1px); }
  .job-card-main { display: flex; align-items: flex-start; gap: 12px; min-width: 0; }
  .job-type-badge { width: 30px; height: 30px; border-radius: var(--radius-chip); display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; flex-shrink: 0; margin-top: 1px; }
  .job-title { font-size: 13px; font-weight: 600; margin: 0 0 2px; }
  .job-meta { font-size: 11px; color: var(--gray-500); margin: 0; }
  .job-check { display: flex; gap: 5px; margin-top: 6px; }
  .job-check .ok { color: #2f7a4f; font-weight: 700; font-size: 12px; }
  .job-check .no { color: #9a4636; font-weight: 700; font-size: 12px; }
  .status-tag { font-size: 11px; padding: 5px 9px; border-radius: var(--radius-pill); white-space: nowrap; font-weight: 600; flex-shrink: 0; }

  .empty-state { text-align: center; padding: 40px 20px; border: 1px dashed var(--gray-500); border-radius: var(--radius-card); color: var(--gray-500); background: var(--card-bg); }
  .empty-title { font-size: 14px; font-weight: 700; color: var(--gray-900); margin: 0 0 6px; }
  .empty-desc { font-size: 12.5px; margin: 0 0 16px; }

  .modal-overlay {
    position: fixed; inset: 0; background: rgba(23,23,31,0.5); display: flex; align-items: center;
    justify-content: center; padding: 16px; z-index: 50; animation: fadeIn .15s ease;
  }
  .modal-box { background: var(--card-bg); border-radius: var(--radius-card); max-width: 380px; width: 100%; padding: 22px; box-shadow: var(--shadow-md); }
  .insight-modal-box { text-align: center; padding: 28px 24px 24px; }
  .insight-modal-emoji { font-size: 40px; line-height: 1; margin-bottom: 12px; }
  .insight-modal-title { font-size: 15px; font-weight: 700; color: var(--gray-900); line-height: 1.5; margin: 0 0 8px; }
  .insight-modal-sub { font-size: 12.5px; color: var(--gray-500); line-height: 1.6; margin: 0 0 20px; }
  .insight-modal-btn { width: 100%; }
  .modal-box .job-title { font-size: 15px; margin-bottom: 2px; }
  .modal-box .job-meta { margin-bottom: 16px; }
  .checklist-row { border: 1px solid var(--gray-200); border-radius: var(--radius-chip); padding: 10px 12px; margin-bottom: 8px; font-size: 13px; }
  .checklist-main { display: flex; align-items: center; justify-content: space-between; }
  .checklist-label { font-weight: 600; color: var(--gray-900); }
  .checklist-detail { margin: 5px 0 0; font-size: 11.5px; line-height: 1.5; color: var(--gray-500); word-break: keep-all; }
  .checklist-detail-fail { color: var(--red-text); }

  .banner {
    background: var(--gray-50); border: 1px solid var(--gray-200); border-radius: var(--radius-card);
    padding: 12px 16px; font-size: 12px; color: var(--gray-700); margin-bottom: 20px; line-height: 1.6;
  }
  .banner b { color: var(--gray-900); }

  /* ---------- landing ---------- */
  .resume-banner { max-width: 1080px; margin: 0 auto; padding: 12px 24px; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; background: var(--card-bg); border-bottom: 1px solid var(--gray-200); }
  .resume-text { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--gray-700); }
  .resume-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); flex-shrink: 0; }
  .resume-actions { display: flex; align-items: center; gap: 14px; }
  .resume-cta { padding: 8px 14px; font-size: 12.5px; white-space: nowrap; }
  .hero { max-width: 640px; margin: 0 auto; padding: 26px 24px 18px; text-align: center; }
  .hero-eyebrow { font-size: 11.5px; font-weight: 700; color: var(--accent); letter-spacing: .02em; margin-bottom: 8px; }
  .hero-title { font-size: 22px; font-weight: 700; line-height: 1.32; margin: 0 0 10px; }
  .hero-title .accent { color: var(--accent); }
  .hero-sub { font-size: 13.5px; color: var(--gray-500); line-height: 1.5; margin: 0 0 16px; }
  .btn-hero { max-width: 280px; margin: 0 auto; padding: 12px; font-size: 14px; box-shadow: var(--shadow-md); background: var(--accent); }
  .btn-hero:hover { background: var(--accent-dark); }

  .how-it-works { max-width: 640px; margin: 0 auto; padding: 2px 24px 22px; }
  .section-label { font-size: 11.5px; font-weight: 700; color: var(--gray-500); text-align: center; margin-bottom: 10px; letter-spacing: .02em; }
  .how-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
  .how-card { background: var(--card-bg); border: none; border-radius: var(--radius-card); padding: 13px 16px; box-shadow: var(--shadow-sm); transition: box-shadow .15s, transform .15s; }
  .how-card:hover { box-shadow: var(--shadow-md); transform: translateY(-2px); }

const EDUCATION_OPTIONS = ["학력무관", "고졸", "전문학사", "학사"];

const MAJOR_OPTIONS = ["무관", "컴퓨터공학", "경영학", "디자인학", "전기전자공학"];

const CATEGORY_LABELS = { education:"학력", experience:"경력", certifications:"자격증/면허", major:"전공", foreignLanguage:"외국어 성적" };

// ===========================================================================
// 2) 갭 분석 로직 (실제 백엔드 프로토타입의 gapAnalysisService.js와 동일한 규칙)
// ===========================================================================
function evaluateJob(job, spec) {
  const req = job.req;
  const educationOk = req.education === "학력무관" || (EDUCATION_RANK[spec.education] ?? 0) >= (EDUCATION_RANK[req.education] ?? 0);
  const experienceOk = req.experienceType === "신입" || (spec.experienceType === "경력" && (spec.experienceMonths||0) >= req.minExperienceMonths);
  const certificationsOk = !req.certifications.length || req.certifications.every(c => spec.certifications.includes(c));
  const majorOk = req.major === "무관" || spec.major === req.major;
  const foreignLanguageOk = !req.foreignLanguage || (spec.foreignLanguage && spec.foreignLanguage.language === req.foreignLanguage.language && (spec.foreignLanguage.score||0) >= req.foreignLanguage.minScore);
  const checks = { education:educationOk, experience:experienceOk, certifications:certificationsOk, major:majorOk, foreignLanguage:foreignLanguageOk };
  const overallMatch = Object.values(checks).every(Boolean);
  return { job, checks, overallMatch };
}

function pickPrimaryStatus(checks) {
  const order = ["education","experience","certifications","major","foreignLanguage"];
  const failed = order.find(k => checks[k] === false);
  if (!failed) return { key:"match", label:"지원 가능" };
  return { key:`missing_${failed}`, label:`${CATEGORY_LABELS[failed]} 미충족` };
}

// 항목별로 "요구 조건 vs 내 스펙"을 사람이 읽을 수 있는 문장으로 만들어준다.
// (results 화면의 상세 모달에서 무엇이 부족한지 정확히 보여주기 위함)
function describeRequirement(category, req, spec) {
  if (category === "education") {
    if (req.education === "학력무관") return "학력 무관 (조건 없음)";
    return `요구: ${req.education} 이상 · 보유: ${spec.education}`;
  }
  if (category === "experience") {
    if (req.experienceType === "신입") return "경력 무관 (신입 지원 가능)";
    const held = spec.experienceType === "경력" ? `경력 ${spec.experienceMonths||0}개월` : "신입 (0개월)";
    return `요구: 경력 ${req.minExperienceMonths}개월 이상 · 보유: ${held}`;
  }
  if (category === "certifications") {
    if (!req.certifications.length) return "필요 자격증/면허 없음";
    const missing = req.certifications.filter(c => !spec.certifications.includes(c));
    const held = spec.certifications.length ? spec.certifications.join(", ") : "없음";
    const missingText = missing.length ? ` (미보유: ${missing.join(", ")})` : "";
    return `요구: ${req.certifications.join(", ")} · 보유: ${held}${missingText}`;
  }
  if (category === "major") {
    if (req.major === "무관") return "전공 무관 (조건 없음)";
    return `요구: ${req.major} · 보유: ${spec.major}`;
  }
  if (category === "foreignLanguage") {
    if (!req.foreignLanguage) return "외국어 성적 불필요";
    const { language, minScore } = req.foreignLanguage;
    if (!spec.foreignLanguage) return `요구: ${language} ${minScore}점 이상 · 보유: 미입력`;
    if (spec.foreignLanguage.language !== language) {
      return `요구: ${language} ${minScore}점 이상 · 보유: ${spec.foreignLanguage.language} 성적만 있음 (${language} 성적 없음)`;
    }
    return `요구: ${language} ${minScore}점 이상 · 보유: ${spec.foreignLanguage.score ?? 0}점`;
  }
  return "";
}

function runGapAnalysis(jobs, filters, spec) {
  const filtered = jobs.filter(j =>
    (!filters.jobType || j.jobType === filters.jobType) &&
    (!filters.region || j.region.includes(filters.region)) &&
    (!filters.employmentType || j.employmentType === filters.employmentType)
  );
  const evaluated = filtered.map(j => evaluateJob(j, spec));
  const matchedJobs = evaluated.filter(e => e.overallMatch).length;
  const totalJobs = evaluated.length;

  const categories = ["education","experience","certifications","major","foreignLanguage"];
  const improvementRanking = categories.map(cat => {
    const delta = evaluated.filter(e => {
      if (e.overallMatch) return false;
      if (e.checks[cat] !== false) return false;
      return Object.entries(e.checks).every(([k,v]) => k===cat || v===true);
    }).length;
    return { category: CATEGORY_LABELS[cat], delta };
  }).sort((a,b) => b.delta - a.delta);

  const jobList = evaluated.map(({job, checks, overallMatch}) => {
    const status = pickPrimaryStatus(checks);
    const req = job.req;
    return {
      id: job.id, title: job.title, company: job.company, region: job.region, jobType: job.jobType,
      checklist: [
        {label:"학력", ok:checks.education, detail: describeRequirement("education", req, spec)},
        {label:"경력", ok:checks.experience, detail: describeRequirement("experience", req, spec)},
        {label:"자격증/면허", ok:checks.certifications, detail: describeRequirement("certifications", req, spec)},
        {label:"전공", ok:checks.major, detail: describeRequirement("major", req, spec)},
        {label:"외국어", ok:checks.foreignLanguage, detail: describeRequirement("foreignLanguage", req, spec)},
      ],
      status: status.key, statusLabel: status.label,
    };
  });

  return {
    stats: { totalJobs, matchedJobs, matchRate: totalJobs ? Math.round(matchedJobs/totalJobs*100) : 0 },
    improvementRanking, jobList,
  };
}

const STORAGE_KEY = "specfit_state_v1";
function saveState(){
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      step: state.step === "loading" ? "spec" : state.step,
      filters: state.filters,
      spec: state.spec,
      result: state.result,
      resultView: state.resultView,
    }));
  } catch (e) { /* localStorage 사용 불가(프라이빗 모드 등) 시 조용히 무시 */ }
}
function loadState(){
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return;
    const saved = JSON.parse(raw);
    if (!saved || typeof saved !== "object") return;
    if (saved.filters) Object.assign(state.filters, saved.filters);
    if (saved.spec) Object.assign(state.spec, saved.spec);
    if (saved.resultView) Object.assign(state.resultView, saved.resultView);
    if (saved.result) state.result = saved.result;
    if (saved.step) state.step = saved.step;
  } catch (e) { /* 손상된 데이터는 무시하고 기본값 사용 */ }
}
function resetAll(){
  try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
  state.step = "landing";
  state.filters = { jobType:"", region:"", employmentType:"" };
  state.spec = { education:"학사", experienceType:"신입", experienceMonths:0, major:"무관", certifications:[], foreignLanguage:null, hasComputerSkill:false };

function uniq(arr){ return [...new Set(arr)]; }
const FILTER_OPTIONS = {
  jobTypes: uniq(MOCK_JOBS.map(j=>j.jobType)),
  regions: uniq(MOCK_JOBS.map(j=>j.region)),
  employmentTypes: uniq(MOCK_JOBS.map(j=>j.employmentType)),
};

function setFilters(patch){ Object.assign(state.filters, patch); render(); }
function setSpec(patch){ Object.assign(state.spec, patch); render(); }
function toggleCert(cert){
  const list = state.spec.certifications;
  const i = list.indexOf(cert);
  if (i>=0) list.splice(i,1); else list.push(cert);
  render();
}
// 타이핑할 때마다 매번 다시 그리면 포커스가 풀리고 화면이 깜빡였기 때문에,
// 입력은 자유롭게 하고 "입력" 버튼(또는 Enter)을 눌렀을 때만 값을 반영해 렌더링한다.
function commitExpMonths(){
  const el = document.getElementById("expMonthsInput");
  if (!el) return;
  const months = Number(el.value.replace(/[^0-9]/g,"")) || 0;
  setSpec({ experienceMonths: months });
}
function commitForeignScore(){
  const el = document.getElementById("flScoreInput");
  if (!el || !state.spec.foreignLanguage) return;
  const score = Number(el.value.replace(/[^0-9]/g,"")) || 0;
  setSpec({ foreignLanguage: { ...state.spec.foreignLanguage, score } });
}
function goStep(step){
  if (step === "result" && !state.result) { state.step = "filter"; render(); return; }
  state.step = step;
  render();
  window.scrollTo({top:0, behavior:"smooth"});
}
function runAnalysis(){
  state.step = "loading";
  render();
  setTimeout(() => {
    state.result = runGapAnalysis(MOCK_JOBS, state.filters, state.spec);
    state.resultView = { statusFilter:"all", sort:"default" };
    state.step = "result";
    state.showInsightModal = true; // 결과 화면이 그려지자마자 무엇을 하면 좋을지부터 먼저 보여준다 (공고가 0건이어도 격려 메시지로 보여줌)
    render();
  }, 550);
}
function closeInsightModal(){ state.showInsightModal = false; render(); }
function fillSampleSpec(){
  Object.assign(state.spec, {
    education:"학사", experienceType:"신입", experienceMonths:0, major:"컴퓨터공학",
    certifications:["정보처리기사"], foreignLanguage:{language:"영어", score:750}, hasComputerSkill:true,
  });
  render();
}
function openJob(id){ state.selectedJobId = id; render(); }
function closeJob(){ state.selectedJobId = null; render(); }

function setResultView(patch){ Object.assign(state.resultView, patch); render(); }
function getDisplayedJobs(){
  const { jobList } = state.result;
  const { statusFilter, sort } = state.resultView;
  let list = jobList;
  if (statusFilter === "match") list = list.filter(j => j.status === "match");
  else if (statusFilter === "missing") list = list.filter(j => j.status !== "match");

  list = [...list];
  if (sort === "matchFirst") list.sort((a,b) => (a.status==="match"?0:1) - (b.status==="match"?0:1));
  else if (sort === "company") list.sort((a,b) => a.company.localeCompare(b.company, "ko"));
  return list;
}

function donutSvg(rate){
  const r = 60, c = 2*Math.PI*r;
  const okLen = c * (rate/100);
  return `
    <svg width="140" height="140" viewBox="0 0 140 140">
      <circle cx="70" cy="70" r="${r}" fill="none" stroke="var(--donut-no)" stroke-width="16" />
      <circle cx="70" cy="70" r="${r}" fill="none" stroke="var(--donut-ok)" stroke-width="16"
        stroke-dasharray="${okLen} ${c-okLen}" stroke-dashoffset="${c*0.25}" stroke-linecap="round"
        transform="scale(1,-1) translate(0,-140)" />
    </svg>
  `;
}

            </select>
          </div>

          <p class="job-list-title">공고 목록 (${displayedJobs.length}건${displayedJobs.length!==allCount ? ` · 전체 ${allCount}건 중` : ""})</p>

          ${ allCount === 0 ? `
            <div class="empty-state">
              <p class="empty-title">조건에 맞는 공고가 없어요</p>
              <p class="empty-desc">필터 조건을 조금 넓혀서 다시 시도해보세요.</p>
              <button class="btn-secondary" onclick="goStep('filter')">필터 다시 설정하기</button>
            </div>
          ` : displayedJobs.length === 0 ? `
            <div class="empty-state">
              <p class="empty-title">해당하는 공고가 없어요</p>
              <p class="empty-desc">다른 탭을 선택해서 확인해보세요.</p>
              <button class="btn-secondary" onclick="setResultView({statusFilter:'all'})">전체 보기</button>
            </div>
          ` : displayedJobs.map(job => {
            const style = STATUS_STYLE[job.status] || STATUS_STYLE.match;
            const jt = JOBTYPE_STYLE[job.jobType] || {bg:"var(--gray-200)", text:"var(--gray-700)", letter:"?"};
            return `
            <button class="job-card" style="border-left-color:${jt.text};" onclick="openJob('${job.id}')">
              <div class="job-card-main">
                <span class="job-type-badge" style="background:${jt.bg};color:${jt.text};">${jobTypeIcon(job.jobType, jt.letter)}</span>
                <div>
                  <p class="job-title">${job.title}</p>
                  <p class="job-meta">${job.company} · ${job.region}</p>
                  <div class="job-check">${job.checklist.map(c => `<span class="${c.ok?'ok':'no'}">${c.ok?'✓':'✕'}</span>`).join("")}</div>
                </div>
              </div>
              <span class="status-tag" style="background:${style.bg};color:${style.text};">${job.statusLabel}</span>
            </button>
          `;
          }).join("") }
        </div>
      </div>
    </div>
  `;
}

function renderInsightModal(){
  const { improvementRanking, stats } = state.result;
  const topTip = improvementRanking[0];
  const hasTip = topTip && topTip.delta > 0;
  const noJobs = stats.totalJobs === 0;

  const emoji = noJobs ? "💪" : hasTip ? "😊" : "🎉";
  const title = noJobs
    ? "지금 조건엔 맞는 공고가 없어요"
    : hasTip
      ? `<b>${topTip.category}</b>만 채우면 지원 가능한 공고가 <b>+${topTip.delta}건</b> 더 늘어나요!`
      : "이미 모든 항목을 꽉 채우고 있어요!";
  const sub = noJobs
    ? "조건을 조금 넓히거나 스펙을 하나씩 더 채워보면 새로운 기회가 열릴 거예요. 조금만 더 힘내봐요!"
    : hasTip
      ? `졸업 전에 ${topTip.category}부터 준비해두면 선택지가 훨씬 넓어질 거예요.`
      : `지금 스펙이면 지원 가능 공고 비율이 ${stats.matchRate}%예요. 정말 잘 준비했어요.`;
  const btnLabel = noJobs ? "확인하기" : hasTip ? "결과 자세히 보기" : "결과 자세히 보기";

  return `
    <div class="modal-overlay" onclick="closeInsightModal()">
      <div class="modal-box insight-modal-box" onclick="event.stopPropagation()">
        <div class="insight-modal-emoji">${emoji}</div>
        <p class="insight-modal-title">${title}</p>
        <p class="insight-modal-sub">${sub}</p>
        <button class="btn-primary insight-modal-btn" onclick="closeInsightModal()">${btnLabel}</button>
      </div>
    </div>
  `;
}

function renderJobModal(){
  const job = state.result.jobList.find(j => j.id === state.selectedJobId);
  if (!job) return "";
  const style = STATUS_STYLE[job.status] || STATUS_STYLE.match;
  const jt = JOBTYPE_STYLE[job.jobType] || {bg:"var(--gray-200)", text:"var(--gray-700)", letter:"?"};
  return `
    <div class="modal-overlay" onclick="closeJob()">
      <div class="modal-box" onclick="event.stopPropagation()">
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:2px;">
          <span class="job-type-badge" style="background:${jt.bg};color:${jt.text};width:26px;height:26px;flex-shrink:0;">${jobTypeIcon(job.jobType, jt.letter)}</span>
          <p class="job-title" style="margin:0;">${job.title}</p>
        </div>
        <p class="job-meta">${job.company} · ${job.region}</p>
        <span class="status-tag" style="background:${style.bg};color:${style.text};display:inline-block;margin-bottom:14px;">${job.statusLabel}</span>
        <p style="font-size:13px;font-weight:600;margin-bottom:8px;">항목별 충족 여부</p>
        ${job.checklist.map(c => `
          <div class="checklist-row">
            <div class="checklist-main">
              <span class="checklist-label">${c.label}</span>
              <span class="${c.ok?'ok':'no'}" style="font-size:14px;">${c.ok?'✓':'✕'}</span>
            </div>
            <p class="checklist-detail mono ${c.ok?'':'checklist-detail-fail'}">${c.detail}</p>
          </div>
        `).join("")}
        <button class="btn-secondary" style="width:100%;margin-top:8px;" onclick="closeJob()">닫기</button>
      </div>
    </div>
  `;
}

function render(){
  // 손상되었거나 앞뒤가 안 맞는 저장 상태에 대한 안전장치
  if (state.step === "result" && !state.result) state.step = "landing";
  if (state.step === "loading" && !state.result) state.step = "spec";

  const app = document.getElementById("app");
  document.title = STEP_TITLES[state.step] || "스펙핏 SpecFit";

  // innerHTML을 통째로 다시 그리면 입력 중이던 요소가 매번 새 DOM 노드로 교체되면서
  // 포커스/커서 위치가 사라진다(숫자 인풋에 한 글자 입력할 때마다 포커스가 풀리는 원인).
  // data-field로 표시해둔 인풋이 포커스 상태였다면 재렌더 후 같은 필드를 찾아 포커스/커서를 복원한다.
  const active = document.activeElement;
  let focusField = null, selStart = null, selEnd = null;
  if (active && active.dataset && active.dataset.field) {
    focusField = active.dataset.field;
    try { selStart = active.selectionStart; selEnd = active.selectionEnd; } catch (e) { /* type=number 등 선택 API 미지원 */ }
  }

  let body;
  if (state.step === "landing") body = renderLandingScreen();
  else if (state.step === "filter") body = renderFilterScreen();
  else if (state.step === "spec") body = renderSpecScreen();
  else if (state.step === "loading") body = renderLoadingScreen();
  else body = renderResultScreen();

  app.innerHTML = `
    ${renderHeaderBar()}
    <main class="fade-in">${body}</main>
    ${renderFooter()}
  `;

  if (state.step === "result" && state.showInsightModal) {
    app.innerHTML += renderInsightModal();
  } else if (state.step === "result" && state.selectedJobId) {
    app.innerHTML += renderJobModal();
  }

  if (focusField) {
    const el = app.querySelector(`[data-field="${focusField}"]`);
    if (el) {
      el.focus();
      if (typeof selStart === "number" && el.setSelectionRange) {
        try { el.setSelectionRange(selStart, selEnd); } catch (e) { /* type=number 등 선택 API 미지원 */ }
      }
    }
  }

  saveState();
}

loadState();
render();
</script>
</body>
</html>
