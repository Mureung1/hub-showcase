<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="병원 현장 환자 등록 프로토타입">
  <title>현장 환자 등록 | 바로진료 병원</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="staff-body">
  <header class="staff-header">
    <a class="brand" href="staff.html" aria-label="바로진료 병원 화면"><span class="brand-mark" aria-hidden="true">+</span><span>바로진료 <small>병원</small></span></a>
    <nav class="staff-nav" aria-label="병원 직원 메뉴"><a href="staff.html">통합 대기열</a><a class="is-active" href="onsite.html" aria-current="page">현장 환자 등록</a><a href="index.html">환자 화면</a></nav>
  </header>

  <main class="onsite-main">
    <a class="back-link" href="staff.html">← 통합 대기열로 돌아가기</a>
    <section class="onsite-panel" aria-labelledby="onsite-title">
      <div class="section-heading"><p class="step-label">현장 접수</p><h1 id="onsite-title">도착한 환자를 대기열에 등록합니다</h1><p>원격 환자와 같은 실제 진료 대기 순서에 추가됩니다.</p></div>
      <form class="waiting-form" action="staff.html#onsite-added" method="get">
        <fieldset><legend>대표자 정보</legend><div class="field-grid"><label class="field"><span>대표자 이름</span><input type="text" name="name" placeholder="이름 입력" required></label><label class="field"><span>휴대전화 번호</span><input type="tel" name="phone" placeholder="010-0000-0000" pattern="[0-9-]{10,13}" required></label></div></fieldset>
        <fieldset><legend>진료받을 가족 인원</legend><div class="count-list"><label class="count-row"><span><strong>소아</strong><small>만 0–18세</small></span><input type="number" name="child" value="0" min="0" max="9" aria-label="소아 인원"></label><label class="count-row"><span><strong>성인</strong><small>만 19–64세</small></span><input type="number" name="adult" value="1" min="0" max="9" aria-label="성인 인원"></label><label class="count-row"><span><strong>노인</strong><small>만 65세 이상</small></span><input type="number" name="senior" value="0" min="0" max="9" aria-label="노인 인원"></label></div></fieldset>
        <div class="important-notice"><strong>현장 환자는 도착 확인 상태로 등록됩니다.</strong><p>등록 후 통합 대기열에서 데스크 접수 완료를 처리합니다.</p></div>
        <div class="action-row form-actions"><a class="button button-secondary" href="staff.html">취소</a><button class="button button-primary" type="submit">대기열에 등록</button></div>
      </form>
    </section>
  </main>
  <footer class="prototype-footer staff-footer">정적 프로토타입 · 입력 정보는 저장되거나 전송되지 않습니다.</footer>
</body>
</html>
