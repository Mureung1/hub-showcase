<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>시간·장소 조율 · Letter&amp;Co</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="lc-frame">

  <svg class="lc-corner lc-corner--tl" viewBox="0 0 76 76" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <path d="M4 70C10 48 16 36 34 30" stroke="#8CA3C2" stroke-width="1.4"/>
    <path d="M14 44C19 39 26 39 28 46" stroke="#8CA3C2" stroke-width="1.2"/>
    <path d="M21 57C26 52 32 52 33 59" stroke="#8CA3C2" stroke-width="1.2"/>
    <circle cx="36" cy="26" r="4.5" fill="#F2D774" stroke="#8C6A1B" stroke-width="1"/>
    <g stroke="#4F6B8C" stroke-width="1.2">
      <path d="M36 26L43 19"/><path d="M36 26L45 26"/><path d="M36 26L43 34"/><path d="M36 26L29 19"/><path d="M36 26L27 26"/>
    </g>
  </svg>
  <svg class="lc-corner lc-corner--br" viewBox="0 0 76 76" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <path d="M4 70C10 48 16 36 34 30" stroke="#8CA3C2" stroke-width="1.4"/>
    <path d="M14 44C19 39 26 39 28 46" stroke="#8CA3C2" stroke-width="1.2"/>
    <path d="M21 57C26 52 32 52 33 59" stroke="#8CA3C2" stroke-width="1.2"/>
    <circle cx="36" cy="26" r="4.5" fill="#F2D774" stroke="#8C6A1B" stroke-width="1"/>
    <g stroke="#4F6B8C" stroke-width="1.2">
      <path d="M36 26L43 19"/><path d="M36 26L45 26"/><path d="M36 26L43 34"/><path d="M36 26L29 19"/><path d="M36 26L27 26"/>
    </g>
  </svg>

  <div class="lc-frame__inner">

    <p class="lc-eyebrow">Step 2 of 6 · 시간·장소 조율</p>
    <h1 class="lc-hand-title">Gather</h1>

    <nav class="lc-journey" aria-label="진행 단계">
      <div class="lc-journey-step is-done"><span class="lc-journey-dot"></span><span class="lc-journey-label">초대</span></div>
      <div class="lc-journey-step is-current"><span class="lc-journey-dot"></span><span class="lc-journey-label">조율</span></div>
      <div class="lc-journey-step"><span class="lc-journey-dot"></span><span class="lc-journey-label">배정</span></div>
      <div class="lc-journey-step"><span class="lc-journey-dot"></span><span class="lc-journey-label">확정</span></div>
      <div class="lc-journey-step"><span class="lc-journey-dot"></span><span class="lc-journey-label">공유</span></div>
      <div class="lc-journey-step"><span class="lc-journey-dot"></span><span class="lc-journey-label">결산</span></div>
    </nav>

    <h2 class="lc-heading">시간과 장소를 모아요</h2>
    <p class="lc-subtitle">모두가 표시한 가능 시간을 모으고,<br>위치를 기반으로 장소를 추천해요.</p>

    <section class="lc-section">
      <p class="lc-label">가능한 요일 선택</p>
      <div class="lc-weekgrid">
        <div class="lc-day is-selected">월</div>
        <div class="lc-day">화</div>
        <div class="lc-day is-selected">수</div>
        <div class="lc-day">목</div>
        <div class="lc-day">금</div>
        <div class="lc-day is-selected">토</div>
        <div class="lc-day">일</div>
      </div>
      <p class="lc-hint">겹치는 시간이 없으면 에이전트가 대안을 제시해요</p>
    </section>

    <section class="lc-section">
      <p class="lc-label">
        <svg width="13" height="13" viewBox="0 0 13 13" fill="none" aria-hidden="true"><path d="M6.5 1C4 1 2 3 2 5.5C2 8.5 6.5 12 6.5 12C6.5 12 11 8.5 11 5.5C11 3 9 1 6.5 1Z" stroke="#4F6B8C" stroke-width="1.2"/><circle cx="6.5" cy="5.5" r="1.6" stroke="#4F6B8C" stroke-width="1.1"/></svg>
        장소 후보 · 익명 투표 중
      </p>

      <div class="lc-place-card is-leading">
        <div class="lc-place-top">
          <span class="lc-place-name">🌿 OO 카페</span>
          <span class="lc-vote"><span class="lc-vote-dot"></span>4표</span>
        </div>
        <p class="lc-place-why">
          <svg width="11" height="11" viewBox="0 0 11 11" style="flex-shrink:0;margin-top:1px" fill="none" aria-hidden="true"><path d="M5.5 1L6.5 4.2L10 4.2L7.2 6.2L8.2 9.5L5.5 7.5L2.8 9.5L3.8 6.2L1 4.2L4.5 4.2Z" stroke="#8C6A1B" stroke-width="0.9" fill="none"/></svg>
          모두에게 이동 거리가 가장 짧아요
        </p>
      </div>

      <div class="lc-place-card">
        <div class="lc-place-top">
          <span class="lc-place-name">🌿 숲속 스터디룸</span>
          <span class="lc-vote"><span class="lc-vote-dot"></span>2표</span>
        </div>
        <p class="lc-place-why">
          <svg width="11" height="11" viewBox="0 0 11 11" style="flex-shrink:0;margin-top:1px" fill="none" aria-hidden="true"><path d="M5.5 1L6.5 4.2L10 4.2L7.2 6.2L8.2 9.5L5.5 7.5L2.8 9.5L3.8 6.2L1 4.2L4.5 4.2Z" stroke="#8C6A1B" stroke-width="0.9" fill="none"/></svg>
          조용히 이야기 나누기 좋아요
        </p>
      </div>
    </section>

    <section class="lc-section">
      <a class="lc-btn" href="2-assign.html" role="button">투표 완료</a>
      <p class="lc-caption">투표는 익명으로 집계돼요 · 확정은 참여자 전원의 클릭으로 마무리돼요</p>
    </section>

  </div>
</main>
</body>
</html>
