<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>초대장 만들기 · Letter&amp;Co</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="lc-frame">

  <svg class="lc-corner lc-corner--tl" viewBox="0 0 76 76" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <path d="M4 70C10 48 16 36 34 30" stroke="#8CA3C2" stroke-width="1.4"/>
    <path d="M14 44C19 39 26 39 28 46" stroke="#8CA3C2" stroke-width="1.2"/>
    <path d="M21 57C26 52 32 52 33 59" stroke="#8CA3C2" stroke-width="1.2"/>
    <circle cx="36" cy="26" r="4.5" fill="#F2D774" stroke="#8C6A1B" stroke-width="1"/>
    <g stroke="#4F6B8C" stroke-width="1.2">
      <path d="M36 26L43 19"/><path d="M36 26L45 26"/><path d="M36 26L43 34"/><path d="M36 26L29 19"/><path d="M36 26L27 26"/>
    </g>
  </svg>
  <svg class="lc-corner lc-corner--br" viewBox="0 0 76 76" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <path d="M4 70C10 48 16 36 34 30" stroke="#8CA3C2" stroke-width="1.4"/>
    <path d="M14 44C19 39 26 39 28 46" stroke="#8CA3C2" stroke-width="1.2"/>
    <path d="M21 57C26 52 32 52 33 59" stroke="#8CA3C2" stroke-width="1.2"/>
    <circle cx="36" cy="26" r="4.5" fill="#F2D774" stroke="#8C6A1B" stroke-width="1"/>
    <g stroke="#4F6B8C" stroke-width="1.2">
      <path d="M36 26L43 19"/><path d="M36 26L45 26"/><path d="M36 26L43 34"/><path d="M36 26L29 19"/><path d="M36 26L27 26"/>
    </g>
  </svg>

  <div class="lc-frame__inner">

    <p class="lc-eyebrow">Step 1 of 6 · 초대장 만들기</p>
    <h1 class="lc-hand-title">Invite</h1>

    <nav class="lc-journey" aria-label="진행 단계">
      <div class="lc-journey-step is-current"><span class="lc-journey-dot"></span><span class="lc-journey-label">초대</span></div>
      <div class="lc-journey-step"><span class="lc-journey-dot"></span><span class="lc-journey-label">조율</span></div>
      <div class="lc-journey-step"><span class="lc-journey-dot"></span><span class="lc-journey-label">배정</span></div>
      <div class="lc-journey-step"><span class="lc-journey-dot"></span><span class="lc-journey-label">확정</span></div>
      <div class="lc-journey-step"><span class="lc-journey-dot"></span><span class="lc-journey-label">공유</span></div>
      <div class="lc-journey-step"><span class="lc-journey-dot"></span><span class="lc-journey-label">결산</span></div>
    </nav>

    <h2 class="lc-heading">정원에 초대해요</h2>
    <p class="lc-subtitle">로그인 없이, 링크 하나로<br>모두를 이 여정에 초대할 수 있어요.</p>

    <section class="lc-section">
      <p class="lc-label">초대장 디자인 고르기</p>
      <div class="lc-invite-grid">
        <div class="lc-invite-card">
          <div class="lc-invite-swatch" style="background: var(--paper);"></div>
          <span>담쟁이</span>
        </div>
        <div class="lc-invite-card is-selected">
          <span class="lc-check-badge" aria-hidden="true">
            <svg width="10" height="10" viewBox="0 0 10 10"><path d="M1.5 5L4 7.5L8.5 2.5" stroke="#fff" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </span>
          <div class="lc-invite-swatch" style="background: var(--wedgwood-pale);"></div>
          <span>웨지우드</span>
        </div>
        <div class="lc-invite-card">
          <div class="lc-invite-swatch" style="background: var(--lemon-pale);"></div>
          <span>레몬정원</span>
        </div>
      </div>
    </section>

    <section class="lc-section">
      <p class="lc-label">초대 문구</p>
      <textarea class="lc-textarea" rows="3" placeholder="다가오는 모임에 초대해요. 시간과 장소는 함께 정해요 🌿" disabled></textarea>
    </section>

    <section class="lc-section">
      <a class="lc-btn" href="1-gather.html" role="button">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <path d="M1.5 4.5h13v8h-13z" stroke="#fff" stroke-width="1.3" stroke-linejoin="round"/>
          <path d="M1.5 4.5L8 9.5L14.5 4.5" stroke="#fff" stroke-width="1.3" stroke-linejoin="round" fill="none"/>
        </svg>
        보내기
      </a>
      <p class="lc-caption">보내면 우편함에 넣는 애니메이션이 재생돼요<br>참여자는 링크로 바로 입장해요</p>
    </section>

  </div>
</main>
</body>
</html>
