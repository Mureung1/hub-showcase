      <path d="M36 26L43 19"/><path d="M36 26L45 26"/><path d="M36 26L43 34"/><path d="M36 26L29 19"/><path d="M36 26L27 26"/>
    </g>
  </svg>
  <svg class="lc-corner lc-corner--br" viewBox="0 0 76 76" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <path d="M4 70C10 48 16 36 34 30" stroke="#8CA3C2" stroke-width="1.4"/>
    <path d="M14 44C19 39 26 39 28 46" stroke="#8CA3C2" stroke-width="1.2"/>
    <path d="M21 57C26 52 32 52 33 59" stroke="#8CA3C2" stroke-width="1.2"/>
    <circle cx="36" cy="26" r="4.5" fill="#F2D774" stroke="#8C6A1B" stroke-width="1"/>

    </g>
  </svg>

  <div class="lc-frame__inner">

    <a class="lc-top-link" href="0-invite.html">
      <svg width="12" height="12" viewBox="0 0 12 12" fill="none" aria-hidden="true"><path d="M8 2L3 6L8 10" stroke="#4F6B8C" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      다시 초대장으로
    </a>

    <p class="lc-eyebrow">Step 5 of 6 · 진행 상황 공유</p>
    <h1 class="lc-hand-title">Bloom</h1>

    <nav class="lc-journey" aria-label="진행 단계">
      <div class="lc-journey-step is-done"><span class="lc-journey-dot"></span><span class="lc-journey-label">초대</span></div>
      <div class="lc-journey-step is-done"><span class="lc-journey-dot"></span><span class="lc-journey-label">조율</span></div>
      <div class="lc-journey-step is-done"><span class="lc-journey-dot"></span><span class="lc-journey-label">배정</span></div>
      <div class="lc-journey-step is-done"><span class="lc-journey-dot"></span><span class="lc-journey-label">확정</span></div>
      <div class="lc-journey-step is-current"><span class="lc-journey-dot"></span><span class="lc-journey-label">공유</span></div>
      <div class="lc-journey-step"><span class="lc-journey-dot"></span><span class="lc-journey-label">결산</span></div>
    </nav>

    <h2 class="lc-heading">역할이 자라나고 있어요</h2>
    <p class="lc-subtitle">사람이 아니라 역할·업무 단위로 봐요.<br>완료된 것만 조용히 쌓이고, 미완료는 강조하지 않아요.</p>

    <section class="lc-section">
      <div class="lc-swipe-card">
        <p class="lc-swipe-role">자료 조사 역할</p>

        <div class="lc-check-row is-done">
          <span class="lc-check">
            <svg width="9" height="9" viewBox="0 0 9 9"><path d="M1 4.5L3.3 6.8L8 2" stroke="#fff" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </span>
          <span>선행 사례 정리</span>
        </div>
        <div class="lc-check-row is-done">
          <span class="lc-check">
            <svg width="9" height="9" viewBox="0 0 9 9"><path d="M1 4.5L3.3 6.8L8 2" stroke="#fff" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </span>
          <span>레퍼런스 수집</span>
        </div>
        <div class="lc-check-row">
          <span class="lc-check"></span>
          <span>요약 문서 작성</span>
        </div>

        <div class="lc-swipe-nav">
          <svg class="lc-chevron" width="7" height="12" viewBox="0 0 7 12" fill="none" aria-hidden="true"><path d="M6 1L1 6L6 11" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <div class="lc-dots">
            <span class="lc-dot"></span><span class="lc-dot is-active"></span><span class="lc-dot"></span>
          </div>
          <svg class="lc-chevron" width="7" height="12" viewBox="0 0 7 12" fill="none" aria-hidden="true"><path d="M1 1L6 6L1 11" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
      </div>
      <p class="lc-caption">◀ 좌우로 스와이프해 다른 역할 보기 ▶<br>자료 조사 역할, 2/3 진행 중</p>
    </section>

    <section class="lc-section">
      <a class="lc-btn lemon" href="5-harvest.html" role="button">모임이 끝나면 결산으로</a>
    </section>

  </div>
</main>

</html>
