    <p class="lc-eyebrow">Step 6 of 6 · 결과 결산</p>
    <h1 class="lc-hand-title">Harvest</h1>

    <nav class="lc-journey" aria-label="진행 단계">
      <div class="lc-journey-step is-done"><span class="lc-journey-dot"></span><span class="lc-journey-label">초대</span></div>
      <div class="lc-journey-step is-done"><span class="lc-journey-dot"></span><span class="lc-journey-label">조율</span></div>

        </div>
        <div class="lc-leaves" role="img" aria-label="5개 중 4개">

        </div>
        <div class="lc-leaves" role="img" aria-label="5개 중 5개">
          <svg width="17" height="17" viewBox="0 0 16 16" fill="#8C6A1B" stroke="#8C6A1B" stroke-width="0.8"><path d="M8 1.5C8 1.5 13.5 3.5 13.5 9C13.5 12 11 14.5 8 14.5C5 14.5 2.5 12 2.5 9C2.5 3.5 8 1.5 8 1.5Z"/></svg>

      <div class="lc-rate-block">
        <div class="lc-rate-top">
          <span class="lc-rate-label">역할 배분</span>
          <span class="lc-rate-desc">업무가 고르게 나뉘었나요</span>
