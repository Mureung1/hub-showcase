<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>회의시간 매칭</title>
<style>
  :root {
    --color-primary: #6C5CE7;
    --bg-page: #F7F5F6;
    --bg-surface: #FFFFFF;
    --text-primary: #1A1726;
    --text-secondary: #5C5670;
    --text-muted: #948FA4;
    --border-subtle: rgba(26,23,38,0.05);
    --radius-sm: 9px;
    --radius-xl: 28px;
    --shadow-sm: 0 1px 3px rgba(26,23,38,0.03);

    --cell-empty: #F2F0F4;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    font-family: "Pretendard", -apple-system, BlinkMacSystemFont, "Segoe UI",
      "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    background: var(--bg-page);
    color: var(--text-primary);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 48px 24px;
  }

  .page {
    width: 100%;
    max-width: 900px;
  }

  .page-header {
    margin-bottom: 28px;
  }

  .page-header h1 {
    font-size: 36px;
    font-weight: 700;
    letter-spacing: -0.025em;
    color: var(--text-primary);
    margin-bottom: 8px;
  }

  .page-header .subtitle {
    font-size: 15px;
    color: var(--text-secondary);
  }

  .card {
    background: var(--bg-surface);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-xl);
    box-shadow: var(--shadow-sm);
    padding: 24px 24px 28px;
  }

  .week-tabs {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin-bottom: 10px;
  }

  .week-tab {
    padding: 9px 20px;
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-sm);
    background: var(--bg-page);
    color: var(--text-secondary);
    font-size: 14px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
  }

  .week-tab:hover:not(.active) {
    color: var(--text-primary);
    border-color: var(--color-primary);
  }

  .week-tab.active {
    background: var(--color-primary);
    border-color: var(--color-primary);
    color: #ffffff;
  }

  .week-range {
    text-align: center;
    font-size: 13px;
    color: var(--text-muted);
    margin-bottom: 4px;
  }

  .card-subtitle {
    text-align: center;
    font-size: 13px;
    color: var(--text-muted);
    margin-bottom: 20px;
  }

  .grid-wrapper {
    overflow-x: auto;
  }

  .grid {
    display: grid;
    grid-template-columns: 72px repeat(7, 1fr);
    gap: 6px;
    min-width: 700px;
  }

  .date-header {
    text-align: center;
    font-size: 13px;
    font-weight: 700;
    color: var(--text-primary);
    padding: 8px 4px;
  }

  .date-header.weekend {
    color: var(--color-primary);
  }

  .date-header.disabled {
    color: var(--text-muted);
    opacity: 0.45;
  }

  .time-label {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    font-size: 13px;
    font-weight: 500;
    color: var(--text-secondary);
    padding-right: 8px;
    white-space: nowrap;
  }

  .slot {
    height: 40px;
    background: var(--cell-empty);
    border-radius: var(--radius-sm);
  }

  .slot.disabled {
    opacity: 0.45;
  }

  .footer-note {
    text-align: center;
    margin-top: 20px;
    font-size: 13px;
    color: var(--text-muted);
  }
</style>
</head>
<body>
  <div class="page">
    <header class="page-header">
      <h1>회의시간 매칭</h1>
      <p class="subtitle">프로젝트 기간 2026.07.13 ~ 2026.08.02 (3주)</p>
    </header>

    <div class="card">
      <div class="week-tabs" id="weekTabs"></div>
      <div class="week-range" id="weekRange"></div>

      <div class="card-subtitle">이번 주 회의 가능 시간을 확인해보세요</div>

      <div class="grid-wrapper">
        <div class="grid" id="grid"></div>
      </div>
    </div>

    <div class="footer-note">클릭 기능은 다음 단계에서 추가될 예정이에요</div>
  </div>

  <script>
    var PROJECT_START = new Date(2026, 6, 13); // 2026-07-13 (월)
    var PROJECT_END = new Date(2026, 7, 2); // 2026-08-02 (일)
    var START_HOUR = 10;
    var END_HOUR = 21;
    var DAY_NAMES = ["일", "월", "화", "수", "목", "금", "토"];

    // 시작일부터 7일씩 끊어서 몇 주차까지 있는지 계산
    var totalDays = Math.round((PROJECT_END - PROJECT_START) / 86400000) + 1;
    var WEEK_COUNT = Math.ceil(totalDays / 7);

    var gridEl = document.getElementById("grid");
    var weekTabsEl = document.getElementById("weekTabs");
    var weekRangeEl = document.getElementById("weekRange");

    var currentWeek = 0;

    function addDays(date, days) {
      var result = new Date(date);
      result.setDate(result.getDate() + days);
      return result;
    }

    function pad2(n) {
      return n < 10 ? "0" + n : "" + n;
    }

    function formatMonthDay(date) {
      return pad2(date.getMonth() + 1) + "." + pad2(date.getDate());
    }

    function formatHeader(date) {
      return formatMonthDay(date) + "(" + DAY_NAMES[date.getDay()] + ")";
    }

    function isWeekend(date) {
      var d = date.getDay();
      return d === 0 || d === 6;
    }

    function isOutOfProject(date) {
      return date < PROJECT_START || date > PROJECT_END;
    }

    function getWeekDates(weekIndex) {
      var weekStart = addDays(PROJECT_START, weekIndex * 7);
      var dates = [];
      for (var i = 0; i < 7; i++) {
        dates.push(addDays(weekStart, i));
      }
      return dates;
    }

    function renderTabs() {
      var html = "";
      for (var w = 0; w < WEEK_COUNT; w++) {
        html +=
          '<button type="button" class="week-tab' +
          (w === currentWeek ? " active" : "") +
          '" data-week="' + w + '">' +
          (w + 1) + "주차</button>";
      }
      weekTabsEl.innerHTML = html;

      Array.prototype.forEach.call(weekTabsEl.querySelectorAll(".week-tab"), function (tab) {
        tab.addEventListener("click", function () {
          currentWeek = parseInt(tab.getAttribute("data-week"), 10);
          render();
        });
      });
    }

    function renderGrid(dates) {
      var html = "<div></div>"; // 좌상단 빈 칸

      dates.forEach(function (date) {
        var classes = "date-header";
        if (isWeekend(date)) classes += " weekend";
        if (isOutOfProject(date)) classes += " disabled";
        html += '<div class="' + classes + '">' + formatHeader(date) + "</div>";
      });

      for (var hour = START_HOUR; hour <= END_HOUR; hour++) {
        html += '<div class="time-label">' + hour + "시</div>";
        for (var col = 0; col < 7; col++) {
          var slotClass = "slot" + (isOutOfProject(dates[col]) ? " disabled" : "");
          html += '<div class="' + slotClass + '"></div>';
        }
      }

      gridEl.innerHTML = html;
    }

    function render() {
      var dates = getWeekDates(currentWeek);
      weekRangeEl.textContent = formatHeader(dates[0]) + " ~ " + formatHeader(dates[6]);
      renderTabs();
      renderGrid(dates);
    }

    render();
  </script>
</body>
</html>
