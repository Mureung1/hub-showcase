server:
  port: ${PORT:8080}
  servlet:
    session:
      cookie:
        same-site: ${COOKIE_SAME_SITE:lax}
        secure: ${COOKIE_SECURE:false}

spring:
  application:
    name: SpendMate
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/spendmate}
    username: ${SPRING_DATASOURCE_USERNAME:soyeon}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

clova:
  ocr:
    invoke-url: ${CLOVA_OCR_INVOKE_URL}
    secret-key: ${CLOVA_OCR_SECRET_KEY}

claude:
  api-key: ${CLAUDE_API_KEY}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8443}