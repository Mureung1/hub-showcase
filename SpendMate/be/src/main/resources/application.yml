spring:
  application:
    name: SpendMate
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  datasource:
    url: jdbc:postgresql://localhost:5432/spendmate
    username: soyeon
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

clova:
  ocr:
    invoke-url: ${CLOVA_OCR_INVOKE_URL}
    secret-key: ${CLOVA_OCR_SECRET_KEY}