org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true

# 레포 경로에 한글이 섞여 있어(D:\부트캠프\...) AGP가 빌드를 거부한다.
# 이 플래그는 Google이 문서화한 우회 수단이다(http://b.android.com/95744).
# 순수 Dart Flutter 앱이라 NDK/CMake를 쓰지 않으므로 실제 위험은 낮다.
# 만약 앞으로 네이티브 코드나 CMake를 쓰는 플러그인에서 경로 관련 오류가 나면,
# Gradle을 붙잡고 씨름하지 말고 레포를 ASCII 경로(예: D:\dev\one-step)로 옮길 것.
android.overridePathCheck=true

# Kotlin 증분 컴파일러가 한글 경로에 캐시(.tab)를 열지 못해
# "Could not close incremental caches" 로 죽는다. 증분 컴파일을 끄면 그 캐시를 안 쓴다.
# 대가는 빌드 시간 증가뿐이다.
kotlin.incremental=false
