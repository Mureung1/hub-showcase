spring.application.name=hub-server
server.port=${PORT:8080}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/itjang?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:itjang}
spring.datasource.password=${DB_PASSWORD:itjang}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:5173}
app.auth.google.client-id=${GOOGLE_CLIENT_ID:}

server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=${SESSION_COOKIE_SAME_SITE:lax}
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha
app.books.google-books.base-url=${GOOGLE_BOOKS_BASE_URL:https://www.googleapis.com/books/v1}
app.books.google-books.api-key=${GOOGLE_BOOKS_API_KEY:}
