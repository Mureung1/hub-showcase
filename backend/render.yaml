services:
  - type: web
    name: naver-challenge-backend
    runtime: node
    buildCommand: rm -rf node_modules && npm install --legacy-peer-deps && npm run db:generate && npm run build
    startCommand: npx prisma migrate deploy && node dist/backend/src/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: LLM_PROVIDER
        value: claude
      - key: CLAUDE_API_KEY
        sync: false
