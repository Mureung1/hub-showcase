server:
  port: ${PORT:8080}

spring:
  application:
    name: devpulse
  datasource:
    url: ${DEVPULSE_DB_URL:jdbc:postgresql://localhost:5433/devpulse}
    username: ${DEVPULSE_DB_USERNAME:devpulse}
    password: ${DEVPULSE_DB_PASSWORD:devpulse}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  kafka:
    bootstrap-servers: ${DEVPULSE_KAFKA_BOOTSTRAP_SERVERS:localhost:19092}
    consumer:
      group-id: devpulse
      auto-offset-reset: earliest

mybatis:
  configuration:
    map-underscore-to-camel-case: true

devpulse:
  alio:
    api-key: ${DEVPULSE_ALIO_API_KEY:}
  groq:
    api-key: ${DEVPULSE_GROQ_API_KEY:}
    model: ${DEVPULSE_GROQ_MODEL:llama-3.3-70b-versatile}
  cors:
    allowed-origins: ${DEVPULSE_CORS_ALLOWED_ORIGINS:http://localhost:5173}
