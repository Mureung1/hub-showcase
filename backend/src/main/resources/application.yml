spring:
  application:
    name: devpulse
  datasource:
    url: ${DEVPULSE_DB_URL:jdbc:postgresql://localhost:5433/devpulse}
    username: ${DEVPULSE_DB_USERNAME:devpulse}
    password: ${DEVPULSE_DB_PASSWORD:devpulse}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none

devpulse:
  worknet:
    api-key: ${DEVPULSE_WORKNET_API_KEY:}
  saramin:
    api-key: ${DEVPULSE_SARAMIN_API_KEY:}
