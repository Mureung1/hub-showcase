spring:

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    properties:
      hibernate:
        format_sql: true

    show-sql: true

logging:
  level:
    org.hibernate.SQL: debug

seoul:
  api:
    key: ${SEOUL_API_KEY}

kakao:
  api:
    key: ${KAKAO_API_KEY}

tmap:
  api:
    key: ${TMAP_API_KEY}