<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>모던 식탁 매트 세트 - ShopEase</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="container">
    <header class="topbar">
      <div class="logo"><span class="logo-mark">S</span>ShopEase</div>
      <nav class="menu-links">
        <a href="shopping_site.html">홈으로</a>
        <a href="login.html">로그인</a>
      </nav>
    </header>

    <section class="hero">
      <h1 class="hero-title">모던 식탁 매트 세트</h1>
      <p class="hero-desc">실용적인 물세척 소재와 세련된 디자인으로 식탁을 깔끔하게 완성합니다.</p>
    </section>

    <div class="details-grid">
      <div class="detail-card">
        <img src="https://images.unsplash.com/photo-1519710164239-da123dc03ef4?auto=format&fit=crop&w=900&q=80" alt="모던 식탁 매트 세트" />
      </div>
      <div class="detail-info">
        <div class="detail-list">
          <div><span>카테고리</span><span>생활용품</span></div>
          <div><span>소재</span><span>폴리우레탄</span></div>
          <div><span>구성</span><span>4개 세트</span></div>
          <div><span>관리</span><span>물세척</span></div>
        </div>
        <p class="price">₩29,800</p>
        <div class="actions-row">
          <a class="btn btn-primary" href="login.html">구매하려면 로그인</a>
          <a class="btn btn-secondary" href="shopping_site.html">쇼핑 계속</a>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
