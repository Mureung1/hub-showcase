<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TasteFit Design Skill</title>
  <link rel="stylesheet" href="skill.css">
</head>
<body class="ds-page">
  <div class="ds-shell">
    <aside class="ds-sidebar" aria-label="디자인 데모 메뉴">
      <strong>T</strong>
    </aside>

    <main class="ds-main">
      <section class="ds-section" aria-labelledby="demo-title">
        <div class="ds-section-heading">
          <div>
            <p class="ds-eyebrow">TASTEFIT DESIGN SYSTEM</p>
            <h1 class="ds-title" id="demo-title">방문자 리뷰 <span class="ds-count">128</span></h1>
          </div>
          <button class="ds-button ds-button-primary" id="open-form" type="button">＋ 리뷰 작성</button>
        </div>

        <div class="ds-row" style="justify-content:flex-start; margin-bottom:12px">
          <button class="ds-chip ds-chip-active" type="button">전체 리뷰</button>
          <button class="ds-chip" type="button">나와 비슷한 취향</button>
          <span class="ds-chip ds-match">취향 96% 일치</span>
        </div>

        <div class="ds-review-list" id="review-list">
          <article class="ds-card ds-review-card ds-featured">
            <div class="ds-row">
              <strong>남남</strong>
              <span class="ds-meta">3일 전</span>
            </div>
            <p class="ds-stars" aria-label="별점 5점">★★★★★</p>
            <p class="ds-text">창가 자리의 오후 빛이 예뻐요. 커피는 고소하고 디저트는 많이 달지 않아 함께 먹기 좋았습니다.</p>
          </article>
        </div>

        <form class="ds-review-form" id="review-form" hidden>
          <h2 class="ds-title">리뷰 작성</h2>
          <p class="ds-stars" aria-label="별점 선택 예시">★★★★★</p>
          <label class="ds-label" for="review">리뷰 내용</label>
          <textarea class="ds-textarea" id="review" placeholder="방문 경험을 들려주세요."></textarea>
          <div class="ds-row" style="justify-content:flex-end; margin-top:20px">
            <button class="ds-button ds-button-secondary" id="cancel-form" type="button">취소</button>
            <button class="ds-button ds-button-primary" type="submit">리뷰 등록하기</button>
          </div>
        </form>
      </section>
    </main>
  </div>

  <script>
    const list = document.querySelector('#review-list');
    const form = document.querySelector('#review-form');
    const open = document.querySelector('#open-form');
    const cancel = document.querySelector('#cancel-form');

    open.addEventListener('click', () => {
      list.hidden = true;
      form.hidden = false;
      open.hidden = true;
    });

    cancel.addEventListener('click', () => {
      form.hidden = true;
      list.hidden = false;
      open.hidden = false;
    });

    form.addEventListener('submit', (event) => event.preventDefault());
  </script>
</body>
</html>
