<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>미니멀 슬림 재킷 - ShopEase</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="container">
    <header class="topbar">
      <div class="logo"><span class="logo-mark">S</span>ShopEase</div>
      <nav class="menu-links">
        <a href="shopping_site.html">홈으로</a>
        <a href="login.html">로그인</a>
      </nav>
    </header>

    <section class="hero">
      <h1 class="hero-title">미니멀 슬림 재킷</h1>
      <p class="hero-desc">데일리와 오피스룩 모두에 어울리는 심플한 슬림핏 재킷입니다.</p>
    </section>

    <div class="details-grid">
      <div class="detail-card">
        <img src="https://images.unsplash.com/photo-1521334884684-d80222895322?auto=format&fit=crop&w=900&q=80" alt="미니멀 슬림 재킷" />
      </div>
      <div class="detail-info">
        <div class="detail-list">
          <div><span>카테고리</span><span>패션</span></div>
          <div><span>소재</span><span>폴리에스터 혼방</span></div>
          <div><span>핏</span><span>슬림</span></div>
          <div><span>색상</span><span>차콜</span></div>
        </div>
        <p class="price">₩84,500</p>
        <div class="actions-row">
          <a class="btn btn-primary" href="login.html">구매하려면 로그인</a>
          <a class="btn btn-secondary" href="shopping_site.html">쇼핑 계속</a>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
