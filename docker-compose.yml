# docker-compose.yml — 전체 스택 한 번에 실행
# 프론트엔드와 백엔드 파일이 같은 루트 폴더(HUB)에 있는 구조 기준
# 실행: docker compose up --build
# 종료: docker compose down
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file: .env          # GOOGLE_API_KEY, NAVER_CLIENT_ID/SECRET, DB_URL(Supabase)
    ports:
      - "3000:8000"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    depends_on:
      - backend
    ports:
      - "80:80"
