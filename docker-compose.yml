# docker-compose.yml — 전체 스택 한 번에 실행
# 프론트엔드(frontend/)와 백엔드(backend/) 폴더로 분리된 구조 기준
# 실행: docker compose up --build
# 종료: docker compose down
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file: ./backend/.env   # GOOGLE_API_KEY, NAVER_CLIENT_ID/SECRET, DB_URL(Supabase)
    ports:
      - "3000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      - backend
    ports:
      - "80:80"
