version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: student_agent_db
    environment:
      POSTGRES_DB: student_agent
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
