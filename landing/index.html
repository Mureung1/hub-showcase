<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pick My Clothes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Gaegu:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="notebook">
    <!-- 스프링 바인딩 -->
    <div class="spiral" aria-hidden="true">
      <span></span><span></span><span></span><span></span><span></span>

      <span></span><span></span><span></span><span></span><span></span>
      <span></span><span></span><span></span><span></span><span></span>
    </div>

    <!-- login 버튼 -->
    <a href="#" class="login-btn">login</a>

    <!-- 왼쪽 위 별 -->
    <div class="stars stars--top-left" aria-hidden="true">
      <span class="star star--filled">★</span>
      <span class="star star--outline">★</span>
    </div>

    <!-- 오른쪽 아래 별 -->
    <div class="stars stars--bottom-right" aria-hidden="true">
      <span class="star star--outline">★</span>
      <span class="star star--filled">★</span>
    </div>

    <!-- 메인 콘텐츠 -->
    <main class="hero">
      <h1 class="title">
        <span class="title__highlight">Pick My Clothse</span>
      </h1>
      <a href="#" class="cta-btn">코디 추천 시작</a>

</html>
