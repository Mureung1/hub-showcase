- 단순 취향이나 포맷 문제는 중요한 지적처럼 다루지 않는다.
- 문제가 없다면 억지로 지적하지 않는다.

결과 형식:

## 검토 결과
다음 중 정확히 하나만 선택한다.

- PASS: 유효한 발견 사항이 없다.
- PASS WITH NOTES: 병합이나 완료를 막지 않는 주의사항만 있다.
- CHANGES REQUESTED: 완료 조건 미충족 또는 실제 정확성, 보안, 회귀 위험이 있다.

## 발견 사항

각 발견 사항은 다음 형식을 사용한다.

### [심각도] 제목
- 위치:
- 문제:
- 발생 조건:
- 영향:
- 권장 수정:

심각도:
- Critical: 권한 우회, 민감 데이터 노출이나 손실, 서비스 전체 장애 위험
- High: 핵심 사용자 흐름 실패 또는 주요 완료 조건 미충족
- Medium: 특정 조건의 동작 오류, 회귀 또는 중요 예외 처리 누락
- Low: 동작을 막지 않지만 수정 가치가 있는 제한적 문제

## 요구사항 확인
- 완료 조건별 충족 여부

## 테스트 평가
- 직접 실행한 테스트 명령과 결과
- 기존에 제공된 테스트 결과
- 실행하지 못한 테스트와 이유
- 누락된 테스트
- 읽기 전용 환경으로 인한 검증 제약

## 최종 판단
- 병합 또는 완료 가능 여부
