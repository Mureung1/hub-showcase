<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Manager.exe XP Desktop Prototype</title>
    <style>
      :root {
        --font-ui: Tahoma, "Malgun Gothic", "Gulim", sans-serif;
        --font-pixel: "Gulim", monospace;
        --text-primary: #1f1f1f;
        --text-secondary: #55514a;
        --text-on-blue: #ffffff;
        --surface-window: #ece9d8;
        --surface-raised: #f8f6ee;
        --surface-dialog: #f1ede2;
        --surface-inset: #d6d0c4;
        --border-window: #003c74;
        --border-dark: #716f64;
        --border-mid: #aca899;
        --border-light: #ffffff;
        --border-control: #7f9db9;
        --xp-blue-950: #003c74;
        --xp-blue-900: #0645a5;
        --xp-blue-800: #0a58bd;
        --xp-blue-700: #1673dd;
        --xp-blue-600: #2a8bf2;
        --xp-blue-highlight: #7fc5ff;
        --status-success: #339943;
        --status-warning: #d58b00;
        --status-danger: #d94735;
        --reward-exp: #c98300;
        --exp-track: #c8c3b9;
        --exp-fill: #43a54b;
        --taskbar-height: 36px;
        --window-title-height: 27px;
        --shadow-window: 3px 4px 0 rgb(0 35 84 / 28%);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
      }

      body,
      button,
      input,
      select {
        color: var(--text-primary);
        font-family: var(--font-ui);
        font-size: 12px;
        letter-spacing: 0;
      }

      button {
        font: inherit;
      }

      .desktop {
        position: relative;
        width: 100vw;
        height: 100dvh;
        overflow: hidden;
        background-color: #59c5ef;
        background-image: url("./assets/xp-pixel-wallpaper.png");
        background-position: center bottom;
        background-size: cover;
        image-rendering: pixelated;
        isolation: isolate;
      }

      .desktop::after {
        content: "";
        position: absolute;
        inset: 0;
        z-index: -1;
        pointer-events: none;
        background: linear-gradient(180deg, rgb(255 255 255 / 3%), transparent 45%);
      }

      .desktop-icons {
        position: absolute;
        top: 14px;
        left: 12px;
        z-index: 10;
        display: grid;
        gap: 10px;
        width: 78px;
      }

      .desktop-icon {
        width: 74px;
        min-height: 70px;
        display: grid;
        justify-items: center;
        align-content: start;
        gap: 3px;
        padding: 3px;
        color: #ffffff;
        line-height: 1.2;
        text-align: center;
        text-shadow: 1px 1px 0 #174d81;
        background: transparent;
        border: 0;
      }

      .desktop-icon:hover,
      .desktop-icon:focus-visible {
        background: rgb(49 106 197 / 44%);
        outline: 1px dotted #ffffff;
      }

      .desktop-icon__graphic {
        width: 40px;
        height: 40px;
        display: grid;
        place-items: center;
        filter: drop-shadow(2px 2px 0 rgb(0 35 84 / 30%));
      }

      .desktop-icon__graphic svg {
        width: 38px;
        height: 38px;
        shape-rendering: crispEdges;
      }

      .desktop-icon__graphic--lumi {
        overflow: hidden;
      }

      .desktop-icon__graphic--lumi img {
        width: 70px;
        height: 70px;
        object-fit: contain;
        image-rendering: pixelated;
      }

      .window {
        position: absolute;
        z-index: 100;
        overflow: hidden;
        background: var(--surface-window);
        border: 1px solid var(--border-window);
        border-radius: 7px 7px 3px 3px;
        box-shadow: var(--shadow-window);
      }

      .window.is-active {
        z-index: 200;
      }

      .window[hidden] {
        display: none;
      }

      .window--quest {
        top: 68px;
        left: clamp(106px, 18vw, 210px);
        width: 360px;
      }

      .window--manager {
        top: 134px;
        left: clamp(485px, 58vw, 790px);
        width: 328px;
      }

      .titlebar {
        height: var(--window-title-height);
        display: flex;
        align-items: center;
        gap: 5px;
        padding: 0 4px 0 7px;
        color: #ffffff;
        font-size: 12px;
        font-weight: 700;
        text-shadow: 1px 1px 0 #00356b;
        background: linear-gradient(
          180deg,
          var(--xp-blue-600) 0%,
          var(--xp-blue-700) 18%,
          var(--xp-blue-800) 72%,
          var(--xp-blue-900) 100%
        );
        border-bottom: 1px solid var(--xp-blue-950);
        cursor: move;
        user-select: none;
      }

      .window:not(.is-active) .titlebar {
        background: linear-gradient(180deg, #93a3bb, #6f84a3);
      }

      .titlebar__icon {
        width: 16px;
        height: 16px;
        display: grid;
        place-items: center;
        color: #0b3977;
        font-size: 10px;
        text-shadow: none;
        background: #fff8da;
        border: 1px solid #d29d28;
      }

      .titlebar__name {
        min-width: 0;
        flex: 1;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .window-controls {
        display: flex;
        gap: 2px;
      }

      .window-control {
        width: 19px;
        height: 19px;
        display: grid;
        place-items: center;
        padding: 0;
        color: #ffffff;
        font-family: Arial, sans-serif;
        font-size: 12px;
        font-weight: 700;
        line-height: 1;
        text-shadow: 1px 1px 0 #00356b;
        background: var(--xp-blue-600);
        border: 1px solid #ffffff;
        border-radius: 2px;
        box-shadow:
          inset 1px 1px 0 var(--xp-blue-highlight),
          inset -1px -1px 0 var(--xp-blue-950);
      }

      .window-control--close {
        background: var(--status-danger);
      }

      .window-body {
        padding: 12px;
        background: var(--surface-window);
      }

      .quest-summary {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin-bottom: 10px;
        color: var(--text-secondary);
        font-size: 11px;
      }

      .quest-form {
        display: grid;
        grid-template-columns: 64px minmax(0, 1fr);
        gap: 8px;
        align-items: center;
      }

      .quest-form label {
        color: #37352f;
        font-weight: 700;
      }

      .xp-input,
      .xp-select {
        width: 100%;
        height: 26px;
        padding: 3px 6px;
        background: #ffffff;
        border: 1px solid var(--border-control);
        border-radius: 0;
        box-shadow: inset 1px 1px 0 rgb(0 0 0 / 12%);
      }

      .form-pair {
        display: grid;
        grid-template-columns: 1fr 82px;
        gap: 6px;
      }

      .difficulty {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 4px;
      }

      .difficulty input {
        position: absolute;
        opacity: 0;
        pointer-events: none;
      }

      .difficulty label {
        height: 26px;
        display: grid;
        place-items: center;
        color: var(--text-primary);
        font-weight: 400;
        background: var(--surface-raised);
        border: 1px solid var(--border-dark);
        box-shadow:
          inset 1px 1px 0 #ffffff,
          inset -1px -1px 0 #716f64;
      }

      .difficulty input:checked + label {
        color: #ffffff;
        font-weight: 700;
        background: var(--xp-blue-700);
        box-shadow:
          inset 1px 1px 0 var(--xp-blue-950),
          inset -1px -1px 0 var(--xp-blue-highlight);
      }

      .quest-footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-top: 12px;
        padding-top: 10px;
        border-top: 1px solid var(--border-mid);
        box-shadow: 0 -1px 0 #ffffff;
      }

      .reward {
        color: var(--reward-exp);
        font-size: 11px;
        font-weight: 700;
      }

      .xp-button {
        min-width: 82px;
        height: 27px;
        padding: 0 12px;
        color: var(--text-primary);
        background: var(--surface-raised);
        border: 1px solid var(--border-dark);
        border-radius: 2px;
        box-shadow:
          inset 1px 1px 0 #ffffff,
          inset -1px -1px 0 #716f64;
      }

      .xp-button:active {
        background: var(--surface-inset);
        box-shadow:
          inset 1px 1px 0 #716f64,
          inset -1px -1px 0 #ffffff;
      }

      .manager-stage {
        min-height: 238px;
        display: grid;
        grid-template-rows: auto 126px auto auto;
        justify-items: center;
        position: relative;
        padding: 4px 8px 10px;
      }

      .manager-name {
        color: #1f3152;
        font-family: var(--font-pixel);
        font-size: 15px;
        font-weight: 700;
      }

      .manager-visual {
        width: 160px;
        height: 126px;
        display: grid;
        place-items: center;
        position: relative;
      }

      .manager-sprite {
        width: 184px;
        height: 184px;
        object-fit: contain;
        image-rendering: pixelated;
        animation: idle 1.8s steps(2, end) infinite;
      }

      .reaction-bubble {
        width: 38px;
        height: 28px;
        position: absolute;
        top: 0;
        right: 22px;
        opacity: 0;
        transform: translateY(5px);
        background: #ffffff;
        border: 2px solid #4d372c;
        border-radius: 12px;
        box-shadow: 2px 2px 0 rgb(77 55 44 / 24%);
        pointer-events: none;
      }

      .reaction-bubble::after {
        content: "";
        width: 8px;
        height: 8px;
        position: absolute;
        right: 5px;
        bottom: -6px;
        background: #ffffff;
        border-right: 2px solid #4d372c;
        border-bottom: 2px solid #4d372c;
        transform: rotate(45deg);
      }

      .reaction-bubble.is-visible {
        animation: react 900ms steps(3, end);
      }

      .manager-progress {
        width: 100%;
        display: grid;
        grid-template-columns: auto 1fr auto;
        align-items: center;
        gap: 7px;
        margin-top: 3px;
      }

      .level {
        font-family: var(--font-pixel);
        font-size: 17px;
        font-weight: 700;
      }

      .exp-bar {
        height: 10px;
        overflow: hidden;
        background: var(--exp-track);
        border: 1px solid var(--border-dark);
        border-radius: 999px;
        box-shadow: inset 1px 1px 0 rgb(0 0 0 / 20%);
      }

      .exp-bar__fill {
        width: 20%;
        height: 100%;
        background: var(--exp-fill);
        border-right: 1px solid #17752c;
        transition: width 180ms steps(4, end);
      }

      .exp-value {
        color: var(--text-secondary);
        font-size: 10px;
        white-space: nowrap;
      }

      .manager-status {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-top: 9px;
        font-weight: 700;
      }

      .status-pixel {
        width: 18px;
        height: 18px;
        display: grid;
        place-items: center;
        color: #ffffff;
        font-family: monospace;
        font-size: 11px;
        line-height: 1;
        background: var(--status-warning);
        border: 1px solid #6f4c00;
        box-shadow:
          inset 1px 1px 0 #ffd36d,
          inset -1px -1px 0 #7c5200;
      }

      .status-pixel.is-complete {
        background: var(--status-success);
        border-color: #176625;
        box-shadow:
          inset 1px 1px 0 #7cda88,
          inset -1px -1px 0 #176625;
      }

      .dialogue-panel {
        min-height: 58px;
        max-height: 58px;
        display: flex;
        align-items: center;
        padding: 8px 10px;
        overflow: hidden;
        line-height: 1.55;
        background: var(--surface-dialog);
        border: 1px solid var(--border-mid);
        border-radius: 4px;
        box-shadow:
          inset 1px 1px 0 #c8c2b5,
          inset -1px -1px 0 #ffffff;
      }

      .taskbar {
        position: fixed;
        right: 0;
        bottom: 0;
        left: 0;
        z-index: 500;
        height: var(--taskbar-height);
        display: grid;
        grid-template-columns: auto minmax(0, 1fr) auto;
        align-items: center;
        color: #ffffff;
        background: linear-gradient(180deg, #2589ef 0%, #0f66d0 45%, #0952bd 100%);
        border-top: 1px solid #6eb8ff;
        box-shadow: 0 -1px 0 #003c74;
      }

      .start-button {
        height: 100%;
        display: flex;
        align-items: center;
        gap: 7px;
        padding: 0 17px 0 10px;
        color: #ffffff;
        font-size: 14px;
        font-style: italic;
        font-weight: 700;
        text-shadow: 1px 1px 0 #1c6f25;
        background: linear-gradient(180deg, #63bd51 0%, #2d8d31 100%);
        border: 0;
        border-right: 1px solid #1c6f25;
        border-radius: 0 11px 11px 0;
      }

      .start-mark {
        width: 17px;
        height: 17px;
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 1px;
        transform: skewY(-5deg);
      }

      .start-mark span:nth-child(1) {
        background: #ef4d34;
      }

      .start-mark span:nth-child(2) {
        background: #64ac43;
      }

      .start-mark span:nth-child(3) {
        background: #2d84db;
      }

      .start-mark span:nth-child(4) {
        background: #f4c442;
      }

      .task-buttons {
        min-width: 0;
        display: flex;
        gap: 4px;
        padding: 0 8px;
      }

      .task-button {
        width: 154px;
        max-width: 34vw;
        height: 27px;
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 0 9px;
        overflow: hidden;
        color: #ffffff;
        text-overflow: ellipsis;
        white-space: nowrap;
        background: #2b80dc;
        border: 1px solid #0a4ca6;
        border-radius: 2px;
        box-shadow: inset 1px 1px 0 #61a8ef;
      }

      .task-button.is-active {
        background: #1553b0;
        box-shadow: inset 1px 1px 2px #073d91;
      }

      .task-button[hidden] {
        display: none;
      }

      .tray {
        height: 100%;
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 0 10px;
        background: #1681d8;
        border-left: 1px solid #4db1ef;
        box-shadow: inset 1px 0 0 #0a62ba;
        white-space: nowrap;
      }

      .tray-level {
        font-weight: 700;
      }

      @keyframes idle {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-3px);
        }
      }

      @keyframes react {
        0% {
          opacity: 0;
          transform: translateY(6px) scale(0.8);
        }
        22%,
        72% {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
        100% {
          opacity: 0;
          transform: translateY(-3px) scale(0.9);
        }
      }

      @media (min-width: 561px) and (max-width: 900px) {
        .window--quest {
          top: 68px;
          left: 96px;
          width: 340px;
        }

        .window--manager {
          top: 182px;
          right: 14px;
          left: auto;
          width: 316px;
        }
      }

      @media (min-width: 561px) and (max-width: 900px) and (max-height: 620px) {
        .desktop-icons {
          transform: scale(0.86);
          transform-origin: top left;
        }

        .window--quest {
          top: 54px;
          left: 80px;
          transform: scale(0.78);
          transform-origin: top left;
        }

        .window--manager {
          top: 168px;
          right: 6px;
          transform: scale(0.78);
          transform-origin: top right;
        }
      }

      @media (max-width: 560px) {
        html,
        body {
          overflow: auto;
        }

        .desktop {
          min-height: 760px;
          height: auto;
          overflow: visible;
          padding: 8px 8px calc(var(--taskbar-height) + 16px) 90px;
        }

        .desktop-icons {
          position: fixed;
          top: 8px;
          left: 5px;
          transform: scale(0.88);
          transform-origin: top left;
        }

        .window,
        .window--quest,
        .window--manager {
          position: relative;
          top: auto !important;
          left: auto !important;
          width: min(100%, 390px);
          margin: 8px auto 12px;
        }

        .titlebar {
          cursor: default;
        }

        .task-button {
          width: 44px;
          padding: 0 7px;
        }

        .task-button span:last-child {
          display: none;
        }

        .tray-level {
          display: none;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 1ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 1ms !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="desktop" aria-label="XP 데스크톱">
      <nav class="desktop-icons" aria-label="바탕화면 아이콘">
        <button class="desktop-icon" type="button" data-open="quest">
          <span class="desktop-icon__graphic" aria-hidden="true">
            <svg viewBox="0 0 38 38">
              <path fill="#8f5b21" d="M4 3h26v4h4v28H4z" />
              <path fill="#edc46e" d="M7 5h20v4h4v23H7z" />
              <path fill="#fff4ca" d="M10 10h18v19H10z" />
              <path fill="#2e8b42" d="M12 13h4v4h-4zM12 21h4v4h-4z" />
              <path fill="#4c4a43" d="M18 14h8v2h-8zM18 22h8v2h-8z" />
            </svg>
          </span>
          <span>오늘의 퀘스트</span>
        </button>

        <button class="desktop-icon" type="button" data-open="manager">
          <span class="desktop-icon__graphic desktop-icon__graphic--lumi" aria-hidden="true">
            <img src="./assets/lumi-manager.png" alt="" />
          </span>
          <span>매니저</span>
        </button>

        <button class="desktop-icon" type="button">
          <span class="desktop-icon__graphic" aria-hidden="true">
            <svg viewBox="0 0 38 38">
              <path fill="#164b88" d="M5 4h28v30H5z" />
              <path fill="#3b8b55" d="M8 6h22v26H8z" />
              <path fill="#d9efc5" d="M12 10h14v16H12z" />
              <path fill="#56756a" d="M14 13h10v2H14zM14 18h10v2H14zM14 23h7v2h-7z" />
            </svg>
          </span>
          <span>기록 노트</span>
        </button>

        <button class="desktop-icon" type="button">
          <span class="desktop-icon__graphic" aria-hidden="true">
            <svg viewBox="0 0 38 38">
              <path fill="#778d91" d="M8 10h22l-2 25H10z" />
              <path fill="#d9eef0" d="M11 13h16l-2 18H13z" />
              <path fill="#597276" d="M5 7h28v5H5zM13 3h12v4H13z" />
              <path fill="#63a68b" d="M15 17h3v10h-3zM21 17h3v10h-3z" />
            </svg>
          </span>
          <span>휴지통</span>
        </button>
      </nav>

      <section class="window window--quest is-active" id="quest-window" data-window="quest">
        <header class="titlebar">
          <span class="titlebar__icon" aria-hidden="true">Q</span>
          <span class="titlebar__name">오늘의 퀘스트</span>
          <div class="window-controls">
            <button class="window-control" type="button" aria-label="최소화">_</button>
            <button class="window-control" type="button" aria-label="최대화">□</button>
            <button class="window-control window-control--close" type="button" data-close="quest" aria-label="닫기">×</button>
          </div>
        </header>

        <div class="window-body">
          <div class="quest-summary">
            <span>오늘 진행할 퀘스트 초안</span>
            <strong>3 / 4 완료</strong>
          </div>

          <form class="quest-form" id="quest-form">
            <label for="quest-title">제목</label>
            <input class="xp-input" id="quest-title" value="데이터베이스 개념 15분 공부" />

            <label for="quest-type">유형</label>
            <select class="xp-select" id="quest-type">
              <option>시간형</option>
              <option>목표형</option>
              <option>행동형</option>
            </select>

            <label for="quest-amount">분량</label>
            <div class="form-pair">
              <input class="xp-input" id="quest-amount" type="number" min="5" value="15" />
              <select class="xp-select" aria-label="분량 단위">
                <option>분</option>
                <option>페이지</option>
                <option>개</option>
              </select>
            </div>

            <span aria-hidden="true">난이도</span>
            <div class="difficulty" role="radiogroup" aria-label="난이도">
              <input id="difficulty-easy" name="difficulty" type="radio" />
              <label for="difficulty-easy">쉬움</label>
              <input id="difficulty-normal" name="difficulty" type="radio" checked />
              <label for="difficulty-normal">보통</label>
              <input id="difficulty-hard" name="difficulty" type="radio" />
              <label for="difficulty-hard">어려움</label>
            </div>

            <label for="quest-deadline">제한 시간</label>
            <select class="xp-select" id="quest-deadline">
              <option>오늘 23:59</option>
              <option>2시간 뒤</option>
              <option>내일 오전 9:00</option>
            </select>
          </form>

          <div class="quest-footer">
            <span class="reward">예상 보상: EXP 20</span>
            <button class="xp-button" id="complete-demo" type="button">완료 시연</button>
          </div>
        </div>
      </section>

      <section class="window window--manager" id="manager-window" data-window="manager">
        <header class="titlebar">
          <span class="titlebar__icon" aria-hidden="true">M</span>
          <span class="titlebar__name">매니저</span>
          <div class="window-controls">
            <button class="window-control" type="button" aria-label="최소화">_</button>
            <button class="window-control" type="button" aria-label="최대화">□</button>
            <button class="window-control window-control--close" type="button" data-close="manager" aria-label="닫기">×</button>
          </div>
        </header>

        <div class="window-body">
          <div class="manager-stage">
            <div class="manager-name">루미</div>

            <div class="manager-visual">
              <div class="reaction-bubble" id="reaction-bubble" aria-hidden="true"></div>
              <img class="manager-sprite" src="./assets/lumi-manager.png" alt="분홍 전자 생물 매니저 루미" />
            </div>

            <div class="manager-progress">
              <span class="level">Lv.1</span>
              <div
                class="exp-bar"
                role="progressbar"
                aria-label="루미 경험치"
                aria-valuemin="0"
                aria-valuemax="100"
                aria-valuenow="20"
              >
                <div class="exp-bar__fill" id="exp-fill"></div>
              </div>
              <span class="exp-value" id="exp-value">20 / 100 EXP</span>
            </div>

            <div class="manager-status">
              <span class="status-pixel" id="status-icon" aria-hidden="true">..</span>
              <span id="status-label">기다리는 중</span>
            </div>
          </div>

          <div class="dialogue-panel" id="dialogue">
            기다리고 있었어. 오늘도 분량을 함께 정해볼까?
          </div>
        </div>
      </section>
    </main>

    <footer class="taskbar">
      <button class="start-button" type="button">
        <span class="start-mark" aria-hidden="true"><span></span><span></span><span></span><span></span></span>
        시작
      </button>

      <div class="task-buttons" aria-label="열린 창">
        <button class="task-button is-active" type="button" data-task="quest">
          <span aria-hidden="true">Q</span>
          <span>오늘의 퀘스트</span>
        </button>
        <button class="task-button" type="button" data-task="manager">
          <span aria-hidden="true">M</span>
          <span>매니저</span>
        </button>
      </div>

      <div class="tray">
        <span class="tray-level">Lv.1</span>
        <time id="clock">14:30</time>
      </div>
    </footer>

    <script>
      (() => {
        const windows = new Map(
          [...document.querySelectorAll("[data-window]")].map((element) => [
            element.dataset.window,
            element,
          ]),
        );
        const taskButtons = new Map(
          [...document.querySelectorAll("[data-task]")].map((element) => [
            element.dataset.task,
            element,
          ]),
        );
        let topLayer = 200;

        function activateWindow(id) {
          const target = windows.get(id);
          if (!target) return;

          target.hidden = false;
          topLayer += 1;
          target.style.zIndex = String(topLayer);

          windows.forEach((windowElement) => windowElement.classList.remove("is-active"));
          taskButtons.forEach((taskButton) => taskButton.classList.remove("is-active"));

          target.classList.add("is-active");
          const taskButton = taskButtons.get(id);
          if (taskButton) {
            taskButton.hidden = false;
            taskButton.classList.add("is-active");
          }
        }

        function closeWindow(id) {
          const target = windows.get(id);
          if (!target) return;
          target.hidden = true;

          const taskButton = taskButtons.get(id);
          if (taskButton) taskButton.hidden = true;

          const remaining = [...windows.entries()]
            .filter(([, element]) => !element.hidden)
            .sort((a, b) => Number(b[1].style.zIndex || 0) - Number(a[1].style.zIndex || 0));

          if (remaining[0]) activateWindow(remaining[0][0]);
        }

        document.querySelectorAll("[data-open]").forEach((button) => {
          button.addEventListener("dblclick", () => activateWindow(button.dataset.open));
          button.addEventListener("click", () => activateWindow(button.dataset.open));
        });

        document.querySelectorAll("[data-close]").forEach((button) => {
          button.addEventListener("click", (event) => {
            event.stopPropagation();
            closeWindow(button.dataset.close);
          });
        });

        taskButtons.forEach((button, id) => {
          button.addEventListener("click", () => activateWindow(id));
        });

        windows.forEach((windowElement, id) => {
          windowElement.addEventListener("pointerdown", () => activateWindow(id));
          const titlebar = windowElement.querySelector(".titlebar");
          let dragState = null;
          let mouseDragState = null;

          titlebar.addEventListener("pointerdown", (event) => {
            if (event.target.closest("button") || window.matchMedia("(max-width: 560px)").matches) return;

            const rect = windowElement.getBoundingClientRect();
            dragState = {
              pointerId: event.pointerId,
              offsetX: event.clientX - rect.left,
              offsetY: event.clientY - rect.top,
            };
            titlebar.setPointerCapture(event.pointerId);
          });

          titlebar.addEventListener("pointermove", (event) => {
            if (!dragState || dragState.pointerId !== event.pointerId) return;

            const maxX = window.innerWidth - windowElement.offsetWidth;
            const maxY = window.innerHeight - windowElement.offsetHeight - 42;
            const nextX = Math.min(Math.max(0, event.clientX - dragState.offsetX), Math.max(0, maxX));
            const nextY = Math.min(Math.max(0, event.clientY - dragState.offsetY), Math.max(0, maxY));

            windowElement.style.left = `${nextX}px`;
            windowElement.style.top = `${nextY}px`;
          });

          titlebar.addEventListener("pointerup", (event) => {
            if (dragState?.pointerId === event.pointerId) {
              dragState = null;
              titlebar.releasePointerCapture(event.pointerId);
            }
          });

          titlebar.addEventListener("mousedown", (event) => {
            if (
              event.button !== 0 ||
              event.target.closest("button") ||
              window.matchMedia("(max-width: 560px)").matches
            ) {
              return;
            }

            const rect = windowElement.getBoundingClientRect();
            mouseDragState = {
              offsetX: event.clientX - rect.left,
              offsetY: event.clientY - rect.top,
            };
            event.preventDefault();
          });

          document.addEventListener("mousemove", (event) => {
            if (!mouseDragState) return;

            const maxX = window.innerWidth - windowElement.offsetWidth;
            const maxY = window.innerHeight - windowElement.offsetHeight - 42;
            const nextX = Math.min(Math.max(0, event.clientX - mouseDragState.offsetX), Math.max(0, maxX));
            const nextY = Math.min(Math.max(0, event.clientY - mouseDragState.offsetY), Math.max(0, maxY));

            windowElement.style.left = `${nextX}px`;
            windowElement.style.top = `${nextY}px`;
            windowElement.style.right = "auto";
          });

          document.addEventListener("mouseup", () => {
            mouseDragState = null;
          });
        });

        const completeButton = document.querySelector("#complete-demo");
        const reactionBubble = document.querySelector("#reaction-bubble");
        const statusIcon = document.querySelector("#status-icon");
        const statusLabel = document.querySelector("#status-label");
        const dialogue = document.querySelector("#dialogue");
        const expFill = document.querySelector("#exp-fill");
        const expValue = document.querySelector("#exp-value");
        const progress = document.querySelector(".exp-bar");

        completeButton.addEventListener("click", () => {
          activateWindow("manager");
          reactionBubble.classList.remove("is-visible");
          void reactionBubble.offsetWidth;
          reactionBubble.classList.add("is-visible");

          statusIcon.textContent = "✓";
          statusIcon.classList.add("is-complete");
          statusLabel.textContent = "함께 성장했어";
          dialogue.textContent = "오늘도 한 걸음 나아갔어. 다음에도 여기서 기다릴게.";
          expFill.style.width = "40%";
          expValue.textContent = "40 / 100 EXP";
          progress.setAttribute("aria-valuenow", "40");
        });

        const clock = document.querySelector("#clock");
        function updateClock() {
          clock.textContent = new Intl.DateTimeFormat("ko-KR", {
            hour: "2-digit",
            minute: "2-digit",
            hour12: false,
          }).format(new Date());
        }
        updateClock();
        window.setInterval(updateClock, 30000);
      })();
    </script>
  </body>
</html>
