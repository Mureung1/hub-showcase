<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>설정 · 챌린지로그 프로토타입</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="screen">
  <header class="topbar">
    <p class="brand">Prototype</p>
    <h1>설정</h1>
  </header>

  <main class="content">
    <section class="card">
      <h2 style="margin-bottom: 12px">알림</h2>

      <div class="setting-row">
        <div>
          <div class="setting-label">매일 아침 알림</div>
          <div class="setting-desc">오전 7시, 오늘의 챌린지가 도착하면 알려드려요</div>
        </div>
        <span class="switch on"></span>
      </div>
    </section>

    <section class="card">
      <h2 style="margin-bottom: 12px">계정</h2>

      <div class="setting-row">
        <div class="setting-label">이메일</div>
        <div class="setting-desc">jihyoun@example.com</div>
      </div>

      <div class="setting-row">
        <div class="setting-label">비밀번호 변경</div>
        <span>›</span>
      </div>

      <div class="setting-row">
        <div class="setting-label">로그아웃</div>
        <span>›</span>
      </div>
    </section>
  </main>

  <nav class="bottom-nav">
    <a href="index.html"><span class="icon">🏠</span>홈</a>
    <a href="record.html"><span class="icon">📷</span>기록</a>
    <a href="calendar.html"><span class="icon">📅</span>캘린더</a>
    <a href="rooms.html"><span class="icon">👥</span>친구 방</a>
    <a href="settings.html" aria-current="page"><span class="icon">⚙️</span>설정</a>
  </nav>
</div>
</body>
</html>
