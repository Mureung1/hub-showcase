<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
</helmet>
<div style="background:#fff; border-radius:20px; padding:16px 16px 12px; box-shadow:0 1px 3px rgba(0,0,0,.05), 0 10px 30px -18px rgba(16,24,40,.25); height:100%; box-sizing:border-box; display:flex; flex-direction:column; font-family:Pretendard, -apple-system, sans-serif;">
  <div style="display:flex; align-items:flex-start; justify-content:space-between; margin-bottom:14px; gap:10px;">
    <div style="min-width:0;">
      <div style="font-size:12px; font-weight:700; color:#3182F6;">24시간 흐름</div>
      <div style="font-size:16px; font-weight:800; color:#191F28; margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">{{ name }} 혼잡도</div>
    </div>
    <div style="flex-shrink:0; font-size:11.5px; font-weight:800; color:#3182F6; background:#E8F1FE; padding:6px 11px; border-radius:999px; white-space:nowrap;">현재 {{ badge }} 기준</div>
  </div>

  <div style="height:170px; flex:none; display:flex; align-items:flex-end; gap:2px; padding-top:6px;">
    <sc-for list="{{ bars }}" as="b" hint-placeholder-count="24">
      <div style="flex:1; height:100%; display:flex; flex-direction:column; justify-content:flex-end; align-items:center; min-width:0;">
        <div style="{{ b.fillStyle }}"></div>
      </div>
    </sc-for>
  </div>

  <div style="display:flex; gap:2px; margin-top:6px;">
    <sc-for list="{{ bars }}" as="b" hint-placeholder-count="24">
      <div style="{{ b.labelStyle }}">{{ b.label }}</div>
    </sc-for>
  </div>

  <div style="display:flex; gap:14px; margin-top:12px; align-items:center; justify-content:center; border-top:1px solid #F2F4F6; padding-top:11px;">
    <div style="display:flex; align-items:center; gap:6px; font-size:11.5px; color:#6B7684; font-weight:600;"><span style="width:10px; height:10px; border-radius:3px; background:#22C55E; display:inline-block;"></span>여유</div>
    <div style="display:flex; align-items:center; gap:6px; font-size:11.5px; color:#6B7684; font-weight:600;"><span style="width:10px; height:10px; border-radius:3px; background:#F5A524; display:inline-block;"></span>보통</div>
    <div style="display:flex; align-items:center; gap:6px; font-size:11.5px; color:#6B7684; font-weight:600;"><span style="width:10px; height:10px; border-radius:3px; background:#F0453A; display:inline-block;"></span>혼잡</div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:460,&quot;height&quot;:280},&quot;stop&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;any&quot;},&quot;hour&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:9}}">
class Component extends DCLogic {
  lv(v){ return v>=70 ? '#F0453A' : v>=40 ? '#F5A524' : '#22C55E'; }
  renderVals(){
    const stop = this.props.stop;
    const hour = this.props.hour ?? 12;
    const hours = (stop && stop.hours) || new Array(24).fill(0);
    const bars = hours.map((v, h) => {
      const cur = h === hour;
      const color = this.lv(v);
      return {
        label: (h % 3 === 0) ? String(h) : '',
        labelStyle: {
          flex:1, textAlign:'center', fontSize:'9px',
          fontWeight: cur ? 800 : 600,
          color: cur ? '#3182F6' : '#B0B8C1', minWidth:0
        },
        fillStyle: {
          width:'80%', height: Math.max(3, v) + '%',
          background: color, borderRadius:'4px 4px 2px 2px',
          transition:'height .6s cubic-bezier(.22,1,.36,1), background .4s ease',
          boxShadow: cur ? '0 0 0 2.5px #fff, 0 0 0 4.5px rgba(49,130,246,.55)' : 'none'
        }
      };
    });
    return {
      bars,
      name: stop ? stop.name : '정류장',
      badge: String(hour).padStart(2,'0') + ':00'
    };
  }
}
</script>
</body>
</html>
