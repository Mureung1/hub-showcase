# 커밋되는 설정. 비밀은 절대 여기 두지 않는다.
# 접속 정보는 전부 환경변수로 주입한다.

spring:
  application:
    name: lineup

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      # Flyway가 스키마를 관리한다. ddl-auto는 절대 update로 두지 않는다.
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

lineup:
  scoring:
    # 컴포넌트 가중치. 합 = 1.0
    # 지금은 손으로 정한 값이다. user_activities가 쌓이면
    # 로지스틱 회귀 계수로 대체된다.
    weights:
      skill: 0.55
      career: 0.15
      major: 0.10
      certification: 0.10
      location: 0.10
    model-version: v1-heuristic-idf
    top-n: 20
    recall-limit: 200

  idf:
    # 매일 새벽 4시 재계산
    cron: "0 0 4 * * *"
    floor: 0.05

logging:
  level:
    com.lineup: DEBUG
